/**
 * Detail routes highlight their parent entry in the sidebar. Later modules add
 * their own entries here when they register, so this never becomes a chain of
 * special cases inside renderNav().
 */
const ROUTE_PARENTS = {
  project: 'projects',
  vendor: 'vendors',
  'labour-sheet': 'labour',
  'salary-sheet': 'salaries'
};

const PAGES = {
  dashboard: pageDashboard,
  projects: pageProjects,
  project: pageProject,
  vendors: pageVendors,
  vendor: pageVendorProfile,
  boq: root => pageProjectModulePicker(root, 'boq', 'BOQ'),
  budgets: root => pageProjectModulePicker(root, 'budget', 'Budgets'),
  schedules: root => pageProjectModulePicker(root, 'schedule', 'Schedules'),
  users: pageUsers,
  roles: pageRoles,
  settings: pageSettings,
  audit: pageAudit,
  database: pageDatabase,
  profile: pageProfile
};

/**
 * Which source file registers each module's screens.
 *
 * Every screen below is built. If its route is missing at runtime the code that
 * registers it did not load — the file is absent from the Apps Script project,
 * or was pasted in truncated, and the browser dropped that whole script block.
 * Saying "arrives in a later phase" in that situation sends people looking for
 * a feature that is already written.
 */
const ROUTE_SOURCE = {
  'purchase-requests': 'Procurement.html', 'rfqs': 'Orders.html',
  'quotations': 'Orders.html', 'purchase-orders': 'Orders.html',
  'vendors': 'JavaScript.html',
  'stock': 'Stock.html', 'stock-items': 'Stock.html', 'goods-receipts': 'Stock.html', 'goods-returns': 'Stock.html',
  'material-issues': 'Stock.html', 'transfers': 'Stock.html',
  'rar': 'Billing.html', 'expenses': 'Costs.html', 'subcontractors': 'Costs.html',
  'cash': 'Treasury.html', 'labour': 'Payroll.html', 'salaries': 'Payroll.html', 'documents': 'Data.html', 'reports': 'Insights.html',
  'management': 'Insights.html', 'notifications': 'Alerts.html',
  'import-export': 'Data.html'
};

/**
 * A standing band under the strip when part of the front end did not load.
 *
 * A file pasted into Apps Script incompletely takes every screen it registers
 * with it, silently: the browser drops that whole script block. Nobody should
 * have to click each module in turn to discover which. This says so on sight,
 * names the files, and stays until they are fixed.
 */
async function reportBrokenDeployment() {
  const host = document.getElementById('deployWarning');
  if (!host) return;

  // The front end: a screen whose registration never ran.
  const broken = [];
  NAV.forEach(g => g.items.forEach(i => {
    if (isBuilt(i) && typeof PAGES[i.id] !== 'function') broken.push(i);
  }));
  const files = [];
  broken.forEach(i => {
    const f = ROUTE_SOURCE[i.id] || 'an unknown file';
    if (files.indexOf(f) === -1) files.push(f);
  });

  // The server: a .gs file that lost its tail. This one fails quietly until
  // some unrelated feature reaches for a function that is not there, so it is
  // worth asking up front rather than waiting for the error.
  let serverMissing = [];
  try {
    serverMissing = (await api('getDeploymentCheck')).data.missing || [];
  } catch (e) { /* an older deployment has no such check; the band still works */ }
  serverMissing.forEach(f => { if (files.indexOf(f) === -1) files.push(f); });

  if (!files.length) { host.innerHTML = ''; host.classList.add('hidden'); return; }

  const parts = [];
  if (broken.length) {
    parts.push(`${broken.length} screen${broken.length === 1 ? '' : 's'} did not load ` +
      `(${UI.esc(broken.map(i => i.label).join(', '))})`);
  }
  if (serverMissing.length) {
    parts.push(`${serverMissing.length} server file${serverMissing.length === 1 ? '' : 's'} ` +
      `stop${serverMissing.length === 1 ? 's' : ''} part way`);
  }
  host.classList.remove('hidden');
  host.innerHTML = `<div class="deploy-warn">
    <strong>This deployment is incomplete.</strong> ${UI.esc(parts.join(', and '))}.
    ${UI.esc(files.join(', '))} ${files.length === 1 ? 'is' : 'are'} missing from this
    Apps Script project, or ${files.length === 1 ? 'was' : 'were'} saved incompletely.
    Replace ${files.length === 1 ? 'that file' : 'those files'} in full, save, deploy a new
    version and reload.
    <button class="linklike" id="deployWarnMore">See the full list</button>
  </div>`;
  const more = document.getElementById('deployWarnMore');
  if (more) more.onclick = () => navigate('database');
}

/** The screens a module offers that failed to register, if any. */
function brokenScreens(moduleName) {
  const group = NAV.find(g => g.group === moduleName);
  if (!group) return [];
  return group.items.filter(i => isBuilt(i) && typeof PAGES[i.id] !== 'function');
}

function reportMissingScreen(route) {
  const item = NAV.reduce((f, g) => f || g.items.find(i => i.id === route), null);
  if (item && !isBuilt(item)) {
    UI.warn('Not available yet', 'That screen arrives in Phase ' + item.phase + '.');
    return;
  }
  const file = ROUTE_SOURCE[route];
  UI.error(item ? item.label + ' did not load' : 'That screen did not load',
    file ? file + ' is missing from the Apps Script project, or was saved incompletely. ' +
           'Replace that one file and reload. Administration \u203a Database lists every screen ' +
           'and whether its code loaded.'
         : 'Its code is not in this deployment. Administration \u203a Database lists every ' +
           'screen and whether its code loaded.');
}

/* ---------------------------------------------------------- BREADCRUMBS */

/**
 * The screens passed through on the way to this one (owner's request,
 * 23 Oct 2026): each detail screen shows "‹ Back" and the trail above its
 * title. A menu screen starts a fresh trail; reopening the screen already
 * shown (a page refreshing itself after a save) adds nothing.
 */
App.trail = [];
App.here = null;
App.crumbJump = false;

function isMenuRoute(route) {
  return NAV.some(g => g.items.some(i => i.id === route));
}

function trackTrail(route, arg) {
  const key = JSON.stringify([route, arg === undefined ? null : arg]);
  if (App.crumbJump) {
    App.crumbJump = false;
  } else if (isMenuRoute(route)) {
    App.trail = [];
  } else if (App.here && App.here.key !== key) {
    App.trail.push(App.here);
    if (App.trail.length > 6) App.trail.shift();
  }
  if (!App.here || App.here.key !== key) App.here = { route, arg, key, title: '' };
}

function crumbsHtml() {
  if (isMenuRoute(App.route)) return '';
  let trail = App.trail;
  // Opened with nothing behind it (a notification, a fresh sign-in): offer
  // the list the screen belongs to.
  if (!trail.length) {
    const parent = ROUTE_PARENTS[App.route];
    const item = parent && NAV.reduce((f, g) => f || g.items.find(i => i.id === parent), null);
    if (!item) return '';
    trail = [{ route: parent, arg: undefined, title: item.label, synthetic: true }];
  }
  const links = trail.map((t, i) =>
    `<a href="#" data-crumb="${i}"${t.synthetic ? ' data-crumb-route="' + UI.esc(t.route) + '"' : ''}>` +
    `${UI.esc(t.title || t.route)}</a>`).join('<span class="crumb-sep">›</span>');
  return `<nav class="crumbs" aria-label="Breadcrumb">
      <a href="#" data-crumb-back class="crumb-back">‹ Back</a>
      <span class="crumb-trail">${links}<span class="crumb-sep">›</span>
        <span class="crumb-here">${UI.esc(App.here ? App.here.title : '')}</span></span>
    </nav>`;
}

document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('[data-crumb], [data-crumb-back]');
  if (!a || !document.getElementById('content').contains(a)) return;
  e.preventDefault();
  if (a.hasAttribute('data-crumb-route')) { navigate(a.getAttribute('data-crumb-route')); return; }
  const i = a.hasAttribute('data-crumb-back') ? App.trail.length - 1 : Number(a.getAttribute('data-crumb'));
  if (i < 0) {
    const parent = ROUTE_PARENTS[App.route];
    navigate(parent && PAGES[parent] ? parent : 'dashboard');
    return;
  }
  const target = App.trail[i];
  App.trail = App.trail.slice(0, i);
  App.here = null;
  App.crumbJump = true;
  navigate(target.route, target.arg);
});

function navigate(route, arg) {
  const page = PAGES[route];
  if (!page) { reportMissingScreen(route); return; }
  trackTrail(route, arg);
  App.crumbsDrawn = false;
  App.route = route;
  App.routeArg = arg;
  const mod = moduleOf(ROUTE_PARENTS[route] || route);
  if (mod) App.module = mod;
  closeModuleMenu();
  renderNav();
  const content = document.getElementById('content');
  content.innerHTML = UI.loadingState();
  Promise.resolve(page(content, arg))
    .then(() => { if (typeof refreshNavCounts === 'function') refreshNavCounts(); })
    .catch(e => {
      content.innerHTML = UI.errorState(e.message, 'retryPage');
      const b = document.getElementById('retryPage');
      if (b) b.onclick = () => navigate(route, arg);
    });
}

function pageHead(title, sub, actionsHtml = '') {
  document.getElementById('headerTitle').textContent = title;
  // Only the screen's own head carries the breadcrumbs and names the trail
  // entry. A project tab reuses a whole list screen (Purchase Orders, say),
  // whose head comes second and must not add a second trail or rename this one.
  let crumbs = '';
  if (!App.crumbsDrawn) {
    App.crumbsDrawn = true;
    if (App.here) App.here.title = String(title);
    crumbs = crumbsHtml();
  }
  return crumbs + `<div class="page-head"><div><div class="page-title">${UI.esc(title)}</div>
    ${sub ? `<div class="page-sub">${UI.esc(sub)}</div>` : ''}</div>
    <div class="flex gap-8">${actionsHtml}</div></div>`;
}

/* ----------------------------------------------------------- DASHBOARD */

/**
 * The company position.
 *
 * One question comes before every other on a construction company's books:
 * has the money gone out faster than the work has gone up? So the screen opens
 * with work done and budget spent on the same scale and names the gap between
 * them, then shows the ledger of projects behind it, then what is waiting on
 * a decision. No wall of tiles: a figure that is not part of that argument is
 * not on this screen.
 */

/** Figures take a real minus sign; a hyphen in a column of numbers reads wrong. */
function signed(n, dp) {
  const v = Number(n) || 0;
  const body = UI.fmt.number(Math.abs(v), dp === undefined ? 1 : dp);
  return (v > 0 ? '+' : v < 0 ? '\u2212' : '') + body;
}

/** +ve gap means money is ahead of work, which is the direction that hurts. */
function gapTone(gap) {
  if (gap === null || gap === undefined) return { cls: '', word: '' };
  const g = Number(gap);
  if (g <= 0) return { cls: 't-navy', word: 'ahead' };
  if (g < 5) return { cls: 't-warn', word: 'watch' };
  return { cls: 't-over', word: 'over' };
}

function rulerRow(label, pct, fillClass) {
  const v = Math.max(0, Math.min(100, Number(pct) || 0));
  return `<div class="ruler-row">
      <div class="ruler-label">${UI.esc(label)}</div>
      <div class="ruler-track"><div class="ruler-fill ${fillClass || ''}" style="width:${v}%"></div></div>
      <div class="ruler-value">${pct === null || pct === undefined ? '\u2014' : UI.fmt.percent(pct)}</div>
    </div>`;
}

function twinBar(done, spent) {
  const tone = gapTone(spent === null ? null : Number(spent) - Number(done));
  const fill = tone.word === 'over' ? 'over' : tone.word === 'watch' ? 'warn' : '';
  const w = n => Math.max(0, Math.min(100, Number(n) || 0));
  return `<div class="twin" aria-hidden="true">
      <div><i style="width:${w(done)}%"></i></div>
      <div><i class="${fill}" style="width:${w(spent)}%"></i></div>
    </div>`;
}

function queueHtml(rows) {
  return `<ul class="queue">${rows.map(r => {
    const age = r.ageDays === null || r.ageDays === undefined ? ''
      : r.ageDays === 0 ? 'today' : r.ageDays + (r.ageDays === 1 ? ' day' : ' days');
    const old = r.ageDays >= 7;
    return `<li>
      <div class="queue-main">
        <div class="queue-title">${UI.esc(r.ref)}</div>
        <div class="queue-sub">${UI.esc(r.what)}${r.project ? ', ' + UI.esc(r.project) : ''}</div>
      </div>
      <div class="queue-amount">${r.amount ? UI.fmt.money(r.amount, App.settings.currencySymbol || 'Rs') : ''}</div>
      <div class="queue-age ${old ? 't-over' : 'muted'}">${UI.esc(age)}</div>
      <button class="btn btn-sm" data-go="${UI.esc(r.route)}">${UI.esc(r.action)}</button>
    </li>`;
  }).join('')}</ul>`;
}

async function pageDashboard(root) {
  const [res, queue] = await Promise.all([

  const q = (queue && queue.data) || { rows: [], total: 0 };
  const tone = gapTone(pos.gap);
  const unit = UI.fmt.unit(Math.max(pos.contractValue || 0, pos.budget || 0));
  const unitNote = unit.label ? `Amounts in ${sym} ${unit.label}.` : `Amounts in ${sym}.`;

  const gapSentence = () => {
    if (!money) return 'Progress only: this role does not see project money.';
    if (pos.gap === null) return '';
    if (pos.gap > 0) return `${sym} ${UI.fmt.scaled(pos.actualCost, unit)} spent of ${UI.fmt.scaled(pos.budget, unit)} approved budget.`;
    return `Work is ahead of the spend. ${sym} ${UI.fmt.scaled(pos.actualCost, unit)} spent of ${UI.fmt.scaled(pos.budget, unit)} approved budget.`;
  };

  root.innerHTML =
    pageHead('Company position',

            <div class="muted" style="font-size:13px;max-width:20ch">${pos.gap > 0

     <div id="dashLedger"></div>

     <div class="split mt-24">

  const mHost = document.getElementById('dashMoney');
  if (money) {
    const rows = [
      ['Billed to clients', d.cards.totalBilled],
      ['Received', d.cards.totalReceived],
      ['Outstanding from clients', d.cards.outstandingReceivables, 'key'],
      ['Retention held by clients', pos.retentionHeld],
      ['Forecast cost', pos.forecastCost]
    ];
    mHost.innerHTML =
      `<div class="section-head" style="margin-top:0"><h2 class="section-title">Money position</h2></div>
       <table class="statement">
         <tbody>
           ${rows.map(r => `<tr class="${r[2] || ''}"><th scope="row">${UI.esc(r[0])}</th>
             <td>${UI.fmt.scaled(r[1], unit)}</td></tr>`).join('')}
           <tr class="total"><th scope="row">Forecast gross margin</th>
             <td>${pos.grossMarginPercent === null ? '\u2014' : UI.fmt.percent(pos.grossMarginPercent)}</td></tr>
         </tbody>
       </table>
       <p class="muted mt-8" style="font-size:13px">Contract ${UI.fmt.scaled(pos.contractValue, unit)}
         less forecast cost ${UI.fmt.scaled(pos.forecastCost, unit)}.</p>`;
  }

  /* ---- what is not built yet, and recent activity ---------------------- */
  const lower = document.getElementById('dashLower');
  if (d.pendingModules && d.pendingModules.length) {
    const pending = UI.el('div', { class: 'card' });
    pending.innerHTML =
      `<div class="card-head"><div class="card-title">Not built yet</div></div>
       <div class="card-body">
         <p class="muted" style="margin:0 0 12px;font-size:13px">
           These stay disabled on the strip rather than opening an empty screen.</p>
         ${d.pendingModules.map(p =>
           `<div class="between" style="padding:6px 0;border-bottom:1px solid var(--border)">
              <span>${UI.esc(p.name)}</span><span class="badge badge-grey">Phase ${p.phase}</span></div>`).join('')}
       </div>`;
    lower.appendChild(pending);
  }

  if (d.recentAudit && d.recentAudit.length) {
    const audit = UI.el('div', { class: 'card' });
    audit.innerHTML = `<div class="card-head"><div class="card-title">Recent activity</div></div>`;
    const body = UI.el('div');
    UI.table(body, {
      columns: [
        { key: 'Timestamp', label: 'When', render: r => UI.fmt.dateTime(r.Timestamp) },
        { key: 'UserEmail', label: 'User' },
        { key: 'Action', label: 'Action', render: r => UI.badge(r.Action, 'blue') },
        { key: 'Module', label: 'Module' },
        { key: 'RecordID', label: 'Record' }
      ],
      rows: d.recentAudit
    });
    audit.appendChild(body);
    lower.appendChild(audit);
  }
}

const userState = { page: 1, pageSize: 25, search: '', role: '', status: '', sortBy: 'Name', sortDir: 'asc' };

async function pageUsers(root) {
  root.innerHTML =
    pageHead('Users', 'Accounts, roles and project assignment',
      `<button class="btn btn-primary" id="addUserBtn">+ Add user</button>`) +
    `<div class="card">
       <div class="card-head">
         <div class="filters">
           <div class="field"><label for="uSearch">Search</label>
             <input class="input" id="uSearch" placeholder="Name, email, department" value="${UI.esc(userState.search)}"></div>
           <div class="field"><label for="uRole">Role</label>
             <select class="input" id="uRole"></select></div>
           <div class="field"><label for="uStatus">Status</label>
             <select class="input" id="uStatus">
               <option value="">All</option><option value="Active">Active</option><option value="Inactive">Inactive</option>
             </select></div>
           <button class="btn" id="uReset">Reset</button>
         </div>
       </div>
       <div id="userTable">${UI.loadingState()}</div>
       <div id="userPager"></div>
     </div>`;

  const roleSel = document.getElementById('uRole');
  roleSel.innerHTML = '<option value="">All roles</option>' +
    ['ADMIN', 'MANAGEMENT', 'PROJECT_MANAGER', 'STOCK_SUPERVISOR', 'PURCHASE']
      .map(r => `<option value="${r}">${r.replace(/_/g, ' ')}</option>`).join('');
  roleSel.value = userState.role;
  document.getElementById('uStatus').value = userState.status;

  let debounce;
  document.getElementById('uSearch').oninput = e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { userState.search = e.target.value; userState.page = 1; loadUsers(); }, 250);
  };
  roleSel.onchange = e => { userState.role = e.target.value; userState.page = 1; loadUsers(); };
  document.getElementById('uStatus').onchange = e => { userState.status = e.target.value; userState.page = 1; loadUsers(); };
  document.getElementById('uReset').onclick = () => {
    Object.assign(userState, { page: 1, search: '', role: '', status: '' });
    pageUsers(root);
  };
  document.getElementById('addUserBtn').onclick = () => openUserForm(null);

  await loadUsers();
}

async function loadUsers() {
  const mount = document.getElementById('userTable');
  if (!mount) return;
  mount.innerHTML = UI.loadingState();
  try {
    const res = await api('listUsers', {
      page: userState.page, pageSize: userState.pageSize, search: userState.search,
      role: userState.role, status: userState.status, sortBy: userState.sortBy, sortDir: userState.sortDir
    });
    const d = res.data;
    UI.table(mount, {
      sortBy: userState.sortBy, sortDir: userState.sortDir,
      onSort: key => {
        userState.sortDir = (userState.sortBy === key && userState.sortDir === 'asc') ? 'desc' : 'asc';
        userState.sortBy = key; loadUsers();
      },
      columns: [
        { key: 'Name', label: 'Name', render: r =>
          `<div class="flex gap-8" style="align-items:center">
             <span class="avatar">${UI.esc(UI.fmt.initials(r.Name))}</span>
             <span><strong>${UI.esc(r.Name)}</strong><br><span class="muted mono">${UI.esc(r.UserID)}</span></span>
           </div>` },
        { key: 'Email', label: 'Email' },
        { key: 'Role', label: 'Role', render: r => UI.badge(r.Role.replace(/_/g, ' '), 'blue') },
        { key: 'Department', label: 'Department' },
        { key: 'AssignedProjects', label: 'Projects', sortable: false,
          render: r => r.AssignedProjects.length ? UI.esc(r.AssignedProjects.join(', ')) : '<span class="muted">All / none</span>' },
        { key: 'Status', label: 'Status', render: r =>
          UI.badge(r.Status) + (r.IsLocked ? ' ' + UI.badge('Locked', 'red') : '') },
        { key: 'LastLogin', label: 'Last login', render: r => UI.fmt.dateTime(r.LastLogin) },
        { key: 'actions', label: '', sortable: false, align: 'right', render: r =>
          `<div class="row-actions">
             <button class="btn btn-sm" data-act="edit" data-id="${UI.esc(r.UserID)}">Edit</button>
             <button class="btn btn-sm" data-act="reset" data-id="${UI.esc(r.UserID)}">Reset password</button>
             <button class="btn btn-sm ${r.Status === 'Active' ? 'btn-danger' : ''}"
                     data-act="status" data-id="${UI.esc(r.UserID)}" data-status="${r.Status}">
               ${r.Status === 'Active' ? 'Deactivate' : 'Activate'}</button>
           </div>` }
      ],
      rows: d.rows, rowKey: 'UserID',
      empty: UI.emptyState('No users match', 'Adjust the filters or add a new user.')
    });

    mount.querySelectorAll('button[data-act]').forEach(b => {
      const id = b.dataset.id;
      const row = d.rows.find(r => r.UserID === id);
      if (b.dataset.act === 'edit') b.onclick = () => openUserForm(row);
      if (b.dataset.act === 'reset') b.onclick = () => resetPassword(row);
      if (b.dataset.act === 'status') b.onclick = () => toggleStatus(row);
    });

    UI.pager(document.getElementById('userPager'), {
      page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
      onPage: p => { userState.page = p; loadUsers(); }
    });
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retryUsers');
    const b = document.getElementById('retryUsers');
    if (b) b.onclick = loadUsers;
  }
}

function userFields(existing) {
  return [
    { name: 'Name', label: 'Full name', required: true },
    { name: 'Email', label: 'Email', type: 'email', required: true,
      hint: existing ? '' : 'Used for sign-in and Google account matching.' },
    { name: 'Phone', label: 'Phone' },
    { name: 'Department', label: 'Department' },
    { name: 'Role', label: 'Role', type: 'select', required: true,
      // Read from the Roles table, so a role added in Administration appears
      // here at once — and a new delivered role is never missed.
      options: (App.roles || []).map(r => ({ value: r.RoleID, label: r.RoleName })) },
    { name: 'Status', label: 'Status', type: 'select', options: ['Active', 'Inactive'] },
    ...(existing ? [] : [{ name: 'Password', label: 'Initial password', type: 'password', min: 8, span: 2,
      hint: 'Leave blank to generate a temporary password the user must change at first sign-in.' }])
  ];
}

function openUserForm(existing) {
  const fields = userFields(existing);
  const body = UI.form(fields, existing || { Status: 'Active' });
  UI.modal({
    title: existing ? 'Edit user' : 'Add user',
    body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: existing ? 'Save changes' : 'Create user', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(body, fields);
        if (!data) return;
        m.busy(true);
        try {
          if (existing) {
            await api('updateUser', existing.UserID, data);
            UI.success('User updated', data.Name);
          } else {
            const res = await api('createUser', data);
            UI.success('User created', data.Name);
            if (res.data.temporaryPassword) showTemporaryPassword(data.Email, res.data.temporaryPassword);
          }
          m.close();
          loadUsers();
        } catch (e) {
          UI.error(existing ? 'Could not save' : 'Could not create user', e.message);
        } finally { m.busy(false); }
      }}
    ]
  });
}

function showTemporaryPassword(email, password) {
  UI.modal({
    title: 'Temporary password', size: 'narrow',
    body: `<p style="margin-top:0;font-size:13.5px">Give this to <strong>${UI.esc(email)}</strong>.
      It is shown once and must be changed at first sign-in.</p>
      <div class="code-box">${UI.esc(password)}</div>`,
    footer: [{ label: 'Done', class: 'btn-primary', onClick: m => m.close() }]
  });
}

function resetPassword(row) {
  const fields = [{ name: 'Password', label: 'New password', type: 'password', min: 8, span: 2,
    hint: 'Leave blank to generate a temporary password.' }];
  const body = UI.form(fields);
  UI.modal({
    title: 'Reset password — ' + row.Name, size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Reset', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(body, fields);
        if (!data) return;
        m.busy(true);
        try {
          const res = await api('resetUserPassword', row.UserID, data.Password);
          m.close();
          UI.success('Password reset', row.Name);
          if (res.data.temporaryPassword) showTemporaryPassword(row.Email, res.data.temporaryPassword);
          loadUsers();
        } catch (e) { UI.error('Could not reset', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

function toggleStatus(row) {
  const next = row.Status === 'Active' ? 'Inactive' : 'Active';
  UI.confirm({
    title: next === 'Inactive' ? 'Deactivate user' : 'Activate user',
    message: `${row.Name} will ${next === 'Inactive' ? 'no longer be able to sign in' : 'be able to sign in again'}.`,
    confirmLabel: next === 'Inactive' ? 'Deactivate' : 'Activate',
    danger: next === 'Inactive',
    onConfirm: async m => {
      try {
        await api('setUserStatus', row.UserID, next);
        m.close(); UI.success('User ' + next.toLowerCase()); loadUsers();
      } catch (e) { UI.error('Could not change status', e.message); }
    }
  });
}

function openChangePassword() {
  const fields = [
    { name: 'current', label: 'Current password', type: 'password', span: 2 },
    { name: 'next', label: 'New password', type: 'password', required: true, min: 8, span: 2 },
    { name: 'confirm', label: 'Confirm new password', type: 'password', required: true, min: 8, span: 2 }
  ];
  const body = UI.form(fields);
  UI.modal({
    title: 'Change password', size: 'narrow', body,
    footer: [
      { label: 'Later', onClick: m => m.close() },
      { label: 'Update password', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(body, fields);
        if (!data) return;
        if (data.next !== data.confirm) { UI.setFieldError(body, 'confirm', 'The two passwords do not match.'); return; }
        m.busy(true);
        try {
          await api('changePassword', data.current, data.next);
          App.user.MustChangePassword = false;
          m.close(); UI.success('Password updated');
        } catch (e) { UI.error('Could not update password', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

      `<div class="card-head"><div>
         <div class="card-title">${UI.esc(r.RoleName)}
           ${r.IsSystem ? '<span class="badge badge-grey">built in</span>' : ''}</div>
         <div class="muted mono">${UI.esc(r.RoleID)}</div>

/**
 * Create a role, or retune an existing one. The permissions are laid out by
 * module with a tick-all for each, because a role is usually "everything about
 * stock, and nothing else".
 */
function roleForm(existing, catalogue, onSaved) {
  const chosen = new Set((existing && existing.Permissions) || []);
  const body = UI.el('div');

  const header = existing
    ? `<div class="field span-2"><label>Role</label>
         <div><strong>${UI.esc(existing.RoleName)}</strong>
           <span class="muted mono"> · ${UI.esc(existing.RoleID)}</span></div></div>`
    : `<div class="form-grid">
         <div class="field"><label for="roleName">Role name *</label>
           <input class="input" id="roleName" maxlength="40" placeholder="Site Accountant"></div>
         <div class="field"><label for="roleDesc">Description</label>
           <input class="input" id="roleDesc" placeholder="What this role is for"></div>
       </div>`;

  body.innerHTML = header +
    `<div style="display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px">
       <strong style="font-size:13px">What may this role do?</strong>
       <span class="muted" style="font-size:12px" id="permCount"></span>
     </div>
     <div class="perm-grid" id="permGrid"></div>
     <div id="roleError"></div>`;

  const grid = body.querySelector('#permGrid');
  const count = body.querySelector('#permCount');

  const refreshCount = () => {
    count.textContent = chosen.size + ' of ' +
      catalogue.reduce((n, g) => n + g.permissions.length, 0) + ' chosen';
    grid.querySelectorAll('[data-all]').forEach(cb => {
      const g = catalogue.find(x => x.module === cb.dataset.all);
      cb.checked = g.permissions.every(p => chosen.has(p));
      cb.indeterminate = !cb.checked && g.permissions.some(p => chosen.has(p));
    });
  };

  grid.innerHTML = catalogue.map(g => `
    <div class="perm-module">
      <label class="perm-module-head">
        <input type="checkbox" data-all="${UI.esc(g.module)}">
        <span>${UI.esc(g.module)}</span>
      </label>
      ${g.permissions.map(p => `
        <label class="perm-opt">
          <input type="checkbox" data-perm="${UI.esc(p)}"${chosen.has(p) ? ' checked' : ''}>
          <span>${UI.esc(p.replace(g.module + '.', ''))}</span>
        </label>`).join('')}
    </div>`).join('');

  grid.querySelectorAll('[data-perm]').forEach(cb => {
    cb.onchange = () => {
      if (cb.checked) chosen.add(cb.dataset.perm); else chosen.delete(cb.dataset.perm);
      refreshCount();
    };
  });
  grid.querySelectorAll('[data-all]').forEach(cb => {
    cb.onchange = () => {
      const g = catalogue.find(x => x.module === cb.dataset.all);
      g.permissions.forEach(p => { if (cb.checked) chosen.add(p); else chosen.delete(p); });
      grid.querySelectorAll('[data-perm]').forEach(x => { x.checked = chosen.has(x.dataset.perm); });
      refreshCount();
    };
  });
  refreshCount();

  UI.modal({
    title: existing ? 'Permissions — ' + existing.RoleName : 'New role',
    size: 'xwide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: existing ? 'Save permissions' : 'Create role', class: 'btn-primary', onClick: async m => {
          const perms = Array.from(chosen);
          if (!perms.length) { UI.warn('Give the role at least one permission.'); return; }
          m.busy(true);
          try {
            let res;
            if (existing) {
              res = await api('updateRole', existing.RoleID, { Permissions: perms });
            } else {
              const name = body.querySelector('#roleName').value.trim();
              if (!name) { m.busy(false); UI.warn('Give the role a name.'); return; }
              res = await api('createRole', { RoleName: name,
                Description: body.querySelector('#roleDesc').value.trim(), Permissions: perms });
            }
            UI.success(res.message);
            m.close();
            if (onSaved) onSaved();
          } catch (e) {
            m.busy(false);
            document.getElementById('roleError').innerHTML =
              '<div class="banner banner-error mt-8">' + UI.esc(e.message) + '</div>';
          }
        } }
    ]
  });
}

        <tbody>${rows.map(r => {

    } catch (err) { UI.error('Could not save settings', err.message); }
    finally { btn.disabled = false; btn.textContent = 'Save changes'; }
  };
}

/**
 * The company logo, uploaded rather than linked.
 *
 * Choosing a file is the whole interaction: the browser shrinks the picture to
 * letterhead size and stores the image itself, so the logo prints from the
 * spreadsheet with nothing to share, host or keep alive. The preview is drawn
 * at the size it prints, because paper is the worst place to find out.
 */
function renderLogoControl(current) {
  const host = document.getElementById('logoControl');
  if (!host) return;
  const isUpload = /^data:image\//i.test(current || '');

  host.innerHTML = `
    <div class="logo-control">
      <div class="logo-shot ${current ? '' : 'logo-shot-empty'}" id="logoShot">
        ${current ? `<img alt="Company logo" id="logoImg" src="${UI.esc(current)}">`
                  : '<span>No logo</span>'}
      </div>
      <div class="logo-actions">
        <label class="btn btn-sm" for="logoFile">${current ? 'Replace' : 'Upload a logo'}
          <input type="file" id="logoFile" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml"
                 style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></label>
        ${current ? `<button type="button" class="btn btn-sm btn-danger" id="logoRemove">Remove</button>` : ''}
        <button type="button" class="linklike" id="logoLinkToggle">or use a link</button>
      </div>
      <div class="hint" id="logoHint">${current
        ? (isUpload ? 'Stored in the app. It prints on every document, with nothing to share or keep alive.'
                    : 'This is a link. If the file moves or stops being shared, documents print without it \u2014 upload the image instead.')
        : 'PNG, JPG, GIF, WEBP or SVG. It is shrunk to letterhead size automatically.'}</div>
      <div id="logoLinkRow" class="hidden" style="margin-top:8px">
        <input class="input" id="logoLink" placeholder="https://… or a Google Drive link"
               value="${isUpload ? '' : UI.esc(current || '')}">
        <div class="hint">Saved with the rest of the settings. A Drive file has to be shared
          as "anyone with the link can view".</div>
      </div>
    </div>`;

  document.getElementById('logoLinkToggle').onclick = () => {
    const row = document.getElementById('logoLinkRow');
    row.classList.toggle('hidden');
    // Only a visible link box is saved; the hidden one must not wipe an upload.
    const box = document.getElementById('logoLink');
    box.dataset.key = row.classList.contains('hidden') ? '' : 'company.logoUrl';
    if (!row.classList.contains('hidden')) box.focus();
  };

  const remove = document.getElementById('logoRemove');
  if (remove) remove.onclick = () => UI.confirm({
    title: 'Remove the logo',
    message: 'Printed documents will leave the space outlined until another is uploaded.',
    confirmLabel: 'Remove', danger: true,
    onConfirm: async m => {
      try {
        const r = await api('clearCompanyLogo');
        m.close(); UI.success('Removed', r.message);
        App.settings.companyLogoUrl = '';
        renderLogoControl('');
      } catch (e) { UI.error('Could not remove it', e.message); }
    }
  });

  document.getElementById('logoFile').onchange = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const hint = document.getElementById('logoHint');
    hint.textContent = 'Preparing…';
    try {
      const dataUri = await prepareLogo(file);
      const res = await api('setCompanyLogo', dataUri);
      UI.success('Logo saved', res.message);
      App.settings.companyLogoUrl = dataUri;
      renderLogoControl(dataUri);
    } catch (err) {
      hint.innerHTML = `<span class="t-over">${UI.esc(err.message)}</span>`;
    }
  };
}

/**
 * Shrink a chosen image to letterhead size and return it as a data URI.
 *
 * A photographed or exported logo is routinely 2 MB; a letterhead needs about
 * 400 x 150. Resizing in the browser means the file that reaches the server is
 * already the size it will print at, which is what keeps it inside a
 * spreadsheet cell. An SVG is left alone — it is text, and it scales anyway.
 */
function prepareLogo(file) {
  const MAX_W = 400, MAX_H = 150, CEILING = 44000;
  return new Promise((resolve, reject) => {
    if (file.size > 8 * 1024 * 1024) {
      reject(new Error('That file is over 8 MB. Export the logo on its own and try again.'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('The file could not be read.'));
    reader.onload = () => {
      const raw = String(reader.result);
      if (/^data:image\/svg\+xml/i.test(raw)) {
        if (raw.length > CEILING) {
          reject(new Error('That SVG is too detailed to store. Export it as a PNG instead.'));
        } else resolve(raw);
        return;
      }
      if (!/^data:image\//i.test(raw)) {
        reject(new Error('That is not an image file.'));
        return;
      }
      const img = new Image();
      img.onerror = () => reject(new Error('That image could not be opened.'));
      img.onload = () => {
        const scale = Math.min(1, MAX_W / img.width, MAX_H / img.height);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        // PNG keeps a flat logo crisp and its transparency intact. If the
        // picture is photographic it will not fit, so step down through JPEG.
        let out = canvas.toDataURL('image/png');
        if (out.length > CEILING) {
          for (const q of [0.92, 0.8, 0.65, 0.5]) {
            out = canvas.toDataURL('image/jpeg', q);
            if (out.length <= CEILING) break;
          }
        }
        if (out.length > CEILING) {
          reject(new Error('That image will not fit even after shrinking. Crop it to the ' +
            'logo itself, without a photographic background.'));
          return;
        }
        resolve(out);
      };
      img.src = raw;
    };
    reader.readAsDataURL(file);
  });
}

async function pageDatabase(root) {
  const res = await call('getDatabaseStatus');
  const d = res.data;
  const groups = {};
  d.tables.forEach(t => { (groups[t.group] = groups[t.group] || []).push(t); });

  root.innerHTML = pageHead('Database', `Google Sheets backend · ${d.tables.length} tables · ${UI.esc(d.version)}`,
    `<button class="btn" id="rerunSetup">Re-run setup</button>`) +
    `<div class="banner banner-info"><div>Spreadsheet
      <a href="${UI.esc(d.spreadsheetUrl)}" target="_blank" rel="noopener">open in Google Sheets</a>
      · <span class="mono">${UI.esc(d.spreadsheetId)}</span></div></div>
     <div id="dbTables">${Object.keys(groups).map(gname => `
       <div class="card mt-16">
         <div class="card-head"><div class="card-title">${UI.esc(gname)}</div>
           <span class="muted">${groups[gname].length} tables</span></div>
         <div class="table-wrap"><table class="data">
           <thead><tr><th>Table</th><th class="num">Columns</th><th class="num">Rows</th><th>Status</th></tr></thead>
           <tbody>${groups[gname].map(t => `<tr>
             <td class="mono">${UI.esc(t.name)}</td>
             <td class="num">${t.columns}</td>
             <td class="num">${UI.fmt.number(t.rows, 0)}</td>
             <td>${t.exists ? UI.badge('Ready', 'green') : UI.badge('Missing', 'red')}</td>
           </tr>`).join('')}</tbody>
         </table></div>
       </div>`).join('')}</div>`;

  // Every screen in the app, and whether the code behind it is in this
  // deployment. A file that was never pasted in, or pasted in truncated, shows
  // here as a screen that did not load — rather than as a menu item that
  // silently refuses to open.
  const screens = [];
  NAV.forEach(gr => gr.items.forEach(i => screens.push({
    module: gr.group, label: i.label, id: i.id,
    file: ROUTE_SOURCE[i.id] || '\u2014',
    built: isBuilt(i),
    loaded: typeof PAGES[i.id] === 'function'
  })));
  const broken = screens.filter(x => x.built && !x.loaded);
  const files = [];
  broken.forEach(x => { if (files.indexOf(x.file) === -1) files.push(x.file); });

  // The other half of the same question: did every server file arrive whole?
  let server = null;
  try { server = (await api('getDeploymentCheck')).data; } catch (e) { /* older build */ }
  if (server) {
    const bad = server.files.filter(f => !f.present);
    const sv = UI.el('div', { class: 'card mt-16' });
    sv.innerHTML =
      `<div class="card-head"><div class="card-title">Server files</div>
        <span class="${bad.length ? 't-over' : 'muted'}">${bad.length
          ? bad.length + ' incomplete' : 'all ' + server.files.length + ' complete'}</span></div>
       ${bad.length ? `<div class="card-body" style="padding-bottom:0">
         <div class="banner banner-warn"><div>
           <strong>${UI.esc(bad.map(f => f.file).join(', '))}</strong>
           ${bad.length === 1 ? 'is' : 'are'} missing or ${bad.length === 1 ? 'was' : 'were'}
           pasted in incompletely. A file that stops part way still runs \u2014 until something
           reaches for what is missing, and then fails somewhere unrelated. Replace
           ${bad.length === 1 ? 'it' : 'them'} in full, save and deploy a new version.</div></div>
       </div>` : ''}
       <div class="table-wrap"><table class="data">
         <thead><tr><th>File</th><th>Checked by</th><th>Status</th></tr></thead>
         <tbody>${server.files.map(f => `<tr>
           <td class="mono">${UI.esc(f.file)}</td>
           <td class="mono muted">${UI.esc(f.sentinel)}</td>
           <td>${f.present ? UI.badge('Complete', 'green') : UI.badge('Incomplete', 'red')}</td>
         </tr>`).join('')}</tbody>
       </table></div>`;
    root.appendChild(sv);
  }

  const check = UI.el('div', { class: 'card mt-16' });
  check.innerHTML =
    `<div class="card-head"><div class="card-title">Screens</div>
      <span class="${broken.length ? 't-over' : 'muted'}">${broken.length
        ? broken.length + ' did not load' : 'all ' + screens.length + ' loaded'}</span></div>
     ${broken.length ? `<div class="card-body" style="padding-bottom:0">
       <div class="banner banner-warn"><div>
         ${files.length === 1 ? `<strong>${UI.esc(files[0])}</strong> is missing from this
           Apps Script project, or was saved incompletely.`
          : `These files are missing or incomplete: <strong>${UI.esc(files.join(', '))}</strong>.`}
         A file that stops part way takes every screen it registers with it. Replace the
         file, save, and reload this page \u2014 no database change is involved.</div></div>
     </div>` : ''}
     <div class="table-wrap"><table class="data">
       <thead><tr><th>Module</th><th>Screen</th><th>Registered by</th><th>Status</th></tr></thead>
       <tbody>${screens.map(x => `<tr>
         <td>${UI.esc(x.module)}</td>
         <td><strong>${UI.esc(x.label)}</strong></td>
         <td class="mono muted">${UI.esc(x.file)}</td>
         <td>${!x.built ? UI.badge('Later phase', 'grey')
              : x.loaded ? UI.badge('Loaded', 'green') : UI.badge('Did not load', 'red')}</td>
       </tr>`).join('')}</tbody>
     </table></div>`;
  root.appendChild(check);

  document.getElementById('rerunSetup').onclick = () => UI.confirm({
    title: 'Re-run database setup',
    message: 'Creates any missing sheet or column. Existing data is never changed or removed.',
    confirmLabel: 'Run setup',
    onConfirm: async m => {
      try {
        const r = await call('setupDatabase');
        m.close(); UI.success('Setup complete', r.message); navigate('database');
      } catch (e) { UI.error('Setup failed', e.message); }
    }
  });
}

          { key: 'budget', label: 'Budget used', align: 'right', sortable: false, render: r =>
            r.metrics ? `<span class="${r.metrics.budgetUtilisation > 100 ? 'state-error' : ''}">${UI.fmt.percent(r.metrics.budgetUtilisation)}</span>` : '—' },
          { key: 'outstanding', label: 'Outstanding', align: 'right', sortable: false, render: r =>
            r.metrics ? UI.fmt.money(r.metrics.outstandingAmount, sym) : '—' }
        ] : []),
        { key: 'PlannedCompletion', label: 'Completion', render: r =>
          UI.fmt.date(r.RevisedCompletion || r.PlannedCompletion) },
        { key: 'actions', label: '', sortable: false, align: 'right', render: r =>
          `<div class="row-actions"><button class="btn btn-sm" data-open="${UI.esc(r.ProjectID)}">Open</button></div>` }
      ],
      rows: d.rows, rowKey: 'ProjectID',
      empty: UI.emptyState('No projects yet',
        can('project.create') ? 'Create the first project to get started.' : 'Nothing has been assigned to you.')
    });

    mount.querySelectorAll('[data-open]').forEach(n => {
      n.onclick = e => { e.preventDefault(); navigate('project', n.dataset.open); };
    });
    UI.pager(document.getElementById('projPager'), {
      page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
      onPage: p => { projectState.page = p; loadProjects(); }
    });
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retryProjects');
    const b = document.getElementById('retryProjects');
    if (b) b.onclick = loadProjects;
  }
}

async function openProjectForm(existing) {
  const commercial = existing ? App.canEditCommercial : true;
  const fields = projectFields(commercial);
  const pmField = fields.find(f => f.name === 'ProjectManager');
  if (pmField) {
    try {
      const users = (await api('listAssignableUsers')).data;
      pmField.options = [{ value: '', label: '— none —' }].concat(users
        .filter(u => ['PROJECT_MANAGER', 'ADMIN', 'MANAGEMENT'].indexOf(u.Role) !== -1)
        .map(u => ({ value: u.UserID, label: u.Name + ' (' + u.Role.replace(/_/g, ' ') + ')' })));
    } catch (e) { pmField.options = [{ value: '', label: '— none —' }]; }
  }
  const body = UI.form(fields, existing || {});
  UI.modal({
    title: existing ? 'Edit project' : 'New project', size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: existing ? 'Save changes' : 'Create project', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(body, fields);
        if (!data) return;
        m.busy(true);
        try {
          if (existing) {
            await api('updateProject', existing.ProjectID, data);
            UI.success('Project updated');
            m.close();
            navigate('project', existing.ProjectID);
          } else {
            const res = await api('createProject', data);
            UI.success('Project created', res.message);
            m.close();
            navigate('project', res.data.ProjectID);
          }
        } catch (e) {
          UI.error(existing ? 'Could not save' : 'Could not create project', e.message);
        } finally { m.busy(false); }
      }}
    ]
  });
}

async function pageProject(root, projectId) {
  if (projectId && typeof projectId === 'object') {
    App.projectTab = projectId.tab || 'overview';
    projectId = projectId.projectId;
  }
  if (!projectId) { navigate('projects'); return; }
  const res = await api('getProject', projectId);
  const d = res.data;
  const p = d.project;
  const m = d.metrics;
  const sym = App.settings.currencySymbol || 'Rs';
  App.canEditCommercial = d.canEditCommercial;

  const actions = [`<button class="btn" id="backProjects">← All projects</button>`];
  if (d.canEdit) actions.push(`<button class="btn" id="editProject">Edit</button>`);
  if (d.allowedTransitions.length && d.canEdit) actions.push(`<button class="btn" id="changeStatus">Change status</button>`);

  root.innerHTML =
    pageHead(p.ProjectName, `${p.Client}${p.Location ? ' · ' + p.Location : ''} · ${p.ProjectID}`, actions.join('')) +
    (p.IsClosed ? `<div class="banner banner-warn"><div><strong>This project is closed.</strong>
       Records are read-only until an administrator reopens it.</div></div>` : '') +
    `<div class="tabs" id="projectTabs"></div>
     <div id="projectTabBody"></div>`;

  document.getElementById('backProjects').onclick = () => navigate('projects');
  const ed = document.getElementById('editProject');
  if (ed) ed.onclick = () => openProjectForm(p);
  const st = document.getElementById('changeStatus');
  if (st) st.onclick = () => openStatusChange(p, d.allowedTransitions);

  const active = PROJECT_TAB_RENDERERS[App.projectTab] ? App.projectTab : 'overview';
  App.projectTab = active;
  const tabs = document.getElementById('projectTabs');
  PROJECT_TABS.forEach(t => {
    // Two different reasons a tab can be shut, and they deserve different words.
    // A phase that has not landed is a promise; a missing renderer is a gap on
    // the project page for a module that otherwise works, and saying "Phase 5"
    // about a finished module is simply wrong.
    const phaseDone = App.phases[t.phase] && App.phases[t.phase].done;
    const hasView = !!PROJECT_TAB_RENDERERS[t.id];
    const b = UI.el('button', { class: 'tab' + (t.id === active ? ' active' : '') });
    b.textContent = t.label;
    if (!phaseDone || !hasView) {
      b.disabled = true;
      b.style.cursor = 'not-allowed';
      b.style.opacity = '.5';
      if (!phaseDone) {
        b.title = t.label + ' has not moved to the new system yet';
        b.innerHTML = UI.esc(t.label) +
          ` <span class="nav-phase" style="background:var(--surface-2);color:var(--text-muted)">not moved</span>`;
      } else {
        b.title = t.label + ' is built, but has no project view yet — open it from the sidebar';
      }
    } else {
      b.onclick = () => {
        App.projectTab = t.id;
        tabs.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        const host = document.getElementById('projectTabBody');
        host.innerHTML = UI.loadingState();
        Promise.resolve(PROJECT_TAB_RENDERERS[t.id](host, d, sym)).then(() => {
          // A tab that reuses a full screen calls pageHead, which rewrites the
          // header. Put the project's name back — that is where you are.
          document.getElementById('headerTitle').textContent = p.ProjectName;
        }).catch(err => {
          host.innerHTML = UI.errorState(err.message, 'retryTab');
          const rb = document.getElementById('retryTab');
          if (rb) rb.onclick = () => navigate('project', { projectId: p.ProjectID, tab: t.id });
        });
      };
    }
    tabs.appendChild(b);
  });

  const host = document.getElementById('projectTabBody');
  await Promise.resolve(PROJECT_TAB_RENDERERS[active](host, d, sym));
  document.getElementById('headerTitle').textContent = p.ProjectName;
}

/**
 * Cost control by budget head: which heads are eating the project.
 * Loaded after the page paints — the overview must not wait on it, and a role
 * without budget.view simply does not get this block.
 */
async function renderOverviewBudget(projectId, sym) {
  const host = document.getElementById('ovBudgetSection');
  if (!host || !can('budget.view')) return;
  let data;
  try { data = (await api('listBudget', projectId, { pageSize: 1000 })).data; }
  catch (e) { return; }
  const rows = data.rows || [];
  const loose = data.unbudgetedCosts || [];
  if (!rows.length && !loose.length) return;

  // One line per budget head, which is how a project manager thinks about it;
  // the cost-code detail lives on the Budget screen.
  const heads = {};
  rows.forEach(r => {
    const k = r.Category || 'Other';
    const h = heads[k] || (heads[k] = { Category: k, Budget: 0, Committed: 0, Actual: 0, Forecast: 0 });
    h.Budget += Number(r.RevisedBudget || r.OriginalBudget) || 0;
    h.Committed += Number(r.Committed) || 0;
    h.Actual += Number(r.Actual) || 0;
    h.Forecast += Number(r.Forecast) || 0;
  });
  // Cost booked against a code with no budget line still spent the project's
  // money. If it were left out, this ledger would disagree with the actual cost
  // stated at the top of the page, and the page would be arguing with itself.
  if (loose.length) {
    const h = { Category: 'No budget head', Budget: 0, Committed: 0, Actual: 0, Forecast: 0, Loose: true };
    loose.forEach(r => {
      h.Committed += Number(r.Committed) || 0;
      h.Actual += Number(r.Actual) || 0;
    });
    h.Forecast = h.Actual + Math.max(0, h.Committed - h.Actual);
    if (h.Actual || h.Committed) heads['\u2014 no budget head'] = h;
  }

  const list = Object.keys(heads).map(k => heads[k]).map(h => {
    h.Variance = Math.round((h.Budget - h.Forecast) * 100) / 100;
    h.SpentOf = h.Budget ? (h.Actual / h.Budget) * 100 : 0;
    return h;
  }).sort((a, b) => (a.Loose ? 1 : 0) - (b.Loose ? 1 : 0) || b.Budget - a.Budget);

  const t = list.reduce((a, h) => ({
    Budget: a.Budget + h.Budget, Committed: a.Committed + h.Committed,
    Actual: a.Actual + h.Actual, Forecast: a.Forecast + h.Forecast
  }), { Budget: 0, Committed: 0, Actual: 0, Forecast: 0 });
  t.Variance = Math.round((t.Budget - t.Forecast) * 100) / 100;

  const over = list.filter(h => h.Variance < 0).sort((a, b) => a.Variance - b.Variance);
  const n = v => UI.fmt.number(v, 0);
  const varianceCell = v => `<td class="num ${v < 0 ? 't-over' : ''}" data-label="Variance">${v < 0 ? '\u2212' : ''}${n(Math.abs(v))}</td>`;

  host.innerHTML = `
    <div class="section-head">
      <h2 class="section-title">Cost control by budget head</h2>
      <span class="muted" style="font-size:13px">Amounts in ${UI.esc(sym)}. Variance is budget less forecast.</span>
    </div>
    ${over.length ? `<p class="t-over" style="margin:0 0 10px;font-size:13px">
       ${over.length === 1 ? 'One head is' : over.length + ' heads are'} forecast past budget.
       ${UI.esc(over[0].Category)} alone accounts for ${n(Math.abs(over[0].Variance))}
       of the ${n(Math.abs(Math.min(0, t.Variance)))} overrun.</p>` : ''}
    <div class="table-wrap"><table class="data ledger">
      <thead><tr>
        <th>Budget head</th><th class="num">Budget</th><th class="num">Committed</th>
        <th class="num">Actual</th><th class="num">Forecast</th><th class="num">Variance</th>
        <th>Spent of budget</th>
      </tr></thead>
      <tbody>${list.map(h => `<tr>
        <td><strong>${UI.esc(h.Category)}</strong>${h.Loose
          ? '<br><span class="muted" style="font-size:12px">Cost booked to a code with no budget line</span>' : ''}</td>
        <td class="num" data-label="Budget">${n(h.Budget)}</td>
        <td class="num" data-label="Committed">${n(h.Committed)}</td>
        <td class="num" data-label="Actual">${n(h.Actual)}</td>
        <td class="num" data-label="Forecast">${n(h.Forecast)}</td>
        ${varianceCell(h.Variance)}
        <td data-label="Spent of budget"><div style="height:8px;max-width:200px;background:var(--surface-2)">
          <i style="display:block;height:8px;width:${Math.max(0, Math.min(100, h.SpentOf))}%;
             background:${h.Variance < 0 ? 'var(--over-fill)' : h.SpentOf > 90 ? 'var(--warn-fill)' : 'var(--navy)'}"></i>
        </div></td>
      </tr>`).join('')}</tbody>
      <tfoot><tr>
        <td>Project</td>
        <td class="num" data-label="Budget">${n(t.Budget)}</td>
        <td class="num" data-label="Committed">${n(t.Committed)}</td>
        <td class="num" data-label="Actual">${n(t.Actual)}</td>
        <td class="num" data-label="Forecast">${n(t.Forecast)}</td>
        ${varianceCell(t.Variance)}<td></td>
      </tr></tfoot>
    </table></div>`;
}

/** Offers the file to the browser; falls back to a copyable modal if blocked. */
function downloadCsv(fileName, text) {
  try {
    const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    UI.success('Download started', fileName);
    return;
  } catch (e) { /* sandboxed iframes can block downloads */ }
  UI.modal({
    title: fileName, size: 'wide',
    body: `<p style="margin-top:0;font-size:13px" class="muted">
      The browser blocked the download. Select everything below and paste it into a .csv file.</p>
      <textarea class="input mono" rows="16" readonly style="white-space:pre">${UI.esc(text)}</textarea>`,
    footer: [{ label: 'Close', class: 'btn-primary', onClick: m => m.close() }]
  });
}

/**
 * Import / Export / Template buttons, on every screen whose records can be
 * loaded from a file.
 *
 * `projectId` may be null on a company-wide list such as Purchase Orders. An
 * import that belongs to a project then asks which one in the dialog, rather
 * than the screen quietly refusing or guessing.
 */
function importExportBar(moduleKey, projectId, onDone, canEdit, exportOptions, opts) {
  const wrap = UI.el('div', { class: 'flex gap-8' });
  if (canEdit) {
    const imp = UI.el('button', { class: 'btn btn-sm', text: 'Import' });
    imp.onclick = () => openImportDialog(moduleKey, projectId, onDone, opts);
    wrap.appendChild(imp);
  }
  const tpl = UI.el('button', { class: 'btn btn-sm', text: 'Template' });
  tpl.onclick = async () => {
    try {
      const r = await api('getImportTemplate', moduleKey);
      downloadCsv(r.data.fileName, r.data.csv);
    } catch (e) { UI.error('Could not build the template', e.message); }
  };
  const exp = UI.el('button', { class: 'btn btn-sm', text: 'Export' });
  exp.title = 'Exports exactly what the current filters show';
  exp.onclick = async () => {
    try {
      // Export what is on screen, not the whole table.
      const opts = Object.assign({ projectId }, exportOptions ? exportOptions() : {});
      const r = await api('exportData', moduleKey, opts);
      downloadCsv(r.data.fileName, r.data.csv);
    } catch (e) { UI.error('Could not export', e.message); }
  };
  wrap.append(tpl, exp);
  return wrap;
}

function openImportDialog(moduleKey, projectId, onDone, opts) {
  const o = opts || {};
  // A project-scoped import opened from a company-wide list has no project yet.
  const needsProject = !!o.projectScoped && !projectId;
  const body = UI.el('div');
  body.innerHTML = `
    <p style="margin-top:0;font-size:13px">
      Upload a CSV. It is checked first — nothing is written until you confirm, and a file
      with any error imports nothing at all.</p>
    ${needsProject ? `<div class="field">
      <label for="importProject">Project these records belong to</label>
      <select class="input" id="importProject"><option value="">Loading…</option></select>
    </div>` : ''}
    <div class="field">
      <label for="importFile">CSV file</label>
      <input class="input" type="file" id="importFile" accept=".csv,text/csv">
    </div>
    <div id="importReport"></div>`;

  if (needsProject) {
    api('listProjects', { pageSize: 200 }).then(r => {
      const sel = body.querySelector('#importProject');
      if (!sel) return;
      sel.innerHTML = '<option value="">Choose a project</option>' +
        r.data.rows.map(p =>
          `<option value="${UI.esc(p.ProjectID)}">${UI.esc(p.ProjectName)}</option>`).join('');
      sel.onchange = () => { projectId = sel.value; };
    }).catch(() => {
      const sel = body.querySelector('#importProject');
      if (sel) sel.innerHTML = '<option value="">Projects could not be loaded</option>';
    });
  }

  let fileText = '';
  const modal = UI.modal({
    title: 'Import — ' + moduleKey, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Check file', class: 'btn-primary', onClick: async m => {
        if (needsProject && !projectId) {
          UI.warn('Choose a project first',
            'These records are filed against a project, so the import needs to know which.');
          return;
        }
        if (!fileText) { UI.warn('Choose a file first'); return; }
        m.busy(true);
        try {
          const res = await api('validateImport', moduleKey, fileText, projectId);
          renderImportReport(res.data, res.message);
        } catch (e) {
          renderImportReport(e.payload ? e.payload.data : null, e.message);
        } finally { m.busy(false); }
      }}
    ]
  });

  body.querySelector('#importFile').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      fileText = ev.target.result;
      body.querySelector('#importReport').innerHTML =
        `<div class="banner banner-info"><div>${UI.esc(file.name)} loaded
          (${UI.fmt.number(fileText.length, 0)} characters). Press <strong>Check file</strong>.</div></div>`;
    };
    reader.readAsText(file);
  };

  function renderImportReport(report, message) {
    const host = body.querySelector('#importReport');
    if (!report) { host.innerHTML = `<div class="banner banner-warn"><div>${UI.esc(message)}</div></div>`; return; }
    const hard = (report.errors || []).filter(e => e.severity !== 'warning');
    const warn = (report.errors || []).filter(e => e.severity === 'warning');

    host.innerHTML =
      `<div class="banner ${hard.length ? 'banner-warn' : 'banner-info'}"><div>${UI.esc(message)}</div></div>` +
      (warn.length ? `<div class="banner banner-info"><div>${warn.map(w => UI.esc(w.message)).join('<br>')}</div></div>` : '') +
      (hard.length
        ? `<div class="card"><div class="card-head"><div class="card-title">Problems</div>
             <button class="btn btn-sm" id="dlErrors">Download error report</button></div>
           <div class="table-wrap"><table class="data">
             <thead><tr><th>Line</th><th>Column</th><th>Value</th><th>Problem</th></tr></thead>
             <tbody>${hard.slice(0, 100).map(e => `<tr><td>${e.row}</td><td>${UI.esc(e.column || '')}</td>
               <td class="mono">${UI.esc(e.value === undefined ? '' : e.value)}</td>
               <td>${UI.esc(e.message)}</td></tr>`).join('')}</tbody></table></div></div>`
        : `<div class="card"><div class="card-head"><div class="card-title">Preview — first
             ${Math.min(20, (report.preview || []).length)} of ${report.summary.valid} row(s)</div></div>
           <div class="table-wrap"><table class="data">
             <thead><tr><th>Line</th>${Object.keys((report.preview || [{ data: {} }])[0].data)
               .map(k => `<th>${UI.esc(k)}</th>`).join('')}</tr></thead>
             <tbody>${(report.preview || []).map(r => `<tr><td>${r.line}</td>${
               Object.keys(r.data).map(k => `<td>${UI.esc(r.data[k])}</td>`).join('')}</tr>`).join('')}</tbody>
           </table></div></div>`);

    const dl = host.querySelector('#dlErrors');
    if (dl) dl.onclick = async () => {
      try {
        const r = await api('getImportErrorReport', moduleKey, fileText, projectId);
        downloadCsv(r.data.fileName, r.data.csv);
      } catch (e) { UI.error('Could not build the report', e.message); }
    };

    // Swap the footer action once the file is clean.
    modal.footer.innerHTML = '';
    const cancel = UI.el('button', { class: 'btn', text: 'Cancel' });
    cancel.onclick = () => modal.close();
    modal.footer.appendChild(cancel);
    if (!hard.length && report.summary.valid) {
      const go = UI.el('button', { class: 'btn btn-primary',
        text: `Import ${report.summary.valid} row(s)` });
      go.onclick = async () => {
        modal.busy(true);
        try {
          const res = await api('commitImport', moduleKey, fileText, projectId);
          modal.close();
          UI.success('Import complete', res.message);
          if (onDone) onDone();
        } catch (e) { UI.error('Import failed', e.message); }
        finally { modal.busy(false); }
      };
      modal.footer.appendChild(go);
    } else {
      const again = UI.el('button', { class: 'btn btn-primary', text: 'Check again' });
      again.onclick = async () => {
        modal.busy(true);
        try {
          const res = await api('validateImport', moduleKey, fileText, projectId);
          renderImportReport(res.data, res.message);
        } catch (e) { renderImportReport(e.payload ? e.payload.data : null, e.message); }
        finally { modal.busy(false); }
      };
      modal.footer.appendChild(again);
    }
  }
}

async function loadBOQ(projectId, sym) {
  const mount = document.getElementById('boqTable');
  if (!mount) return;
  mount.innerHTML = UI.loadingState();
  try {
    const res = await api('listBOQ', projectId, boqState);
    const d = res.data;

    const cat = document.getElementById('boqCategory');
    if (cat && !cat.dataset.filled) {
      cat.innerHTML = '<option value="">All categories</option>' +
        d.categories.map(c => `<option value="${UI.esc(c)}">${UI.esc(c)}</option>`).join('');
      cat.value = boqState.category;
      cat.dataset.filled = '1';
      cat.onchange = e => { boqState.category = e.target.value; boqState.page = 1; loadBOQ(projectId, sym); };
    }
    const cc = document.getElementById('boqCostCode');
    if (cc && !cc.dataset.filled) {
      cc.innerHTML = '<option value="">All cost codes</option>' +
        d.costCodes.map(c => `<option value="${UI.esc(c)}">${UI.esc(c)}</option>`).join('');
      cc.value = boqState.costCode;
      cc.dataset.filled = '1';
      cc.onchange = e => { boqState.costCode = e.target.value; boqState.page = 1; loadBOQ(projectId, sym); };
    }

    const actions = document.getElementById('boqActions');
    if (actions && !actions.dataset.filled) {
      actions.dataset.filled = '1';
      if (d.canEdit) {
        const add = UI.el('button', { class: 'btn btn-sm btn-primary', text: '+ Add item' });
        add.onclick = () => openBOQForm(projectId, null, sym);
        actions.appendChild(add);
      }
      actions.appendChild(importExportBar('BOQ', projectId,
        () => navigate('project', { projectId, tab: 'boq' }), d.canEdit,
        () => ({ search: boqState.search, filters: { Category: boqState.category, CostCode: boqState.costCode } })));
    }

    document.getElementById('boqTotals').innerHTML = `
      <div class="stat-grid" style="padding:16px 16px 0">
        ${[['Items', d.totals.items, 'BOQ lines'],
           ['Original value', UI.fmt.money(d.totals.originalAmount, sym), 'Quantity × rate'],
           ['Revised value', UI.fmt.money(d.totals.revisedAmount, sym), 'After variations'],
           ['Executed value', UI.fmt.money(d.totals.executedValue, sym),
             UI.fmt.percent(d.totals.executedPercent) + ' of revised']]
          .map(t => `<div class="stat"><div class="stat-label">${UI.esc(t[0])}</div>
            <div class="stat-value">${UI.esc(t[1])}</div><div class="stat-note">${UI.esc(t[2])}</div>
            <div class="stat-accent"></div></div>`).join('')}
      </div>`;

    // Several lines deleted at once (owner's request, 23 Oct 2026). The
    // choice is per page and is cleared whenever the list reloads.
    const canBulk = !!d.canDelete;   // sent only by a server that has deleteBOQItems
    const picked = new Set();
    const bulk = document.getElementById('boqBulk');
    const drawBulk = () => {
      if (!bulk) return;
      bulk.classList.toggle('hidden', !canBulk || !d.rows.length);
      bulk.innerHTML = `<label class="check"><input type="checkbox" id="boqPickAll"
          ${picked.size && picked.size === d.rows.length ? 'checked' : ''}> Select all on this page</label>
        <span class="muted">${picked.size ? picked.size + ' selected' : ''}</span>
        <button class="btn btn-sm btn-danger" id="boqDelPicked" ${picked.size ? '' : 'disabled'}>
          Delete selected${picked.size ? ' (' + picked.size + ')' : ''}</button>`;
      const all = document.getElementById('boqPickAll');
      if (all) all.onchange = e => {
        picked.clear();
        if (e.target.checked) d.rows.forEach(r => picked.add(r.BOQID));
        mount.querySelectorAll('[data-pick]').forEach(c => { c.checked = e.target.checked; });
        drawBulk();
      };
      const del = document.getElementById('boqDelPicked');
      if (del) del.onclick = () => UI.confirm({
        title: 'Delete ' + picked.size + ' BOQ line(s)',
        message: d.rows.filter(r => picked.has(r.BOQID)).slice(0, 12)
          .map(r => r.ItemCode + ' — ' + r.Description).join('\n') +
          (picked.size > 12 ? '\n… and ' + (picked.size - 12) + ' more' : '') +
          '\n\nIf any of them has been billed, nothing is deleted.',
        confirmLabel: 'Delete ' + picked.size, danger: true,
        onConfirm: async m => {
          try {
            const res = await api('deleteBOQItems', [...picked]);
            m.close(); UI.success(res.message); loadBOQ(projectId, sym);
          } catch (e) { UI.error('Nothing was deleted', e.message); }
        }
      });
    };

    UI.table(mount, {
      sortBy: boqState.sortBy, sortDir: boqState.sortDir,
      onSort: key => {
        boqState.sortDir = (boqState.sortBy === key && boqState.sortDir === 'asc') ? 'desc' : 'asc';
        boqState.sortBy = key; loadBOQ(projectId, sym);
      },
      columns: [
        ...(canBulk ? [{ key: 'pick', label: '', sortable: false, width: '34px', render: r =>
          `<input type="checkbox" data-pick="${UI.esc(r.BOQID)}" aria-label="Select ${UI.esc(r.ItemCode)}">` }] : []),
        { key: 'ItemCode', label: 'Code', render: r =>
          `<span class="mono"><strong>${UI.esc(r.ItemCode)}</strong></span>` +
          (r.IsRevised ? ' ' + UI.badge('Revised', 'violet') : '') },
        { key: 'Description', label: 'Description', render: r =>
          `${UI.esc(r.Description)}${r.CostCode ? `<br><span class="muted mono">${UI.esc(r.CostCode)}</span>` : ''}` },
        { key: 'Unit', label: 'Unit' },
        { key: 'Quantity', label: 'Qty', align: 'right', render: r => UI.fmt.number(r.Quantity, 3) },
        { key: 'Rate', label: 'Rate', align: 'right', render: r => UI.fmt.number(r.Rate) },
        { key: 'Amount', label: 'Amount', align: 'right', render: r => UI.fmt.number(r.Amount) },
        { key: 'RevisedAmount', label: 'Revised', align: 'right', render: r =>
          r.IsRevised ? `${UI.fmt.number(r.RevisedAmount)}<br><span class="muted">${UI.fmt.number(r.EffectiveQuantity, 3)} × ${UI.fmt.number(r.EffectiveRate)}</span>`
                      : '<span class="muted">—</span>' },
        { key: 'ExecutedQuantity', label: 'Executed', align: 'right', render: r =>
          `${UI.fmt.number(r.ExecutedQuantity, 3)}<br><span class="muted">${UI.fmt.percent(r.ExecutedPercent)}</span>` },
        { key: 'BalanceQuantity', label: 'Balance', align: 'right', render: r => UI.fmt.number(r.BalanceQuantity, 3) },
        ...(d.canEdit ? [{ key: 'actions', label: '', sortable: false, align: 'right', render: r =>
          `<div class="row-actions">
             <button class="btn btn-sm" data-edit="${UI.esc(r.BOQID)}">Edit</button>
             <button class="btn btn-sm btn-danger" data-del="${UI.esc(r.BOQID)}">Delete</button></div>` }] : [])
      ],
      rows: d.rows, rowKey: 'BOQID',
      empty: UI.emptyState('No BOQ items', 'Add items one by one, or import a CSV using the template.')
    });

    mount.querySelectorAll('[data-pick]').forEach(c => {
      c.onchange = () => { c.checked ? picked.add(c.dataset.pick) : picked.delete(c.dataset.pick); drawBulk(); };
    });
    drawBulk();
    mount.querySelectorAll('[data-edit]').forEach(b => {
      const row = d.rows.find(r => r.BOQID === b.dataset.edit);
      b.onclick = () => openBOQForm(projectId, row, sym);
    });
    mount.querySelectorAll('[data-del]').forEach(b => {
      const row = d.rows.find(r => r.BOQID === b.dataset.del);
      b.onclick = () => UI.confirm({
        title: 'Delete BOQ item', message: `${row.ItemCode} — ${row.Description}`,
        confirmLabel: 'Delete', danger: true,
        onConfirm: async m => {
          try { await api('deleteBOQItem', row.BOQID); m.close(); UI.success('Item deleted'); loadBOQ(projectId, sym); }
          catch (e) { UI.error('Could not delete', e.message); }
        }
      });
    });

    UI.pager(document.getElementById('boqPager'), {
      page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
      onPage: p => { boqState.page = p; loadBOQ(projectId, sym); }
    });
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retryBoq');
    const b = document.getElementById('retryBoq');
    if (b) b.onclick = () => loadBOQ(projectId, sym);
  }
}

function openBOQForm(projectId, existing, sym) {
  const fields = [
    { name: 'ItemCode', label: 'Item code', required: true },
    { name: 'Unit', label: 'Unit', type: 'select', required: true, options: App.enums.UNITS || [] },
    { name: 'Description', label: 'Description', required: true, span: 2 },
    { name: 'Category', label: 'Category' },
    { name: 'CostCode', label: 'Cost code', hint: 'Links this item to a budget line' },
    { name: 'Quantity', label: 'Quantity', type: 'number', required: true },
    { name: 'Rate', label: 'Rate', type: 'number', required: true },
    { name: 'RevisedQuantity', label: 'Revised quantity', type: 'number', hint: 'Leave blank if unchanged' },
    { name: 'RevisedRate', label: 'Revised rate', type: 'number', hint: 'Leave blank if unchanged' },
    { name: 'ExecutedQuantity', label: 'Executed quantity', type: 'number' }
  ];
  const values = existing ? Object.assign({}, existing, {
    RevisedQuantity: existing.RevisedQuantity === null ? '' : existing.RevisedQuantity,
    RevisedRate: existing.RevisedRate === null ? '' : existing.RevisedRate
  }) : {};
  const body = UI.form(fields, values);

  const live = UI.el('div', { class: 'banner banner-info' });
  body.appendChild(live);
  live.classList.add('span-2');
  const recompute = () => {
    const v = UI.readForm(body);
    const q = Number(v.Quantity) || 0, r = Number(v.Rate) || 0;
    const eq = v.RevisedQuantity === '' ? q : Number(v.RevisedQuantity) || 0;
    const er = v.RevisedRate === '' ? r : Number(v.RevisedRate) || 0;
    live.innerHTML = `<div>Amount <strong>${UI.fmt.money(q * r, sym)}</strong> ·
      Revised amount <strong>${UI.fmt.money(eq * er, sym)}</strong> ·
      Balance quantity <strong>${UI.fmt.number(eq - (Number(v.ExecutedQuantity) || 0), 3)}</strong>
      <br><span class="muted">Calculated on the server when you save — these figures are never typed in.</span></div>`;
  };
  body.querySelectorAll('input').forEach(i => i.addEventListener('input', recompute));
  recompute();

  UI.modal({
    title: existing ? 'Edit BOQ item' : 'Add BOQ item', size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: existing ? 'Save' : 'Add item', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(body, fields);
        if (!data) return;
        m.busy(true);
        try {
          if (existing) await api('updateBOQItem', existing.BOQID, data);
          else await api('createBOQItem', projectId, data);
          m.close();
          UI.success(existing ? 'BOQ item updated' : 'BOQ item added');
          loadBOQ(projectId, sym);
        } catch (e) { UI.error('Could not save', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

    <div id="budgetSection" class="flex gap-8" style="display:none;margin-bottom:12px;flex-wrap:wrap"></div>
    <div id="budgetWorks" data-cardify style="display:none"></div>
    <div class="card" id="budgetMaterials">
      <div class="card-head">
        <div class="filters">
          <div class="field"><label for="budgetSearch">Search</label>
            <input class="input" id="budgetSearch" placeholder="Cost code, description or material"
              value="${UI.esc(budgetState.search)}"></div>
          <div class="field"><label for="budgetCategory">Category</label><select class="input" id="budgetCategory"></select></div>
          <div class="field"><label for="budgetShow">Show</label><select class="input" id="budgetShow"></select></div>
        </div>
        <div class="flex gap-8" id="budgetActions"></div>
      </div>

      <div id="budgetTable">${UI.loadingState()}</div>
      <div id="budgetPager"></div>
      <div id="budgetExtras"></div>

  document.getElementById('budgetSearch').oninput = e => {
