async function pageGoodsReceipts(root) {
  root.innerHTML =
    pageHead('Goods Receipts', 'What arrived, what was accepted, what was sent back',
      can('grn.create') ? `<button class="btn btn-primary" id="newGrnBtn">+ Receive material</button>` : '') +
    `<div id="grnSummary" class="stat-grid" style="margin-bottom:16px"></div>
     <div class="card">
       <div class="card-head">
         <div class="filters">
           <div class="field"><label for="grnSearch">Search</label>
             <input class="input" id="grnSearch" placeholder="GRN or PO number, vendor, item"
                    value="${UI.esc(grnState.search)}"></div>
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="grnRejects"> With rejections</label></div>
           <button class="btn" id="grnReset">Reset</button>
         </div>
       </div>
       <div id="grnTable">${UI.loadingState()}</div>
       <div id="grnPager"></div>
     </div>`;

  document.getElementById('grnRejects').checked = grnState.rejectionsOnly;
  let debounce;
  document.getElementById('grnSearch').oninput = e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { grnState.search = e.target.value; grnState.page = 1; loadGoodsReceipts(); }, 250);
  };
  document.getElementById('grnRejects').onchange = e => {
    grnState.rejectionsOnly = e.target.checked; grnState.page = 1; loadGoodsReceipts();
  };
  document.getElementById('grnReset').onclick = () => {
    Object.assign(grnState, { page: 1, search: '', rejectionsOnly: false });
    pageGoodsReceipts(root);
  };
  const nb = document.getElementById('newGrnBtn');
  if (nb) nb.onclick = openReceivePicker;

  await loadGoodsReceipts();
}

async function loadGoodsReceipts() {
  const mount = document.getElementById('grnTable');
  if (!mount) return;
  mount.innerHTML = UI.loadingState();
  try {
    const d = (await api('listGoodsReceipts', grnState)).data;
    document.getElementById('grnSummary').innerHTML =
      [['Receipts', d.summary.total, 'Visible to you'],
       ['Accepted value', money(d.summary.value), d.summary.reversed === undefined
          ? 'Material taken into stock' : 'Material taken into stock, reversals left out'],
       ['With rejections', d.summary.withRejections, 'Something was sent back']]
        // Reversed receipts, counted apart (24 Oct 2026).
        .concat(d.summary.reversed ? [['Reversed', d.summary.reversed, money(d.summary.reversedValue) + ' taken back out']] : [])
        .map(t => `<div class="stat"><div class="stat-label">${UI.esc(t[0])}</div>
          <div class="stat-value">${UI.esc(t[1])}</div><div class="stat-note">${UI.esc(t[2])}</div>
          <div class="stat-accent"></div></div>`).join('');

    UI.table(mount, {
      sortBy: grnState.sortBy, sortDir: grnState.sortDir,
      onSort: key => {
        grnState.sortDir = (grnState.sortBy === key && grnState.sortDir === 'asc') ? 'desc' : 'asc';
        grnState.sortBy = key; loadGoodsReceipts();
      },
      columns: [
        { key: 'GRNID', label: 'Receipt', render: r =>
          `<a href="#" data-open="${UI.esc(r.GRNID)}"><strong class="mono">${UI.esc(r.GRNID)}</strong></a>
           <br><span class="muted">${UI.fmt.date(r.ReceiptDate)}</span>` },
        { key: 'POID', label: 'Order', render: r => `<span class="mono">${UI.esc(r.POID)}</span>` },
        { key: 'VendorName', label: 'Vendor' },
        { key: 'StockRoomName', label: 'Into store' },
        { key: 'LineCount', label: 'Lines', align: 'right' },
        { key: 'RejectedQty', label: 'Rejected', align: 'right', render: r =>
          r.RejectedQty ? UI.badge(UI.fmt.number(r.RejectedQty, 3), 'red') : '<span class="muted">—</span>' },
        // A reversed receipt says so, and its value is struck through (24 Oct 2026).
        { key: 'AcceptedValue', label: 'Accepted', align: 'right', render: r => r.Status === 'Reversed'
          ? `<s class="muted">${money(r.AcceptedValue)}</s>` : money(r.AcceptedValue) },
        { key: 'Status', label: 'Status', render: r => UI.badge(r.Status || 'Received',
          r.Status === 'Reversed' ? 'red' : 'green') },
        { key: 'SupplierInvoiceID', label: 'Invoice', render: r => r.SupplierInvoiceID
          ? `<span class="mono">${UI.esc(r.SupplierInvoiceID)}</span>`
          : (r.Status === 'Reversed' || r.SupplierInvoiceID === undefined ? '' : '<span class="muted">not yet</span>') },
        { key: 'actions', label: '', sortable: false, render: r =>
          `<div class="row-actions"><button class="btn btn-sm" data-open="${UI.esc(r.GRNID)}">Open</button></div>` }
      ],
      rows: d.rows,
      empty: UI.emptyState('Nothing received yet',
        d.canCreate ? 'Receive material against an issued purchase order.' : 'No deliveries recorded.')
    });
    mount.querySelectorAll('[data-open]').forEach(n => {
      n.onclick = e => { e.preventDefault(); openGoodsReceipt(n.dataset.open); };
    });
    UI.pager(document.getElementById('grnPager'), {
      page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
      onPage: p => { grnState.page = p; loadGoodsReceipts(); }
    });
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retryGrn');
    const b = document.getElementById('retryGrn');
    if (b) b.onclick = loadGoodsReceipts;
  }
}

async function openGoodsReceipt(grnId) {
  let d;
  try { d = (await api('getGoodsReceipt', grnId)).data; }
  catch (e) { UI.error('Could not load the receipt', e.message); return; }

  const body = UI.el('div');
  const reversed = d.grn.Status === 'Reversed';
  body.innerHTML =
    // Said first, not after the lines (24 Oct 2026: it was easy to miss).
    (reversed ? `<div class="banner banner-warn" style="margin-bottom:14px"><div>
        <strong>REVERSED — this receipt no longer counts.</strong>
        ${d.reversedBy ? 'By ' + UI.esc(d.reversedBy.Name) : ''}
        ${d.grn.ReversedAt ? ' on ' + UI.fmt.date(d.grn.ReversedAt) : ''}.
        ${d.grn.ReversalReason ? '<br>Reason: ' + UI.esc(d.grn.ReversalReason) : ''}
        <br>The stock was taken back out and the order quantities reopened.</div></div>` : '') +
    `<div class="grid-2">
      <div class="box"><h4>Delivery</h4>
        <div>Order <span class="mono">${UI.esc(d.grn.POID)}</span></div>
        <div>${UI.esc(d.vendor ? d.vendor.CompanyName : '')}</div>
        <div class="muted">${UI.fmt.date(d.grn.ReceiptDate)}
          ${d.grn.DeliveryNote ? ' · note ' + UI.esc(d.grn.DeliveryNote) : ''}</div></div>
      <div class="box"><h4>Into</h4>
        <div>${UI.esc(d.stockRoom ? d.stockRoom.Name : '')}</div>
        <div class="muted">${UI.esc(d.project ? d.project.ProjectName : '')}</div>
        <div class="muted">Received by ${UI.esc(d.receivedBy ? d.receivedBy.Name : '')}</div></div>
    </div>
    <div class="table-wrap mt-16"><table class="data">
      <thead><tr><th>Item</th><th class="num">Ordered</th><th class="num">Delivered</th>
        <th class="num">Rejected</th><th class="num">Accepted</th><th class="num">Rate</th>
        <th class="num">Value</th></tr></thead>
      <tbody>${d.items.map(i => `<tr>
        <td><strong>${UI.esc(i.ItemName)}</strong>
          <br><span class="mono muted">${UI.esc(i.ItemCode)}</span>
          ${i.Remarks ? `<br><span class="muted">${UI.esc(i.Remarks)}</span>` : ''}</td>
        <td class="num muted">${UI.fmt.number(i.OrderedQty, 3)}</td>
        <td class="num">${UI.fmt.number(i.ReceivedQty, 3)}</td>
        <td class="num">${i.RejectedQty ? UI.badge(UI.fmt.number(i.RejectedQty, 3), 'red') : '—'}</td>
        <td class="num"><strong>${UI.fmt.number(i.AcceptedQty, 3)} ${UI.esc(i.Unit)}</strong></td>
        <td class="num">${UI.fmt.number(i.Rate)}</td>
        <td class="num">${UI.fmt.number(i.Amount)}</td></tr>`).join('')}</tbody>
    </table></div>
    ${reversed
      ? ''
      : (d.reversalBlockers && d.reversalBlockers.length
          ? `<div class="banner banner-info mt-16"><div>
               <strong>This receipt can no longer be reversed.</strong><ul style="margin:6px 0 0 18px">
               ${d.reversalBlockers.map(b => `<li>${UI.esc(b)}</li>`).join('')}</ul></div></div>`
          : '')}
    ${d.invoice !== undefined ? `<p class="mt-16"><strong>Invoice:</strong>
        ${d.invoice ? `<span class="mono">${UI.esc(d.invoice)}</span>` : '<span class="muted">not invoiced yet</span>'}</p>` : ''}
    ${(d.returns || []).length ? `<p class="mt-8"><strong>Returned to vendor:</strong>
        ${d.returns.map(x => `<span class="mono">${UI.esc(x.VendorReturnID)}</span> ${money(x.TotalValue)}` +
          (x.Status === 'Cancelled' ? ' <span class="muted">(cancelled)</span>' : '')).join(' · ')}</p>` : ''}
    <p class="muted mt-16">Only the accepted quantity became stock —
      ${d.transactions.length} movement(s) were posted to the ledger.</p>`;

  // Close stays first, as everywhere else in the app. A destructive action put
  // where Close normally sits is one stray click from taking stock out.
  const footer = [{ label: 'Close', onClick: m => m.close() },
                  { label: 'Print', onClick: () => printRecord('GRN', grnId) }];
  // Goods back to the vendor (24 Oct 2026).
  if (d.canReturn) footer.push({ label: 'Return to vendor', onClick: m => { m.close(); openVendorReturnForm(grnId); } });
  const canReverse = d.canReverse && !(d.reversalBlockers || []).length;
  if (canReverse) {
    footer.push({ label: 'Reverse receipt', class: 'btn-danger', onClick: m => {
      m.close();
      openReasonModal({
        title: 'Reverse ' + grnId,
        label: 'Why is this being reversed?',
        confirmLabel: 'Reverse receipt', danger: true,
        intro: `This takes the accepted stock back out of
          ${UI.esc(d.stockRoom ? d.stockRoom.Name : 'the store')} and reopens the quantities on
          ${UI.esc(d.grn.POID)}. The receipt stays on record, marked reversed.`,
        onConfirm: async reason => {
          const res = await api('reverseGoodsReceipt', grnId, reason);
          UI.success('Reversed', res.message);
          if (typeof loadGoodsReceipts === 'function') loadGoodsReceipts();
        }
      });
    }});
  }
  UI.modal({ title: 'Goods receipt ' + grnId + (reversed ? ' — REVERSED' : ''), size: 'wide', body, footer: footer });
}

/* ===================================================== GOODS RETURNS (TO VENDOR) */
/*
 * Owner's request, 24 Oct 2026. A return takes stock out and reopens the
 * quantity on the order; the money side is a debit note, posted from the
 * vendor's page, as an invoice is to a receipt.
 */
const vrState = { page: 1, pageSize: 25, search: '', status: '', sortBy: 'ReturnDate', sortDir: 'desc' };

async function pageGoodsReturns(root) {
  root.innerHTML =
    pageHead('Goods Returns', 'Material sent back to the vendor after it was received',
      can('grn.create') ? `<button class="btn btn-primary" id="newVrBtn">+ Return to vendor</button>` : '') +
    `<div id="vrSummary" class="stat-grid" style="margin-bottom:16px"></div>
     <div class="card">
       <div class="card-head">
         <div class="filters">
           <div class="field"><label for="vrSearch">Search</label>
             <input class="input" id="vrSearch" placeholder="Return, GRN or PO number, vendor, item"
                    value="${UI.esc(vrState.search)}"></div>
           <div class="field"><label for="vrStatus">Status</label>
             <select class="input" id="vrStatus"><option value="">All</option><option>Returned</option><option>Cancelled</option></select></div>
           <button class="btn" id="vrReset">Reset</button>
         </div>
       </div>
       <div id="vrTable">${UI.loadingState()}</div>
       <div id="vrPager"></div>
     </div>`;
  document.getElementById('vrStatus').value = vrState.status;
  let debounce;
  document.getElementById('vrSearch').oninput = e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { vrState.search = e.target.value; vrState.page = 1; loadGoodsReturns(); }, 250);
  };
  document.getElementById('vrStatus').onchange = e => { vrState.status = e.target.value; vrState.page = 1; loadGoodsReturns(); };
  document.getElementById('vrReset').onclick = () => { Object.assign(vrState, { page: 1, search: '', status: '' }); pageGoodsReturns(root); };
  const nb = document.getElementById('newVrBtn');
  if (nb) nb.onclick = openReturnPicker;
  await loadGoodsReturns();
}

async function loadGoodsReturns() {
  const mount = document.getElementById('vrTable');
  if (!mount) return;
  mount.innerHTML = UI.loadingState();
  try {
    const d = (await api('listVendorReturns', vrState)).data;
    document.getElementById('vrSummary').innerHTML =
      [['Returns', d.summary.total, 'Visible to you'],
       ['Value returned', money(d.summary.value), 'Cancelled returns left out'],
       ['On debit notes', money(d.summary.debited), 'Credited by the vendor'],
       ['Awaiting debit note', money(Math.round((d.summary.value - d.summary.debited) * 100) / 100), 'Post from the vendor’s page']]
        .map(t => `<div class="stat"><div class="stat-label">${UI.esc(t[0])}</div>
          <div class="stat-value">${UI.esc(t[1])}</div><div class="stat-note">${UI.esc(t[2])}</div>
          <div class="stat-accent"></div></div>`).join('');
    UI.table(mount, {
      sortBy: vrState.sortBy, sortDir: vrState.sortDir,
      onSort: key => { vrState.sortDir = (vrState.sortBy === key && vrState.sortDir === 'asc') ? 'desc' : 'asc'; vrState.sortBy = key; loadGoodsReturns(); },
      columns: [
        { key: 'VendorReturnID', label: 'Return', render: r =>
          `<a href="#" data-open="${UI.esc(r.VendorReturnID)}"><strong class="mono">${UI.esc(r.VendorReturnID)}</strong></a>
           <br><span class="muted">${UI.fmt.date(r.ReturnDate)}</span>` },
        { key: 'GRNID', label: 'From receipt', render: r => `<span class="mono">${UI.esc(r.GRNID)}</span><br><span class="muted mono">${UI.esc(r.POID)}</span>` },
        { key: 'VendorName', label: 'Vendor' },
        { key: 'Reason', label: 'Reason' },
        { key: 'TotalValue', label: 'Value', align: 'right', render: r => r.Status === 'Cancelled'
          ? `<s class="muted">${money(r.TotalValue)}</s>` : money(r.TotalValue) },
        { key: 'DebitNoteID', label: 'Debit note', render: r => r.DebitNoteID
          ? `<span class="mono">${UI.esc(r.DebitNoteID)}</span>` : (r.Status === 'Cancelled' ? '' : '<span class="muted">not yet</span>') },
        { key: 'Status', label: 'Status', render: r => UI.badge(r.Status, r.Status === 'Cancelled' ? 'grey' : 'amber') },
        { key: 'actions', label: '', sortable: false, render: r =>
          `<div class="row-actions"><button class="btn btn-sm" data-open="${UI.esc(r.VendorReturnID)}">Open</button></div>` }
      ],
      rows: d.rows,
      empty: UI.emptyState('Nothing returned', 'Open a goods receipt and choose Return to vendor.')
    });
    mount.querySelectorAll('[data-open]').forEach(n => { n.onclick = e => { e.preventDefault(); openVendorReturn(n.dataset.open); }; });
    UI.pager(document.getElementById('vrPager'), {
      page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
      onPage: p => { vrState.page = p; loadGoodsReturns(); }
    });
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retryVr');
    const b = document.getElementById('retryVr');
    if (b) b.onclick = loadGoodsReturns;
  }
}

async function openReceiveForm(poId) {
  let d;
  try { d = (await api('getPOForReceiving', poId)).data; }
  catch (e) { UI.error('Could not load the order', e.message); return; }
  if (!d.stockRooms.length) {
    UI.warn('No stock room', 'Create a store for this project before receiving material.');
    return;
  }

  const fields = [
    { name: 'StockRoomID', label: 'Into store', type: 'select', required: true,
      options: d.stockRooms.map(r => ({ value: r.StockRoomID, label: r.Name })) },
    { name: 'ReceiptDate', label: 'Received on', type: 'date', required: true },
    { name: 'DeliveryNote', label: 'Delivery note number' },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  body.innerHTML = `<div class="banner banner-info"><div>
    <strong>${UI.esc(poId)}</strong> · ${UI.esc(d.vendor ? d.vendor.CompanyName : '')}
    <br>Rejected quantity is recorded on the note but does <strong>not</strong> go into stock.
  </div></div>`;
  const form = UI.form(fields, { ReceiptDate: new Date().toISOString().slice(0, 10) });
  body.appendChild(form);

  const wrap = UI.el('div', { class: 'card mt-16' });
  wrap.innerHTML = `<div class="card-head"><div class="card-title">Lines</div></div>
    <div class="table-wrap"><table class="data" id="receiveTable">
      <thead><tr><th>Ordered item</th><th>Stock item</th><th class="num">Outstanding</th>
        <th class="num" style="width:120px">Delivered</th><th class="num" style="width:120px">Rejected</th>
        <th class="num">Accepted</th><th class="num">Value</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><th colspan="6" class="num">Accepted value</th>
        <th class="num" id="receiveTotal">0</th></tr></tfoot></table></div>`;
  body.appendChild(wrap);

  const tbody = wrap.querySelector('tbody');
  const allItemOptions = d.allItems.map(i => `<option value="${UI.esc(i.ItemID)}">${UI.esc(i.ItemCode)} — ${UI.esc(i.ItemName)}</option>`).join('');
  d.items.filter(i => i.OutstandingQty > 0).forEach(line => {
    const tr = UI.el('tr');
    tr.dataset.poItem = line.POItemID;
    tr.dataset.outstanding = line.OutstandingQty;
    tr.dataset.rate = line.Rate;
    tr.innerHTML =
      `<td><strong>${UI.esc(line.ItemName)}</strong>
        ${line.ItemCode ? `<br><span class="mono muted">${UI.esc(line.ItemCode)}</span>` : ''}</td>
       <td><select class="input" data-f="ItemID">
         <option value="">— pick an item —</option>${allItemOptions}</select></td>
       <td class="num">${UI.fmt.number(line.OutstandingQty, 3)} ${UI.esc(line.Unit)}</td>
       <td><input class="input" type="number" step="any" min="0" data-f="ReceivedQty"
            value="${line.OutstandingQty}" style="text-align:right"></td>
       <td><input class="input" type="number" step="any" min="0" data-f="RejectedQty"
            value="0" style="text-align:right"></td>
       <td class="num" data-accepted><strong>${UI.fmt.number(line.OutstandingQty, 3)}</strong></td>
       <td class="num" data-value>0</td>`;
    tbody.appendChild(tr);
    const pick = tr.querySelector('[data-f="ItemID"]');
    if (line.SuggestedItemID) pick.value = line.SuggestedItemID;
    makeSearchable(pick, { placeholder: 'Search code or name…' });
  });

  if (!tbody.querySelectorAll('tr').length) {
    UI.warn('Nothing outstanding', 'Everything on this order has already been received.');
    return;
  }

  function recalc() {
    let total = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const received = Number(tr.querySelector('[data-f="ReceivedQty"]').value) || 0;
      const rejected = Number(tr.querySelector('[data-f="RejectedQty"]').value) || 0;
      const accepted = Math.round((received - rejected) * 10000) / 10000;
      const value = accepted * Number(tr.dataset.rate);
      tr.querySelector('[data-accepted]').innerHTML =
        `<strong${accepted < 0 ? ' class="text-red"' : ''}>${UI.fmt.number(accepted, 3)}</strong>`;
      tr.querySelector('[data-value]').textContent = UI.fmt.number(Math.max(0, value));
      if (accepted > 0) total += value;
    });
    wrap.querySelector('#receiveTotal').textContent = money(total);
  }
  tbody.querySelectorAll('input').forEach(i => i.addEventListener('input', recalc));
  recalc();

  UI.modal({
    title: 'Receive against ' + poId, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Record receipt', class: 'btn-primary', onClick: async m => {
        const head = UI.validate(form, fields);
        if (!head) return;
        const items = [];
        let bad = null;
        tbody.querySelectorAll('tr').forEach(tr => {
          const received = Number(tr.querySelector('[data-f="ReceivedQty"]').value) || 0;
          const rejected = Number(tr.querySelector('[data-f="RejectedQty"]').value) || 0;
          const itemId = tr.querySelector('[data-f="ItemID"]').value;
          if (received <= 0 && rejected <= 0) return;      // nothing arrived on this line
          if (!itemId) bad = bad || 'Every delivered line needs a stock item.';
          if (rejected > received) bad = bad || 'More was rejected than delivered on a line.';
          if (received - rejected > Number(tr.dataset.outstanding)) {
            bad = bad || 'A line accepts more than is outstanding on the order.';
          }
          items.push({ POItemID: tr.dataset.poItem, ItemID: itemId,
                       ReceivedQty: received, RejectedQty: rejected });
        });
        if (!items.length) { UI.warn('Nothing to record', 'Enter what was delivered.'); return; }
        if (bad) { UI.warn('Check the lines', bad); return; }
        m.busy(true);
        try {
          const res = await api('createGoodsReceipt', poId,
            Object.assign({}, head, { items: items }));
          m.close(); UI.success('Received', res.message);
          navigate('goods-receipts');
        } catch (e) { UI.error('Could not record the receipt', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

      can('issue.create') ? `<button class="btn btn-primary" id="newIssueBtn">+ Issue material</button>` : '') +

           <div class="field"><label for="issueSearch">Search</label>

                    value="${UI.esc(issueState.search)}"></div>

         </div>
       </div>
       <div id="issueTable">${UI.loadingState()}</div>
       <div id="issuePager"></div>

async function loadMaterialIssues() {
  const mount = document.getElementById('issueTable');
  if (!mount) return;
  mount.innerHTML = UI.loadingState();
  try {
    const d = (await api('listMaterialIssues', issueState)).data;
    document.getElementById('issueSummary').innerHTML =
      [['Issues', d.summary.total, 'Visible to you'],
       ['Value issued', money(d.summary.value), 'Net of returns, charged to projects']]
        .map(t => `<div class="stat"><div class="stat-label">${UI.esc(t[0])}</div>
          <div class="stat-value">${UI.esc(t[1])}</div><div class="stat-note">${UI.esc(t[2])}</div>
          <div class="stat-accent"></div></div>`).join('');

    UI.table(mount, {
      sortBy: issueState.sortBy, sortDir: issueState.sortDir,
      onSort: key => {
        issueState.sortDir = (issueState.sortBy === key && issueState.sortDir === 'asc') ? 'desc' : 'asc';
        issueState.sortBy = key; loadMaterialIssues();
      },
      columns: [
        { key: 'IssueID', label: 'Issue', render: r =>
          `<a href="#" data-open="${UI.esc(r.IssueID)}"><strong class="mono">${UI.esc(r.IssueID)}</strong></a>
           <br><span class="muted">${UI.fmt.date(r.IssueDate)}</span>` },
        { key: 'ProjectName', label: 'Project' },
        { key: 'StockRoomName', label: 'From store' },
        { key: 'Purpose', label: 'Purpose' },
        { key: 'LineCount', label: 'Lines', align: 'right' },
        { key: 'TotalValue', label: 'Value', align: 'right', render: r => money(r.TotalValue) },
        { key: 'actions', label: '', sortable: false, render: r =>
          `<div class="row-actions"><button class="btn btn-sm" data-open="${UI.esc(r.IssueID)}">Open</button></div>` }
      ],
      rows: d.rows,
      empty: UI.emptyState('Nothing issued yet',
        d.canCreate ? 'Issue material from a store to a project.' : 'No material has gone out.')
    });
    mount.querySelectorAll('[data-open]').forEach(n => {

function openReturnForm(issueId, itemId, max) {
  const fields = [
    { name: 'Quantity', label: 'Quantity returned', type: 'number', required: true,
      hint: 'At most ' + UI.fmt.number(max, 3) + ' is still outstanding on this line.' },
    { name: 'Condition', label: 'Condition', type: 'select',
      options: ['Good', 'Damaged', 'Partly used'] },
    { name: 'ReturnedBy', label: 'Returned by' },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, { Condition: 'Good' });
  body.appendChild(form);
  UI.modal({
    title: 'Return material to store', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Record return', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(form, fields);
        if (!data) return;
        if (!(Number(data.Quantity) > 0)) { UI.warn('Quantity must be more than zero'); return; }
        if (Number(data.Quantity) > max) {
          UI.warn('Too much', 'Only ' + UI.fmt.number(max, 3) + ' is outstanding on this line.');
          return;
        }
        m.busy(true);
        try {
          const res = await api('createMaterialReturn', issueId,
            Object.assign({ ItemID: itemId }, data));
          m.close(); UI.success('Returned', res.message);
          navigate('material-issues');
        } catch (e) { UI.error('Could not record the return', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

async function openIssueForm() {
  let projects = [], rooms = [], stock = [];
  try {
    projects = (await api('listProjects', { pageSize: 200, includeMetrics: false })).data.rows
      .filter(p => !p.IsClosed);
    rooms = (await api('listStockRooms', { activeOnly: true })).data.rows;
    stock = (await api('listStock', { pageSize: 500, inStockOnly: true })).data.rows;
  } catch (e) { UI.error('Could not load', e.message); return; }
  if (!projects.length) { UI.warn('No open projects'); return; }
  if (!stock.length) { UI.warn('Nothing in stock', 'There is nothing to issue.'); return; }

  const fields = [
    { name: 'ProjectID', label: 'Issue to project', type: 'select', required: true,
      options: projects.map(p => ({ value: p.ProjectID, label: p.ProjectName })) },
    { name: 'StockRoomID', label: 'From store', type: 'select', required: true,
      options: rooms.map(r => ({ value: r.StockRoomID, label: r.Name })) },
    { name: 'IssueDate', label: 'Issued on', type: 'date', required: true },
    { name: 'RequestedBy', label: 'Requested by' },
    { name: 'Purpose', label: 'Purpose', required: true, span: 2,
      placeholder: 'What the material is for — appears on the ledger' }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, { IssueDate: new Date().toISOString().slice(0, 10) });
  body.appendChild(form);

  const wrap = UI.el('div', { class: 'card mt-16' });
  wrap.innerHTML = `<div class="card-head"><div class="card-title">Items</div>
    <button class="btn btn-sm" id="addIssueRow">+ Add item</button></div>
    <div class="table-wrap"><table class="data" id="issueItemTable">
      <thead><tr><th>Item</th><th class="num">Available</th>
        <th class="num" style="width:120px">Quantity</th><th style="width:130px">Cost code</th>
        <th class="num">Value</th><th style="width:40px"></th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><th colspan="4" class="num">Charged to the project</th>
        <th class="num" id="issueTotal">0</th><th></th></tr></tfoot></table></div>`;
  body.appendChild(wrap);

  const tbody = wrap.querySelector('tbody');
  const roomSel = form.querySelector('[name="StockRoomID"]');

  function held() { return stock.filter(s => s.StockRoomID === roomSel.value); }

  function recalc() {
    let total = 0;
    let short = false;
    tbody.querySelectorAll('tr').forEach(tr => {
      const opt = tr.querySelector('[data-f="ItemID"]').selectedOptions[0];
      const available = opt ? Number(opt.dataset.available || 0) : 0;
      const rate = opt ? Number(opt.dataset.rate || 0) : 0;
      const q = Number(tr.querySelector('[data-f="Quantity"]').value) || 0;
      tr.querySelector('[data-available]').textContent = UI.fmt.number(available, 3);
      tr.querySelector('[data-value]').textContent = UI.fmt.number(q * rate);
      // Flag the shortfall in the form: the server refuses it anyway, but the
      // storekeeper should not have to submit to find out.
      const over = q > available;
      tr.classList.toggle('row-error', over);
      if (over) short = true;
      total += q * rate;
    });
    wrap.querySelector('#issueTotal').textContent = money(total);
    let warn = wrap.querySelector('#issueShort');
    if (short && !warn) {
      wrap.insertAdjacentHTML('afterbegin',
        `<div id="issueShort" style="padding:12px 16px 0"><div class="banner banner-warn"><div>
          <strong>A line asks for more than the store holds.</strong>
          Stock cannot go negative, so this issue will be refused.</div></div></div>`);
    } else if (!short && warn) { warn.remove(); }
  }

  function addRow() {
    const available = held();
    if (!available.length) { UI.warn('That store holds nothing'); return; }
    const tr = UI.el('tr');
    tr.innerHTML =
      `<td><select class="input" data-f="ItemID">${available.map(s =>
        `<option value="${UI.esc(s.ItemID)}" data-available="${s.Closing}" data-rate="${s.AvgRate}">
          ${UI.esc(s.ItemCode)} — ${UI.esc(s.ItemName)}</option>`).join('')}</select></td>
       <td class="num" data-available>0</td>
       <td><input class="input" type="number" step="any" min="0" data-f="Quantity" style="text-align:right"></td>
       <td><input class="input" data-f="CostCode"></td>
       <td class="num" data-value>0</td>
       <td><button class="btn btn-sm btn-ghost" data-remove>&times;</button></td>`;
    tr.querySelectorAll('input, select').forEach(i => i.addEventListener('input', recalc));
    tr.querySelector('[data-f="ItemID"]').addEventListener('change', recalc);
    makeSearchable(tr.querySelector('[data-f="ItemID"]'), { placeholder: 'Search code or name…' });
    tr.querySelector('[data-remove]').onclick = () => {
      if (tbody.querySelectorAll('tr').length === 1) { UI.warn('Keep at least one line'); return; }
      tr.remove(); recalc();
    };
    tbody.appendChild(tr);
    recalc();
  }

  roomSel.onchange = () => { tbody.innerHTML = ''; addRow(); };
  wrap.querySelector('#addIssueRow').onclick = addRow;
  addRow();

  UI.modal({
    title: 'Issue material to site', size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Issue', class: 'btn-primary', onClick: async m => {
        const head = UI.validate(form, fields);
        if (!head) return;
        const items = [];
        let bad = null;
        tbody.querySelectorAll('tr').forEach((tr, i) => {
          const q = tr.querySelector('[data-f="Quantity"]').value;
          if (!(Number(q) > 0)) bad = bad || ('Line ' + (i + 1) + ' needs a quantity.');
          items.push({ ItemID: tr.querySelector('[data-f="ItemID"]').value, Quantity: q,
                       CostCode: tr.querySelector('[data-f="CostCode"]').value });
        });
        if (bad) { UI.warn('Check the lines', bad); return; }
        m.busy(true);
        try {
          const res = await api('createMaterialIssue', head.ProjectID,
            Object.assign({}, head, { items: items }));
          m.close(); UI.success('Issued', res.message);
          navigate('material-issues');
        } catch (e) {
          if (e.code === 'INSUFFICIENT_STOCK') UI.error('Not enough stock', e.message);
          else UI.error('Could not issue', e.message);
        }
        finally { m.busy(false); }
      }}
    ]
  });
}

    mount.innerHTML = UI.errorState(e.message, 'retryItems');
    const b = document.getElementById('retryItems');
    if (b) b.onclick = loadStockItems;
  }
}

/** Add, rename or retire an item category. Retiring leaves existing items alone. */
async function openItemCategories() {
  let d;
  try { d = (await api('listItemCategories', {})).data; }
  catch (e) { UI.error('Could not load the categories', e.message); return; }

  const body = UI.el('div');
  const host = UI.el('div', { id: 'catTable' });
  body.innerHTML =
    `<p class="muted" style="margin-top:0">Retiring a category leaves the items that already
     carry it untouched — it only stops the name being chosen again. Renaming one carries its
     items with it.</p>
     <div class="filters" style="margin-bottom:10px">
       <div class="field"><label for="newCatName">New category</label>
         <input class="input" id="newCatName" placeholder="e.g. Scaffolding"></div>
       <div class="field"><label for="newCatGroup">Group</label>
         <input class="input" id="newCatGroup" placeholder="e.g. Site and general"></div>
       <div class="field"><label>&nbsp;</label>
         <button class="btn btn-primary" id="addCatBtn">Add</button></div>
     </div>`;
  body.appendChild(host);

  const draw = rows => UI.table(host, {
    columns: [
      { key: 'Name', label: 'Category', render: r => `<strong>${UI.esc(r.Name)}</strong>` },
      { key: 'CategoryGroup', label: 'Group' },
      { key: 'ItemCount', label: 'Items', align: 'right' },
      { key: 'Status', label: 'Status', render: r => UI.badge(r.Status) },
      { key: 'actions', label: '', align: 'right', render: r =>
        d.canManage ? `<div class="row-actions">
          <button class="btn btn-sm" data-ren="${UI.esc(r.ItemCategoryID)}">Rename</button>
          <button class="btn btn-sm" data-tog="${UI.esc(r.ItemCategoryID)}">${
            r.Status === 'Active' ? 'Retire' : 'Restore'}</button></div>` : '' }
    ],
    rows: rows
  });
  draw(d.rows);

  const refresh = async () => {
    d = (await api('listItemCategories', {})).data;
    draw(d.rows);
    wire();
  };
  const wire = () => {
    host.querySelectorAll('[data-ren]').forEach(b => {
      b.onclick = async () => {
        const row = d.rows.find(x => String(x.ItemCategoryID) === b.dataset.ren);
        const name = prompt('Rename "' + row.Name + '" to:', row.Name);
        if (!name || name === row.Name) return;
        try {
          const r = await api('updateItemCategory', row.ItemCategoryID, { Name: name });
          UI.success('Renamed', r.message); await refresh();
        } catch (e) { UI.error('Could not rename', e.message); }
      };
    });
    host.querySelectorAll('[data-tog]').forEach(b => {
      b.onclick = async () => {
        const row = d.rows.find(x => String(x.ItemCategoryID) === b.dataset.tog);
        const next = row.Status === 'Active' ? 'Inactive' : 'Active';
        try {
          const r = await api('updateItemCategory', row.ItemCategoryID, { Status: next });
          UI.success('Saved', r.message); await refresh();
        } catch (e) { UI.error('Could not change the status', e.message); }
      };
    });
  };
  wire();

  UI.modal({
    title: 'Item categories', size: 'wide', body,
    footer: [{ label: 'Done', class: 'btn-primary', onClick: m => { m.close(); loadStockItems(); } }]
  });

  const addBtn = document.getElementById('addCatBtn');
  if (addBtn) addBtn.onclick = async () => {
    const name = document.getElementById('newCatName').value.trim();
    const group = document.getElementById('newCatGroup').value.trim();
    if (!name) { UI.warn('A name is needed', 'Type the category name first.'); return; }
    try {
      const r = await api('createItemCategory', { Name: name, CategoryGroup: group });
      UI.success('Added', r.message);
      document.getElementById('newCatName').value = '';
      await refresh();
    } catch (e) { UI.error('Could not add it', e.message); }
  };
}

  <script>
/* =============================================================
   Billing.html — Phase 8. Running account bills (RAR / IPC),
   certification, client payments and the billing position.
   ============================================================= */

const rarState = { page: 1, pageSize: 25, search: '', status: '', projectId: '',
                   awaitingCertification: false, outstandingOnly: false,
                   sortBy: 'SubmissionDate', sortDir: 'desc' };

const RAR_TONE = { 'Draft': 'grey', 'Submitted': 'blue', 'Under Review': 'amber',
                   'Certified': 'green', 'Partially Paid': 'violet', 'Paid': 'green',
                   'Rejected': 'red' };

/* ============================================================== BILL LIST */

async function pageRARs(root) {
  root.innerHTML =
    pageHead('RAR / IPC', 'What has been billed to the client, and what has come back',
      `<span id="rarActions" class="flex gap-8"></span>` +
      (can('rar.create') ? `<button class="btn btn-primary" id="newRarBtn">+ New bill</button>` : '')) +
    `<div id="rarSummary" class="stat-grid" style="margin-bottom:16px"></div>
     <div class="card">
       <div class="card-head">
         <div class="filters">
           <div class="field"><label for="rarSearch">Search</label>
             <input class="input" id="rarSearch" placeholder="Bill number, project, client"
                    value="${UI.esc(rarState.search)}"></div>
           <div class="field"><label for="rarStatus">Status</label>
             <select class="input" id="rarStatus"></select></div>
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="rarAwaiting"> Awaiting certification</label></div>
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="rarOutstanding"> Money still owed</label></div>
           <button class="btn" id="rarReset">Reset</button>
         </div>
         <button class="btn btn-sm" id="receivablesBtn">Receivables</button>
       </div>
       <div id="rarTable">${UI.loadingState()}</div>
       <div id="rarPager"></div>
     </div>`;

  document.getElementById('rarAwaiting').checked = rarState.awaitingCertification;
  document.getElementById('rarOutstanding').checked = rarState.outstandingOnly;

  let debounce;
  document.getElementById('rarSearch').oninput = e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { rarState.search = e.target.value; rarState.page = 1; loadRARs(); }, 250);
  };
  document.getElementById('rarStatus').onchange = e => {
    rarState.status = e.target.value; rarState.page = 1; loadRARs();
  };
  document.getElementById('rarAwaiting').onchange = e => {
    rarState.awaitingCertification = e.target.checked; rarState.page = 1; loadRARs();
  };
  document.getElementById('rarOutstanding').onchange = e => {
    rarState.outstandingOnly = e.target.checked; rarState.page = 1; loadRARs();
  };
  document.getElementById('rarReset').onclick = () => {
    Object.assign(rarState, { page: 1, search: '', status: '',
      awaitingCertification: false, outstandingOnly: false });
    pageRARs(root);
  };
  document.getElementById('receivablesBtn').onclick = openReceivables;
  const nb = document.getElementById('newRarBtn');
  if (nb) nb.onclick = openRarProjectPicker;

  document.getElementById('rarActions').appendChild(
    importExportBar('RAR', rarState.projectId || null, () => loadRARs(), can('rar.create'),
      () => ({ projectId: rarState.projectId, search: rarState.search,
               filters: { CertificationStatus: rarState.status } }),
      { projectScoped: true }));

  await loadRARs();
}

async function loadRARs() {
  const mount = document.getElementById('rarTable');
  if (!mount) return;
  mount.innerHTML = UI.loadingState();
  try {
    const d = (await api('listRARs', rarState)).data;

    const sel = document.getElementById('rarStatus');
    if (sel && !sel.options.length) {
      sel.innerHTML = `<option value="">All statuses</option>` +
        d.statuses.map(s => `<option value="${s}">${s}</option>`).join('');
      sel.value = rarState.status;
    }

    document.getElementById('rarSummary').innerHTML =
      [['Bills', d.summary.total, 'Visible to you'],
       ['Awaiting certification', d.summary.awaitingCertification, 'With the client'],
       ['Certified', money(d.summary.certified), 'Agreed by the client'],
       ['Outstanding', money(d.summary.outstanding), 'Certified but not yet received']]
        .map(t => `<div class="stat"><div class="stat-label">${UI.esc(t[0])}</div>
          <div class="stat-value">${UI.esc(t[1])}</div><div class="stat-note">${UI.esc(t[2])}</div>
          <div class="stat-accent"></div></div>`).join('');

    UI.table(mount, {
      sortBy: rarState.sortBy, sortDir: rarState.sortDir,
      onSort: key => {
        rarState.sortDir = (rarState.sortBy === key && rarState.sortDir === 'asc') ? 'desc' : 'asc';
        rarState.sortBy = key; loadRARs();
      },
      columns: [
        { key: 'RARID', label: 'Bill', render: r =>
          `<a href="#" data-open="${UI.esc(r.RARID)}"><strong class="mono">${UI.esc(r.RARID)}</strong></a>
           <br><span class="muted">No. ${UI.esc(r.SequenceNo)}</span>` },
        { key: 'ProjectName', label: 'Project', render: r =>
          `${UI.esc(r.ProjectName)}<br><span class="muted">${UI.esc(r.Client)}</span>` },
        { key: 'PeriodTo', label: 'Period', render: r =>
          `${UI.fmt.date(r.PeriodFrom)}<br><span class="muted">to ${UI.fmt.date(r.PeriodTo)}</span>` },
        { key: 'CurrentAmount', label: 'Claimed', align: 'right', render: r => money(r.CurrentAmount) },
        { key: 'NetPayable', label: 'Net payable', align: 'right', render: r => money(r.NetPayable) },
        { key: 'CertifiedAmount', label: 'Certified', align: 'right', render: r =>
          r.IsCertified
            ? money(r.CertifiedAmount) +
              (r.CertifiedAmount < r.NetPayable
                ? '<br>' + UI.badge('Reduced', 'amber') : '')
            : '<span class="muted">—</span>' },
        { key: 'Outstanding', label: 'Owed', align: 'right', render: r =>
          r.Outstanding > 0 ? `<strong>${money(r.Outstanding)}</strong>` : '<span class="muted">—</span>' },
        { key: 'CertificationStatus', label: 'Status', render: r =>
          UI.badge(r.CertificationStatus, RAR_TONE[r.CertificationStatus]) },
        { key: 'actions', label: '', sortable: false, render: r =>
          `<div class="row-actions"><button class="btn btn-sm" data-open="${UI.esc(r.RARID)}">Open</button></div>` }
      ],
      rows: d.rows,
      empty: UI.emptyState('No bills yet',
        d.canCreate ? 'Raise a running account bill from the work recorded against the BOQ.'
                    : 'Nothing has been billed to a client yet.')
    });
    mount.querySelectorAll('[data-open]').forEach(n => {
      n.onclick = e => { e.preventDefault(); navigate('rar-bill', n.dataset.open); };
    });
    UI.pager(document.getElementById('rarPager'), {
      page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
      onPage: p => { rarState.page = p; loadRARs(); }
    });
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retryRars');
    const b = document.getElementById('retryRars');
    if (b) b.onclick = loadRARs;
  }
}

/* ------------------------------------------------------------- DETAIL */

async function pageRARDetail(root, rarId) {
  if (!rarId) { navigate('rar'); return; }
  const d = (await api('getRAR', rarId)).data;
  const r = d.rar;

  const actions = [`<button class="btn" id="backRars">← All bills</button>`,
                   `<button class="btn" id="printRar">Print</button>`];
  if (d.canEdit) actions.push(`<button class="btn" id="editRar">Edit</button>`);
  if (d.canSubmit) actions.push(`<button class="btn btn-primary" id="submitRar">Submit</button>`);
  if (d.canCertify) actions.push(
    `<button class="btn" id="reviewRar">Under review</button>`,
    `<button class="btn btn-danger" id="rejectRar">Reject</button>`,
    `<button class="btn btn-primary" id="certifyRar">Certify</button>`);
  if (d.canRecordPayment) actions.push(`<button class="btn btn-primary" id="payRar">Record payment</button>`);
  if (d.canDelete) actions.push(`<button class="btn btn-danger" id="deleteRar">Delete draft</button>`);

  root.innerHTML =
    pageHead(r.RARID + ' — bill ' + r.SequenceNo,
      (d.project ? d.project.ProjectName + ' · ' + d.project.Client : ''), actions.join(' ')) +
    `<div class="stat-grid" style="margin-bottom:16px">
      ${statTile('Status', r.CertificationStatus,
        UI.fmt.date(r.PeriodFrom) + ' to ' + UI.fmt.date(r.PeriodTo))}
      ${statTile('Claimed this period', money(r.CurrentAmount),
        'Cumulative ' + money(r.GrossAmount))}
      ${statTile('Net payable', money(r.NetPayable), 'After retention and recoveries')}
      ${statTile(r.IsCertified ? 'Certified' : 'Not yet certified',
        r.IsCertified ? money(r.CertifiedAmount) : '—',
        r.IsCertified && d.shortCertified > 0
          ? money(d.shortCertified) + ' less than claimed' : 'Agreed by the client')}
    </div>
    ${d.shortCertified > 0 ? `<div class="banner banner-warn" style="margin-bottom:16px"><div>
      <strong>This bill was certified for ${money(r.CertifiedAmount)} against
      ${money(r.NetPayable)} claimed</strong> — a shortfall of ${money(d.shortCertified)}.
      The difference stays visible rather than being written off silently.</div></div>` : ''}
    <div class="card"><div class="card-head"><div class="card-title">Measured work</div>
      <span class="muted">Cumulative to date, less what was certified before</span></div>
      <div id="rarItems"></div></div>
    <div class="mt-16" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">
      <div class="card"><div class="card-head"><div class="card-title">Payments</div></div>
        <div id="rarPayments"></div></div>
      <div class="card"><div class="card-head"><div class="card-title">History</div></div>
        <div id="rarHistory"></div></div>
    </div>`;

  UI.table(document.getElementById('rarItems'), {
    columns: [
      { key: 'ItemCode', label: 'Item', render: i =>
        `<strong class="mono">${UI.esc(i.ItemCode)}</strong><br><span class="muted">${UI.esc(i.Description)}</span>` },
      { key: 'Rate', label: 'Rate', align: 'right', render: i =>
        `${UI.fmt.number(i.Rate)}<br><span class="muted">per ${UI.esc(i.Unit)}</span>` },
      { key: 'PreviousQty', label: 'Previous', align: 'right', render: i =>
        `${UI.fmt.number(i.PreviousQty, 3)}<br><span class="muted">${UI.fmt.number(i.PreviousAmount)}</span>` },
      { key: 'CurrentQty', label: 'This period', align: 'right', render: i =>
        `<strong>${UI.fmt.number(i.CurrentQty, 3)}</strong><br><span class="muted">${UI.fmt.number(i.CurrentAmount)}</span>` },
      { key: 'CumulativeQty', label: 'Cumulative', align: 'right', render: i =>
        `${UI.fmt.number(i.CumulativeQty, 3)}<br><span class="muted">${UI.fmt.number(i.CumulativeAmount)}</span>` }
    ],
    rows: d.items,
    empty: UI.emptyState('No measured work', 'Nothing has been recorded on this bill.')
  });

  document.getElementById('rarItems').insertAdjacentHTML('beforeend',
    `<div class="totals-strip">
      <div><span>Work done to date</span><strong>${money(r.GrossAmount)}</strong></div>
      <div><span>Less previously billed</span><strong>− ${money(r.PreviousAmount)}</strong></div>
      <div><span>This period</span><strong>${money(r.CurrentAmount)}</strong></div>
      <div><span>Retention ${UI.esc(r.RetentionPercent)}%</span><strong>− ${money(r.RetentionAmount)}</strong></div>
      ${r.AdvanceRecovery ? `<div><span>Advance recovery</span>
        <strong>− ${money(r.AdvanceRecovery)}</strong></div>` : ''}
      ${r.OtherDeductions ? `<div><span>Other deductions</span>
        <strong>− ${money(r.OtherDeductions)}</strong></div>` : ''}
      ${r.TaxPercent ? `<div><span>Tax ${UI.esc(r.TaxPercent)}%</span>
        <strong>${money(r.TaxAmount)}</strong></div>` : ''}
      <div class="grand"><span>Net payable</span><strong>${money(r.NetPayable)}</strong></div>
    </div>`);

  const payHost = document.getElementById('rarPayments');
  UI.table(payHost, {
    columns: [
      { key: 'PaymentDate', label: 'When', render: p => UI.fmt.date(p.PaymentDate) },
      { key: 'Amount', label: 'Amount', align: 'right', render: p => money(p.Amount) },
      { key: 'Method', label: 'Method' },
      { key: 'Reference', label: 'Reference' }
    ],
    rows: d.payments,
    empty: UI.emptyState('Nothing received yet',
      r.IsCertified ? 'Record a payment when the client pays.' : 'The bill is not certified yet.')
  });
  if (r.IsCertified) {
    payHost.insertAdjacentHTML('beforeend',
      `<div class="totals-strip">
        <div><span>Certified</span><strong>${money(r.CertifiedAmount)}</strong></div>
        <div><span>Received</span><strong>${money(d.paidToDate)}</strong></div>
        <div class="grand"><span>Outstanding</span><strong>${money(d.outstanding)}</strong></div>
      </div>`);
  }

  UI.table(document.getElementById('rarHistory'), {
    columns: [
      { key: 'ActionAt', label: 'When', render: h => UI.fmt.dateTime(h.ActionAt) },

      { key: 'UserName', label: 'By', render: h =>
        `${UI.esc(h.UserName || h.UserID)}<br><span class="muted">${UI.esc(h.Role)}</span>` },
      { key: 'Comments', label: 'Comments' }
    ],
    rows: d.approvals,
    empty: UI.emptyState('Nothing yet', 'Submission and certification appear here.')
  });

  document.getElementById('backRars').onclick = () => navigate('rar');
  document.getElementById('printRar').onclick = () => printRAR(d);
  const bind = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  bind('editRar', () => openRarForm(d.project.ProjectID, d));
  bind('submitRar', () => UI.confirm({
    title: 'Submit bill ' + r.RARID,
    message: 'The bill goes to the client for certification. It cannot be edited once submitted.',
    confirmLabel: 'Submit',
    onConfirm: async m => {
      try { const res = await api('submitRAR', r.RARID, ''); m.close();
            UI.success('Submitted', res.message); navigate('rar-bill', r.RARID); }
      catch (e) { UI.error('Could not submit', e.message); }
    }
  }));
  bind('certifyRar', () => openCertifyForm(d));
  bind('reviewRar', () => UI.confirm({
    title: 'Mark under review',
    message: 'The bill is with the client\'s consultant for checking.',
    confirmLabel: 'Mark under review',
    onConfirm: async m => {
      try { const res = await api('setRARUnderReview', r.RARID, ''); m.close();
            UI.success('Under review', res.message); navigate('rar-bill', r.RARID); }
      catch (e) { UI.error('Could not update', e.message); }
    }
  }));
  bind('rejectRar', () => openReasonModal({
    title: 'Reject ' + r.RARID, label: 'Reason', confirmLabel: 'Reject', danger: true,
    onConfirm: async reason => {
      const res = await api('rejectRAR', r.RARID, reason);
      UI.success('Rejected', res.message);
      navigate('rar-bill', r.RARID);
    }
  }));
  bind('payRar', () => openPaymentForm(d));
  bind('deleteRar', () => UI.confirm({
    title: 'Delete draft ' + r.RARID,
    message: 'This draft and its measured quantities are removed. Submitted bills can never be deleted.',
    confirmLabel: 'Delete', danger: true,
    onConfirm: async m => {
      try { await api('deleteRAR', r.RARID); m.close(); UI.success('Draft deleted');
            navigate('rar'); }
      catch (e) { UI.error('Could not delete', e.message); }
    }
  }));
}

/* --------------------------------------------------------------- FORMS */

async function openRarProjectPicker() {
  let projects = [];
  try {
    projects = (await api('listProjects', { pageSize: 200, includeMetrics: false })).data.rows
      .filter(p => !p.IsClosed);
  } catch (e) { UI.error('Could not load projects', e.message); return; }
  if (!projects.length) { UI.warn('No open projects'); return; }
  if (projects.length === 1) { openRarForm(projects[0].ProjectID, null); return; }

  const fields = [{ name: 'ProjectID', label: 'Project', type: 'select', required: true, span: 2,
    options: projects.map(p => ({ value: p.ProjectID, label: p.ProjectName })) }];
  const body = UI.el('div');
  const form = UI.form(fields);
  body.appendChild(form);
  UI.modal({
    title: 'New bill — which project?', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Continue', class: 'btn-primary', onClick: m => {
        const data = UI.validate(form, fields);
        if (!data) return;
        m.close();
        openRarForm(data.ProjectID, null);
      }}
    ]
  });
}

async function openRarForm(projectId, existing) {
  let w;
  try { w = (await api('getRARWorksheet', projectId, existing ? existing.rar.RARID : '')).data; }
  catch (e) { UI.error('Could not load the worksheet', e.message); return; }
  if (!w.rows.length) {
    UI.warn('No BOQ', 'A bill is measured against the BOQ. Import or add BOQ items first.');
    return;
  }

  const fields = [
    { name: 'PeriodFrom', label: 'Period from', type: 'date', required: true },
    { name: 'PeriodTo', label: 'Period to', type: 'date', required: true },
    { name: 'RetentionPercent', label: 'Retention %', type: 'number',
      value: w.project.RetentionPercent },
    { name: 'TaxPercent', label: 'Tax %', type: 'number', value: w.defaultTaxPercent },
    { name: 'AdvanceRecovery', label: 'Advance recovery', type: 'number', value: 0,
      hint: w.advanceOutstanding > 0
        ? money(w.advanceOutstanding) + ' of advance is still outstanding.'
        : 'No advance outstanding on this project.' },
    { name: 'OtherDeductions', label: 'Other deductions', type: 'number', value: 0 }
  ];
  const values = existing ? {
    PeriodFrom: existing.rar.PeriodFrom, PeriodTo: existing.rar.PeriodTo,
    RetentionPercent: existing.rar.RetentionPercent, TaxPercent: existing.rar.TaxPercent,
    AdvanceRecovery: existing.rar.AdvanceRecovery, OtherDeductions: existing.rar.OtherDeductions
  } : {};

  const body = UI.el('div');
  body.innerHTML = `<div class="banner banner-info"><div>
    <strong>${UI.esc(w.project.ProjectName)}</strong> · bill ${UI.esc(w.nextSequence)}
    <br>Enter the <strong>cumulative</strong> quantity done to date against each item.
    What is payable now is the difference from the last certified bill — the system works it out.
  </div></div>`;
  const form = UI.form(fields, values);
  body.appendChild(form);

  const wrap = UI.el('div', { class: 'card mt-16' });
  wrap.innerHTML = `<div class="card-head"><div class="card-title">Measured work</div>
    <button class="btn btn-sm" id="fillExecuted">Use executed quantities</button></div>
    <div class="table-wrap"><table class="data" id="rarWorksheet">
      <thead><tr><th>Item</th><th class="num">BOQ qty</th><th class="num">Rate</th>
        <th class="num">Previously billed</th><th class="num" style="width:130px">Cumulative to date</th>
        <th class="num">This period</th><th class="num">Value</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><th colspan="5" class="num">Claimed this period</th>
        <th class="num" id="rarPeriodQty"></th><th class="num" id="rarPeriodValue">0</th></tr></tfoot>
    </table></div>`;
  body.appendChild(wrap);

  const summary = UI.el('div', { class: 'mt-16', id: 'rarFormSummary' });
  body.appendChild(summary);

  const tbody = wrap.querySelector('tbody');
  w.rows.forEach(row => {
    const tr = UI.el('tr');
    tr.dataset.boq = row.BOQID;
    tr.dataset.rate = row.Rate;
    tr.dataset.previous = row.PreviousQty;
    tr.dataset.boqQty = row.BOQQuantity;
    tr.dataset.executed = row.ExecutedQuantity;
    tr.innerHTML =
      `<td><strong class="mono">${UI.esc(row.ItemCode)}</strong>
        <br><span class="muted">${UI.esc(row.Description)}</span></td>
       <td class="num">${UI.fmt.number(row.BOQQuantity, 3)} ${UI.esc(row.Unit)}</td>
       <td class="num">${UI.fmt.number(row.Rate)}</td>
       <td class="num muted">${UI.fmt.number(row.PreviousQty, 3)}</td>
       <td><input class="input" type="number" step="any" min="${row.PreviousQty}"
            max="${row.BOQQuantity}" data-cumulative value="${row.CumulativeQty}"
            style="text-align:right"></td>
       <td class="num" data-period>0</td>
       <td class="num" data-value>0</td>`;
    tbody.appendChild(tr);
  });

  function recalc() {
    let value = 0, anyBad = false, anyWork = false;
    tbody.querySelectorAll('tr').forEach(tr => {
      const previous = Number(tr.dataset.previous);
      const boqQty = Number(tr.dataset.boqQty);
      const rate = Number(tr.dataset.rate);
      const input = tr.querySelector('[data-cumulative]');
      const cumulative = Number(input.value) || 0;
      const period = Math.round((cumulative - previous) * 10000) / 10000;
      // Two things a running account can never do: go backwards, or exceed
      // the BOQ. Both are shown here rather than discovered on submit.
      const bad = cumulative < previous || (boqQty > 0 && cumulative > boqQty);
      tr.classList.toggle('row-error', bad);
      if (bad) anyBad = true;
      if (period > 0) anyWork = true;
      tr.querySelector('[data-period]').innerHTML =
        period ? `<strong>${UI.fmt.number(period, 3)}</strong>` : '<span class="muted">—</span>';
      tr.querySelector('[data-value]').textContent = UI.fmt.number(Math.max(0, period) * rate);
      if (period > 0) value += period * rate;
    });
    wrap.querySelector('#rarPeriodValue').textContent = money(value);

    const retention = value * (Number(form.querySelector('[name="RetentionPercent"]').value) || 0) / 100;
    const advance = Number(form.querySelector('[name="AdvanceRecovery"]').value) || 0;
    const other = Number(form.querySelector('[name="OtherDeductions"]').value) || 0;
    const tax = value * (Number(form.querySelector('[name="TaxPercent"]').value) || 0) / 100;
    const net = value - retention - advance - other + tax;
    summary.innerHTML =
      (anyBad ? `<div class="banner banner-warn"><div><strong>A line is out of range.</strong>
        A cumulative quantity cannot fall below what has already been certified, nor exceed
        the BOQ quantity.</div></div>` : '') +
      (!anyWork ? `<div class="banner banner-warn"><div>
        No new work is claimed — the bill would be empty.</div></div>` : '') +
      `<div class="totals-strip">
        <div><span>This period</span><strong>${money(value)}</strong></div>
        <div><span>Retention</span><strong>− ${money(retention)}</strong></div>
        ${advance ? `<div><span>Advance recovery</span><strong>− ${money(advance)}</strong></div>` : ''}
        ${other ? `<div><span>Other deductions</span><strong>− ${money(other)}</strong></div>` : ''}
        ${tax ? `<div><span>Tax</span><strong>${money(tax)}</strong></div>` : ''}
        <div class="grand"><span>Net payable</span><strong>${money(net)}</strong></div>
      </div>`;
  }
  tbody.querySelectorAll('[data-cumulative]').forEach(i => i.addEventListener('input', recalc));
  ['RetentionPercent', 'TaxPercent', 'AdvanceRecovery', 'OtherDeductions'].forEach(n =>
    form.querySelector('[name="' + n + '"]').addEventListener('input', recalc));

  wrap.querySelector('#fillExecuted').onclick = () => {
    tbody.querySelectorAll('tr').forEach(tr => {
      const executed = Number(tr.dataset.executed) || 0;
      const previous = Number(tr.dataset.previous);
      tr.querySelector('[data-cumulative]').value = Math.max(executed, previous);
    });
    recalc();
  };
  recalc();

  UI.modal({
    title: existing ? 'Edit ' + existing.rar.RARID : 'New running account bill', size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: existing ? 'Save draft' : 'Create draft', class: 'btn-primary', onClick: async m => {
        const head = UI.validate(form, fields);
        if (!head) return;
        const quantities = [];
        tbody.querySelectorAll('tr').forEach(tr => {
          const cumulative = Number(tr.querySelector('[data-cumulative]').value) || 0;
          if (cumulative > 0) quantities.push({ BOQID: tr.dataset.boq, CumulativeQty: cumulative });
        });
        if (!quantities.length) { UI.warn('Nothing measured', 'Enter the work done.'); return; }
        m.busy(true);
        try {
          if (existing) {
            await api('updateRAR', existing.rar.RARID,
              Object.assign({}, head, { quantities: quantities }));
            m.close(); UI.success('Draft saved');
            navigate('rar-bill', existing.rar.RARID);
          } else {
            const res = await api('createRAR', projectId,
              Object.assign({}, head, { quantities: quantities }));
            m.close(); UI.success('Bill drafted', res.message);
            navigate('rar-bill', res.data.RARID);
          }
        } catch (e) { UI.error('Could not save the bill', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

function openCertifyForm(d) {
  const claimed = d.rar.NetPayable;
  const fields = [
    { name: 'CertifiedAmount', label: 'Certified amount', type: 'number', required: true,
      value: claimed, hint: 'Claimed: ' + money(claimed) },
    { name: 'Comments', label: 'Comments', type: 'textarea', span: 2,
      hint: 'Required if you certify less than was claimed.' }
  ];
  const body = UI.el('div');
  const form = UI.form(fields);
  body.appendChild(form);
  const note = UI.el('div', { class: 'mt-16', id: 'certifyNote' });
  body.appendChild(note);

  const commentsLabel = form.querySelector('label[for="f_Comments"]');
  const refresh = () => {
    const certified = Number(form.querySelector('[name="CertifiedAmount"]').value);
    if (isNaN(certified)) { note.innerHTML = ''; return; }
    const short = Math.round((claimed - certified) * 100) / 100;
    fields[1].required = short > 0;
    commentsLabel.textContent = 'Comments' + (short > 0 ? ' *' : '');
    UI.clearErrors(form);
    note.innerHTML = certified > claimed
      ? `<div class="banner banner-warn"><div>You cannot certify more than was claimed.</div></div>`
      : short > 0
        ? `<div class="banner banner-warn"><div><strong>Certifying ${money(short)} less than claimed.</strong>
            The shortfall stays on the record, so give the reason.</div></div>`
        : `<div class="banner banner-ok"><div>Certifying the bill in full.</div></div>`;
  };
  form.querySelector('[name="CertifiedAmount"]').addEventListener('input', refresh);
  refresh();

  UI.modal({
    title: 'Certify ' + d.rar.RARID, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Certify', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(form, fields);
        if (!data) return;
        if (Number(data.CertifiedAmount) > claimed) {
          UI.warn('Too much', 'The certified amount cannot exceed what was claimed.');
          return;
        }
        m.busy(true);
        try {
          const res = await api('certifyRAR', d.rar.RARID, data);
          m.close(); UI.success('Certified', res.message);
          navigate('rar-bill', d.rar.RARID);
        } catch (e) { UI.error('Could not certify', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

      hint: money(d.retentionHeld) + ' is currently held.' },
    { name: 'ReleaseDate', label: 'Release date', type: 'date', required: true },

      hint: 'Kept on the record — for example, release at practical completion.' }

  const body = UI.el('div');
  const form = UI.form(fields, { ReleaseDate: new Date().toISOString().slice(0, 10) });

  UI.modal({
    title: 'Release retention', size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Release', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(form, fields);

        if (Number(data.Amount) > d.retentionHeld) {

        finally { m.busy(false); }
      }}
    ]
  });
}

async function expenseForm(existing, onSaved, fixedProjectId) {
  const projects = (await api('listProjects', { pageSize: 200, status: 'Active' })).data.rows;
  const vendors = can('vendor.view') ? (await api('listVendors', { pageSize: 200 })).data.rows : [];
  const meta = (await api('listExpenses', { pageSize: 1 })).data;

  const values = existing ? Object.assign({}, existing) : {
    ProjectID: fixedProjectId || expState.projectId || (projects[0] && projects[0].ProjectID),
    ExpenseDate: new Date().toISOString().slice(0, 10), PaymentMethod: 'Cash'
  };

  const fields = [
    { name: 'ProjectID', label: 'Project', type: 'select', required: true,
      options: projects.map(p => ({ value: p.ProjectID, label: p.ProjectID + ' — ' + p.ProjectName })),
      readonly: !!existing || !!fixedProjectId },
    { name: 'ExpenseDate', label: 'Date', type: 'date', required: true },
    { name: 'Category', label: 'Category', type: 'select', required: true, options: meta.categories },
    { name: 'CostCode', label: 'Cost code', placeholder: 'Optional — ties the spend to a budget line' },
    { name: 'Description', label: 'What was the money spent on', required: true, span: 2 },
    { name: 'Amount', label: 'Amount', type: 'number', required: true },
    { name: 'PaymentMethod', label: 'Paid by', type: 'select', options: meta.methods },
    { name: 'VendorID', label: 'Vendor (optional)', type: 'select',
      options: [{ value: '', label: '— none —' }].concat(
        vendors.map(v => ({ value: v.VendorID, label: v.CompanyName }))) },
    { name: 'ReferenceNo', label: 'Reference / receipt no.' }
  ];

  const body = UI.el('div');
  const form = UI.form(fields, values);
  body.appendChild(form);
  body.appendChild(UI.el('div', { class: 'hint mt-8', id: 'expLimitNote',
    text: 'Anything over ' + cash(meta.pmLimit) + ' needs management approval.' }));

  const save = submit => async m => {
    const data = UI.validate(form, fields);
    if (!data) return;
    if (Number(data.Amount) <= 0) {
      UI.setFieldError(form, 'Amount', 'The amount must be greater than zero.');
      return;
    }
    m.busy(true);
    try {
      const payload = Object.assign({}, data, { submit: submit });
      const res = existing
        ? await api('updateExpense', existing.ExpenseID, payload)
        : await api('createExpense', data.ProjectID, payload);
      UI.success(res.message);
      m.close();
      if (onSaved) onSaved(res.data);
    } catch (e) { m.busy(false); UI.error('Could not save', e.message); }
  };

  UI.modal({
    title: existing ? 'Edit expense ' + existing.ExpenseID : 'Record an expense', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      ...(existing ? [] : [{ label: 'Save as draft', onClick: save(false) }]),
      { label: existing ? 'Save changes' : 'Save and submit', class: 'btn-primary', onClick: save(!existing) }
    ]
  });
}

function budgetNote(b) {
  if (!b || b.budgeted === undefined) return '';
  const over = b.available !== undefined && b.available < 0;
  return `<div class="banner ${over ? 'banner-warn' : 'banner-info'}" style="margin-top:8px">
    Budget for this cost code: ${cash(b.budgeted)} · committed ${cash(b.committed || 0)} ·
    available ${cash(b.available || 0)}</div>`;
}


function decideExpenseDialog(expenseId, action) {
  const verb = { APPROVE: 'Approve', RETURN: 'Return for correction', REJECT: 'Reject' }[action];
  const needsReason = action !== 'APPROVE';
  const fields = [{ name: 'Comments', label: needsReason ? 'Reason (required)' : 'Comments',
                    type: 'textarea', required: needsReason, span: 2 }];
  const body = UI.el('div');
  const form = UI.form(fields, {});
  body.appendChild(form);
  UI.modal({
    title: verb + ' expense', size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: verb, class: action === 'REJECT' ? 'btn-danger' : 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          m.busy(true);
          try {
            UI.success((await api('decideExpense', expenseId, action, data.Comments || '')).message);
            m.close();
            navigate('expense', expenseId);
          } catch (e) { m.busy(false); UI.error('Could not record the decision', e.message); }
        } }
    ]
  });
}

function renderApprovalTimeline(mount, approvals) {
  if (!mount) return;
  if (!approvals || !approvals.length) {
    mount.innerHTML = '<p class="muted">Nothing recorded yet.</p>';
    return;
  }
  mount.innerHTML = '<ol class="timeline">' + approvals.map(a => {
    const tone = /APPROVE|SUBMIT|ACTIVE/.test(a.Action) ? 'ok' : /REJECT|TERMINAT/.test(a.Action) ? 'no' : '';
    return `<li class="timeline-item ${tone}">
      <div class="timeline-title">${UI.esc(String(a.Action).replace(/_/g, ' '))} — ${UI.esc(a.UserName || a.UserID || '')}</div>
      <div class="timeline-sub">${UI.fmt.dateTime(a.ActionAt)}${a.Role ? ' · ' + UI.esc(a.Role) : ''}</div>
      ${a.Comments ? `<div class="timeline-note">${UI.esc(a.Comments)}</div>` : ''}
    </li>`;
  }).join('') + '</ol>';
}

/**
 * Two-level category picker: main trades down the left, their sub-trades on
 * the right as checkboxes. What is ticked in one main trade stays ticked when
 * you move to another, and everything chosen is listed underneath.
 */
function categoryPicker(groups, initial) {
  const chosen = new Set((initial || []).map(String));
  let active = (groups[0] && groups[0].group) || '';
  // Open on a main trade the firm already works in, if there is one.
  (groups || []).forEach(g => {
    if (g.items.some(i => chosen.has(i.Name !== undefined ? i.Name : i))) active = active === (groups[0] || {}).group ? g.group : active;
  });

  const root = UI.el('div', { class: 'field span-2' });
  root.innerHTML =
    `<label>Trades this firm works in *</label>
     <div class="cat-picker">
       <div class="cat-picker-groups" id="pickGroups"></div>
       <div class="cat-picker-items" id="pickItems"></div>
     </div>
     <div class="cat-picker-chosen" id="pickChosen"></div>`;

  const groupHost = root.querySelector('#pickGroups');
  const itemHost = root.querySelector('#pickItems');
  const chosenHost = root.querySelector('#pickChosen');

  const nameOf = i => (i && i.Name !== undefined) ? i.Name : i;
  const countIn = g => g.items.filter(i => chosen.has(nameOf(i))).length;

  const drawGroups = () => {
    groupHost.innerHTML = groups.map(g => {
      const n = countIn(g);
      return `<button type="button" class="cat-picker-group${g.group === active ? ' active' : ''}"
               data-group="${UI.esc(g.group)}">
                <span>${UI.esc(g.group)}</span>
                ${n ? `<span class="cat-count">${n}</span>` : ''}
              </button>`;
    }).join('');
    groupHost.querySelectorAll('[data-group]').forEach(b => {
      b.onclick = () => { active = b.dataset.group; drawGroups(); drawItems(); };
    });
  };

  const drawItems = () => {
    const g = groups.find(x => x.group === active) || { items: [] };
    itemHost.innerHTML = g.items.map(i => {
      const name = nameOf(i);
      return `<label class="cat-opt">
                <input type="checkbox" data-cat="${UI.esc(name)}"${chosen.has(name) ? ' checked' : ''}>
                <span>${UI.esc(name)}</span>
              </label>`;
    }).join('') || '<div class="muted" style="padding:8px">Nothing in this trade yet.</div>';
    itemHost.querySelectorAll('[data-cat]').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) chosen.add(cb.dataset.cat); else chosen.delete(cb.dataset.cat);
        drawGroups();
        drawChosen();
      };
    });
  };

  const drawChosen = () => {
    if (!chosen.size) {
      chosenHost.innerHTML = '<span class="muted" style="font-size:12.5px">Nothing chosen yet.</span>';
      return;
    }
    chosenHost.innerHTML = groups.map(g => {
      const mine = g.items.map(nameOf).filter(n => chosen.has(n));
      if (!mine.length) return '';
      return `<div class="cat-line"><span class="cat-group">${UI.esc(g.group)}</span>` +
        mine.map(n => `<span class="chip chip-strong" data-drop="${UI.esc(n)}"
          title="Remove">${UI.esc(n)} ×</span>`).join('') + `</div>`;
    }).join('');
    chosenHost.querySelectorAll('[data-drop]').forEach(c => {
      c.onclick = () => { chosen.delete(c.dataset.drop); drawGroups(); drawItems(); drawChosen(); };
    });
  };

  drawGroups(); drawItems(); drawChosen();
  return { root, selected: () => Array.from(chosen) };
}

    ...((existing ? 'CNIC' in existing : App.serverHasCnic)
      ? [{ name: 'CNIC', label: 'CNIC', placeholder: '12345-1234567-1' }] : []),
    { name: 'Phone', label: 'Phone' },
    { name: 'Email', label: 'Email', type: 'email' },
    { name: 'NTN', label: 'NTN' },
    { name: 'STRN', label: 'STRN' },
    { name: 'BankName', label: 'Bank' },
    { name: 'IBAN', label: 'IBAN' },
    { name: 'Status', label: 'Status', type: 'select', required: true,
      options: ['Active', 'Inactive', 'Blacklisted'],
      hint: 'Only an active firm can be given a new agreement' },
    { name: 'Address', label: 'Address', type: 'textarea', span: 2 },
    { name: 'Notes', label: 'Notes', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, Object.assign({}, existing || {}, {
    Status: (existing && ['Active', 'Inactive', 'Blacklisted'].indexOf(existing.Status) !== -1)
      ? existing.Status : 'Active'
  }));
  body.appendChild(form);

  // Pick the main trade, then tick the sub-trades inside it. Choices from other
  // main trades stay picked — a firm doing masonry AND tiling is normal.
  const picker = categoryPicker(cats.groups, (existing && existing.CategoryList) || []);
  form.insertBefore(picker.root, form.children[1] || null);

  if (cats.canManage) {
    const manage = UI.el('button', { class: 'btn mt-8', type: 'button', id: 'manageCatsBtn' });
    manage.textContent = 'Manage the category list';
    manage.onclick = () => subcategoryManager(() => {
      UI.info('Reopen this form to pick from the updated list.');
    });
    body.appendChild(manage);
  }
  UI.modal({
    title: existing ? 'Edit ' + existing.CompanyName : 'Register a subcontractor', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Save', class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          const picked = picker.selected();
          if (!picked.length) { UI.warn('Choose at least one sub-category.'); return; }
          data.Categories = picked;
          m.busy(true);
          try {
            const res = existing
              ? await api('updateSubcontractor', existing.SubcontractorID, data)
              : await api('createSubcontractor', data);
            UI.success(res.message);
            m.close();
            if (onSaved) onSaved(res.data);
          } catch (e) { m.busy(false); UI.error('Could not save', e.message); }
        } }
    ]
  });
}

/* ============================================ MANAGING THE CATEGORY LIST */

async function subcategoryManager(onChanged) {
  const body = UI.el('div');
  body.innerHTML =
    `<div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:12px">
       <div class="field" style="flex-grow:1;margin:0">
         <label for="newCatName">Add a category</label>

       </div>

         <label for="newCatGroup">Under</label>
         <select id="newCatGroup" class="input"></select>
       </div>
       <button class="btn btn-primary" type="button" id="addCatBtn">Add</button>
     </div>
     <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:8px">
       <input type="checkbox" id="showInactive"> Show ones switched off

     <div id="catList" style="max-height:48vh;overflow-y:auto"></div>`;

  const listHost = body.querySelector('#catList');
  const groupSel = body.querySelector('#newCatGroup');
  let data = null;

  const refresh = async () => {
    listHost.innerHTML = UI.loadingState('Loading…');
    data = (await api('listSubcategories',
      { includeInactive: body.querySelector('#showInactive').checked })).data;

    const groups = Array.from(new Set(data.rows.map(r => r.TradeGroup))).sort();
    const keep = groupSel.value;
    groupSel.innerHTML = groups.map(g => `<option>${UI.esc(g)}</option>`).join('') +
      `<option value="__new">Other</option>`;
    if (keep) groupSel.value = keep;

    listHost.innerHTML = data.groups.map(g => `
      <div style="margin-bottom:14px">
        <div style="font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
                    color:var(--text-muted);margin:0 0 6px">${UI.esc(g.group)}</div>
        ${g.items.map(i => `
          <div style="display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;
                      ${i.Status === 'Active' ? '' : 'opacity:.55;'}">
            <span style="flex-grow:1;font-size:13px">${UI.esc(i.Name)}
              ${i.InUse ? `<span class="muted">· ${i.InUse} firm(s)</span>` : ''}
              ${i.Status === 'Active' ? '' : '<span class="muted">· off</span>'}</span>
            <button class="btn btn-sm" type="button" data-rename="${i.CategoryID}">Rename</button>
            <button class="btn btn-sm" type="button" data-toggle="${i.CategoryID}"
              data-status="${i.Status}">${i.Status === 'Active' ? 'Switch off' : 'Switch on'}</button>
            ${i.InUse ? '' : `<button class="btn btn-sm btn-danger" type="button"
              data-del="${i.CategoryID}" data-name="${UI.esc(i.Name)}">Remove</button>`}
          </div>`).join('')}
      </div>`).join('') || UI.emptyState('Nothing here', '');

    listHost.querySelectorAll('[data-rename]').forEach(b => {
      b.onclick = async () => {
        const row = data.rows.find(r => r.CategoryID === b.dataset.rename);
        const next = window.prompt('Rename this category' +
          (row.InUse ? ` — ${row.InUse} subcontractor(s) will be updated too` : ''), row.Name);
        if (next === null || !next.trim() || next.trim() === row.Name) return;
        try {
          UI.success((await api('updateSubcategory', row.CategoryID, { Name: next.trim() })).message);
          await refresh();
          if (onChanged) onChanged();
        } catch (e) { UI.error('Could not rename it', e.message); }
      };
    });
    listHost.querySelectorAll('[data-toggle]').forEach(b => {
      b.onclick = async () => {
        const next = b.dataset.status === 'Active' ? 'Inactive' : 'Active';
        try {
          await api('updateSubcategory', b.dataset.toggle, { Status: next });
          await refresh();
          if (onChanged) onChanged();
        } catch (e) { UI.error('Could not change it', e.message); }
      };
    });
    listHost.querySelectorAll('[data-del]').forEach(b => {
      b.onclick = () => UI.confirm({
        title: 'Remove this category?',
        message: `"${b.dataset.name}" is not used by any subcontractor and will be removed.`,
        confirmLabel: 'Remove', danger: true,
        onConfirm: async () => {
          try {
            UI.success((await api('deleteSubcategory', b.dataset.del)).message);
            await refresh();
            if (onChanged) onChanged();
          } catch (e) { UI.error('Could not remove it', e.message); }
        }
      });
    });
  };

  body.querySelector('#showInactive').onchange = refresh;
  body.querySelector('#addCatBtn').onclick = async () => {
    const name = body.querySelector('#newCatName').value.trim();
    if (!name) { UI.warn('Give the category a name.'); return; }
    try {
      const res = await api('createSubcategory', { Name: name, TradeGroup: groupSel.value });
      UI.success(res.message);
      body.querySelector('#newCatName').value = '';
      await refresh();
      if (onChanged) onChanged();
    } catch (e) { UI.error('Could not add it', e.message); }
  };

  await refresh();
  UI.modal({ title: 'Subcontractor categories', size: 'wide', body,
    footer: [{ label: 'Done', class: 'btn-primary', onClick: m => m.close() }] });
}
