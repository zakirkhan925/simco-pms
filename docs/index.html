  document.getElementById('docSearch').oninput = ev => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { docState.search = ev.target.value; docState.page = 1; loadDocuments(); }, 250);
  };
  document.getElementById('docProject').onchange = ev => {
    docState.projectId = ev.target.value; docState.page = 1; loadDocuments();
  };
  document.getElementById('docType').onchange = ev => {
    docState.documentType = ev.target.value; docState.page = 1; loadDocuments();
  };
  document.getElementById('docReset').onclick = () => {
    Object.assign(docState, { page: 1, search: '', documentType: '', projectId: '' });
    pageDocuments(root, {});
  };
  document.getElementById('docUploadBtn').onclick = () => documentUploadForm(projects, () => loadDocuments());

  await loadDocuments();
}

async function loadDocuments() {
  const mount = document.getElementById('docTable');
  if (!mount) return;
  const d = (await api('listDocuments', Object.assign({}, docState))).data;

  const typeSel = document.getElementById('docType');
  if (typeSel && !typeSel.options.length) {
    typeSel.innerHTML = '<option value="">All types</option>' +
      d.documentTypes.map(t => `<option${t === docState.documentType ? ' selected' : ''}>${UI.esc(t)}</option>`).join('');
  }
  const up = document.getElementById('docUploadBtn');
  if (up) up.style.display = d.canUpload ? '' : 'none';

  document.getElementById('docSummary').innerHTML =
    `<div class="stat"><div class="stat-label">Documents</div><div class="stat-value" id="docCount">${d.summary.total}</div></div>` +
    d.summary.byType.slice(0, 5).map(t =>
      `<div class="stat"><div class="stat-label">${UI.esc(t.type)}</div><div class="stat-value">${t.count}</div></div>`).join('');

  UI.table(mount, {
    columns: [
      { key: 'FileName', label: 'File',
        render: r => `<a class="link" href="${UI.esc(r.DriveUrl)}" target="_blank" rel="noopener">${UI.esc(r.FileName)}</a>` +
          (r.Notes ? `<div class="muted" style="font-size:11.5px">${UI.esc(r.Notes)}</div>` : '') },
      { key: 'DocumentType', label: 'Type', width: '140px', render: r => UI.badge(r.DocumentType, 'blue') },
      { key: 'ProjectName', label: 'Project', width: '170px' },
      { key: 'RecordID', label: 'Attached to', width: '150px',
        render: r => r.RecordID ? `<span class="mono">${UI.esc(r.RecordID)}</span>` : '<span class="muted">—</span>' },
      { key: 'UploadedByName', label: 'Uploaded by', width: '150px' },
      { key: 'UploadedAt', label: 'When', width: '160px', render: r => UI.fmt.dateTime(r.UploadedAt) },
      { key: '_act', label: '', width: '90px', sortable: false,
        render: r => r.CanDelete
          ? `<button class="btn btn-sm btn-danger" data-del="${r.DocumentID}">Remove</button>` : '' }
    ],
    rows: d.rows,
    empty: UI.emptyState('No documents yet',
      d.canUpload ? 'Upload a contract, a drawing or a site photograph.' : 'Nothing has been uploaded.')
  });
  mount.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => UI.confirm({
      title: 'Remove this document?',
      message: 'The file goes to the Drive bin and the link here is removed. The audit trail keeps a record.',
      danger: true, confirmLabel: 'Remove',
      onConfirm: async modal => {
        try {
          UI.success((await api('deleteDocument', b.dataset.del)).message);
          modal.close();
          loadDocuments();
        } catch (e) { modal.close(); UI.error('Could not remove', e.message); }
      }
    });
  });

  UI.pager(document.getElementById('docPager'), {
    page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
    onPage: p => { docState.page = p; loadDocuments(); }
  });
}

function documentUploadForm(projects, onSaved, fixed) {
  const fields = [
    { name: 'ProjectID', label: 'Project', type: 'select', required: true,
      options: projects.map(p => ({ value: p.ProjectID, label: p.ProjectID + ' — ' + p.ProjectName })),
      value: (fixed && fixed.projectId) || docState.projectId, readonly: !!(fixed && fixed.projectId) },
    { name: 'DocumentType', label: 'Type', type: 'select', required: true,
      options: (App.enums.DOCUMENT_TYPES || []) },
    { name: 'Module', label: 'Attach to module', value: (fixed && fixed.module) || '',
      hint: 'Optional — e.g. PO, RAR, EXPENSE' },
    { name: 'RecordID', label: 'Attach to record', value: (fixed && fixed.recordId) || '',
      hint: 'Optional — the record id the file belongs to' },
    { name: 'Notes', label: 'Notes', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, {});
  body.appendChild(form);
  const fileField = UI.el('div', { class: 'field' });
  fileField.appendChild(UI.el('label', { for: 'docFile', text: 'File *' }));
  const fileInput = UI.el('input', { class: 'input', type: 'file', id: 'docFile' });
  fileField.appendChild(fileInput);
  fileField.appendChild(UI.el('div', { class: 'hint', id: 'docFileHint',
    text: 'Up to 10 MB. Larger files belong in Drive with a link here.' }));
  body.appendChild(fileField);

  UI.modal({
    title: 'Upload a document', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Upload', class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          const file = fileInput.files && fileInput.files[0];
          if (!file) {
            document.getElementById('docFileHint').innerHTML =
              '<span class="text-red">Choose a file first.</span>';
            return;
          }
          if (file.size > 10 * 1024 * 1024) {
            document.getElementById('docFileHint').innerHTML =
              '<span class="text-red">That file is larger than 10 MB.</span>';
            return;
          }
          m.busy(true);
          try {
            const base64 = await readAsBase64(file);
            const res = await api('uploadDocument', data.ProjectID, {
              FileName: file.name, MimeType: file.type || 'application/octet-stream',
              Base64: base64, SizeBytes: file.size,
              DocumentType: data.DocumentType, Module: data.Module,
              RecordID: data.RecordID, Notes: data.Notes
            });
            UI.success(res.message);
            m.close();
            if (onSaved) onSaved(res.data);
          } catch (e) { m.busy(false); UI.error('Upload failed', e.message); }
        } }
    ]
  });
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('The file could not be read.'));
    reader.readAsDataURL(file);
  });
}

 * dumping every field of the record: a voucher has a payee and an amount in
 * words, a cash report has a reconciliation, an RFQ has what is being asked
 * for and who is being asked. Anything else falls back to the field list.
 */
/**
 * The approval history on a printed document, as the purchase order prints
 * it (owner's request, 10 Nov 2026): when, which step, who in what role, and
 * what they said. No email addresses.
 */
function printApprovalHistory(list) {
  if (!list || !list.length) return '';
  const step = a => String(a.Action || '').replace(/_/g, ' ').toLowerCase().replace(/^./, c => c.toUpperCase());
  return `
    <h3 style="margin-top:14px">Approval history and comments</h3>
    <table>
      <thead><tr><th style="width:90px">Date</th><th style="width:120px">Step</th><th style="width:200px">By</th><th>Comments</th></tr></thead>
      <tbody>${list.map(a => `<tr>
        <td style="white-space:nowrap">${UI.esc(a.ActionAt ? UI.fmt.date(a.ActionAt) : '')}</td>
        <td>${UI.esc(step(a))}${a.StatusAfter ? '<br><small>' + UI.esc(a.StatusAfter) + '</small>' : ''}</td>
        <td>${UI.esc(a.UserName || '')}${a.Role ? '<br><small>' + UI.esc(String(a.Role).replace(/_/g, ' ')) + '</small>' : ''}</td>
        <td style="white-space:pre-wrap">${a.Comments ? UI.esc(a.Comments) : '<span class="muted">—</span>'}</td>
      </tr>`).join('')}</tbody>
    </table>`;
}

/** Rupees in words, because a voucher is not a voucher without them. */
function amountInWords(value) {
  const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
    'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen',
    'eighteen', 'nineteen'];
  const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  const under1000 = n => {
    if (n < 20) return ONES[n];
    if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
    return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' and ' + under1000(n % 100) : '');
  };
  // Pakistani grouping: crore, lakh, thousand — the way the amount is read aloud.
  const words = n => {
    if (n === 0) return 'zero';
    const parts = [];
    const crore = Math.floor(n / 10000000); n %= 10000000;
    const lakh = Math.floor(n / 100000); n %= 100000;
    const thousand = Math.floor(n / 1000); n %= 1000;
    if (crore) parts.push(under1000(crore) + ' crore');
    if (lakh) parts.push(under1000(lakh) + ' lakh');
    if (thousand) parts.push(under1000(thousand) + ' thousand');
    if (n) parts.push(under1000(n));
    return parts.join(' ');
  };
  const total = Math.abs(Number(value) || 0);
  const rupees = Math.floor(total);
  const paisa = Math.round((total - rupees) * 100);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  return cap(words(rupees)) + ' rupees' + (paisa ? ' and ' + words(paisa) + ' paisa' : '') + ' only';
}

    if (v === null || v === undefined || v === '') return c.type === 'count' ? '–' : '';
    switch (c.type) {
      case 'count': return v ? UI.fmt.number(v, 0) : '–';
      case 'number': return UI.fmt.number(v, 0);
      case 'qty': return UI.fmt.number(v, 2);

  const period = filters.from || filters.to

  const table = `<table class="rep"><thead><tr>${cols.map(c =>

  const charts = (d.charts || []).map(ch => {

        <span class="bv">${UI.fmt.number(b.value, 0)}</span></div>`).join('')}</div>`;
  }).join('');
  return UI.print.page({
    company: p.company, title: d.name || 'Report', ref: period,
    meta: [`Run by ${d.generatedBy || ''}`],

    styles: UI.print.docStyles() + `

/**
 * The payment voucher in the accounts' own format (owner's request, 14 Nov 2026):
 * the Bank Payment Voucher (BPV) they kept in Excel for the CFO to post in
 * QuickBooks, filled from the payment itself. A vendor payment, a subcontractor
 * payment (bill, advance, retention) and cash issued to a float all print it.
 * Paid by bank, cheque or online it is a BPV; in cash, a Cash Payment Voucher (CPV).
 * The entry: Dr the payee, Cr the bank (or cash, or the float), and for a vendor
 * payment with tax withheld, Cr withholding tax payable for the tax.
 */
function paymentVoucherHtml(p) {
  const c = p.company || {}, d = p.data || {}, L = p.labels || {}, k = p.kind;
  const proj = p.voucherProject || d.project || null;
  const banks = c.banks || [];
  const n2 = x => Number(x || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const day = v => { if (!v) return ''; const t = new Date(String(v).slice(0, 10) + 'T00:00:00');
    return isNaN(t) ? '' : t.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' }).replace(/ /g, '-'); };
  const BANK_METHODS = ['Bank transfer', 'Cheque', 'Online'];
  // Who printed this copy and when, in Pakistan time (owner's request, 14 Nov 2026).
  const printedAt = (() => { const n = new Date();
    const f = o => n.toLocaleString('en-GB', Object.assign({ timeZone: 'Asia/Karachi' }, o));
    return f({ day: '2-digit' }) + '-' + f({ month: 'short' }) + '-' + f({ year: 'numeric' }) + ' ' +
      f({ hour: 'numeric', minute: '2-digit', hour12: true }).toUpperCase(); })();

  let pay, id, date, payee, desc, gross, tax = 0, method = '', floatName = '', reversed = false;
  if (k === 'VENDORPAY') {
    pay = d.payment || {}; id = pay.VendorPaymentID; date = pay.PaymentDate;
    payee = d.vendor ? d.vendor.CompanyName : (L.VendorID || pay.VendorID);
    gross = Number(pay.Amount) || 0; tax = Number(pay.TaxWithheld) || 0; method = pay.Method || '';
    desc = pay.Remarks || (d.invoice ? 'Payment against invoice ' + (d.invoice.InvoiceNumber || d.invoice.SupplierInvoiceID)
      : pay.POID ? 'Advance against ' + pay.POID : 'Payment on account');
    reversed = !!d.isReversed || pay.Status === 'Reversed';
  } else if (k === 'SUBPAY') {
    pay = d.payment || {}; id = pay.SubPaymentID; date = pay.PaymentDate;
    payee = d.subcontractor ? d.subcontractor.CompanyName : (L.SubcontractorID || pay.SubcontractorID);
    gross = Number(pay.Amount) || 0; method = pay.Method || '';
    const what = { Advance: 'Advance', Retention: 'Retention release', Bill: 'Bill payment' }[pay.PaymentType] || 'Payment';
    const b = d.bill;
    desc = what + (b ? ' against bill ' + (b.BillNumber && b.BillNumber !== b.SubBillID ? b.BillNumber : b.SubBillID) : '') +
      (d.agreement ? ' (' + d.agreement.AgreementID + (d.agreement.Scope ? ' — ' + d.agreement.Scope : '') + ')' : '') +
      (pay.Remarks ? ' — ' + pay.Remarks : '');
    reversed = !!pay.IsReversed || pay.Status === 'Reversed';
  } else {
    pay = d.transaction || {}; id = pay.CashTxnID; date = pay.TxnDate;
    const a = d.account || {};
    payee = a.CustodianName || a.Name || a.CashAccountID;
    gross = Number(pay.Amount) || 0; method = pay.BankAccount ? 'Bank transfer' : 'Cash';
    desc = (pay.Description || 'Working cash advance') + ' — float ' + (a.Name || a.CashAccountID);
  }

  // What it was paid from: a bank account, the cash in hand, or a site's working float.
  const fromFloat = k !== 'CASHISSUE' && (method === 'Cash (working float)' || (!!pay.CashAccountID && !pay.BankAccount));
  if (fromFloat) floatName = d.account ? (d.account.Name || d.account.CashAccountID) : (L.CashAccountID || 'Working cash');
  const byBank = !!pay.BankAccount || (!fromFloat && BANK_METHODS.indexOf(method) !== -1);
  const bank = pay.BankAccount ? banks.find(b => b.name === pay.BankAccount) || { name: pay.BankAccount } : null;
  const creditGl = pay.BankAccount || (fromFloat ? floatName : byBank ? 'Bank' : 'Cash in hand');
  const type = byBank ? 'BPV' : 'CPV';
  const title = byBank ? 'Bank Payment Voucher (BPV)' : 'Cash Payment Voucher (CPV)';
  const t = date ? new Date(String(date).slice(0, 10) + 'T00:00:00') : null;
  const voucherNo = type + '/' + (t && !isNaN(t) ? t.toLocaleString('en-GB', { month: 'short' }).toUpperCase() + '/' + t.getFullYear() : '') + '/' + (id || '');
  const net = Math.round((gross - tax) * 100) / 100;

  const headOffice = !proj;
  const projCode = proj ? (proj.ProjectCode || proj.ProjectName || proj.ProjectID) : (headOffice ? 'Head Office' : '');
  const projLoc = proj ? (proj.Location || proj.ProjectName || '') : (headOffice ? 'Head Office' : '');
  const office = fromFloat ? floatName : 'Head Office';

  const lines = [[payee, projCode, desc, gross, 0]];

function buildPrintHtml(p) {
  if (p.kind === 'STATEMENTS') return buildStatementsHtml(p);
  // Payment vouchers in the accounts' BPV / CPV format (14 Nov 2026).
  if (p.kind === 'VENDORPAY' || p.kind === 'SUBPAY' || p.kind === 'CASHISSUE') return paymentVoucherHtml(p);
  if (p.kind === 'REPORT') return buildReportPrintHtml(p);
  const c = p.company;
  const title = PRINT_TITLES[p.kind] || 'Document';
  const rows = flattenForPrint(p);
  const isNum = h => /qty|quantity|rate|amount|value|total/i.test(h);
  const ref = rows.ref || '';
  const bespoke = PRINT_BODIES[p.kind];
  if (bespoke) {
    return UI.print.page({
      company: c, title: title, ref: ref, styles: UI.print.docStyles(),
      signatures: p.kind === 'VENDORPAY' || p.kind === 'SUBPAY' ? ['Prepared by', 'Approved by', 'Received by']
        : p.kind === 'CASHREPORT' ? ['Custodian', 'Checked by', 'Approved by']
        : p.kind === 'VENDORSTMT' || p.kind === 'SUBSTMT' ? ['Prepared by', 'Checked by']
        : p.kind === 'SUPINV' || p.kind === 'SUBBILL' ? ['Prepared by', 'Checked by', 'Approved by']
        : ['Prepared by', 'Approved by'],
      body: bespoke(p)
    });
  }
  return UI.print.page({
    company: c,
    title: title,
    ref: ref,
    styles: UI.print.docStyles(),
    body:
      `<dl class="kv">${rows.header.map(kv =>
        `<dt>${UI.esc(kv[0])}</dt><dd>${UI.esc(kv[1])}</dd>`).join('')}</dl>` +
      (rows.lines.length
        ? `<table><thead><tr>${rows.lineCols.map(h =>
            `<th class="${isNum(h) ? 'r' : ''}">${UI.esc(h.replace(/([a-z])([A-Z])/g, '$1 $2'))}</th>`).join('')}</tr></thead><tbody>` +
          rows.lines.map(l => `<tr>${rows.lineCols.map(h =>
            `<td class="${isNum(h) || typeof l[h] === 'number' ? 'r' : ''}">${UI.esc(l[h] === undefined || l[h] === null
              ? '' : printValue(h, l[h]))}</td>`).join('')}</tr>`).join('') +
          `</tbody></table>`
        : '')
  });
}

/** The id field that names each kind of document, on its own record. */
const PRINT_REF_FIELD = {
  PO: 'POID', PR: 'PRID', GRN: 'GRNID', ISSUE: 'IssueID', RAR: 'RARID',
  SUBBILL: 'SubBillID', RFQ: 'RFQID', VENDORPAY: 'VendorPaymentID',
  CASHREPORT: 'CashReportID', SUPINV: 'SupplierInvoiceID', SUBPAY: 'SubPaymentID', CASHISSUE: 'CashTxnID'
};

/** A header value as it should read on paper: dates as dates, amounts with separators. */
function printValue(key, v) {
  if (typeof v === 'number') return UI.fmt.number(v);
  if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}(T|$)/.test(v)) {
    return /T/.test(v) && !/(Date|From|To)$/.test(key) ? UI.fmt.dateTime(v) : UI.fmt.date(v);
  }
  return v;
}

/** Turns whichever record shape the server returned into a header block plus lines. */
function flattenForPrint(p) {
  const d = p.data || {};
  // Each payload wraps its record under a different key. The three newest —
  // an RFQ, a payment voucher, a cash report — were not listed here, so their
  // printed copies came out with no reference number on them at all.
  // A supplier invoice's payload is the one whose record is d.invoice; other
  // payloads (a voucher, a receipt) carry an invoice beside their own record.
  const record = (p.kind === 'SUPINV' && d.invoice) || (p.kind === 'SUBPAY' && d.payment) || d.po || d.pr || d.grn || d.issue || d.rar || d.bill ||
                 d.purchaseOrder || d.rfq || d.payment || d.report || d;
  const header = [];
  // Each id shows its name beside it, flags for the screen ("Is Editable") are
  // left out, and dates and amounts read as people write them (28 Oct 2026).
  const labels = p.labels || {};
  Object.keys(record).forEach(k => {
    const v = record[k];
    if (v === null || v === undefined || v === '' || typeof v === 'object' || typeof v === 'boolean') return;
    if (/^(UpdatedBy|CreatedAt|UpdatedAt)$/.test(k) || /^Is[A-Z]/.test(k)) return;
    // "GRNNumber" → "GRN Number", "POID" → "PO ID", "ReceiptDate" → "Receipt Date".
    header.push([k.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/([A-Z]{2,})(Number|ID)$/, '$1 $2'), printValue(k, v) +
      (labels[k] ? ' — ' + labels[k] : '')]);
  });
  // The record's own id heads the document; repeating it in the detail list
  // would just be the same string twice.
  //
  // Named per kind rather than picked from whichever id field turns up first:
  // an RFQ carries the PRID of the request behind it, and a first-match chain
  // put that number at the top of the page instead of the RFQ's own.
  const ref = record[PRINT_REF_FIELD[p.kind]] || '';
  const lines = d.items || d.lines || d.poItems || d.prItems || [];
  const lineCols = lines.length
    ? Object.keys(lines[0]).filter(k => typeof lines[0][k] !== 'object' && typeof lines[0][k] !== 'boolean' &&
        !/ID$/.test(k) && !/^Is[A-Z]/.test(k))
    : [];
  return { ref: ref, header: header.slice(0, 16), lines: lines, lineCols: lineCols };
}

  <script>
/* =============================================================
   Alerts.html — Phase 12. The notification centre: the bell in
   the header, its dropdown, and the full list.
   ============================================================= */

const notifState = { page: 1, pageSize: 25, unreadOnly: false, module: '', unread: 0, timer: null };

const NOTIF_TONE = { info: 'blue', action: 'amber', warning: 'amber', critical: 'red' };

/** Where a notification points. Unknown modules simply do not link anywhere. */
const NOTIF_ROUTES = {
  PR: id => navigate('purchase-request', id),
  RFQ: id => navigate('rfq', id),
  QUOTATION: id => navigate('quotations'),
  PO: id => navigate('purchase-order', id),
  GRN: () => navigate('goods-receipts'),
  ISSUE: () => navigate('material-issues'),
  STOCK: () => navigate('stock'),

  SUBBILL: id => navigate('subbill', id),
  AGREEMENT: id => navigate('agreement', id),
  PROJECT: id => navigate('project', id),
  BUDGET: id => navigate('project', { projectId: id, tab: 'budget' })
};

function initNotifications() {
  const btn = document.getElementById('notifBtn');
  if (!btn || btn.dataset.wired) return;
  btn.dataset.wired = '1';
  btn.disabled = false;
  btn.removeAttribute('title');
  btn.setAttribute('aria-label', 'Notifications');

  btn.onclick = e => { e.stopPropagation(); toggleNotifPanel(); };
  document.addEventListener('click', ev => {
    const panel = document.getElementById('notifPanel');
    if (panel && !panel.classList.contains('hidden') &&
        ev.target !== btn && !panel.contains(ev.target)) panel.classList.add('hidden');
  });

  refreshNotifBadge();
  if (notifState.timer) clearInterval(notifState.timer);
  // Pull rather than push: one small call a minute, and nothing to retry.
  notifState.timer = setInterval(refreshNotifBadge, 60000);
}

async function refreshNotifBadge() {
  try {
    const d = (await api('listNotifications', { pageSize: 1, unreadOnly: true })).data;
    setNotifBadge(d.unread);
  } catch (e) { /* a failed poll must never interrupt the user */ }
}

function setNotifBadge(count) {
  notifState.unread = count;
  const btn = document.getElementById('notifBtn');
  if (!btn) return;
  let dot = document.getElementById('notifDot');
  if (!count) { if (dot) dot.remove(); return; }
  if (!dot) {
    dot = UI.el('span', { class: 'notif-dot', id: 'notifDot' });
    btn.appendChild(dot);
  }
  dot.textContent = count > 99 ? '99+' : String(count);
}

async function toggleNotifPanel() {
  let panel = document.getElementById('notifPanel');
  if (!panel) {
    panel = UI.el('div', { class: 'notif-panel hidden', id: 'notifPanel' });
    document.querySelector('.topbar').appendChild(panel);
  }
  if (!panel.classList.contains('hidden')) { panel.classList.add('hidden'); return; }

  panel.innerHTML = UI.loadingState('Loading…');
  panel.classList.remove('hidden');
  try {
    const d = (await api('listNotifications', { pageSize: 8 })).data;
    setNotifBadge(d.unread);
    panel.innerHTML =
      `<div class="notif-head">
         <span>Notifications${d.unread ? ' · ' + d.unread + ' unread' : ''}</span>
         <button class="btn btn-sm" id="notifMarkAll"${d.unread ? '' : ' disabled'}>Mark all read</button>
       </div>` +
      (d.rows.length
        ? d.rows.map(n => notifItemHtml(n)).join('')
        : '<div class="notif-empty">Nothing waiting for you.</div>') +
      `<div class="notif-foot"><button class="btn btn-sm" id="notifSeeAll">See all</button></div>`;

    panel.querySelectorAll('[data-notif]').forEach(el => {
      el.onclick = () => openNotification(el.dataset.notif, el.dataset.module, el.dataset.record);
    });
    document.getElementById('notifSeeAll').onclick = () => {
      panel.classList.add('hidden');
      navigate('notifications');
    };
    const markAll = document.getElementById('notifMarkAll');
    if (markAll && !markAll.disabled) markAll.onclick = async ev => {
      ev.stopPropagation();
      await api('markAllNotificationsRead');
      setNotifBadge(0);
      toggleNotifPanel(); toggleNotifPanel();
    };
  } catch (e) {
    panel.innerHTML = `<div class="notif-empty">${UI.esc(e.message)}</div>`;
  }
}

function notifItemHtml(n) {
  const unread = String(n.Status) === 'Unread';
  return `<div class="notif-item${unread ? ' unread' : ''}"
       data-notif="${UI.esc(n.NotificationID)}" data-module="${UI.esc(n.Module || '')}"
       data-record="${UI.esc(n.RecordID || '')}">
     <span class="badge badge-${NOTIF_TONE[n.Severity] || 'grey'}">${UI.esc(n.Severity || 'info')}</span>
     <div class="notif-body">
       <div class="notif-title">${UI.esc(n.Title)}</div>
       <div class="notif-msg">${UI.esc(n.Message)}</div>
       <div class="notif-when">${UI.fmt.dateTime(n.CreatedAt)}</div>
     </div>
   </div>`;
}

async function openNotification(id, module, recordId) {
  try { await api('markNotificationRead', id); } catch (e) { /* reading is best effort */ }
  const panel = document.getElementById('notifPanel');
  if (panel) panel.classList.add('hidden');
  refreshNotifBadge();
  const go = NOTIF_ROUTES[String(module || '').toUpperCase()];
  if (go && recordId) go(recordId);
  else if (go) go();
  else navigate('notifications');
}

/* ------------------------------------------------------------ FULL LIST */

async function pageNotifications(root) {
  root.innerHTML =
    pageHead('Notifications', 'Work waiting on you, and things worth knowing about',
      `<button class="btn" id="notifPageMarkAll">Mark all read</button>`) +
    `<div class="card">
       <div class="card-head">
         <div class="filters">
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="notifUnreadOnly"> Unread only</label></div>
           <div class="field"><label for="notifModule">Module</label>
             <select class="input" id="notifModule">
               <option value="">All</option>
               ${Object.keys(NOTIF_ROUTES).map(m => `<option>${m}</option>`).join('')}
             </select></div>
         </div>
       </div>
       <div id="notifList">${UI.loadingState()}</div>
       <div id="notifPager"></div>
     </div>`;

  document.getElementById('notifUnreadOnly').checked = notifState.unreadOnly;
  document.getElementById('notifUnreadOnly').onchange = e => {
    notifState.unreadOnly = e.target.checked; notifState.page = 1; loadNotifications();
  };
  document.getElementById('notifModule').onchange = e => {
    notifState.module = e.target.value; notifState.page = 1; loadNotifications();
  };
  document.getElementById('notifPageMarkAll').onclick = async () => {
    const d = (await api('markAllNotificationsRead')).data;
    UI.success('Marked read', d.marked + ' notification(s).');
    setNotifBadge(0);
    loadNotifications();

  await loadNotifications();
}

async function loadNotifications() {
  const mount = document.getElementById('notifList');
  if (!mount) return;
  const d = (await api('listNotifications', {
    page: notifState.page, pageSize: notifState.pageSize,
    unreadOnly: notifState.unreadOnly, module: notifState.module
  })).data;
  setNotifBadge(d.unread);

  UI.table(mount, {
    columns: [
      { key: 'Severity', label: '', width: '90px',

      { key: 'Title', label: 'Notification',
        render: n => `<div class="${String(n.Status) === 'Unread' ? 'bold' : ''}">${UI.esc(n.Title)}</div>
                      <div class="muted" style="font-size:11.5px">${UI.esc(n.Message)}</div>` },
      { key: 'Module', label: 'Module', width: '110px' },
      { key: 'RecordID', label: 'Record', width: '130px',

      { key: 'CreatedAt', label: 'When', width: '160px', render: n => UI.fmt.dateTime(n.CreatedAt) },
      { key: 'Status', label: 'Status', width: '90px', render: n => UI.badge(n.Status) },
      { key: '_act', label: '', width: '80px', sortable: false,

    ],
    rows: d.rows,

  });
  mount.querySelectorAll('[data-open]').forEach(b => {
    b.onclick = () => openNotification(b.dataset.open, b.dataset.module, b.dataset.record);

  UI.pager(document.getElementById('notifPager'), {
    page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,

    rfq: 'rfqs',
    'purchase-order': 'purchase-orders',
    'rar-bill': 'rar',
    // A project's billing position. Its menu parent is Projects, but it is
    // the billing module's screen, so it opens when RAR / IPC has moved.
    billing: 'rar',
    expense: 'expenses',
    subcontractor: 'subcontractors',
    agreements: 'subcontractors',
    agreement: 'subcontractors',
    subbill: 'subcontractors',
    payables: 'subcontractors',
    'cash-account': 'cash',
    'cash-reports': 'cash',
    'cash-report': 'cash',
    'labour-sheet': 'labour',
    'salary-sheet': 'salaries',
    // CDR & Guarantees (11 Nov 2026): its menu group appears only for people with access.
    'bgm-instrument': 'bgm-register',
    report: 'reports',
    profile: null
  };

  window.PMS_PORT = {
    phases: PHASES,
    notMoved: NOT_MOVED,
    // Answered in the page; see call() in site/bridge.js. Files are the
    // server's to accept or refuse: it knows whether Drive is connected.
    local: {
      getAppMeta: () => ({ success: true, message: 'Meta', data: { phases: PHASES } }),
      // The original checked that every Apps Script file arrived whole. The
      // server here is one bundle with no such files, so there is nothing to
      // list; asking it cost a refused request on every page load. No data:
      // the startup band treats that as "nothing missing" and the diagnostics
      // screen leaves out its "Server files" card, as for an older build.
      getDeploymentCheck: () => ({ success: true, message: 'Deployment check', data: null })
    }
  };

  // Set now, not when getAppMeta answers: boot navigates in the same tick as
  // it asks, and the guard below needs the table already in place.
  App.phases = PHASES;

  isBuilt = function (item) {
    return !!(App.phases[item.phase] && App.phases[item.phase].done) &&
      NOT_MOVED.indexOf(item.id) === -1;
  };

  function navItem(route) {
    for (const g of NAV) {
      const found = g.items.find(i => i.id === route);
      if (found) return found;
    }
    return null;
  }

  function moved(route) {
    const item = navItem(route);
    if (item) return isBuilt(item);
    if (Object.prototype.hasOwnProperty.call(DETAIL_ROUTES, route)) {
      const parent = DETAIL_ROUTES[route];
      return parent ? moved(parent) : true;
    }
    return false;
  }

  /** The first moved screen this person may open, in menu order. */
  function landingRoute() {
    for (const g of NAV) {
      for (const i of g.items) {
        if (can(i.perm) && isBuilt(i) && typeof PAGES[i.id] === 'function') return i.id;
      }
    }
    return 'profile';
  }

  // The old system was switched off after cutover (22 Oct 2026), so a screen
  // that has not moved can no longer send anyone back to it. The Database
  // page managed the Google Sheet's tabs and has no meaning here: it leaves
  // the menu rather than sitting there greyed out.
  NAV.forEach(g => { g.items = g.items.filter(i => i.id !== 'database'); });

  const originalNavigate = navigate;
  navigate = function (route, arg) {
    if (moved(route)) return originalNavigate(route, arg);
    // Sign-in and boot land on the dashboard. Should it ever be shut, open
    // the first screen that has moved instead of an error.
    if (route === 'dashboard') return originalNavigate(landingRoute());
    const item = navItem(route) || navItem(ROUTE_PARENTS[route]);
    UI.warn('Not available',
      (item ? item.label : 'That screen') + ' is not part of the new system.');
  };

  // Import, Template and Export on the list screens belong to the import /
  // export module. Until it moves, the buttons are shown greyed with the
  // reason, rather than failing after a click.
  const originalImportExportBar = importExportBar;
  importExportBar = function () {
    const bar = originalImportExportBar.apply(this, arguments);
    if (!IMPORT_EXPORT_MOVED) {
      bar.querySelectorAll('button').forEach(b => {
        b.disabled = true;
        b.title = 'Import and export have not moved to the new system yet';
      });
    }
    return bar;
  };
})();
</script>
<script>
/* The service worker (site/app/sw.js): installable, stores nothing. */
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
