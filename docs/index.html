/* ------------------------------------------- SUBCONTRACTOR LEDGER (24 Oct 2026)
 * One running account per subcontractor, as the vendor's. A bill goes in at
 * its full value; advances, payments and retention releases come off it.
 * The balance is split below the figures into payable on bills, retention
 * held and advance not yet recovered, which add up to it.
 */
function subLedWindow() {
  return { from: (document.getElementById('subLedFrom') || {}).value || '',
           to: (document.getElementById('subLedTo') || {}).value || '',
           agreementId: (document.getElementById('subLedAgr') || {}).value || '' };
}

const SUBLED_TONE = { Bill: 'amber', Payment: 'green', Advance: 'blue',
                      'Retention released': 'violet', 'Retention paid': 'green' };

async function loadSubLedger(subId) {
  const host = document.getElementById('subLedger');
  if (!host) return;
  host.innerHTML = UI.loadingState();
  try {
    const d = (await api('getSubcontractorLedger', subId, subLedWindow())).data;
    const s = d.summary;
    document.getElementById('subLedgerSummary').innerHTML =
      `<div class="ledger-figures">
        ${[['Opening', cash(d.openingBalance)],
           ['Billed', cash(s.billed)],
           ['Paid', cash(s.paid)],
           ['Advanced', cash(s.advanced)],
           ['Retention released', cash(s.retentionReleased)],
           ['Balance', cash(s.closingBalance), 'strong'],
           ['Retention held', cash(s.retentionHeld)]]
          .map(t => `<div class="ledger-figure${t[2] ? ' is-total' : ''}">
            <span>${UI.esc(t[0])}</span><strong>${UI.esc(t[1])}</strong></div>`).join('')}
      </div>
      <div class="muted" style="font-size:12.5px;padding:0 16px 10px">
        Balance = payable on approved bills ${cash(s.payableOnBills)}
        − advance not yet recovered ${cash(s.advanceUnrecovered)}.
        Bills are entered after retention; retention held (${cash(s.retentionHeld)}) is not in the balance
        and comes in when it is released.</div>`;
    const rows = [{ opening: true, description: 'Balance brought forward', balance: d.openingBalance }]
      .concat(d.entries);
    UI.table(host, {
      columns: [
        { key: 'date', label: 'Date', width: '96px', render: r => r.opening ? '' : UI.fmt.date(r.date) },
        { key: 'type', label: 'Type', width: '92px', render: r =>
          r.opening ? '' : UI.badge(r.type, SUBLED_TONE[r.type] || 'grey') },
        { key: 'ref', label: 'Reference', width: '130px', render: r =>
          r.opening ? '' : `<span class="mono nowrap">${UI.esc(r.ref)}</span>` +
            (r.document ? `<br><span class="muted">${UI.esc(r.document)}</span>` : '') },
        { key: 'description', label: 'Particulars', render: r =>
          (r.opening ? `<em>${UI.esc(r.description)}</em>` : UI.esc(r.description)) +
          (r.project || r.agreementId ? `<br><span class="muted">${UI.esc([r.agreementId, r.project]
            .filter(Boolean).join(' · '))}</span>` : '') },
        { key: 'debit', label: 'Debit', align: 'right', width: '108px', render: r =>
          r.debit ? UI.fmt.number(r.debit) : '<span class="muted">—</span>' },
        { key: 'credit', label: 'Credit', align: 'right', width: '108px', render: r =>
          r.credit ? UI.fmt.number(r.credit) : '<span class="muted">—</span>' },
        { key: 'balance', label: 'Balance', align: 'right', width: '116px', render: r =>
          `<strong>${UI.fmt.number(r.balance)}</strong>` },
        { key: 'actions', label: '', align: 'right', width: '80px', render: r =>
          r.type === 'Bill' ? `<div class="row-actions"><button class="btn btn-sm"
             data-subbill="${UI.esc(r.ref)}">Open</button></div>` : '' }
      ],
      rows: rows,
      empty: UI.emptyState('Nothing on the account', 'Approved bills and payments appear here.')
    });
    host.querySelectorAll('[data-subbill]').forEach(b => {
      b.onclick = () => navigate('subbill', b.dataset.subbill);
    });
  } catch (e) {
    host.innerHTML = UI.errorState(e.message, 'retrySubLedger');
    const b = document.getElementById('retrySubLedger');
    if (b) b.onclick = () => loadSubLedger(subId);
  }
}

async function exportSubLedger(subId) {
  try {
    const d = (await api('getSubcontractorLedger', subId, subLedWindow())).data;
    const esc = v => {
      const t = String(v === undefined || v === null ? '' : v);
      return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    const lines = [['Date', 'Type', 'Reference', 'Document', 'Project', 'Detail', 'Debit', 'Credit', 'Balance'].join(',')];
    if (d.openingBalance) {
      lines.push(['', 'Opening', '', '', '', 'Balance brought forward', '', '', d.openingBalance].map(esc).join(','));
    }
    d.entries.forEach(e => lines.push([UI.fmt.date(e.date), e.type, e.ref, e.document, e.project, e.description,
      e.debit || '', e.credit || '', e.balance].map(esc).join(',')));
    downloadCsv(`${d.subcontractor.CompanyName.replace(/[^A-Za-z0-9]+/g, '_')}` +
      `${d.agreement ? '_' + d.agreement.AgreementID : ''}_ledger.csv`, lines.join('\n'));
  } catch (e) { UI.error('Could not export the ledger', e.message); }
}

/**
 * Attach an advance that was paid before the agreement existed. Only
 * agreements on the same project are offered — the cash came out of that
 * project's float.
 */
function tagAdvanceDialog(paymentId, d, onDone) {
  const advance = (d.advances || []).find(a => a.SubPaymentID === paymentId);
  if (!advance) return;
  const choices = (d.agreements || [])
    .filter(a => String(a.ProjectID) === String(advance.ProjectID));

  if (!choices.length) {
    UI.error('No agreement to attach it to',
      'There is no agreement with this subcontractor on ' +
      (advance.ProjectName || advance.ProjectID) + ' yet. Prepare the agreement first.');
    return;
  }

  const fields = [
    { name: 'AgreementID', label: 'Recover through', type: 'select', required: true, span: 2,
      options: choices.map(a => ({ value: a.AgreementID,
        label: (a.AgreementNumber || a.AgreementID) + ' — ' + cash(a.ContractValue) +
               (a.Scope ? ' · ' + a.Scope : '') })) }
  ];
  const body = UI.el('div');
  body.innerHTML = `<p class="muted">${UI.esc(advance.SubPaymentID)} — ${cash(advance.Amount)}
    paid ${UI.esc(advance.PaymentDate)} on ${UI.esc(advance.ProjectName || advance.ProjectID)}.
    Once attached it is deducted from the bills on that agreement.</p>`;
  const form = UI.form(fields, {});
  body.appendChild(form);

  UI.modal({
    title: 'Attach advance to an agreement', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Attach', class: 'btn-primary', onClick: async m => {
          const v = UI.validate(form, fields);
          if (!v) return;
          m.busy(true);
          try {
            UI.success((await api('tagSubcontractorAdvance', paymentId, v.AgreementID)).message);
            m.close();
            onDone();
          } catch (e) { m.busy(false); UI.error('Could not attach it', e.message); }
        } }
    ]
  });
}

/* ========================================================== AGREEMENTS */

async function pageAgreements(root, arg) {
  if (arg && arg.projectId) agrState.projectId = arg.projectId;
  root.innerHTML =
    pageHead('Subcontract agreements', 'What each subcontractor is committed to deliver', '') +
    `<div id="agrSummary" class="stat-grid" style="margin-bottom:16px"></div>
     <div class="card">
       <div class="card-head">
         <div class="filters">
           <div class="field"><label for="agrSearch">Search</label>
             <input class="input" id="agrSearch" placeholder="Subcontractor, project, scope"
                    value="${UI.esc(agrState.search)}"></div>
           <div class="field"><label for="agrStatus">Status</label>
             <select class="input" id="agrStatus"></select></div>
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="agrLive"> Live only</label></div>
           <button class="btn" id="agrReset">Reset</button>
         </div>
       </div>
       <div id="agrTable">${UI.loadingState()}</div>
       <div id="agrPager"></div>
     </div>`;
  document.getElementById('agrLive').checked = agrState.liveOnly;
  let debounce;
  document.getElementById('agrSearch').oninput = e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { agrState.search = e.target.value; agrState.page = 1; loadAgreements(); }, 250);
  };
  document.getElementById('agrStatus').onchange = e => { agrState.status = e.target.value; agrState.page = 1; loadAgreements(); };
  document.getElementById('agrLive').onchange = e => { agrState.liveOnly = e.target.checked; agrState.page = 1; loadAgreements(); };
  document.getElementById('agrReset').onclick = () => {
    Object.assign(agrState, { page: 1, search: '', status: '', liveOnly: false }); pageAgreements(root, arg);
  };
  await loadAgreements();
}

async function loadAgreements() {
  const mount = document.getElementById('agrTable');
  if (!mount) return;
  const d = (await api('listAgreements', Object.assign({}, agrState))).data;

  const sel = document.getElementById('agrStatus');
  if (sel && !sel.options.length) {
    sel.innerHTML = '<option value="">All statuses</option>' +
      (d.statuses || []).map(s => `<option${s === agrState.status ? ' selected' : ''}>${s}</option>`).join('');
  }
  document.getElementById('agrSummary').innerHTML = [
    statTile('Agreements', String(d.summary.total), d.summary.active + ' active'),
    statTile('Contracted', cash(d.summary.contracted), ''),
    statTile('Billed', cash(d.summary.billed), 'gross work approved'),
    statTile('Outstanding', cash(d.summary.outstanding), 'net still to pay')
  ].concat(d.summary.advancePaid === undefined ? [] : [
    statTile('Advances', cash(d.summary.advancePaid), cash(d.summary.advanceOutstanding) + ' still to recover')
  ]).join('');

  UI.table(mount, {
    columns: [
      { key: 'AgreementID', label: 'Agreement', width: '105px',
        render: r => `<a href="#" class="link" data-agr="${r.AgreementID}">${r.AgreementID}</a>` },
      // The name opens the subcontractor: details, advances and the statement of account.
      { key: 'SubcontractorName', label: 'Subcontractor', render: r => r.SubcontractorID
          ? `<a href="#" class="link" data-sub="${UI.esc(r.SubcontractorID)}">${UI.esc(r.SubcontractorName || r.SubcontractorID)}</a>`
          : UI.esc(r.SubcontractorName) },
      { key: 'ProjectName', label: 'Project' },
      { key: 'Scope', label: 'Scope' },
      { key: 'ContractValue', label: 'Value', align: 'right', render: r => cash(r.ContractValue) },
      { key: 'BilledValue', label: 'Billed', align: 'right', render: r => cash(r.BilledValue) },
      { key: 'RemainingValue', label: 'Remaining', align: 'right', render: r => cash(r.RemainingValue) },
      { key: 'AdvancePaid', label: 'Advance', align: 'right', render: r =>
          !(Number(r.AdvancePaid) || Number(r.AdvanceOutstanding)) ? '<span class="muted">—</span>'
            : cash(r.AdvancePaid) + (Number(r.AdvanceOutstanding) > 0
                ? `<br><span class="muted">${cash(r.AdvanceOutstanding)} to recover</span>` : '') },
      { key: 'Status', label: 'Status', width: '100px', render: r => UI.badge(r.Status, AGREEMENT_TONE[r.Status]) }
    ],
    rows: d.rows,
    empty: UI.emptyState('No agreements', 'Register a subcontractor first, then raise an agreement.')
  });
  mount.querySelectorAll('[data-agr]').forEach(a => {
    a.onclick = e => { e.preventDefault(); navigate('agreement', a.dataset.agr); };
  });
  mount.querySelectorAll('[data-sub]').forEach(a => {
    a.onclick = e => { e.preventDefault(); navigate('subcontractor', a.dataset.sub); };
  });
  UI.pager(document.getElementById('agrPager'), {
    page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
    onPage: p => { agrState.page = p; loadAgreements(); }
  });
}



/* ================================================ AGREEMENT LINE ITEMS
   A subcontract is normally let on measured rates — so many SFT at so much
   per SFT. These lines are that schedule; every bill measures against them. */

function lineQty(n) {
  const v = Number(n || 0);
  return v.toLocaleString(undefined, { maximumFractionDigits: 3 });
}

/**
 * The line grid: a spreadsheet of Code / Description / UOM / Quantity / Rate.
 * Built once and used both when drawing up an agreement and when editing its
 * scope later, so the two cannot drift apart.
 *
 * Returns { root, collect, recalc, total } — `collect` gives the rows to send.
 */
function lineGrid(items, units, opts) {
  const o = opts || {};
  const rows = (items || []).map(i => ({
    AgreementItemID: i.AgreementItemID, ItemCode: i.ItemCode || '', Description: i.Description || '',
    Unit: i.Unit || '', Quantity: i.Quantity, Rate: i.Rate, Remarks: i.Remarks || '',
    BOQItems: i.BOQItems || '', BOQShare: i.BOQShare === null || i.BOQShare === undefined ? '' : i.BOQShare,
    locked: Number(i.PreviousQty || 0) > 0, billed: Number(i.PreviousQty || 0)
  }));

  const root = UI.el('div');
  root.innerHTML =
    `<div class="table-wrap">
       <table class="lines">
         <thead><tr>
           <th style="width:110px">Code</th>
           <th>Description</th>
           <th style="width:92px">UOM</th>
           <th class="num" style="width:110px">Quantity</th>
           <th class="num" style="width:110px">Rate</th>
           <th class="num" style="width:130px">Amount</th>
           <th style="width:34px"></th>
         </tr></thead>
         <tbody id="lineRows"></tbody>
         <tfoot><tr>
           <td colspan="5" style="text-align:right">${UI.esc(o.totalLabel || 'Agreement value')}</td>
           <td class="num" id="lineTotal">—</td><td></td>
         </tr></tfoot>
       </table>
     </div>
     <button class="btn mt-8" type="button" id="lineAdd">+ Add line</button>
     <datalist class="boq-codes"></datalist>
     <p class="muted boq-note" style="display:none;margin:8px 0 0;font-size:12.5px">Pick a BOQ item as the code and
       its quantity is tracked against the BOQ under Budget &rarr; Trade works (Sft against Sqm and the like is converted).
       A line agreed by area for several items (tiling, plaster, wiring...): use <strong>Covers BOQ items</strong>.</p>`;

  const tbody = root.querySelector('#lineRows');
  // The project's BOQ items, offered as codes (13 Nov 2026): a line coded with a
  // BOQ item counts toward it in the budget's Works view.
  const listId = 'boqCodes' + Math.random().toString(36).slice(2, 8);
  const dl = root.querySelector('.boq-codes');
  dl.id = listId;
  let boqByCode = new Map(), boqList = [], boqLinks = false;
  const setBoq = (list, links) => {
    boqList = list || [];
    boqLinks = !!links && boqList.length > 0;
    tbody.querySelectorAll('.cover-btn').forEach(b => { b.style.display = boqLinks ? '' : 'none'; });
    boqByCode = new Map((list || []).map(b => [String(b.ItemCode).trim().toLowerCase(), b]));
    dl.innerHTML = (list || []).map(b => `<option value="${UI.esc(b.ItemCode)}">${UI.esc(
      (b.Category ? b.Category + ' · ' : '') + b.Description + ' (' + lineQty(b.EffectiveQuantity ?? b.Quantity) + ' ' + b.Unit + ')')}</option>`).join('');
    root.querySelector('.boq-note').style.display = boqByCode.size ? '' : 'none';
  };
  const fromBoq = tr => {
    const code = tr.querySelector('[data-f=ItemCode]');
    const b = boqByCode.get(code.value.trim().toLowerCase());
    code.title = b ? 'BOQ ' + b.ItemCode + ': ' + lineQty(b.EffectiveQuantity ?? b.Quantity) + ' ' + b.Unit : '';
    if (!b) return;
    const desc = tr.querySelector('[data-f=Description]');
    if (!desc.value.trim()) desc.value = String(b.Description || '').slice(0, 200);
    const unit = tr.querySelector('[data-f=Unit]');
    if (!unit.value && !unit.disabled && Array.from(unit.options).some(o => o.value === b.Unit)) unit.value = b.Unit;
  };
  const totalCell = root.querySelector('#lineTotal');
  const unitOptions = u => units.map(x =>
    `<option value="${UI.esc(x)}"${x === u ? ' selected' : ''}>${UI.esc(x)}</option>`).join('');

  const recalc = () => {
    let total = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const q = Number(tr.querySelector('[data-f=Quantity]').value || 0);
      const r = Number(tr.querySelector('[data-f=Rate]').value || 0);
      const amt = q * r;
      total += amt;
      tr.querySelector('.line-amount').textContent = amt ? cash(amt) : '—';
    });
    totalCell.textContent = cash(total);
    if (o.onChange) o.onChange(total);
    return total;
  };

  const addRow = (row) => {
    const tr = UI.el('tr');
    const locked = !!row.locked;
    tr.dataset.id = row.AgreementItemID || '';
    tr.innerHTML =
      `<td><input class="input" data-f="ItemCode" value="${UI.esc(row.ItemCode)}" placeholder="BW-01" list="${listId}"
                  autocomplete="off">
            <button type="button" class="btn btn-ghost btn-sm cover-btn" style="display:${boqLinks ? '' : 'none'};padding:2px 4px;
              font-size:11.5px;white-space:normal;text-align:left;height:auto">Covers BOQ items</button>
            <div class="muted cover-sum" style="font-size:11.5px"></div></td>
       <td><input class="input" data-f="Description" value="${UI.esc(row.Description)}"
                  placeholder="Block work 8&quot;"></td>
       <td><select class="input" data-f="Unit"${locked ? ' disabled' : ''}>
             <option value="">—</option>${unitOptions(row.Unit)}</select></td>
       <td><input class="input" type="number" step="any" min="0" data-f="Quantity"
                  value="${row.Quantity === undefined ? '' : row.Quantity}"></td>
       <td><input class="input" type="number" step="any" min="0" data-f="Rate"${o.ratesLocked || (locked && !o.billedRates) ? ' readonly' : ''}
                  title="${o.ratesLocked ? 'Approved agreement: only an administrator can change a rate' : ''}"
                  value="${row.Rate === undefined ? '' : row.Rate}"></td>
       <td class="num"><span class="line-amount">—</span></td>
       <td><button class="line-drop" type="button" title="${locked
             ? lineQty(row.billed) + ' ' + UI.esc(row.Unit) + ' already billed — this line cannot be removed'
             : 'Remove this line'}"${locked ? ' disabled' : ''}>×</button></td>`;
    tbody.appendChild(tr);
    tr.querySelectorAll('input,select').forEach(i => { i.oninput = recalc; i.onchange = recalc; });
    tr.querySelector('[data-f=ItemCode]').onchange = () => { fromBoq(tr); recalc(); };
    tr.dataset.covers = row.BOQItems || '';
    tr.dataset.share = row.BOQShare === undefined || row.BOQShare === null ? '' : String(row.BOQShare);
    showCover(tr);
    tr.querySelector('.cover-btn').onclick = () => coverPicker(tr);
    const drop = tr.querySelector('.line-drop');
    if (!locked) drop.onclick = () => { tr.remove(); recalc(); };
  };

  /** The summary under a line's code: what it covers, and its share. */
  function showCover(tr) {
    const list = (tr.dataset.covers || '').split(',').map(x => x.trim()).filter(Boolean);
    const btn = tr.querySelector('.cover-btn');
    tr.querySelector('.cover-sum').textContent = list.length
      ? 'Covers ' + (list.length > 3 ? list.length + ' BOQ items' : list.join(', ')) +
        (tr.dataset.share && Number(tr.dataset.share) !== 100 ? ' · ' + tr.dataset.share + '%' : '') : '';
    if (btn) btn.textContent = list.length ? 'Change covered items' : 'Covers BOQ items';
  }

  /** Choose the BOQ items one line covers, e.g. a tiling or wiring line agreed by area. */
  function coverPicker(tr) {
    const chosen = new Set((tr.dataset.covers || '').split(',').map(x => x.trim().toLowerCase()).filter(Boolean));
    const trades = [...new Set(boqList.map(b => b.Category || ''))].filter(Boolean).sort();
    const body = UI.el('div');
    body.innerHTML = `
      <p class="muted" style="margin:0 0 10px;font-size:13px">The BOQ items this line's work covers. On Budget &rarr; Trade works
        each one counts its scope x the share below as given to this subcontractor, and is measured in proportion to the
        quantity billed on this line (bill a quarter of the line, a quarter of each item). Units need not match.</p>
      <div class="filters" style="margin-bottom:8px">
        <div class="field"><label>Trade</label><select class="input cp-trade"><option value="">All trades</option>
          ${trades.map(t => `<option value="${UI.esc(t)}">${UI.esc(t)}</option>`).join('')}</select></div>
        <div class="field"><label>Search</label><input class="input cp-search" placeholder="Code or description"></div>
        <div class="field"><label>Share of their scope (%)</label><input class="input cp-share" type="number" min="1" max="100"
          step="any" value="${UI.esc(tr.dataset.share || '100')}" style="max-width:110px"></div>
      </div>
      <div class="flex gap-8" style="margin-bottom:6px"><button type="button" class="btn btn-sm cp-all">Tick all shown</button>
        <button type="button" class="btn btn-sm cp-none">Untick all shown</button><span class="muted cp-count" style="align-self:center"></span></div>
      <div class="cp-list" style="max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:6px"></div>`;
    const list = body.querySelector('.cp-list');
    const shown = () => {
      const t = body.querySelector('.cp-trade').value, q = body.querySelector('.cp-search').value.trim().toLowerCase();
      return boqList.filter(b => (!t || b.Category === t) &&
        (!q || (b.ItemCode + ' ' + b.Description).toLowerCase().indexOf(q) !== -1));
    };
    const draw = () => {
      list.innerHTML = shown().map(b => `<label style="display:flex;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);
          align-items:flex-start;font-size:13px"><input type="checkbox" data-code="${UI.esc(b.ItemCode)}"
          ${chosen.has(String(b.ItemCode).toLowerCase()) ? 'checked' : ''} style="margin-top:3px">
          <span><strong class="mono">${UI.esc(b.ItemCode)}</strong> ${UI.esc(String(b.Description || '').slice(0, 110))}
          <span class="muted"> · ${lineQty(b.EffectiveQuantity ?? b.Quantity)} ${UI.esc(b.Unit)}</span></span></label>`).join('') ||
        '<div class="muted" style="padding:10px">Nothing matches.</div>';
      list.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => {
        const k = c.dataset.code.toLowerCase(); if (c.checked) chosen.add(k); else chosen.delete(k); count();
      });
      count();
    };
    const count = () => { body.querySelector('.cp-count').textContent = chosen.size + ' chosen'; };
    body.querySelector('.cp-trade').onchange = draw;
    body.querySelector('.cp-search').oninput = draw;
    body.querySelector('.cp-all').onclick = () => { shown().forEach(b => chosen.add(String(b.ItemCode).toLowerCase())); draw(); };
    body.querySelector('.cp-none').onclick = () => { shown().forEach(b => chosen.delete(String(b.ItemCode).toLowerCase())); draw(); };
    draw();
    UI.modal({
      title: 'BOQ items this line covers', size: 'wide', body,
      footer: [
        { label: 'Cancel', onClick: m => m.close() },
        { label: 'Use these', class: 'btn-primary', onClick: m => {
          const share = body.querySelector('.cp-share').value.trim();
          const n = Number(share);
          if (share && (!(n > 0) || n > 100)) { UI.warn('Share', 'Give a share more than 0 and at most 100.'); return; }
          tr.dataset.covers = boqList.filter(b => chosen.has(String(b.ItemCode).toLowerCase())).map(b => b.ItemCode).join(', ');
          tr.dataset.share = tr.dataset.covers && share && n !== 100 ? share : '';
          showCover(tr);
          m.close();
        } }
      ]
    });
  }

  const blank = { ItemCode: '', Description: '', Unit: '', Quantity: '', Rate: '' };
  rows.forEach(addRow);
  if (!rows.length) addRow(blank);
  recalc();
  root.querySelector('#lineAdd').onclick = () => { addRow(blank); recalc(); };

  const collect = () => Array.from(tbody.querySelectorAll('tr')).map(tr => {
    const get = f => tr.querySelector('[data-f=' + f + ']');
    const out = {
      ItemCode: get('ItemCode').value.trim(),
      Description: get('Description').value.trim(),
      Unit: get('Unit').value,
      Quantity: get('Quantity').value,
      Rate: get('Rate').value
    };
    if (tr.dataset.id) out.AgreementItemID = tr.dataset.id;
    if (boqLinks || tr.dataset.covers) { out.BOQItems = tr.dataset.covers || ''; out.BOQShare = tr.dataset.share || ''; }
    // A row nobody touched is not a line.
    const empty = !out.ItemCode && !out.Description && !out.Unit && !out.Quantity && !out.Rate;
    return empty && !tr.dataset.id ? null : out;
  }).filter(Boolean);

  if (o.boq) setBoq(o.boq);
  return { root, collect, recalc, setBoq: r => setBoq(r && r.rows ? r.rows : r, r && r.links) };
}

/** A project's BOQ items, for coding agreement lines, and whether the server takes covering lines. */
async function boqItemsFor(projectId) {
  if (!projectId) return { rows: [], links: false };
  try {
    const d = (await api('listBOQ', projectId, { pageSize: 1000 })).data;
    return { rows: d.rows || [], links: !!d.boqLinks };
  } catch (e) { return { rows: [], links: false }; }
}

function agreementLinesEditor(agreementId, items, units, onSaved, rates) {
  const r = rates || {};
  const body = UI.el('div');
  body.innerHTML =
    `<p class="muted" style="margin:0 0 12px;font-size:13px">
       Each line is measured separately. A line that has already been billed keeps its unit, and its
       quantity can only grow.</p>` +
    (r.locked
      ? `<div class="banner banner-warn" style="margin:0 0 12px">This agreement is approved: only an administrator can
           change a rate or price a new line.</div>`
      : r.approved
        ? `<div class="banner" style="margin:0 0 12px">Changing the rate of a line already billed: the difference on the
             quantity billed so far is added to (or taken off) the next bill as a <strong>rate revision</strong>.
             Bills already approved stay as they are.</div>`
        : '');
  const grid = lineGrid(items, units, { ratesLocked: !!r.locked, billedRates: !!r.approved && !r.locked });
  body.appendChild(grid.root);
  if (r.projectId) boqItemsFor(r.projectId).then(grid.setBoq);
  body.appendChild(UI.el('div', { id: 'lineError' }));

  UI.modal({
    title: 'Scope and rates — ' + agreementId, size: 'xwide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Save lines', class: 'btn-primary', onClick: async m => {
          m.busy(true);
          try {
            const res = await api('saveAgreementItems', agreementId, grid.collect());
            UI.success(res.message);
            m.close();
            if (onSaved) onSaved(res.data);
          } catch (e) {
            m.busy(false);
            document.getElementById('lineError').innerHTML =
              '<div class="banner banner-error mt-8">' + UI.esc(e.message) + '</div>';
          }
        } }
    ]
  });
}

async function agreementForm(existing, subId, onSaved, fixedProjectId) {
  // Every project that is still open, not only the active ones — a subcontract
  // is often signed while the project is in Planning or Tender.
  const projects = (await api('listProjects', { pageSize: 200 })).data.rows
    .filter(p => String(p.Status) !== 'Closed');
  const subs = (await api('listSubcontractors', { pageSize: 200 })).data.rows;
  const units = (App.enums && App.enums.UNITS) || [];

  const isNew = !existing;
  const values = existing ? Object.assign({}, existing) : {
    SubcontractorID: subId || '', ProjectID: fixedProjectId || '',
    Basis: 'measured',
    RetentionPercent: App.settings['finance.defaultRetentionPercent'] || 10
  };

  const fields = [
    { name: 'ProjectID', label: 'Project', type: 'select', required: true,
      options: projects.map(p => ({ value: p.ProjectID,
        label: p.ProjectID + ' — ' + p.ProjectName +
               (p.Status === 'Active' ? '' : ' (' + p.Status + ')') })),
      readonly: !!existing,
      hint: projects.length ? '' : 'No open projects — create one first' },
    { name: 'SubcontractorID', label: 'Subcontractor', type: 'select', required: true,
      options: subs.map(x => ({ value: x.SubcontractorID, label: x.CompanyName + ' (' + x.Trade + ')' })),
      readonly: !!existing },
    { name: 'Scope', label: 'Scope of work', required: true, type: 'textarea', span: 2 }
  ].concat(isNew ? [
    { name: 'Basis', label: 'How is this subcontract billed?', type: 'select', required: true, span: 2,
      options: [{ value: 'measured', label: 'Measured — quantity × rate per line (SFT, Cft, Nos…)' },
                { value: 'lump', label: 'Lump sum — one agreed figure' }],
      hint: 'Measured lets every bill be measured against the lines below' }
  ] : []).concat([
    { name: 'ContractValue', label: 'Contract value', type: 'number',
      required: !isNew && !(existing && existing.IsMeasured),
      hint: existing && existing.IsMeasured
        ? 'Set by the measured lines — change it under Scope & rates'
        : 'Set by the lines below when the subcontract is measured',
      readonly: !!(existing && existing.IsMeasured) },
    { name: 'RetentionPercent', label: 'Retention %', type: 'number' },
    { name: 'AdvanceAmount', label: 'Advance paid', type: 'number',
      hint: 'Recovered from bills as work is done' },
    { name: 'StartDate', label: 'Start date', type: 'date', required: true },
    { name: 'EndDate', label: 'End date', type: 'date', required: true },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ]);

  const body = UI.el('div');
  const form = UI.form(fields, values);
  body.appendChild(form);

  // On a new agreement the scope is entered here, as lines, rather than in a
  // second visit to the record.
  let grid = null, gridWrap = null;
  const valueField = form.querySelector('[name="ContractValue"]');
  const basisField = form.querySelector('[name="Basis"]');

  if (isNew) {
    gridWrap = UI.el('div');
    gridWrap.innerHTML = `<h4 style="margin:18px 0 6px;font-size:13px">Scope and rates</h4>`;
    grid = lineGrid([], units, {
      onChange: total => {
        if (valueField) {
          valueField.value = total ? total : '';
          valueField.setAttribute('readonly', 'readonly');
        }
      }
    });
    gridWrap.appendChild(grid.root);
    body.appendChild(gridWrap);

    const applyBasis = () => {
      const measured = basisField.value === 'measured';
      gridWrap.style.display = measured ? '' : 'none';
      const valueRow = valueField.closest('.field') || valueField.parentElement;
      if (valueRow) valueRow.style.display = measured ? 'none' : '';
      if (measured) { grid.recalc(); }
      else { valueField.removeAttribute('readonly'); }
    };
    basisField.onchange = applyBasis;
    applyBasis();
    // The chosen project's BOQ items are offered as line codes.
    const projField = form.querySelector('[name="ProjectID"]');
    const loadBoq = () => boqItemsFor(projField && projField.value).then(grid.setBoq);
    if (projField) projField.addEventListener('change', loadBoq);
    loadBoq();
  }

  UI.modal({
    title: existing ? 'Edit ' + existing.AgreementID : 'New subcontract agreement',
    size: isNew ? 'xwide' : '', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Save', class: 'btn-primary', onClick: async m => {
          const measured = isNew && basisField.value === 'measured';
          // The value comes from the lines, so it is not a field the user answers.
          const check = measured ? fields.filter(f => f.name !== 'ContractValue') : fields;
          const data = UI.validate(form, check);
          if (!data) return;
          if (measured) {
            data.items = grid.collect();
            delete data.ContractValue;
            if (!data.items.length) {
              UI.warn('Add at least one line with a quantity and a rate.');
              return;
            }
          }
          m.busy(true);
          try {
            const res = existing
              ? await api('updateAgreement', existing.AgreementID, data)
              : await api('createAgreement', data.ProjectID, data);
            UI.success(res.message);
            m.close();
            if (onSaved) onSaved(res.data);
          } catch (e) { m.busy(false); UI.error('Could not save', e.message); }
        } }
    ]
  });
}

function subRecoveryForm(agreementId, d, onSaved) {

    approves it; it is then taken off this agreement's next bills until recovered.</p>`;

async function subBillForm(agreementId, agreementData, onSaved, existing) {
  const p = agreementData.position, a = agreementData.agreement;
  const editing = !!existing;
  const mine = {};
  if (editing) {
    (existing.items || []).forEach(i => { mine[String(i.AgreementItemID)] = Number(i.CurrentQty) || 0; });
  }
  const allItems = (agreementData.items || []).map(i => {
    const own = mine[String(i.AgreementItemID)] || 0;
    if (!own) return i;
    return Object.assign({}, i, {
      PreviousQty: Number(i.PreviousQty) - own,
      BalanceQty: Number(i.BalanceQty) + own,
      PreviousAmount: Number(i.PreviousAmount || 0) - own * Number(i.Rate || 0)
    });
  });
  const measured = allItems.filter(i => Number(i.BalanceQty) > 0 || Number(i.PreviousQty) > 0);
  const isMeasured = allItems.length > 0;
  // Approved recovery notes still to come off (12 Nov 2026); a bill being corrected gets its own back.
  const recAvail = Number(agreementData.recoveryPendingTotal || 0) + (editing ? Number(existing.bill.OtherRecovery || 0) : 0);
  // Owed (or to come back) on work billed before a rate changed: it goes on this bill.
  const revisions = allItems.filter(i => Number(i.RateDifference || 0) !== 0);
  const revisionTotal = revisions.reduce((t, i) => t + Number(i.RateDifference), 0);

  const fields = [
    { name: 'PeriodFrom', label: 'Period from', type: 'date', required: true },
    { name: 'PeriodTo', label: 'Period to', type: 'date', required: true }
  ].concat(isMeasured ? [] : [
    { name: 'GrossAmount', label: 'Value of work done this period', type: 'number', required: true,
      hint: 'At most ' + cash(p.remaining) + ' is left of the agreement' }
  ]).concat([
    { name: 'AdvanceRecovery', label: 'Advance recovery', type: 'number',
      hint: p.advanceOutstanding > 0
        ? 'Leave blank to recover the standard share. ' + cash(p.advanceOutstanding) + ' outstanding.'
        : 'No advance outstanding' },
  ]).concat(!('recoveryPendingTotal' in agreementData) ? [] : [
    { name: 'OtherRecovery', label: 'Recovery (damage / wastage / penalty)', type: 'number',
      hint: recAvail > 0 ? 'Leave blank to recover the approved notes, ' + cash(recAvail) + ', up to what this bill leaves payable.'
        : 'No approved recovery notes outstanding' }
  ]).concat([
    { name: 'TaxPercent', label: 'Tax %', type: 'number', value: 0 },
    { name: 'BillDate', label: 'Bill date', type: 'date', value: new Date().toISOString().slice(0, 10) }
  ]);

  const body = UI.el('div');
  const seed = editing ? {
    PeriodFrom: (existing.bill.PeriodFrom || '').slice(0, 10),
    PeriodTo: (existing.bill.PeriodTo || '').slice(0, 10),
    GrossAmount: existing.bill.GrossAmount,
    AdvanceRecovery: existing.bill.AdvanceRecovery,
    OtherRecovery: existing.bill.OtherRecovery || '',
    TaxPercent: existing.bill.TaxPercent,
    BillDate: (existing.bill.BillDate || '').slice(0, 10)
  } : {};
  const form = UI.form(fields, seed);
  body.appendChild(form);

  // The measurement sheet: what was done this period, line by line.
  let sheet = null;
  if (isMeasured) {
    sheet = UI.el('div');
    sheet.innerHTML =
      `<h4 style="margin:18px 0 6px;font-size:13px">Measurement for this period</h4>
       <div class="table-wrap">
         <table class="lines">
           <thead><tr>
             <th>Line</th><th style="width:56px">UOM</th>
             <th class="num" style="width:96px">Contract</th>
             <th class="num" style="width:96px">Previous</th>
             <th class="num" style="width:110px">This bill</th>
             <th class="num" style="width:96px">Cumulative</th>
             <th class="num" style="width:90px">Rate</th>
             <th class="num" style="width:120px">Amount</th>
           </tr></thead>
           <tbody>${measured.map(i => `
             <tr data-id="${UI.esc(i.AgreementItemID)}">
               <td>${UI.esc(i.Description)}${i.ItemCode
                 ? ' <span class="muted">· ' + UI.esc(i.ItemCode) + '</span>' : ''}${i.BOQItems
                 ? '<br><span class="muted" style="font-size:12px">Covers ' + UI.esc(i.BOQItems) +
                   (i.BOQShare ? ' · ' + UI.esc(i.BOQShare) + '%' : '') + '</span>' : ''}</td>
               <td>${UI.esc(i.Unit)}</td>
               <td class="num">${lineQty(i.Quantity)}</td>
               <td class="num">${lineQty(i.PreviousQty)}</td>
               <td><input class="input" type="number" step="any" min="0" max="${i.BalanceQty}"
                          data-qty value="${mine[String(i.AgreementItemID)] || ''}" placeholder="0"
                          title="${lineQty(i.BalanceQty)} ${UI.esc(i.Unit)} still to do"></td>
               <td class="num" data-cum>${lineQty(i.PreviousQty)}</td>
               <td class="num">${cash(i.Rate)}</td>
               <td class="num" data-amt>—</td>
             </tr>`).join('')}</tbody>
         </table>
       </div>
       <div id="sheetWarn"></div>` +
      (revisions.length
        ? `<h4 style="margin:18px 0 6px;font-size:13px">Rate revision on work billed earlier</h4>
           <div class="table-wrap"><table class="lines"><tbody>${revisions.map(i => `
             <tr><td>${UI.esc(i.Description)} <span class="muted">· ${lineQty(i.PreviousQty)} ${UI.esc(i.Unit)} billed earlier,
               now at ${cash(i.Rate)}</span></td>
               <td class="num" style="width:140px"><strong>${Number(i.RateDifference) < 0 ? '−' : '+'}${cash(Math.abs(i.RateDifference))}</strong></td></tr>`).join('')}
           </tbody></table></div>
           <p class="muted" style="font-size:12.5px;margin:6px 0 0">Added to this bill automatically: the rate changed after
             that work was billed. Approved bills stay as they were.</p>`
        : '');
    body.appendChild(sheet);
  }

  const preview = UI.el('div', { class: 'totals-strip', id: 'billPreview' });
  body.appendChild(preview);

  const readSheet = () => (measured || []).map((i, idx) => {
    const tr = sheet.querySelectorAll('tbody tr')[idx];
    return { AgreementItemID: i.AgreementItemID, CurrentQty: tr.querySelector('[data-qty]').value };
  }).filter(r => Number(r.CurrentQty) > 0);

  const recalc = () => {
    const v = UI.readForm(form);
    let gross;
    if (isMeasured) {
      gross = 0;
      const warn = [];
      measured.forEach((i, idx) => {
        const tr = sheet.querySelectorAll('tbody tr')[idx];
        const qty = Number(tr.querySelector('[data-qty]').value || 0);
        const amt = qty * Number(i.Rate || 0);
        gross += amt;
        tr.querySelector('[data-amt]').textContent = amt ? cash(amt) : '—';
        tr.querySelector('[data-cum]').textContent = lineQty(Number(i.PreviousQty) + qty);
        if (qty > Number(i.BalanceQty)) {
          warn.push(i.Description + ': only ' + lineQty(i.BalanceQty) + ' ' + i.Unit + ' left to bill');
        }
      });
      sheet.querySelector('#sheetWarn').innerHTML = warn.length
        ? '<div class="banner banner-warn mt-8">' + warn.map(UI.esc).join('<br>') + '</div>' : '';
      gross += revisionTotal;
    } else {
      gross = Number(v.GrossAmount || 0);
    }
    const retention = gross * Number(a.RetentionPercent || 0) / 100;
    const advance = (v.AdvanceRecovery === '' || v.AdvanceRecovery === undefined)
      ? Math.min(p.advanceOutstanding,
          gross * Number(App.settings['finance.advanceRecoveryPercent'] || 20) / 100)
      : Number(v.AdvanceRecovery || 0);
    const tax = gross * Number(v.TaxPercent || 0) / 100;
    const before = gross - retention - advance + tax;
    const other = (v.OtherRecovery === '' || v.OtherRecovery === undefined)
      ? Math.max(0, Math.min(recAvail, before)) : Number(v.OtherRecovery || 0);
    const net = before - other;
    preview.innerHTML =
      '<div><span>Work done</span><span id="billGross">' + cash(gross) + '</span></div>' +
      '<div><span>Less retention (' + Number(a.RetentionPercent || 0) + '%)</span>' +
        '<span id="billRet">−' + cash(retention) + '</span></div>' +
      '<div><span>Less advance recovery</span><span id="billAdv">−' + cash(advance) + '</span></div>' +
      (tax ? '<div><span>Plus tax</span><span>+' + cash(tax) + '</span></div>' : '') +
      (other ? '<div><span>Less recovery (damage / penalty)</span><span id="billOther">−' + cash(other) + '</span></div>' : '') +
      '<div class="grand"><span>Net payable</span>' +
        '<strong id="billNet">' + cash(net) + '</strong></div>' +
      (gross > p.remaining
        ? '<div class="banner banner-warn mt-8" id="billOver">This is more than the ' + cash(p.remaining) +
          ' left on the agreement and will be refused.</div>' : '');
  };
  form.querySelectorAll('input').forEach(i => { i.oninput = recalc; });
  if (sheet) sheet.querySelectorAll('[data-qty]').forEach(i => { i.oninput = recalc; });
  recalc();

  UI.modal({
    title: editing ? 'Correct ' + existing.bill.SubBillID : 'New subcontractor bill',
    size: isMeasured ? 'xwide' : '', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: editing ? 'Save changes' : 'Create draft', class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          if (isMeasured) {
            data.items = readSheet();
            if (!data.items.length && !(revisionTotal > 0)) {
              UI.warn('Enter the quantity done this period against at least one line.');
              return;
            }
          }
          m.busy(true);
          try {
            const res = editing
              ? await api('updateSubcontractorBill', existing.bill.SubBillID, data)
              : await api('createSubcontractorBill', agreementId, data);
            UI.success(res.message);
            m.close();
            if (onSaved) onSaved(res.data);
          } catch (e) {
            m.busy(false);
            UI.error(editing ? 'Could not save the bill' : 'Could not create the bill', e.message);
          }
        } }
    ]
  });
}

function decideSubBillDialog(billId, action) {
  const verb = { APPROVE: 'Approve', RETURN: 'Return for correction', REJECT: 'Reject' }[action];
  const needsReason = action !== 'APPROVE';
  const fields = [{ name: 'Comments', label: needsReason ? 'Reason (required)' : 'Comments',
                    type: 'textarea', required: needsReason, span: 2 }];
  const body = UI.el('div');
  const form = UI.form(fields, {});
  body.appendChild(form);
  UI.modal({
    title: verb + ' bill', size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: verb, class: action === 'REJECT' ? 'btn-danger' : 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          m.busy(true);
          try {
            UI.success((await api('decideSubcontractorBill', billId, action, data.Comments || '')).message);
            m.close();
            navigate('subbill', billId);
          } catch (e) { m.busy(false); UI.error('Could not record the decision', e.message); }
        } }
    ]
  });
}


function subPaymentDialog(billId, outstanding) {
  const fields = [
    { name: 'Amount', label: 'Amount', type: 'number', required: true,
      hint: cash(outstanding) + ' is outstanding' },
    { name: 'PaymentDate', label: 'Payment date', type: 'date', required: true,
      value: new Date().toISOString().slice(0, 10) },
    // Method and Reference: the names the server reads. The original screen
    // sent PaymentMethod / ReferenceNo, so every bill payment was stored as a
    // bank transfer with no reference (found 24 Oct 2026).
    { name: 'Method', label: 'Method', type: 'select',
      options: ['Bank transfer', 'Cheque', 'Cash', 'Online'] },
    ...bankFieldFor(), { name: 'Reference', label: 'Cheque / transfer number' },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, { Amount: outstanding });
  body.appendChild(form);
  const warn = UI.el('div', { class: 'banner banner-warn mt-8 hidden', id: 'payWarn',
    text: 'That is more than the outstanding balance and will be refused.' });
  body.appendChild(warn);
  form.querySelector('[name="Amount"]').oninput = e => {
    warn.classList.toggle('hidden', Number(e.target.value || 0) <= outstanding + 0.005);
  };

  UI.modal({
    title: 'Record a payment', size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Record payment', class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          m.busy(true);
          try {
            UI.success((await api('recordSubcontractorPayment', billId, data)).message);
            m.close();
            navigate('subbill', billId);
          } catch (e) { m.busy(false); UI.error('Could not record the payment', e.message); }
        } }
    ]
  });
}

  TRANSFER_IN: 'Transfer in', TRANSFER_OUT: 'Transfer out', ADJUSTMENT: 'Adjustment'
};
const CASH_REPORT_TONE = {
  Draft: 'muted', Submitted: 'info', Returned: 'warn', Approved: 'good', Rejected: 'bad'
};
const CASH_ACCOUNT_TONE = { Active: 'good', Suspended: 'warn', Closed: 'muted' };

async function pageCash(root) {
  root.innerHTML = pageHead('Working cash', 'Site floats, what is in them and what has been spent',
    `<button class="btn" id="cashReportsBtn">Period reports</button>
     <button class="btn btn-primary hidden" id="newFloatBtn">+ New float</button>`) +

async function loadCashAccounts() {
  const host = document.getElementById('cashTable');
  host.innerHTML = UI.loadingState('Loading floats…');
  const d = (await api('listCashAccounts', { pageSize: 100 })).data;

  document.getElementById('cashTotals').innerHTML =
    statTile('Floats', String(d.totals.accounts), 'open on site') +
    statTile('Cash held', cash(d.totals.cashHeld), 'across all custodians') +
    statTile('Unreported entries', String(d.totals.unreported), 'awaiting a period report');

  UI.table(host, {
    columns: [
      { key: 'CashAccountID', label: 'Float', width: '95px',
        render: r => `<a href="#" class="link" data-float="${r.CashAccountID}">${r.CashAccountID}</a>` },
      { key: 'CustodianName', label: 'Held by',
        render: r => UI.esc(r.CustodianName) + (r.IsMine ? ' <span class="muted">· you</span>' : '') },

      { key: 'Balance', label: 'Balance', align: 'right', render: r => cash(r.Balance) },
      { key: 'FloatLimit', label: 'Ceiling', align: 'right',
        render: r => r.FloatLimit ? cash(r.FloatLimit) : '<span class="muted">none</span>' },
      { key: 'Unreported', label: 'Unreported', align: 'right',
        render: r => r.Unreported ? `<strong>${r.Unreported}</strong>` : '<span class="muted">0</span>' },
      { key: 'Status', label: 'Status', width: '100px',
        render: r => UI.badge(r.Status, CASH_ACCOUNT_TONE[r.Status]) }
    ],
    rows: d.rows,
    empty: UI.emptyState('No cash floats yet', d.canManage
      ? 'Open a float to give a site accountant working cash.'
      : 'None has been opened for you yet.')
  });
  host.querySelectorAll('[data-float]').forEach(el => {
    el.onclick = e => { e.preventDefault(); navigate('cash-account', el.dataset.float); };
  });
}

async function cashAccountForm() {
  const projects = (await api('listProjects', { pageSize: 200 })).data.rows
    .filter(p => String(p.Status) !== 'Closed');
  const users = (await api('listUsers', { pageSize: 200 })).data.rows
    .filter(u => String(u.Status) === 'Active');
  const fields = [
    { name: 'ProjectID', label: 'Project', type: 'select', required: true,
      options: projects.map(p => ({ value: p.ProjectID, label: p.ProjectID + ' — ' + p.ProjectName })) },
    { name: 'CustodianUserID', label: 'Held by', type: 'select', required: true,
      options: users.map(u => ({ value: u.UserID, label: u.Name + ' (' + u.Role + ')' })),
      hint: 'Usually the site accountant' },
    { name: 'Name', label: 'Name this float', span: 2, hint: 'Left blank, the custodian and project are used' },
    { name: 'FloatLimit', label: 'Ceiling', type: 'number',
      hint: 'The most the float may hold. 0 for no ceiling' },
    { name: 'OpeningBalance', label: 'Cash already in hand', type: 'number',
      hint: 'Recorded as the opening balance' },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, { FloatLimit: App.settings['cash.defaultFloatLimit'] || '' });
  body.appendChild(form);
  UI.modal({
    title: 'Open a working cash float', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Open float', class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          m.busy(true);
          try {
            const res = await api('createCashAccount', data);
            UI.success(res.message);
            m.close();
            navigate('cash-account', res.data.CashAccountID);
          } catch (e) { m.busy(false); UI.error('Could not open the float', e.message); }
        } }
    ]
  });
}

    actions.push(`<button class="btn" id="cashReportBtn">Draw up report</button>`);
  }
  if (d.canSpend) actions.push(`<button class="btn btn-primary" id="cashSpendBtn">+ Record payment</button>`);

     </div>

         <span class="muted" style="font-size:12.5px">every movement, oldest first</span></div>
       <div id="cashLedger"></div>

       <div class="card">

       <div class="card">
         <div class="card-head"><h3>Advances to staff</h3></div>

          (r.Category ? ` <span class="muted">· ${UI.esc(r.Category)}</span>` : '') +
          // Spent on another of the custodian's projects (11 Nov 2026).

      { key: 'In', label: 'In', align: 'right',

      { key: 'Out', label: 'Out', align: 'right',

      { key: 'Balance', label: 'Balance', align: 'right', render: r => `<strong>${cash(r.Balance)}</strong>` },
      { key: 'ReportID', label: 'Report', width: '95px', render: r => r.ReportID

          // Cash issued from head office prints a payment voucher (14 Nov 2026), once the server can.
          (r.Type === 'ISSUE' && App.settings && 'bankAccounts' in App.settings
            ? `<div class="row-actions"><button class="btn btn-sm" data-txnvoucher="${UI.esc(r.CashTxnID)}">Voucher</button></div>` : '') +
          (r.CanEdit

               data-edittxn="${UI.esc(r.CashTxnID)}">Edit</button></div>`

    rows: d.advances,

  });

  root.querySelectorAll('[data-creport]').forEach(el => {
    el.onclick = e => { e.preventDefault(); navigate('cash-report', el.dataset.creport); };
  });

  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };

async function cashSpendDialog(accountId, d) {
  // A float may pay for each of its holder's projects (owner's request, 11 Nov
  // 2026). The server sends the list; with one project there is nothing to choose.
  const projects = d.projects || [];
  const multi = projects.length > 1;
  const proj = () => {
    const el = document.querySelector('.modal [name="ProjectID"]');
    return (el && el.value) || d.account.ProjectID;
  };
  // Only approved bills with something still owing can be settled from the float.
  const billCache = {};
  const billsFor = async pid => {
    if (!billCache[pid]) {
      try {
        billCache[pid] = (await api('listSubcontractorBills', { projectId: pid, pageSize: 100 }))
          .data.rows.filter(b => b.IsApproved && Number(b.Outstanding) > 0);
      } catch (e) { billCache[pid] = []; }
    }
    return billCache[pid];
  };
  const bills = await billsFor(d.account.ProjectID);
  const advances = (d.advances || []).filter(a => Number(a.Outstanding) > 0);

  // Cash goes to subcontractors before there is a bill, so the firm is picked
  // directly. Agreements are offered per firm, and only this project's.
  const [subRes, agrRes, vndRes] = await Promise.all([
    api('listSubcontractors', { pageSize: 300 }),
    api('listAgreements', { pageSize: 300 }),
    // Vendors for an advance before the invoice (owner's request, 9 Nov 2026).
    api('listVendors', { pageSize: 1000, includeStats: false }).catch(() => ({ data: { rows: [] } }))
  ]);
  const vendors = vndRes.data.rows.filter(v => String(v.Status) !== 'Blacklisted');
  const subs = subRes.data.rows.filter(x => String(x.Status) !== 'Blacklisted');
  const allAgreements = agrRes.data.rows;

  const fields = (multi ? [
    { name: 'ProjectID', label: 'Project', type: 'select', required: true, span: 2,
      options: projects.map(p => ({ value: p.ProjectID, label: p.ProjectName || p.ProjectID })),
      hint: 'The project this money was spent on. Its expenses are booked there when the report is approved.' }
  ] : []).concat([
    { name: 'Type', label: 'What kind of payment?', type: 'select', required: true, span: 2,
      options: [
        { value: 'EXPENSE', label: 'Site expense' },
        { value: 'SUBPAYMENT', label: 'Payment against a subcontractor bill' },
        { value: 'SUBADVANCE', label: 'Advance to a subcontractor (no bill yet)' },
        { value: 'VENDOR_ADVANCE', label: 'Advance to a vendor (no invoice yet)' },
        { value: 'STAFF_ADVANCE', label: 'Advance to labour or an employee' },
        { value: 'ADVANCE_RECOVERY', label: 'Advance settled or returned' },
        { value: 'RETURN', label: 'Cash returned to the office' }
      ] },
    { name: 'Amount', label: 'Amount', type: 'number', required: true,
      hint: cash(d.balance) + ' in hand' },
    { name: 'TxnDate', label: 'Date', type: 'date', required: true,
      value: new Date().toISOString().slice(0, 10) },
    { name: 'Category', label: 'Expense category', type: 'select', options: d.categories || [] },
    { name: 'CostCode', label: 'Cost code' },
    { name: 'SubBillID', label: 'Subcontractor bill', type: 'select',
      options: bills.map(b => ({ value: b.SubBillID,
        label: b.SubBillID + ' — ' + cash(b.Outstanding) + ' outstanding' })),
      hint: bills.length ? '' : 'No approved bills are outstanding on this project' },
    { name: 'SubcontractorID', label: 'Subcontractor', type: 'select',
      options: subs.map(x => ({ value: x.SubcontractorID,
        label: x.CompanyName + (x.Trade ? ' — ' + x.Trade : '') })),
      hint: subs.length ? '' : 'No active subcontractor on file' },
    { name: 'AgreementID', label: 'Against agreement', type: 'select',
      options: [],
      hint: 'Optional. Leave blank if the agreement is not signed yet — ' +
            'you can attach it later from the subcontractor.' },
    { name: 'VendorID', label: 'Vendor', type: 'select',
      options: [{ value: '', label: 'Choose the vendor…' }].concat(vendors.map(v => ({ value: v.VendorID, label: v.CompanyName }))),
      hint: vendors.length ? 'Shows on his ledger as paid; his next invoice is settled against it'
        : 'No vendor to choose: none on file, or your role cannot view vendors' },
    { name: 'POID', label: 'Against purchase order', type: 'select', options: [],
      hint: 'Optional' },
    { name: 'StaffAdvanceID', label: 'Advance being settled', type: 'select',
      options: advances.map(a => ({ value: a.StaffAdvanceID,
        label: a.PersonName + (a.PersonType ? ' (' + a.PersonType.toLowerCase() + ')' : '') + ' — ' +
               cash(a.Outstanding) + ' outstanding' })),
      hint: advances.length ? '' : 'Nothing outstanding' },
    // Labour or employee, always (owner's request, 9 Nov 2026): the labour and
    // salary sheets deduct the advance when it names someone on their register.
    { name: 'PersonType', label: 'Advance to', type: 'select',
      options: [{ value: '', label: 'Labour or employee?' }, { value: 'Labour', label: 'Labour' }, { value: 'Employee', label: 'Employee' }] },
    { name: 'PersonID', label: 'Who', type: 'select', options: [] },
    { name: 'PersonName', label: 'Person receiving it', hint: 'Not on the register: type the name. Link it to him later from his sheet.' },
    { name: 'PayeeName', label: 'Paid to', placeholder: 'Shop, driver, supplier…' },
    { name: 'Description', label: 'What was it for?', type: 'textarea', span: 2 }
  ]);

  const body = UI.el('div');
  const form = UI.form(fields, { Type: 'EXPENSE', ProjectID: d.account.ProjectID });
  body.appendChild(form);

  // Each kind of payment needs a different handful of these fields.
  const SHOW = {
    EXPENSE:          ['Category', 'CostCode', 'PayeeName', 'Description'],
    SUBPAYMENT:       ['SubBillID', 'Description'],
    SUBADVANCE:       ['SubcontractorID', 'AgreementID', 'Description'],
    VENDOR_ADVANCE:   ['VendorID', 'POID', 'Description'],
    STAFF_ADVANCE:    ['PersonType', 'PersonID', 'PersonName', 'Description'],
    ADVANCE_RECOVERY: ['StaffAdvanceID', 'Description'],
    RETURN:           ['Description']
  };
  const typeField = form.querySelector('[name="Type"]');
  const applyType = () => {
    const show = SHOW[typeField.value] || [];
    ['Category', 'CostCode', 'SubBillID', 'SubcontractorID', 'AgreementID', 'StaffAdvanceID',
     'VendorID', 'POID', 'PersonType', 'PersonID', 'PersonName', 'PayeeName', 'Description']
      .forEach(n => {
        const el = form.querySelector('[name="' + n + '"]');
        if (!el) return;
        const row = el.closest('.field') || el.parentElement;
        if (row) row.style.display = show.indexOf(n) === -1 ? 'none' : '';
      });
    if (typeField.value === 'STAFF_ADVANCE') applyPersonId();
  };

  // The register's names for the chosen kind; a name typed only when he is not on it.
  const ptField = form.querySelector('[name="PersonType"]');
  const pidField = form.querySelector('[name="PersonID"]');
  const pnRow = () => { const el = form.querySelector('[name="PersonName"]'); return el.closest('.field') || el.parentElement; };
  const applyPersonId = () => {
    if (typeField.value !== 'STAFF_ADVANCE') return;
    pnRow().style.display = pidField.value ? 'none' : '';
  };
  const peopleCache = {};
  const loadPeople = async () => {
    const t = ptField.value;
    pidField.innerHTML = '<option value="">' + (t ? 'Not on the register' : 'Choose labour or employee first') + '</option>';
    if (t) {
      const key = proj() + '|' + t;
      if (!peopleCache[key]) {
        try { peopleCache[key] = (await api('listPayrollPeople', proj(), t)).data; }
        catch (e) { peopleCache[key] = []; }
      }
      pidField.innerHTML += peopleCache[key].map(p => `<option value="${UI.esc(p.PersonID)}">` +
        UI.esc(p.Name + (p.Detail ? ' — ' + p.Detail : '')) + '</option>').join('');
    }
    applyPersonId();
  };
  ptField.onchange = loadPeople;
  pidField.onchange = applyPersonId;
  loadPeople();

  // A vendor's open orders on this project, for an advance against one.
  const vField = form.querySelector('[name="VendorID"]');
  const poField = form.querySelector('[name="POID"]');
  const poCache = {};
  const applyVendor = async () => {
    poField.innerHTML = '<option value="">Not against an order</option>';
    if (!vField.value) return;
    const pid = proj();
    if (!poCache[pid]) {
      try { poCache[pid] = (await api('listPurchaseOrders', { projectId: pid, pageSize: 500, hideCancelled: true })).data.rows; }
      catch (e) { poCache[pid] = []; }
    }
    poField.innerHTML += poCache[pid].filter(o => String(o.VendorID) === String(vField.value) && o.Status !== 'Cancelled')
      .map(o => `<option value="${UI.esc(o.POID)}">${UI.esc(o.POID + ' — ' + o.Status)}</option>`).join('');
  };
  vField.onchange = applyVendor;
  typeField.onchange = applyType;
  applyType();

  // The agreement list follows the firm: offering another firm's agreement
  // would only be refused by the server.
  const subField = form.querySelector('[name="SubcontractorID"]');
  const agrField = form.querySelector('[name="AgreementID"]');
  const applySub = () => {
    const mine = allAgreements.filter(a => String(a.ProjectID) === String(proj()) &&
      String(a.SubcontractorID) === String(subField.value));
    agrField.innerHTML = '<option value="">Not against an agreement yet</option>' +
      mine.map(a => `<option value="${UI.esc(a.AgreementID)}">` +
        UI.esc((a.AgreementNumber || a.AgreementID) + ' — ' + (a.Scope || a.Status)) +
        '</option>').join('');
    agrField.disabled = !mine.length;
  };
  subField.onchange = applySub;
  applySub();

  // Changing the project re-offers what belongs to it: bills, agreements, orders, people.
  const projField = form.querySelector('[name="ProjectID"]');
  if (projField) projField.onchange = async () => {
    const billField = form.querySelector('[name="SubBillID"]');
    const list = await billsFor(proj());
    billField.innerHTML = list.map(b => `<option value="${UI.esc(b.SubBillID)}">` +
      UI.esc(b.SubBillID + ' — ' + cash(b.Outstanding) + ' outstanding') + '</option>').join('');
    const billRow = billField.closest('.field');
    let hint = billRow && billRow.querySelector('.hint');
    if (!hint && billRow) { hint = UI.el('div', { class: 'hint' }); billRow.appendChild(hint); }
    if (hint) hint.textContent = list.length ? '' : 'No approved bills are outstanding on this project';
    applySub();
    applyVendor();
    loadPeople();
  };

  UI.modal({
    title: 'Record a payment from ' + accountId, body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Record', class: 'btn-primary', onClick: async m => {
          const shown = ['ProjectID', 'Type', 'Amount', 'TxnDate'].concat(SHOW[typeField.value] || []);
          const data = UI.validate(form, fields.filter(f => shown.indexOf(f.name) !== -1));
          if (!data) return;
          data.Type = typeField.value;
          if (data.Type === 'STAFF_ADVANCE' && !data.PersonType) {
            UI.setFieldError(form, 'PersonType', 'Say whether it is labour or an employee'); return;
          }
          if (data.Type === 'STAFF_ADVANCE' && !data.PersonID && !String(data.PersonName || '').trim()) {
            UI.setFieldError(form, 'PersonName', 'Choose him from the register, or type his name'); return;
          }
          if (data.Type === 'VENDOR_ADVANCE' && !data.VendorID) {
            UI.setFieldError(form, 'VendorID', 'Choose the vendor'); return;
          }
          m.busy(true);
          try {
            UI.success((await api('recordCashSpend', accountId, data)).message);
            m.close();
            navigate('cash-account', accountId);
          } catch (e) { m.busy(false); UI.error('Could not record it', e.message); }
        } }
    ]
  });
}

/**
 * Correcting an entry already in the book.
 *
 * What is offered depends on the entry. The detail — what it was for, who
 * took the money, which category it belongs under — is always correctable
 * while the period is open. The amount and date are only correctable on a
 * movement that stands alone; where the figure is shared with a bill, an
 * advance or another float, the form says so instead of letting someone
 * type a number the server will refuse.
 */
async function cashEditDialog(txnId, onDone) {
  let d;
  try { d = (await api('getCashTransaction', txnId)).data; }
  catch (e) { UI.error('Could not open the entry', e.message); return; }

  const t = d.transaction;
  if (!d.canEdit) { UI.error('This entry cannot be changed', d.blockedBy); return; }

  const money = d.canEditAmount;
  const fields = [
    { name: 'Amount', label: 'Amount', type: 'number', required: true,
      hint: money ? '' : d.amountBlockedBy },
    { name: 'TxnDate', label: 'Date', type: 'date', required: true },
    { name: 'Category', label: 'Expense category', type: 'select', options: d.categories || [] },
    { name: 'CostCode', label: 'Cost code' },
    { name: 'PayeeName', label: 'Paid to' },
    { name: 'Description', label: 'What was it for?', type: 'textarea', span: 2 }
  ];

  const body = UI.el('div');
  const head = UI.el('div', { class: 'banner banner-info' });
  head.innerHTML = `<div><strong>${UI.esc(CASH_TYPE_LABEL[t.Type] || t.Type)}</strong>
    · ${UI.esc(t.CashTxnID)}
    ${d.reportId ? ` · in report <span class="mono">${UI.esc(d.reportId)}</span>
        (${UI.esc(d.reportStatus)}), which is restated when you save` : ' · not yet reported'}
    ${d.linkedTo ? `<br>The amount is also held on ${UI.esc(d.linkedTo)}.` : ''}</div>`;
  body.appendChild(head);

  const form = UI.form(fields, {
    Amount: t.Amount, TxnDate: t.TxnDate, Category: t.Category,
    CostCode: t.CostCode, PayeeName: t.PayeeName, Description: t.Description
  });
  body.appendChild(form);

  // Only an expense carries a category; nothing else should be asked for one.
  if (t.Type !== 'EXPENSE') {
    ['Category', 'CostCode'].forEach(n => {
      const el = form.querySelector('[name="' + n + '"]');
      const rowEl = el && (el.closest('.field') || el.parentElement);
      if (rowEl) rowEl.style.display = 'none';
    });
  }
  // A figure that cannot move is shown, not hidden — the custodian still
  // needs to read it while correcting the line around it.
  if (!money) {
    ['Amount', 'TxnDate'].forEach(n => {
      const el = form.querySelector('[name="' + n + '"]');
      if (el) { el.disabled = true; el.classList.add('is-readonly'); }
    });
  }

  UI.modal({
    title: 'Edit ' + txnId, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Save changes', class: 'btn-primary', onClick: async m => {
          const shown = fields.filter(f =>
            (money || ['Amount', 'TxnDate'].indexOf(f.name) === -1) &&
            (t.Type === 'EXPENSE' || ['Category', 'CostCode'].indexOf(f.name) === -1));
          const v = UI.validate(form, shown);
          if (!v) return;
          m.busy(true);
          try {
            UI.success((await api('updateCashTransaction', txnId, v)).message);
            m.close();
            onDone();
          } catch (e) { m.busy(false); UI.error('Could not save it', e.message); }
        } }
    ]
  });
}

  });

async function pageCashReport(root, reportId) {
  if (!reportId) { navigate('cash'); return; }
  const d = (await api('getCashReport', reportId)).data;
  const r = d.report;

  const actions = [`<button class="btn" id="creportBack">← Float</button>`,
                   `<button class="btn" id="creportPrint">Print</button>`];
  if (d.canSubmit) actions.push(`<button class="btn btn-primary" id="creportSubmit">Submit for approval</button>`);
  if (d.canDecide) {
    actions.push(`<button class="btn" id="creportReturn">Return</button>`);
    actions.push(`<button class="btn btn-danger" id="creportReject">Reject</button>`);
    actions.push(`<button class="btn btn-primary" id="creportApprove">Approve</button>`);
  }

  const diff = Number(r.Discrepancy || 0);
  root.innerHTML =
    pageHead(reportId, UI.esc(d.account.CustodianName) + ' · ' +
      UI.fmt.date(r.PeriodFrom) + ' — ' + UI.fmt.date(r.PeriodTo), actions.join(' ')) +
    (diff ? `<div class="banner banner-warn"><div><strong>The cash counted differs by ${cash(diff)}.</strong>
       The ledger says ${cash(r.ClosingBalance)}; ${cash(r.CountedCash)} was counted.</div></div>` : '') +
    `<div class="grid-2">
       <div class="card">
         <div class="card-head"><h3>The period</h3>${UI.badge(r.Status, CASH_REPORT_TONE[r.Status])}</div>
         <div class="card-body">
           <div class="totals-strip">
             <div><span>Opening balance</span><span id="crOpen">${cash(r.OpeningBalance)}</span></div>
             <div><span>Cash issued in</span><span id="crIn">+${cash(r.TotalIn)}</span></div>
             <div><span>Spent (${r.EntryCount} entries)</span><span id="crSpent">−${cash(r.TotalSpent)}</span></div>
             <div><span>Returned to office</span><span>−${cash(r.TotalReturned)}</span></div>
             <div class="grand"><span>Closing balance</span>
               <strong id="crClose">${cash(r.ClosingBalance)}</strong></div>
             ${r.CountedCash ? `<div><span>Counted in hand</span><span id="crCounted">${cash(r.CountedCash)}</span></div>` : ''}
           </div>
         </div>
       </div>
       <div class="card">
         <div class="card-head"><h3>Where it went</h3></div>
         <div id="crCategories"></div>
       </div>
     </div>
     ${(d.byProject || []).length > 1 ? `<div class="card" style="margin-top:16px">
       <div class="card-head"><h3>Spend by project</h3>
         <span class="muted" style="font-size:12.5px">expenses are booked to each project when the report is approved</span></div>
       <div id="crProjects"></div>
     </div>` : ''}
     <div class="card" style="margin-top:16px">
       <div class="card-head"><h3>Every entry in this period</h3></div>
       <div id="crRows"></div>
     </div>
     <div class="card" style="margin-top:16px">
       <div class="card-head"><h3>History</h3></div>
       <div class="card-body" id="crHistory"></div>
     </div>`;

  UI.table(document.getElementById('crCategories'), {
    columns: [
      { key: 'category', label: 'Category' },
      { key: 'amount', label: 'Amount', align: 'right', render: x => cash(x.amount) }
    ],
    rows: d.byCategory,
    empty: UI.emptyState('No expenses', 'This period holds no site expenses.')
  });

  // A float that paid for several projects (owner's request, 11 Nov 2026).
  const projHost = document.getElementById('crProjects');
  if (projHost) {
    const tot = k => d.byProject.reduce((s, x) => s + Number(x[k] || 0), 0);
    UI.table(projHost, {
      columns: [
        { key: 'project', label: 'Project', render: x => UI.esc(x.project) +
            (String(x.projectId) === String(d.account.ProjectID) ? ' <span class="muted">· this float\'s</span>' : '') },
        { key: 'expenses', label: 'Site expenses', align: 'right', render: x => cash(x.expenses) },
        { key: 'payments', label: 'Payments and advances', align: 'right', render: x => cash(x.payments) },
        { key: 'total', label: 'Total', align: 'right', render: x => `<strong>${cash(x.total)}</strong>` }
      ],
      rows: d.byProject.concat([{ project: 'Total', projectId: '', expenses: tot('expenses'),
        payments: tot('payments'), total: tot('total') }])
    });
  }

  UI.table(document.getElementById('crRows'), {
    columns: [
      { key: 'TxnDate', label: 'Date', width: '100px', render: x => UI.fmt.date(x.TxnDate) },
      { key: 'Type', label: 'Movement', width: '165px',
        render: x => UI.esc(CASH_TYPE_LABEL[x.Type] || x.Type) },
      { key: 'Description', label: 'Detail', render: x => UI.esc(x.Description || '') +
          (x.PayeeName ? ` <span class="muted">· ${UI.esc(x.PayeeName)}</span>` : '') +
          // Booked to another project than the float's (11 Nov 2026).
          (x.ProjectName && String(x.ProjectID) !== String(d.account.ProjectID)
            ? `<br><span class="chip">${UI.esc(x.ProjectName)}</span>` : '') },
      { key: 'Category', label: 'Category', width: '130px',
        render: x => x.Category ? UI.esc(x.Category) : '<span class="muted">—</span>' },
      { key: 'Amount', label: 'Amount', align: 'right',
        render: x => x.Signed > 0 ? `<span class="num-pos">+${cash(x.Amount)}</span>`
                                  : `<span class="num-neg">−${cash(x.Amount)}</span>` }
    ],
    rows: d.rows,
    empty: UI.emptyState('Empty', '')
  });

  renderApprovalTimeline(document.getElementById('crHistory'), d.approvals);

  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on('creportBack', () => navigate('cash-account', r.CashAccountID));
  on('creportPrint', () => printRecord('CASHREPORT', r.CashReportID));
  on('creportSubmit', () => cashSubmitDialog(reportId, r));
  on('creportApprove', () => cashDecideDialog(reportId, 'APPROVE'));
  on('creportReturn', () => cashDecideDialog(reportId, 'RETURN'));
  on('creportReject', () => cashDecideDialog(reportId, 'REJECT'));
}

function cashSubmitDialog(reportId, report) {
  const fields = [
    { name: 'CountedCash', label: 'Cash actually in hand', type: 'number', span: 2,
      value: report.CountedCash || '',
      hint: 'The ledger says ' + cash(report.ClosingBalance) + '. Count the box and enter what is there.' }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, {});
  body.appendChild(form);
  const warn = UI.el('div', { id: 'submitDiff' });
  body.appendChild(warn);
  const recalc = () => {
    const v = UI.readForm(form);
    const diff = Number(v.CountedCash || 0) - Number(report.ClosingBalance || 0);
    warn.innerHTML = (v.CountedCash !== '' && diff)
      ? `<div class="banner banner-warn mt-8">That is ${cash(Math.abs(diff))} ${diff > 0 ? 'more' : 'less'}
         than the ledger expects. Submit anyway and explain it to your manager.</div>` : '';
  };
  form.querySelectorAll('input').forEach(i => { i.oninput = recalc; });

  UI.modal({
    title: 'Submit ' + reportId, size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Submit', class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          m.busy(true);
          try {
            UI.success((await api('submitCashReport', reportId, data.CountedCash)).message);
            m.close();
            navigate('cash-report', reportId);
          } catch (e) { m.busy(false); UI.error('Could not submit', e.message); }
        } }
    ]
  });
}

function cashDecideDialog(reportId, action) {
  const label = { APPROVE: 'Approve', RETURN: 'Return for correction', REJECT: 'Reject' }[action];
  const fields = [
    { name: 'Comments', label: 'Comments', type: 'textarea', span: 2,
      required: action !== 'APPROVE',
      hint: action === 'APPROVE'
        ? 'The expenses will be booked to the project and the period closed'
        : 'Say what needs putting right' }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, {});
  body.appendChild(form);
  UI.modal({
    title: label + ' ' + reportId, size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: label, class: action === 'REJECT' ? 'btn-danger' : 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          m.busy(true);
          try {
            UI.success((await api('decideCashReport', reportId, action, data.Comments || '')).message);
            m.close();
            navigate('cash-report', reportId);
          } catch (e) { m.busy(false); UI.error('Could not record the decision', e.message); }
        } }
    ]
  });
}

PAGES['cash'] = pageCash;
PAGES['cash-account'] = pageCashAccount;
PAGES['cash-reports'] = pageCashReports;
PAGES['cash-report'] = pageCashReport;

      : `<div class="field"><label for="paySearch">Search</label>
           <input class="input" id="paySearch" placeholder="Name, CNIC${K.kind === 'LABOUR' ? ', mate or trade' : ' or designation'}"></div>
         <div class="field"><label for="payPStatus">Status</label><select class="input" id="payPStatus">
           <option value="">All</option><option>Active</option><option>Left</option></select></div>`}`;
  const proj = document.getElementById('payProject');
  proj.value = payState.project[K.kind] || '';
  proj.onchange = () => { payState.project[K.kind] = proj.value; load(); };

  const load = tab === 'sheets' ? () => payrollSheetsList(K, projects) : () => payrollRegister(K, projects);
  if (tab === 'sheets') {
    const st = document.getElementById('payStatus');
    st.value = payState.status[K.kind] || '';
    st.onchange = () => { payState.status[K.kind] = st.value; load(); };
  } else {
    let t;
    document.getElementById('paySearch').oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
    document.getElementById('payPStatus').onchange = load;
  }
  await load();
}
