<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#15325C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SIMCO PMS">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315325C'/%3E%3Ctext x='16' y='21' font-family='system-ui,sans-serif' font-size='13' font-weight='700' fill='%23fff' text-anchor='middle'%3ESC%3C/text%3E%3C/svg%3E">
  <title>SIMCO Construction PMS</title>
  <style>
/* =============================================================
   SIMCO Construction PMS — "Schedule of Rates" visual system
   The screen reads like a priced BOQ: hairline rules, right-aligned
   figures on a shared axis, totals marked by a rule rather than a box.
   Desktop-first, responsive, no decorative animation.
   ============================================================= */
:root{
  /* --- the system ------------------------------------------------ */
  --ink:#10151C; --ink-2:#2A323C; --muted:#5A6472;
  --paper:#F7F8FA; --rule:#DDE2E9; --rule-2:#C7CEDA;
  --navy:#15325C; --navy-deep:#0B2141; --navy-soft:#E8EDF5;
  --warn:#8A5109; --warn-fill:#B4690E; --warn-soft:#FBF3E8;
  --over:#8C1D18; --over-fill:#A4262C; --over-soft:#FAEDEC;
  --good:#1F5A3D; --good-soft:#EAF3EE;

  /* --- legacy names, repointed at the system above --------------- */
  --navy-900:#0B1627; --navy-800:#10213A; --navy-700:#15325C; --navy-600:#1E4278;
  --blue-600:#15325C; --blue-500:#2E5590; --blue-50:#E8EDF5;
  --slate-900:#10151C; --slate-700:#2A323C; --slate-600:#3F4A58; --slate-500:#5A6472;
  --slate-400:#8A94A3; --slate-300:#C7CEDA; --slate-200:#DDE2E9; --slate-100:#F1F3F7;
  --slate-50:#F7F8FA; --white:#fff;
  --green-600:#1F5A3D; --green-50:#EAF3EE;
  --amber-600:#8A5109; --amber-50:#FBF3E8;
  --red-600:#8C1D18;   --red-50:#FAEDEC;
  --violet-600:#4A3A6B;--violet-50:#F0EDF5;

  --bg:var(--paper); --surface:#fff; --surface-2:#F1F3F7;
  --border:var(--rule); --border-strong:var(--rule-2);
  --text:var(--ink); --text-muted:var(--muted); --text-invert:#fff;
  --accent:var(--navy); --accent-soft:var(--navy-soft);

  /* Square-ish corners and no card shadows: the page is one document,
     not a tray of floating tiles. Shadow is kept for things that really
     do float — menus, modals, toasts. */
  --radius:3px; --radius-sm:3px; --radius-lg:4px;
  --shadow-sm:none;
  --shadow:none;
  --shadow-lg:0 10px 28px rgba(16,21,28,.18);
  --header-h:64px; --strip-h:46px; --page-max:1480px;
  /* No web font: this app loads nothing from outside itself, by design and
     by test. The ledger character comes from the figures instead — tabular
     numerals, a tight weight scale and hairline rules. */
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",
    Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --ink:#E9EEF6; --ink-2:#C6CFDC; --muted:#93A0B3;
  --paper:#0E131B; --rule:#232C39; --rule-2:#303B4B;
  --navy:#6E9AD8; --navy-deep:#8FB4E6; --navy-soft:#15202F;
  --warn:#D9A05B; --warn-fill:#C2731B; --warn-soft:#231B10;
  --over:#E58A82; --over-fill:#A4262C; --over-soft:#2A1514;
  --good:#6FBE93; --good-soft:#12221A;
  --bg:var(--paper); --surface:#141B25; --surface-2:#1A2230;
  --border:var(--rule); --border-strong:var(--rule-2);
  --text:var(--ink); --text-muted:var(--muted);
  --accent:var(--navy); --accent-soft:var(--navy-soft);
  --slate-50:#1A2230; --slate-100:#141B25; --slate-200:#232C39; --slate-300:#303B4B;
  --slate-500:#93A0B3; --slate-600:#AEB9C8;
  --green-600:#6FBE93; --green-50:#12221A;
  --amber-600:#D9A05B; --amber-50:#231B10;
  --red-600:#E58A82;   --red-50:#2A1514;
  --blue-600:#6E9AD8;  --blue-50:#15202F;
  --shadow-lg:0 14px 36px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);
  background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;font-size:inherit}
.hidden{display:none !important}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--text-muted)}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}
.flex{display:flex}
.between{display:flex;align-items:center;justify-content:space-between}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.w-full{width:100%}

/* ----------------------------------------------------------- LOGIN */
#loginScreen{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(140deg,var(--navy-900),var(--navy-700) 55%,#24406b)}
.login-card{width:100%;max-width:400px;background:var(--surface);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);padding:32px}
/* Logo above the name, not beside it: a registered company name runs long
   ("Shoukat Iqbal Mir & Co.) Pvt Ltd"), and side by side it wrapped to three
   lines against a squeezed mark. */
.login-brand{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:24px}
.login-mark{width:44px;height:44px;border-radius:10px;background:var(--navy-700);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:.5px}
/* A figure that is shown but cannot be changed here. Greyed, not hidden:
   the custodian is correcting the line around it and still has to read it. */
.input.is-readonly{background:var(--paper);color:var(--muted);cursor:not-allowed}

/* The statement's figures: one quiet line above the ledger rather than a
   wall of tiles, so the dated entries are what the eye lands on. */
.ledger-figures{display:flex;flex-wrap:wrap;gap:0;padding:12px 16px;
  border-bottom:1px solid var(--rule)}
.ledger-figure{display:flex;flex-direction:column;gap:2px;padding:0 20px 0 0;margin-right:20px;
  border-right:1px solid var(--rule)}
.ledger-figure:last-child{border-right:0;margin-right:0;padding-right:0}
.ledger-figure span{font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.ledger-figure strong{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.ledger-figure.is-total strong{font-size:17px;font-weight:700}
@media (max-width:720px){
  .ledger-figure{border-right:0;margin-right:0;padding:0;flex:1 1 45%;
    flex-direction:row;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--rule);padding:5px 0}
  .ledger-figure:last-child{border-bottom:0}
}

.login-logo{height:46px;max-width:100%;width:auto;object-fit:contain;display:block;flex:none}
.login-title{font-size:17px;font-weight:650;line-height:1.3}
.login-sub{font-size:12.5px;color:var(--text-muted)}
.login-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text-muted);font-size:12px}
.login-divider::before,.login-divider::after{content:"";flex:1;height:1px;background:var(--border)}

/* ----------------------------------------------------------- SHELL */
/* Navigation lives across the top: the module button opens the list of
   modules, the strip under it holds the screens of the module you are in.
   No sidebar, so the full width belongs to the content. */
#appShell{display:flex;flex-direction:column;min-height:100vh}

.topbar{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
.topbar-inner{max-width:var(--page-max);margin:0 auto;padding:0 24px;min-height:var(--header-h);
  display:flex;align-items:center;gap:16px}
/* The company mark sits with the name. It is capped by height so a wide
   wordmark and a square badge both sit on the same baseline, and it never
   grows the bar. */
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-logo{height:26px;max-width:132px;width:auto;object-fit:contain;display:block;flex:none}
.brand-name{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand-ver{font-size:11px;color:var(--muted);white-space:nowrap}
.header-title{font-size:13.5px;color:var(--muted);padding-left:16px;border-left:1px solid var(--rule);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.header-spacer{flex:1}

.navstrip-wrap{background:var(--surface);border-bottom:1px solid var(--rule);
  position:sticky;top:var(--header-h);z-index:29}
.nav.navstrip{max-width:var(--page-max);margin:0 auto;padding:0 24px;display:flex;align-items:center;
  gap:24px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.nav-group{display:flex;align-items:center;gap:24px}
.nav-item{display:flex;align-items:center;gap:8px;min-height:var(--strip-h);padding:0 2px;border:0;
  background:none;color:var(--text);cursor:pointer;font-size:13.5px;white-space:nowrap;
  box-shadow:inset 0 0 0 0 var(--ink)}
.nav-item:hover:not(:disabled){box-shadow:inset 0 -3px 0 0 var(--rule-2)}
.nav-item.active{font-weight:600;box-shadow:inset 0 -3px 0 0 var(--ink)}
.nav-item:disabled{color:var(--muted);cursor:not-allowed}
.nav-icon{display:none}
.nav-phase{font-size:10px;padding:2px 6px;border-radius:2px;background:var(--surface-2);
  color:var(--muted);white-space:nowrap}
.nav-count{min-width:20px;padding:1px 5px;border-radius:2px;flex:none;font-size:11px;font-weight:700;
  text-align:center;background:var(--over);color:#fff}
.nav-count-elsewhere{background:var(--over);color:#fff}
.tabs-sub{margin:-4px 0 14px}
.tabs-sub .tab{font-size:12.5px;padding:6px 12px}

/* ---- module switcher (one module at a time) ---- */
.mod-switch{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 13px;flex:none;
  background:var(--surface-2);border:1px solid var(--rule-2);border-radius:var(--radius);
  color:var(--text);cursor:pointer;text-align:left}
.mod-switch:hover{background:var(--rule)}
.mod-switch:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.mod-switch[aria-expanded="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.mod-switch[aria-expanded="true"] .nav-count{background:#fff;color:var(--navy)}
.mod-switch-icon{display:none}
.mod-switch-text{display:flex;align-items:center;min-width:0}
.mod-switch-label{display:none}
.mod-switch-name{font-size:14.5px;font-weight:600;white-space:nowrap}
.mod-switch-caret{font-size:10px;flex:none}
.mod-switch[aria-expanded="true"] .mod-switch-caret{transform:rotate(180deg)}

.mod-menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--ink);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:0;overflow:hidden}
.mod-menu-head{padding:11px 16px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--muted)}
.mod-menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;
  border:0;border-bottom:1px solid var(--surface-2);background:var(--surface);cursor:pointer;
  text-align:left;color:var(--text)}
.mod-menu-item:last-child{border-bottom:0}
.mod-menu-item:hover{background:var(--surface-2)}
.mod-menu-item.current{background:var(--surface-2)}
.mod-menu-item.current .mod-menu-name{color:var(--navy)}
.mod-menu-item:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
.mod-menu-icon{display:none}
.mod-menu-text{flex:1;min-width:0}
.mod-menu-name{display:block;font-size:14px;font-weight:600}
.mod-menu-sub{display:block;font-size:12px;color:var(--muted);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-menu .nav-count{background:var(--warn);color:#fff}

/* ---- top-bar furniture ---- */
.global-search{position:relative;width:300px;max-width:30vw}
.global-search input{width:100%;min-height:44px;padding:8px 10px 8px 30px;border:1px solid var(--rule-2);
  border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:13.5px;font-family:inherit}
.global-search::before{content:"\2315";position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:15px}
.icon-btn{min-width:44px;min-height:44px;border-radius:var(--radius);border:1px solid var(--rule-2);
  background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--surface-2)}
.badge-dot{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:2px;
  background:var(--over);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
.user-chip{display:flex;align-items:center;gap:9px;min-height:44px;padding:4px 10px 4px 5px;
  border-radius:var(--radius);border:1px solid var(--rule-2);background:var(--surface);cursor:pointer}
.user-chip:hover{background:var(--surface-2)}
.avatar{width:32px;height:32px;border-radius:var(--radius);background:var(--navy);color:#fff;display:grid;
  place-items:center;font-size:12px;font-weight:600;flex:none}
.user-meta{line-height:1.15;text-align:left}
.user-name{font-size:13px;font-weight:600}
.user-role{font-size:11px;color:var(--muted)}

.content{max-width:var(--page-max);width:100%;margin:0 auto;padding:28px 24px 64px;flex:1;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:14px;margin-bottom:22px;border-bottom:2px solid var(--ink)}
.page-title{font-size:25px;font-weight:700;letter-spacing:-.015em}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px}
/* Several rows chosen at once — BOQ lines, 23 Oct 2026. */
.bulk-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;
  border-top:1px solid var(--line, rgba(0,0,0,.08));font-size:13px}
.bulk-bar.hidden{display:none}
.bulk-bar .check{display:flex;align-items:center;gap:6px;cursor:pointer}
/* Breadcrumbs above a detail screen's title (23 Oct 2026). */
.crumbs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-8px 0 10px}
.crumbs a{color:var(--accent)}
.crumbs a:hover{text-decoration:underline}
.crumb-back{font-weight:600;padding:3px 10px 3px 8px;border:1px solid var(--accent-soft);border-radius:999px;
  background:var(--accent-soft)}
.crumb-trail{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-width:0}
.crumb-sep{color:var(--muted);opacity:.7}
.crumb-here{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}

@media (max-width:1000px){
  .topbar-inner{flex-wrap:wrap;padding:10px 16px;gap:10px;min-height:0}
  .header-title{order:4;border-left:0;padding-left:0;max-width:100%;flex-basis:100%}
  .global-search{order:9;width:100%;max-width:none}
  .navstrip-wrap{position:static}
  .nav.navstrip{padding:0 16px}
  .content{padding:20px 16px 56px}
}

/* ----------------------------------------------------------- CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.card-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:600}
.card-body{padding:16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 16px}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:500}
.stat-value{font-size:24px;font-weight:680;margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-note{font-size:11.5px;color:var(--text-muted);margin-top:4px}
/* The tiles are already ruled off; a coloured bar under each one was
   decoration, so it is not drawn. The markup keeps it for compatibility. */
.stat-accent{display:none}

/* ----------------------------------------------------------- TABLE */
.table-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.data th{text-align:left;padding:10px 12px;background:var(--surface);color:var(--text-muted);
  font-weight:600;font-size:12px;border-bottom:1px solid var(--ink);white-space:nowrap;
  position:sticky;top:0}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--text)}
table.data td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.data tbody tr:hover{background:var(--surface-2)}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* ----------------------------------------------------------- BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;
  border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text);font-size:13px;font-weight:530;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){filter:brightness(1.07);background:var(--accent)}
.btn-danger{background:var(--red-600);border-color:var(--red-600);color:#fff}
.btn-danger:hover:not(:disabled){filter:brightness(1.07);background:var(--red-600)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover:not(:disabled){background:var(--surface-2)}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-block{width:100%}

/* ----------------------------------------------------------- FORMS */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--text)}
.field .hint{font-size:11.5px;color:var(--text-muted);margin-top:4px}
.input,select.input,textarea.input{width:100%;padding:8px 10px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);font-size:13.5px;background:var(--surface);color:var(--text);font-family:inherit}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.input[aria-invalid="true"]{border-color:var(--red-600)}
textarea.input{min-height:76px;resize:vertical}
.field-error{color:var(--red-600);font-size:11.5px;margin-top:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .span-2{grid-column:1 / -1}
.checkbox{display:flex;align-items:center;gap:8px;font-size:13px}
.checkbox input{width:15px;height:15px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{margin-bottom:0;min-width:150px}

/* ----------------------------------------------------------- BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:2px;
  font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.badge-green{background:var(--good-soft);color:var(--good);border-color:var(--good-soft)}
.badge-amber{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-soft)}
.badge-red{background:var(--over-soft);color:var(--over);border-color:var(--over-soft)}
.badge-blue{background:var(--navy-soft);color:var(--navy);border-color:var(--navy-soft)}
.badge-violet{background:var(--violet-50);color:var(--violet-600);border-color:var(--violet-50)}
.badge-grey{background:var(--slate-100);color:var(--text-muted);border-color:var(--border)}
:root[data-theme="dark"] .badge{border-color:var(--border)}

/* ----------------------------------------------------------- STATES */
.state{padding:40px 20px;text-align:center;color:var(--text-muted)}
.state-icon{font-size:30px;opacity:.5}
.state-title{font-size:14.5px;font-weight:600;color:var(--text);margin-top:10px}
.state-text{font-size:13px;margin-top:5px}
.state-error{color:var(--red-600)}
.spinner{width:17px;height:17px;border:2px solid var(--border-strong);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.spinner-lg{width:30px;height:30px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}

/* ----------------------------------------------------------- MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,18,32,.55);display:grid;place-items:center;

   wider than its dialog scrolls inside it. */
table td .input[data-f=ItemCode],table td .input[data-f=CostCode],table td .input[data-f=MaterialCode]{min-width:130px}
table td .input[data-f=Unit]{min-width:84px}
table td .input[data-f=OrderedQty],table td .input[data-f=Quantity],table td .input[data-f=Rate],
table td .input[data-f=CurrentQty]{min-width:96px}
/* Whatever is wider than the dialog scrolls inside it (12 Nov 2026). */
.modal-body{min-width:0;overflow-x:auto}
/* A choice made of a title and a sentence: wraps, never runs off the side. */
.btn.choice{display:block;width:100%;white-space:normal;text-align:left;padding:12px 14px;line-height:1.45;height:auto}
.modal.modal-wide{max-width:820px}

  justify-content:space-between;gap:12px}

.print-overlay-bar{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;

.print-overlay-frame{flex:1;width:100%;border:0;background:#fff}
.modal-body{padding:20px;overflow-y:auto}

<body>

  <!-- Boot splash ------------------------------------------------------ -->
  <div id="splash" style="min-height:100vh;display:grid;place-items:center">
    <div class="state">
      <div class="spinner spinner-lg"></div>
      <div class="state-title">Starting SIMCO PMS…</div>
    </div>
  </div>

  <!-- Login ------------------------------------------------------------ -->
  <div id="loginScreen" class="hidden"></div>

  <!-- Application shell ------------------------------------------------ -->
  <div id="appShell" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div id="modBar"></div>
        <div class="brand">
          <img class="brand-logo hidden" id="brandLogo" alt="">
          <span class="brand-name" id="brandName">SIMCO PMS</span>
          <span class="brand-ver" id="brandVersion">3.8.0</span>
        </div>
        <div class="header-title" id="headerTitle">Dashboard</div>
        <div class="header-spacer"></div>
        <div class="global-search">
          <input id="globalSearch" placeholder="Search projects, POs, vendors, items…"
                 autocomplete="off" aria-label="Global search">
          <div id="globalSearchResults" class="search-results hidden"></div>
        </div>
        <button class="icon-btn search-toggle" id="searchToggle" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
          </svg>
        </button>
        <button class="icon-btn" id="notifBtn" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
          </svg>
        </button>
        <button class="user-chip" id="userChip" aria-label="Account menu"></button>
      </div>
    </header>

    <div class="navstrip-wrap">
      <nav class="nav navstrip" id="nav" aria-label="Main"></nav>
    </div>

    <div id="deployWarning" class="hidden"></div>

    <main class="content" id="content"></main>
  </div>

  <div id="toastHost" aria-live="polite"></div>

  <script>
/* =============================================================
   Components.html — UI kit: toasts, modals, tables, states.
   Pure DOM, no framework, no external requests.
   ============================================================= */

const UI = (() => {

  const esc = s => String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  const el = (tag, attrs = {}, html) => {
    const n = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
      else n.setAttribute(k, v);
    });
    if (html !== undefined) n.innerHTML = html;
    return n;
  };

  /* ------------------------------------------------------------ TOASTS */
  function toast(type, title, message, ms) {
    const host = document.getElementById('toastHost');
    const node = el('div', { class: 'toast toast-' + type, role: 'status' });
    node.innerHTML =
      `<div style="flex:1"><div class="toast-title">${esc(title)}</div>` +
      (message ? `<div class="toast-msg">${esc(message)}</div>` : '') + '</div>';
    const close = el('button', { class: 'toast-close', 'aria-label': 'Dismiss' }, '&times;');
    close.onclick = () => node.remove();
    node.appendChild(close);
    host.appendChild(node);
    const life = ms === undefined ? (type === 'error' ? 8000 : 4000) : ms;
    if (life > 0) setTimeout(() => node.remove(), life);
    return node;
  }
  const success = (t, m) => toast('success', t, m);
  const error   = (t, m) => toast('error', t, m);
  const warn    = (t, m) => toast('warn', t, m);
  const info    = (t, m) => toast('info', t, m);

  /* ------------------------------------------------------------- MODAL */
  let openModals = [];

  function modal({ title, body, size = '', footer = [], onClose }) {
    const backdrop = el('div', { class: 'modal-backdrop' });
    const box = el('div', { class: 'modal ' + (size ? 'modal-' + size : '') });
    const head = el('div', { class: 'modal-head' });
    // On a phone a dialog is a full-width sheet: "‹ Back" where the eye expects it (13 Nov 2026).
    const back = el('button', { class: 'btn btn-ghost btn-sm modal-back', 'aria-label': 'Back' }, '\u2039 Back');
    head.appendChild(back);
    head.appendChild(el('div', { class: 'modal-title', text: title }));
    const x = el('button', { class: 'btn btn-ghost btn-sm', 'aria-label': 'Close' }, '&times;');
    head.appendChild(x);
    const bodyEl = el('div', { class: 'modal-body' });
    if (typeof body === 'string') bodyEl.innerHTML = body; else bodyEl.appendChild(body);
    const foot = el('div', { class: 'modal-foot' });

    const api = {
      root: backdrop, body: bodyEl, footer: foot,
      close() {
        backdrop.remove();
        openModals = openModals.filter(m => m !== api);
        document.removeEventListener('keydown', onKey);
        if (onClose) onClose();
      },
      busy(on) {
        foot.querySelectorAll('button').forEach(b => { b.disabled = !!on; });
        const primary = foot.querySelector('.btn-primary');
        if (primary) {
          if (on) {
            primary.dataset.label = primary.innerHTML;
            primary.innerHTML = '<span class="spinner"></span> Working…';
          } else if (primary.dataset.label) {
            primary.innerHTML = primary.dataset.label;
          }
        }
      }
    };

    footer.forEach(f => {
      const b = el('button', { class: 'btn ' + (f.class || '') , text: f.label });
      b.onclick = () => f.onClick(api);
      foot.appendChild(b);
    });

    x.onclick = api.close;
    back.onclick = api.close;
    backdrop.addEventListener('mousedown', e => { if (e.target === backdrop) api.close(); });
    const onKey = e => { if (e.key === 'Escape' && openModals[openModals.length - 1] === api) api.close(); };
    document.addEventListener('keydown', onKey);

    box.append(head, bodyEl);
    if (footer.length) box.appendChild(foot);
    backdrop.appendChild(box);
    document.body.appendChild(backdrop);
    openModals.push(api);
    // Focus synchronously on open. A deferred focus would steal the caret from
    // whatever the user had already started typing in.
    const first = bodyEl.querySelector('input:not([readonly]),select,textarea');
    if (first) first.focus();
    return api;
  }

  function confirm({ title, message, confirmLabel = 'Confirm', danger = false, onConfirm }) {
    return modal({
      title, size: 'narrow',
      body: `<p style="margin:0;font-size:13.5px">${esc(message)}</p>`,
      footer: [
        { label: 'Cancel', onClick: m => m.close() },
        { label: confirmLabel, class: danger ? 'btn-danger' : 'btn-primary',
          onClick: async m => { m.busy(true); try { await onConfirm(m); } finally { m.busy(false); } } }
      ]
    });
  }

  /* ------------------------------------------------------------ STATES */
  const loadingState = (text = 'Loading…') =>
    `<div class="state"><div class="spinner spinner-lg"></div><div class="state-title">${esc(text)}</div></div>`;

  const emptyState = (title, text, actionHtml = '') =>
    `<div class="state"><div class="state-icon">◍</div><div class="state-title">${esc(title)}</div>` +
    `<div class="state-text">${esc(text)}</div>${actionHtml ? '<div class="mt-16">' + actionHtml + '</div>' : ''}</div>`;

  const errorState = (message, retryId) =>
    `<div class="state"><div class="state-icon state-error">⚠</div>` +
    `<div class="state-title state-error">Could not load this</div>` +
    `<div class="state-text">${esc(message)}</div>` +
    (retryId ? `<div class="mt-16"><button class="btn" id="${retryId}">Try again</button></div>` : '') + '</div>';

  /* ------------------------------------------------------------- TABLE */
  /**
   * columns: [{key, label, align, width, render(row), sortable}]
   * Renders into `mount`; returns nothing (state lives with the caller).
   */
  function table(mount, { columns, rows, empty, onSort, sortBy, sortDir, rowKey }) {
    mount.innerHTML = '';
    if (!rows.length) { mount.innerHTML = empty || emptyState('Nothing here yet', 'No records match the current filters.'); return; }
    const wrap = el('div', { class: 'table-wrap' });
    const t = el('table', { class: 'data' });
    const thead = el('thead');
    const tr = el('tr');
    columns.forEach(c => {
      const th = el('th', {
        class: (c.align === 'right' ? 'num ' : '') + (c.sortable !== false && onSort ? 'sortable' : ''),
        style: c.width ? 'width:' + c.width : null
      });
      th.textContent = c.label;
      if (sortBy === c.key) th.textContent += sortDir === 'desc' ? '  ↓' : '  ↑';
      if (c.sortable !== false && onSort) th.onclick = () => onSort(c.key);
      tr.appendChild(th);
    });
    thead.appendChild(tr);
    const tbody = el('tbody');
    rows.forEach(row => {
      const r = el('tr');
      if (rowKey) r.dataset.key = row[rowKey];
      columns.forEach(c => {
        const td = el('td', { class: c.align === 'right' ? 'num' : '' });
        const v = c.render ? c.render(row) : row[c.key];
        if (v instanceof Node) td.appendChild(v);
        else td.innerHTML = (c.render ? v : esc(v === null || v === undefined ? '' : v));
        r.appendChild(td);
      });
      tbody.appendChild(r);
    });
    t.append(thead, tbody);
    wrap.appendChild(t);
    mount.appendChild(wrap);
  }

  function pager(mount, { page, totalPages, total, pageSize, onPage }) {
    mount.innerHTML = '';
    if (!total) return;
    const bar = el('div', { class: 'pager' });
    const from = (page - 1) * pageSize + 1;
    const to = Math.min(total, page * pageSize);
    bar.appendChild(el('div', { text: `Showing ${from}–${to} of ${total}` }));
    const btns = el('div', { class: 'pager-buttons' });
    const prev = el('button', { class: 'btn btn-sm', text: 'Previous' });
    prev.disabled = page <= 1;
    prev.onclick = () => onPage(page - 1);
    const label = el('span', { class: 'muted', text: ` Page ${page} of ${totalPages} `,
      style: 'align-self:center;padding:0 6px' });
    const next = el('button', { class: 'btn btn-sm', text: 'Next' });
    next.disabled = page >= totalPages;
    next.onclick = () => onPage(page + 1);
    btns.append(prev, label, next);
    bar.appendChild(btns);
    mount.appendChild(bar);
  }

  /* ------------------------------------------------------------- FORMS */
  /** fields: [{name,label,type,required,options,value,hint,placeholder,span,readonly}] */
  function form(fields, values = {}) {
    const wrap = el('div', { class: 'form-grid' });
    fields.forEach(f => {
      const box = el('div', { class: 'field' + (f.span === 2 ? ' span-2' : '') });
      if (f.span === 2) box.classList.add('span-2');
      const id = 'f_' + f.name;
      if (f.type === 'checkbox') {
        const lab = el('label', { class: 'checkbox', for: id });
        const input = el('input', { type: 'checkbox', id, name: f.name });
        input.checked = !!(values[f.name] !== undefined ? values[f.name] : f.value);
        lab.append(input, document.createTextNode(' ' + f.label));
        box.appendChild(lab);
      } else {
        box.appendChild(el('label', { for: id, text: f.label + (f.required ? ' *' : '') }));
        let input;
        const val = values[f.name] !== undefined ? values[f.name] : (f.value !== undefined ? f.value : '');
        if (f.type === 'select') {
          input = el('select', { class: 'input', id, name: f.name });
          (f.options || []).forEach(o => {
            const opt = el('option', { value: o.value === undefined ? o : o.value });
            opt.textContent = o.label === undefined ? o : o.label;
            if (String(opt.value) === String(val)) opt.selected = true;
            input.appendChild(opt);
          });
        } else if (f.type === 'textarea') {
          input = el('textarea', { class: 'input', id, name: f.name, placeholder: f.placeholder || '' });
          input.value = val;
        } else if (f.type === 'multiselect') {
          input = el('select', { class: 'input', id, name: f.name, multiple: 'multiple', size: 5 });
          const selected = Array.isArray(val) ? val.map(String) : String(val || '').split(',').map(s => s.trim());
          (f.options || []).forEach(o => {
            const opt = el('option', { value: o.value === undefined ? o : o.value });
            opt.textContent = o.label === undefined ? o : o.label;
            if (selected.indexOf(String(opt.value)) !== -1) opt.selected = true;
            input.appendChild(opt);
          });
        } else {
          input = el('input', { class: 'input', id, name: f.name, type: f.type || 'text',
            placeholder: f.placeholder || '', autocomplete: f.autocomplete || 'off' });
          input.value = val;
        }
        if (f.readonly) { input.setAttribute('readonly', 'readonly'); input.disabled = f.type === 'select'; }
        if (f.required) input.required = true;
        box.appendChild(input);
        if (f.hint) box.appendChild(el('div', { class: 'hint', text: f.hint }));
        box.appendChild(el('div', { class: 'field-error hidden', id: id + '_err' }));
      }
      wrap.appendChild(box);
    });
    return wrap;
  }

  function readForm(root) {
    const out = {};
    root.querySelectorAll('input,select,textarea').forEach(i => {
      if (!i.name) return;
      if (i.type === 'checkbox') out[i.name] = i.checked;
      else if (i.multiple) out[i.name] = Array.from(i.selectedOptions).map(o => o.value);
      else out[i.name] = i.value.trim();
    });
    return out;
  }

  function clearErrors(root) {
    root.querySelectorAll('.field-error').forEach(e => { e.classList.add('hidden'); e.textContent = ''; });
    root.querySelectorAll('[aria-invalid]').forEach(e => e.removeAttribute('aria-invalid'));
  }

  function setFieldError(root, name, message) {
    const err = root.querySelector('#f_' + name + '_err');
    const input = root.querySelector('[name="' + name + '"]');
    if (err) { err.textContent = message; err.classList.remove('hidden'); }
    if (input) input.setAttribute('aria-invalid', 'true');
  }

  /** Client-side required/format check. Server-side validation still runs. */
  function validate(root, fields) {
    clearErrors(root);
    const data = readForm(root);
    let firstBad = null;
    fields.forEach(f => {
      const v = data[f.name];
      if (f.required && (v === '' || v === undefined || (Array.isArray(v) && !v.length))) {
        setFieldError(root, f.name, f.label + ' is required.');
        firstBad = firstBad || f.name;
      } else if (f.type === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) {
        setFieldError(root, f.name, 'Enter a valid email address.');
        firstBad = firstBad || f.name;
      } else if (f.min !== undefined && v && String(v).length < f.min) {
        setFieldError(root, f.name, f.label + ' must be at least ' + f.min + ' characters.');
        firstBad = firstBad || f.name;
      }
    });
    if (firstBad) {
      const node = root.querySelector('[name="' + firstBad + '"]');
      if (node) node.focus();
      return null;
    }
    return data;
  }

  /* ------------------------------------------------------------ FORMAT */
  const fmt = {
    money(n, symbol) {
      const v = Number(n || 0);
      return (symbol ? symbol + ' ' : '') + v.toLocaleString('en-PK', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    },
    number(n, dp = 2) {
      return Number(n || 0).toLocaleString('en-PK', { minimumFractionDigits: 0, maximumFractionDigits: dp });
    },
    percent(n) { return Number(n || 0).toFixed(1) + '%'; },
    /**
     * One unit for a whole table, so its figures share a decimal axis the way
     * a priced BOQ does. The unit is chosen from the largest figure and named
     * once in the heading, never repeated on every row.
     */
    unit(max) {
      const m = Math.abs(Number(max) || 0);
      if (m >= 1e9) return { div: 1e9, label: 'billion' };
      if (m >= 1e6) return { div: 1e6, label: 'million' };
      if (m >= 1e4) return { div: 1e3, label: 'thousand' };
      return { div: 1, label: '' };
    },
    scaled(n, unit) {
      if (n === null || n === undefined || n === '') return '\u2014';
      const u = unit || { div: 1 };
      const dp = u.div === 1 ? 0 : 1;
      return (Number(n) / u.div).toLocaleString('en-PK',
        { minimumFractionDigits: dp, maximumFractionDigits: u.div === 1 ? 2 : dp });
    },
    date(v) {
      if (!v) return '—';
      const d = new Date(v);
      if (isNaN(d)) return String(v);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    },
    dateTime(v) {
      if (!v) return '—';
      const d = new Date(v);
      if (isNaN(d)) return String(v);
      return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit' });
    },
    initials(name) {
      return String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
    }
  };

  const BADGE_TONE = {
    Active: 'green', Completed: 'green', Approved: 'green', Certified: 'green', Paid: 'green',
    Inactive: 'grey', Draft: 'grey', DRAFT: 'grey', Closed: 'grey', Cancelled: 'grey',
    Planning: 'blue', Tender: 'blue', SUBMITTED: 'blue', Issued: 'blue', 'Under Review': 'blue',
    'On Hold': 'amber', Delayed: 'amber', 'Pending Approval': 'amber', STOCK_VERIFIED: 'amber',
    PM_APPROVED: 'violet', APPROVED_FOR_PROCUREMENT: 'green',
    REJECTED: 'red', RETURNED: 'red', Rejected: 'red'
  };
  const badge = (value, tone) =>
    `<span class="badge badge-${tone || BADGE_TONE[value] || 'grey'}">${esc(value || '—')}</span>`;

  /* ------------------------------------------------------------- PRINT */
  /**
   * One letterhead for every document that leaves this office.
   *
   * A purchase order, an RFQ, a payment voucher and a cash report are all the
   * company speaking to someone outside it, so they are printed on the same
   * paper: logo, company, address and NTN on the left; what the document is,
   * its reference and the date on the right.
   *
   * When no logo has been set the space is drawn as a labelled outline rather
   * than left blank, so it is obvious that a logo belongs there and where it
   * will sit. The outline says where to set it, and it is the only part of the
   * page that is not the record itself.
   */
  const print = {
    company() {
      // `App` is declared with const, so it never becomes a property of window:
      // reading it as window.App silently handed every letterhead the fallback
      // company name and no logo at all.
      const st = (typeof App !== 'undefined' && App.settings) || {};
      return {
        name: st.companyName || 'SIMCO Construction',
        address: st.companyAddress || '',
        ntn: st.companyNtn || '',
        logoUrl: st.companyLogoUrl || ''
      };
    },

    logo(company) {
      const c = company || {};
      if (c.logoUrl) {
        return `<img class="pr-logo" src="${esc(c.logoUrl)}" alt="${esc(c.name || 'Company')} logo">`;
      }
      return `<div class="pr-logo pr-logo-empty" role="img"
                   aria-label="No company logo set">
                <span>Company logo</span>
                <small>Administration &rsaquo; Settings &rsaquo; company.logoUrl</small>
              </div>`;
    },

    /** The shared head block. `right` is whatever identifies this document. */
    letterhead(company, right) {
      const c = company || {};
      return `<header class="pr-head">
        <div class="pr-id">
          ${this.logo(c)}
          <div>
            <div class="pr-co">${esc(c.name || '')}</div>
            ${c.address ? `<div class="pr-sub">${esc(c.address)}</div>` : ''}
            ${c.ntn ? `<div class="pr-sub">NTN ${esc(c.ntn)}</div>` : ''}
          </div>
        </div>
        <div class="pr-doc">${right || ''}</div>
      </header>`;
    },

    /** Letterhead styles. Each document adds its own on top. */
    styles() {
      return `
        *{box-sizing:border-box}
        body{font:12px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
             color:#10151C;margin:28px;font-variant-numeric:tabular-nums}
        .pr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
                 border-bottom:2px solid #10151C;padding-bottom:12px;margin-bottom:18px}
        .pr-id{display:flex;gap:14px;align-items:flex-start;min-width:0}
        .pr-logo{max-height:56px;max-width:190px;object-fit:contain;flex:none}
        .pr-logo-empty{width:150px;height:56px;border:1px dashed #AFB7C4;border-radius:2px;
                       display:flex;flex-direction:column;align-items:center;justify-content:center;
                       gap:2px;color:#8A94A3;text-align:center;padding:4px}
        .pr-logo-empty span{font-size:11px;font-weight:600;letter-spacing:.02em}
        .pr-logo-empty small{font-size:7.5px;line-height:1.25}
        .pr-co{font-size:17px;font-weight:700;letter-spacing:-.01em}
        .pr-sub{font-size:11px;color:#5A6472}
        .pr-doc{text-align:right;flex:none}
        .pr-title{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
        .pr-ref{font-size:13px;font-weight:600;margin-top:2px}
        .pr-meta{font-size:11px;color:#5A6472}
        .pr-foot{margin-top:40px;display:flex;justify-content:space-between;gap:32px}
        .pr-foot div{flex:1;border-top:1px solid #10151C;padding-top:6px;font-size:11px}
        @media print{
          body{margin:12mm}
          .pr-logo-empty{border-color:#CBD2DC;color:#AFB7C4}
        }`;
    },

    /**
     * Table, box and total styling shared by the documents that carry lines:
     * orders, RFQs, bills, vouchers and reports all rule their figures the
     * same way so one office stamp reads across all of them.
     */
    docStyles() {
      return `
        table{width:100%;border-collapse:collapse;margin-top:10px}
        th,td{border:1px solid #DDE2E9;padding:6px 8px;vertical-align:top}
        th{background:#F1F3F7;text-align:left;font-size:11px;font-weight:600}
        .r{text-align:right}
        tfoot td{font-weight:600}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:4px}
        .box{border:1px solid #DDE2E9;padding:10px}
        .box h3{margin:0 0 6px;font-size:11px;font-weight:600;color:#5A6472}
        .muted{color:#5A6472}
        .summary{margin-top:16px;width:60%;margin-left:auto}
        .summary td{border:none;padding:3px 8px}
        .summary tr.total td{border-top:2px solid #10151C;font-weight:700}
        dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 18px;margin:12px 0;font-size:11.5px}
        dl.kv dt{color:#5A6472} dl.kv dd{margin:0;font-weight:600}`;
    },

    /**
     * Builds the whole printable page. The caller supplies only what makes its
     * document different: the title block on the right, the body, any extra CSS.
     */
    page(o) {
      const c = o.company || this.company();
      const right =
        `<div class="pr-title">${esc(o.title || 'Document')}</div>` +
        (o.ref ? `<div class="pr-ref">${esc(o.ref)}</div>` : '') +
        (o.meta || []).map(m => `<div class="pr-meta">${esc(m)}</div>`).join('') +
        `<div class="pr-meta">Printed ${esc(new Date().toLocaleDateString('en-GB'))}</div>`;
      const signatures = o.signatures === null ? ''
        : `<div class="pr-foot">${(o.signatures || ['Prepared by', 'Checked by', 'Approved by'])
            .map(x => `<div>${esc(x)}</div>`).join('')}</div>`;
      return `<!doctype html><html lang="en"><head><meta charset="utf-8">
        <title>${esc(o.ref || o.title || 'Document')}</title>
        <style>${this.styles()}${o.styles || ''}</style></head><body>
        ${this.letterhead(c, right)}
        ${o.body || ''}
        ${signatures}
        </body></html>`;
    },

    /** Opens the built page in a window and sends it to the printer. */
    /**
     * On a phone (or the installed app) the document opens inside PMS, full
     * screen, with "‹ Back" and "Print / Save PDF" (13 Nov 2026): a window of
     * its own had no way back. On a computer it still opens a window, which
     * now carries the same two buttons; neither is printed.
     */
    send(html) {
      const phone = window.matchMedia('(max-width: 720px)').matches ||
        window.matchMedia('(display-mode: standalone)').matches;
      if (phone) return this.overlay(html);
      const bar = `<style>.pr-toolbar{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;padding:8px 0 12px;
          background:#fff;z-index:5}.pr-toolbar button{font:600 13px system-ui,sans-serif;padding:8px 14px;border:1px solid #cbd5e1;
          border-radius:6px;background:#fff;cursor:pointer}.pr-toolbar .go{background:#15325C;color:#fff;border-color:#15325C}
          @media print{.pr-toolbar{display:none}}</style>
        <div class="pr-toolbar"><button onclick="window.close()">\u2039 Back to PMS</button>
          <button class="go" onclick="window.print()">Print / Save PDF</button></div>`;
      const w = window.open('', '_blank');
      if (!w) { warn('Pop-up blocked', 'Allow pop-ups for this site to print.'); return false; }
      w.document.write(html.replace(/<body([^>]*)>/i, m => m + bar));
      w.document.close();
      w.focus();
      setTimeout(() => { try { w.print(); } catch (e) {} }, 250);
      return true;
    },

    /** The document inside PMS: a full-screen layer, closed by ‹ Back or the phone's back button. */
    overlay(html) {
      const layer = el('div', { class: 'print-overlay' });
      layer.innerHTML = `<div class="print-overlay-bar">
          <button class="btn" data-pr-back>\u2039 Back</button>
          <button class="btn btn-primary" data-pr-print>Print / Save PDF</button></div>`;
      const frame = el('iframe', { class: 'print-overlay-frame', title: 'Document' });
      layer.appendChild(frame);
      document.body.appendChild(layer);
      // Laid out at paper width and shrunk to the screen, as the printout will
      // look; at phone width the letterhead overlapped. Screen only: the print is untouched.
      const fit = Math.min(1, (frame.clientWidth || window.innerWidth) / 820).toFixed(3);
      const shrink = `<style>@media screen{html{zoom:${fit}}}</style>`;
      frame.srcdoc = /<head[^>]*>/i.test(html) ? html.replace(/<head([^>]*)>/i, m => m + shrink) : shrink + html;
      layer.querySelector('[data-pr-back]').onclick = () => layer.remove();
      layer.querySelector('[data-pr-print]').onclick = () => {
        try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) { warn('Could not print', e.message); }
      };
      return true;
    }
  };

  /** Closes the dialog on top, if any: the phone's back button uses it. */
  function closeTopModal() {
    const m = openModals[openModals.length - 1];
    if (!m) return false;
    m.close();
    return true;
  }

  return { el, esc, toast, success, error, warn, info, modal, confirm, closeTopModal,
           loadingState, emptyState, errorState, table, pager,
           form, readForm, validate, clearErrors, setFieldError, fmt, badge, print };
})();

/**
 * Type-to-search for a long drop-down (owner's request, 10 Nov 2026: the item
 * master has over a thousand items). The <select> stays in the page, hidden,
 * and keeps the value, so everything that reads or listens to it still works.
 * Every word typed must appear (code or name, any order); up/down and Enter
 * choose; Esc puts back what was chosen.
 */
function makeSearchable(sel, opts) {
  if (!sel || sel.dataset.searchable) return;
  opts = opts || {};
  sel.dataset.searchable = '1';
  const items = [...sel.options].map(o => ({ value: o.value, label: o.textContent.replace(/\s+/g, ' ').trim() }))
    .map(i => Object.assign(i, { lc: i.label.toLowerCase() }));
  const wrap = document.createElement('div');
  wrap.className = 'ss-wrap';
  const input = document.createElement('input');
  input.className = 'input ss-input';
  input.type = 'text';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.placeholder = opts.placeholder || 'Type to search…';
  sel.parentNode.insertBefore(wrap, sel);
  wrap.appendChild(input);
  wrap.appendChild(sel);
  sel.style.display = 'none';
  const chosenLabel = () => { const o = sel.options[sel.selectedIndex]; return o && o.value ? o.textContent.replace(/\s+/g, ' ').trim() : ''; };
  const showChosen = () => { input.value = chosenLabel(); input.title = input.value; };
  showChosen();
  sel.addEventListener('change', showChosen);

  let list = null, hits = [], active = 0;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const place = () => {
    if (!list) return;
    const r = input.getBoundingClientRect();
    const below = window.innerHeight - r.bottom, above = r.top;
    list.style.left = Math.max(4, Math.min(r.left, window.innerWidth - Math.max(r.width, 340) - 4)) + 'px';
    list.style.width = Math.max(r.width, 340) + 'px';
    if (below < 240 && above > below) {
      list.style.top = ''; list.style.bottom = (window.innerHeight - r.top + 2) + 'px';
      list.style.maxHeight = Math.min(320, above - 12) + 'px';
    } else {
      list.style.bottom = ''; list.style.top = (r.bottom + 2) + 'px';
      list.style.maxHeight = Math.min(320, below - 12) + 'px';
    }
  };
  const render = q => {
    const words = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
    const all = items.filter(i => i.value !== '' && words.every(w => i.lc.indexOf(w) !== -1));
    hits = all.slice(0, 150);
    if (active >= hits.length) active = Math.max(0, hits.length - 1);
    const mark = label => {
      let out = esc(label);
      words.forEach(w => { out = out.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<b>$1</b>'); });
      return out;
    };
    list.innerHTML = hits.length
      ? hits.map((h, k) => `<div class="ss-opt${k === active ? ' active' : ''}${h.value === sel.value ? ' chosen' : ''}" data-k="${k}">${mark(h.label)}</div>`).join('') +
        (all.length > hits.length ? `<div class="ss-note">${all.length - hits.length} more — keep typing to narrow it down</div>` : '')
      : `<div class="ss-note">Nothing matches “${esc(q)}”</div>`;
  };
  const close = () => {
    if (list) { list.remove(); list = null; }
    window.removeEventListener('scroll', place, true);
    window.removeEventListener('resize', place);
  };
  const open = () => {
    if (!list) {
      list = document.createElement('div');
      list.className = 'ss-list';
      document.body.appendChild(list);
      list.addEventListener('mousedown', e => {
        e.preventDefault();
        const o = e.target.closest('.ss-opt');
        if (o) choose(hits[Number(o.dataset.k)]);
      });
      window.addEventListener('scroll', place, true);
      window.addEventListener('resize', place);
    }
    active = 0;
    render(input.value === chosenLabel() ? '' : input.value);
    place();
  };
  const choose = h => {
    if (!h) return;
    sel.value = h.value;
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    showChosen();
    close();
  };
  const move = step => {
    if (!list || !hits.length) return;
    active = (active + step + hits.length) % hits.length;
    list.querySelectorAll('.ss-opt').forEach((el, k) => el.classList.toggle('active', k === active));
    const el = list.querySelector('.ss-opt.active');
    if (el) el.scrollIntoView({ block: 'nearest' });
  };
  input.addEventListener('focus', () => { input.select(); open(); });
  input.addEventListener('click', () => { if (!list) open(); });
  input.addEventListener('input', () => { active = 0; if (!list) open(); render(input.value); place(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!list) open(); else move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { if (list) { e.preventDefault(); choose(hits[active]); } }
    else if (e.key === 'Escape') { if (list) { e.stopPropagation(); close(); showChosen(); } }
    else if (e.key === 'Tab') { close(); showChosen(); }
  });
  input.addEventListener('blur', () => setTimeout(() => {
    // Cleared on purpose: nothing chosen (where the list allows nothing).
    if (!input.value.trim() && items.some(i => i.value === '') && sel.value !== '') {
      sel.value = ''; sel.dispatchEvent(new Event('change', { bubbles: true }));
    }
    close(); showChosen();
  }, 120));
}

  <script>
/* =============================================================
   JavaScript.html — application state, server bridge, router, pages.
   Phase 1: Dashboard, Administration (Users / Roles / Settings /
   Audit / Database), Profile. Later-phase routes are declared but
   disabled — no button here pretends to do something it cannot.
   ============================================================= */

const App = {
  token: null,
  user: null,
  permissions: [],
  settings: {},
  enums: {},
  phases: {},
  route: 'dashboard',
  module: null,       // which sidebar module is open (M2 switcher)
  navCounts: {},      // route id -> things waiting for this user
  cache: {}
};

/* ------------------------------------------------------------- SERVER */

/**
 * The server bridge, repointed. Replaces call() in src/JavaScript.html at
 * build time (site/build.ts); nothing else in the screens changes.
 *
 * The original wrapped google.script.run. This posts the same function name
 * and the same arguments to the Edge Function, which answers with the same
 * { success, message, data } envelope, and resolves or rejects exactly as the
 * original did: a refusal rejects with .code and .payload, anything else that
 * goes wrong rejects with a plain message.
 *
 * The token is not added here. api() already passes it as the first argument,
 * where every server function expects it, and call() is used bare for the
 * functions that take no token (login) or take it explicitly (bootstrap).
 */
const PMS_API_URL = 'https://hmbebzxiirnjkrlbkylx.supabase.co/functions/v1/api';

function call(fn, ...args) {
  // A few names are answered in the page rather than by the server: the
  // phase table (which modules have moved) and the Apps Script file check
  // (see site/port.js).
  // A local answer of undefined means "not mine": the call goes to the server.
  const local = window.PMS_PORT && PMS_PORT.local[fn];
  const answer = local ? local(...args) : undefined;
  if (answer !== undefined) {
    if (answer.success === false) {
      return Promise.reject(Object.assign(new Error(answer.message), { code: answer.code, payload: answer }));
    }
    return Promise.resolve(answer);
  }

  // JSON is what google.script.run approximated too: undefined arguments
  // arrive as null, Dates as strings. The screens already avoided both.
  const body = JSON.stringify({ fn: fn, args: args });
  // One round trip: the parsed answer (null if it is not JSON), the raw text
  // and the status. Only the request itself failing rejects.
  const send = () => fetch(PMS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body
  }).then(response => response.text().then(text => {
    let res = null;
    try { res = JSON.parse(text); } catch (e) { /* not ours: settle says so */ }
    return { res: res, text: text, status: response.status };
  }), () => {
    throw new Error('Cannot reach the server. Check the connection and try again.');
  });

  // The platform itself sometimes turns a request away for a moment
  // (Supabase's SUPABASE_EDGE_RUNTIME_SERVICE_DEGRADED, seen on the first
  // morning live). That is refused at the door, before the server's code
  // runs, so nothing was done and sending it once more cannot do anything
  // twice. Only that refusal is retried — never a request that may have run.
  const turnedAway = r => !isEnvelope(r.res) && /SERVICE_DEGRADED/.test(r.text);

  return send().then(first => turnedAway(first)
    ? new Promise(wait => setTimeout(wait, 1500)).then(send).then(settle)
    : settle(first));

  /** Our server always answers { success, message, data }; anything else is not an answer. */
  function isEnvelope(res) {
    return !!res && typeof res === 'object' && typeof res.success === 'boolean';
  }

  function settle(r) {
    let res = r.res;
    // Before this check, a platform error that happened to be JSON resolved as
    // if it were data, and the screen showed nothing rather than saying so.
    if (!isEnvelope(res)) {
      throw new Error(turnedAway(r)
        ? 'The server is busy for a moment. Nothing was saved. Try again shortly.'
        // Anything else (a gateway timeout, say) may have arrived after the
        // server did the work, so it must not promise that nothing happened.
        : 'No answer from the server (HTTP ' + r.status + '). Check whether it went through before trying again.');
    }
    if (res.success === false) {
      // A function the new server does not have yet is a module that has not
      // moved, not a fault — say so in those words.
      if (res.code === 'UNKNOWN_FUNCTION') {
        res = Object.assign({}, res, {
          code: 'NOT_MOVED',
          message: 'This part has not moved to the new system yet (' + fn + ').'
        });
      }
      throw Object.assign(new Error(res.message), { code: res.code, payload: res });
    }
    return res;
  }
}

/** Authenticated call — token first, as every server endpoint expects. */
const api = (fn, ...args) => call(fn, App.token, ...args);

function can(permission) {
  if (!App.permissions) return false;
  if (App.permissions.indexOf('*') !== -1) return true;
  if (App.permissions.indexOf(permission) !== -1) return true;
  return App.permissions.some(p => p.indexOf(permission + '.') === 0);
}

function storeToken(t) {
  App.token = t || null;
  try { t ? sessionStorage.setItem('pms_token', t) : sessionStorage.removeItem('pms_token'); } catch (e) {}
}
function loadToken() {
  try { return sessionStorage.getItem('pms_token') || ''; } catch (e) { return ''; }
}

/**
 * Puts each line table's column heading on its cells as data-label, which the
 * phone layout shows above each box (12 Nov 2026). Watches the page, so line
 * tables drawn later in forms and dialogs are labelled too.
 */
function labelLines(root) {
  // Line tables, and any table whose rows are typed into (order lines, Tag codes…).
  (root || document).querySelectorAll('table.lines, table.data').forEach(t => {
    // ...and any table inside [data-cardify], read better as cards on a phone (Works, 13 Nov 2026).
    if (!t.classList.contains('lines') && !t.closest('[data-cardify]') &&
        !t.querySelector('tbody input:not([type=checkbox]):not([type=hidden]), tbody select')) return;
    t.classList.add('cardify');
    const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    if (!heads.length) return;
    t.querySelectorAll('tbody tr').forEach(tr => {
      [...tr.children].forEach((td, i) => { if (heads[i] && !td.dataset.label) td.dataset.label = heads[i]; });
    });
  });
}
new MutationObserver(() => labelLines()).observe(document.documentElement, { childList: true, subtree: true });

/**
 * The phone's back button (and the browser's) acts inside PMS (13 Nov 2026):
 * it closes the dialog or document on top, else goes back a screen as "‹ Back"
 * does; on a screen with nothing behind it, a second press leaves PMS. One
 * history entry is kept in front of the app so a press reaches us.
 */
const BackGuard = {
  armed: false, leaving: false,
  arm() { if (!this.armed) { history.pushState({ pmsGuard: 1 }, ''); this.armed = true; } },
  onBack() {
    this.armed = false;
    const layer = document.querySelector('.print-overlay');
    if (layer) { layer.remove(); this.arm(); return; }
    if (UI.closeTopModal()) { this.arm(); return; }
    const back = document.querySelector('#content [data-crumb-back]');
    if (back) { back.click(); this.arm(); return; }
    if (!this.leaving) {
      this.leaving = true;
      UI.info('Press back again to leave PMS');
      setTimeout(() => { this.leaving = false; this.arm(); }, 2500);
      return;
    }
    history.back();                                   // a second press: leave
  }
};
window.addEventListener('popstate', () => BackGuard.onBack());
// Re-armed on every tap: Chrome skips a history entry added without one.
document.addEventListener('click', () => BackGuard.arm(), { capture: true });

async function boot() {
  applyStoredTheme();
  const shell = document.getElementById('appShell');
  const login = document.getElementById('loginScreen');
  const splash = document.getElementById('splash');
  try {
    const res = await call('bootstrapSession', loadToken());
    if (res.data.authenticated) {
      adoptSession(res.data);
      splash.classList.add('hidden');
      shell.classList.remove('hidden');
      renderShell();
      navigate('dashboard');
    } else {
      splash.classList.add('hidden');
      login.classList.remove('hidden');
      renderLogin(res.data);
    }
  } catch (e) {
    splash.innerHTML = UI.errorState(e.message, 'retryBoot');
    const btn = document.getElementById('retryBoot');
    if (btn) btn.onclick = () => location.reload();
  }
}

function adoptSession(data) {
  App.user = data.user;
  App.permissions = data.permissions || [];
  App.settings = data.settings || {};
  App.enums = data.enums || {};
  App.roles = data.roles || [];
  if (data.token) storeToken(data.token);
  call('getAppMeta', App.token).then(r => { App.phases = r.data.phases || {}; renderNav(); }).catch(() => {});
}

function renderLogin(info) {
  const host = document.getElementById('loginScreen');
  host.innerHTML = `
    <div class="login-card">
      <div class="login-brand">
        ${info.companyLogoUrl
          ? `<img class="login-logo" src="${UI.esc(info.companyLogoUrl)}"

        ${UI.esc(info.appName || 'SIMCO PMS')} · ${UI.esc(info.version || '')}

    </div>`;

  document.getElementById('loginForm').onsubmit = async e => {
    e.preventDefault();

    const email = document.getElementById('loginEmail').value.trim();

    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';

      const res = await call('login', email, password);

function finishLogin(res) {

/* -------------------------------------------------------------- SHELL */

function renderShell() {
  document.getElementById('brandName').textContent = App.settings.companyName || 'SIMCO PMS';

  // A logo that fails to load leaves the name standing rather than a broken
  // image, so the bar never looks damaged.

      mark.alt = App.settings.companyName || 'Company';
      mark.classList.remove('hidden');

     <span class="user-role">${UI.esc(App.user.Role.replace(/_/g, ' '))}</span></span>`;

  };

/* ---------------------------------------------- NAVIGATION (M2, top bar) */

/**
 * Navigation is one module at a time, across the top. The button in the top
 * bar names the module you are in and drops down the full list; the strip
 * under it holds only that module's screens, so it never scrolls on a laptop
 * and the module you are in is never in doubt.
 *
 * A module with nothing this role can open is not offered at all.
 */

function visibleModules() {
  return NAV
    .map(group => ({ name: group.group, items: group.items.filter(i => can(i.perm)) }))
    .filter(m => m.items.length);
}

function moduleOf(routeId) {
  const found = NAV.find(g => g.items.some(i => i.id === routeId));
  return found ? found.group : null;
}

function moduleIcon(name) {
  const g = NAV.find(x => x.group === name);
  return g && g.items.length ? g.items[0].icon : '\u25A6';
}

/** Total waiting inside a module, so a collapsed module still speaks up. */
function moduleCount(mod) {
  return mod.items.reduce((n, i) => n + (App.navCounts[i.id] || 0), 0);
}

function currentModule() {
  const mods = visibleModules();
  if (!mods.length) return null;
  const byRoute = moduleOf(ROUTE_PARENTS[App.route] || App.route);
  if (byRoute && mods.some(m => m.name === byRoute)) return byRoute;
  if (App.module && mods.some(m => m.name === App.module)) return App.module;
  return mods[0].name;
}

function countChip(n) {
  if (!n) return '';
  return `<span class="nav-count">${n > 99 ? '99+' : n}</span>`;
}

function renderNav() {
  const nav = document.getElementById('nav');
  const bar = document.getElementById('modBar');
  nav.innerHTML = '';
  if (bar) bar.innerHTML = '';
  const mods = visibleModules();
  if (!mods.length) return;

  const current = currentModule();
  App.module = current;
  const mod = mods.find(m => m.name === current) || mods[0];

  // --- the switcher -------------------------------------------------
  const elsewhere = mods.reduce((n, m) => n + (m.name === mod.name ? 0 : moduleCount(m)), 0);
  const sw = UI.el('button', {
    class: 'mod-switch',
    id: 'modSwitch',
    title: 'Switch module'
  });
  sw.setAttribute('aria-haspopup', 'true');
  sw.setAttribute('aria-expanded', 'false');
  sw.innerHTML =
    `<span class="mod-switch-icon">${moduleIcon(mod.name)}</span>` +
    `<span class="mod-switch-text"><span class="mod-switch-label">Module</span>` +
    `<span class="mod-switch-name">${UI.esc(mod.name)}</span></span>` +
    (elsewhere ? `<span class="nav-count nav-count-elsewhere"
        title="${elsewhere} waiting in other modules">${elsewhere > 99 ? '99+' : elsewhere}</span>` : '') +
    `<span class="mod-switch-caret" aria-hidden="true">\u25BE</span>`;
  sw.onclick = toggleModuleMenu;
  (bar || nav).appendChild(sw);

  // --- the screens of this module -----------------------------------
  const list = UI.el('div', { class: 'nav-group' });
  const activeRoute = ROUTE_PARENTS[App.route] || App.route;
  mod.items.forEach(item => {
    const built = isBuilt(item);
    const loaded = typeof PAGES[item.id] === 'function';
    const b = UI.el('button', {
      class: 'nav-item' + (activeRoute === item.id ? ' active' : ''),
      title: !built ? `${item.label} \u2014 not moved to the new system yet`
        : loaded ? item.label
        : `${item.label} \u2014 its code did not load` +
          (ROUTE_SOURCE[item.id] ? ` (${ROUTE_SOURCE[item.id]})` : '')
    });
    b.innerHTML = `<span class="nav-icon">${item.icon}</span><span>${UI.esc(item.label)}</span>` +
      (!built ? `<span class="nav-phase">Not moved yet</span>`
        : loaded ? countChip(App.navCounts[item.id])
        : `<span class="nav-phase nav-broken" title="Its code did not load">!</span>`);
    b.disabled = !built;
    if (built) b.onclick = () => navigate(item.id);
    list.appendChild(b);
  });
  nav.appendChild(list);
  // On a narrow screen the strip slides: bring the screen you are on into view,
  // and fold the phone's search box away once you have gone somewhere.
  const on = list.querySelector('.nav-item.active');
  if (on && nav.scrollWidth > nav.clientWidth) {
    nav.scrollLeft += on.getBoundingClientRect().left - nav.getBoundingClientRect().left
      - (nav.clientWidth - on.offsetWidth) / 2;
  }
  const topbarEl = document.querySelector('.topbar');
  if (topbarEl) topbarEl.classList.remove('search-open');
}

/** Listeners that belong to an open menu, so closing takes them with it. */
let modMenuListeners = null;

function closeModuleMenu() {
  if (modMenuListeners) {
    document.removeEventListener('mousedown', modMenuListeners.away);
    document.removeEventListener('keydown', modMenuListeners.esc);
    modMenuListeners = null;
  }
  const m = document.getElementById('modMenu');
  if (m) m.remove();
  const sw = document.getElementById('modSwitch');
  if (sw) sw.setAttribute('aria-expanded', 'false');
}

function toggleModuleMenu() {
  if (document.getElementById('modMenu')) { closeModuleMenu(); return; }
  const sw = document.getElementById('modSwitch');
  const menu = UI.el('div', { class: 'mod-menu', id: 'modMenu' });
  menu.innerHTML = '<div class="mod-menu-head">Pick a module and the strip below shows its screens.</div>';

  visibleModules().forEach(m => {
    const n = moduleCount(m);
    const b = UI.el('button', {
      class: 'mod-menu-item' + (m.name === App.module ? ' current' : '')
    });
    const first = m.items.find(i => isBuilt(i)) || m.items[0];
    b.innerHTML =
      `<span class="mod-menu-icon">${moduleIcon(m.name)}</span>` +
      `<span class="mod-menu-text"><span class="mod-menu-name">${UI.esc(m.name)}</span>` +
      `<span class="mod-menu-sub" title="${UI.esc(m.items.map(i => i.label).join(', '))}">` +
      `${UI.esc(m.items.map(i => i.label).join(', '))}</span></span>` +
      countChip(n);
    b.onclick = () => {
      closeModuleMenu();
      App.module = m.name;
      // Land on the first screen this role can actually open — and if that one's
      // code never loaded, try the rest before reporting, so one missing file
      // does not shut a module that still has working screens.
      const openable = m.items.find(i => isBuilt(i) && typeof PAGES[i.id] === 'function');
      if (openable) navigate(openable.id);
      else if (first && isBuilt(first)) navigate(first.id);   // reports what is wrong
      else renderNav();
    };
    menu.appendChild(b);
  });

  const rect = sw.getBoundingClientRect();
  menu.style.left = rect.left + 'px';
  menu.style.top = (rect.bottom + 6) + 'px';
  menu.style.width = Math.min(Math.max(rect.width, 352), window.innerWidth - 24) + 'px';
  document.body.appendChild(menu);
  sw.setAttribute('aria-expanded', 'true');

  // Attached now, not on a later tick: this runs on click, so the mousedown
  // that opened the menu has already passed and cannot close it again. A
  // deferred listener would leave a gap where clicking away did nothing.
  const away = e => { if (!menu.contains(e.target) && !sw.contains(e.target)) closeModuleMenu(); };
  const esc = e => { if (e.key === 'Escape') { closeModuleMenu(); sw.focus(); } };
  document.addEventListener('mousedown', away);
  document.addEventListener('keydown', esc);
  modMenuListeners = { away: away, esc: esc };
}

/**
 * Counts are the price of showing one module at a time: without them a request
 * waiting in another module is invisible. One server call, cached both sides.
 */
async function refreshNavCounts() {
  if (!App.token) return;
  try {
    const d = (await call('getNavCounts', App.token)).data;
    App.navCounts = (d && d.counts) || {};
    renderNav();
  } catch (e) { /* a badge is never worth an error on screen */ }
}

function toggleUserMenu() {
  const existing = document.getElementById('userMenu');
  if (existing) { existing.remove(); return; }
  const menu = UI.el('div', { class: 'dropdown', id: 'userMenu' });
  menu.innerHTML = `<div class="dropdown-head">${UI.esc(App.user.Email)}</div>`;
  const add = (label, fn) => {
    const b = UI.el('button', { class: 'dropdown-item', text: label });
    b.onclick = () => { menu.remove(); fn(); };
    menu.appendChild(b);
  };
  add('My profile', () => navigate('profile'));
  add('Change password', openChangePassword);
  add(document.documentElement.dataset.theme === 'dark' ? 'Light theme' : 'Dark theme', toggleTheme);
  menu.appendChild(UI.el('div', { class: 'dropdown-sep' }));
  add('Sign out', doLogout);
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('mousedown', function off(e) {
    if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('mousedown', off); }
  }), 0);
}

function applyStoredTheme() {
  let t = 'light';
  try { t = localStorage.getItem('pms_theme') || 'light'; } catch (e) {}
  document.documentElement.dataset.theme = t;
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('pms_theme', next); } catch (e) {}

async function doLogout() {
  try { await api('logout'); } catch (e) {}
  storeToken(null);
  location.reload();
}
