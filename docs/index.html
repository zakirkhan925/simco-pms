async function loadSchedule(projectId) {
  const mount = document.getElementById('schBody');
  if (!mount) return;
  mount.innerHTML = UI.loadingState();
  try {
    const res = await api('listSchedule', projectId, scheduleState);
    const d = res.data;

    const statusSel = document.getElementById('schStatus');
    if (statusSel && !statusSel.dataset.filled) {
      statusSel.innerHTML = '<option value="">All statuses</option>' +
        d.statuses.map(s => `<option value="${s}">${s}</option>`).join('');
      statusSel.value = scheduleState.status;
      statusSel.dataset.filled = '1';
      statusSel.onchange = e => { scheduleState.status = e.target.value; loadSchedule(projectId); };
    }
    const actions = document.getElementById('schActions');
    if (actions && !actions.dataset.filled) {
      actions.dataset.filled = '1';
      if (d.canEdit) {
        const add = UI.el('button', { class: 'btn btn-sm btn-primary', text: '+ Add activity' });
        add.onclick = () => openActivityForm(projectId, null);
        actions.appendChild(add);
      }
      actions.appendChild(importExportBar('SCHEDULE', projectId,
        () => navigate('project', { projectId, tab: 'schedule' }), d.canEdit,
        () => ({ search: scheduleState.search, filters: { Status: scheduleState.status } })));
    }
    const msActions = document.getElementById('msActions');
    if (msActions && !msActions.dataset.filled && d.canEdit) {
      msActions.dataset.filled = '1';
      const add = UI.el('button', { class: 'btn btn-sm', text: '+ Add milestone' });
      add.onclick = () => openMilestoneForm(projectId, null);
      msActions.appendChild(add);
    }

    const s = d.summary;
    document.getElementById('schSummary').innerHTML = `
      <div class="stat-grid" style="padding:16px 16px 0">
        ${[['Activities', s.activities, `${s.delayed} delayed`],
           ['Planned progress', UI.fmt.percent(s.plannedProgress), 'Weighted by activity'],
           ['Actual progress', UI.fmt.percent(s.actualProgress), 'Weighted by activity'],
           ['Variance', UI.fmt.percent(s.variance), s.variance < 0 ? 'Behind plan' : 'On or ahead of plan'],
           ['Window', (s.earliestStart || '—') + ' → ' + (s.latestFinish || '—'), 'Earliest start to latest finish']]
          .map(x => `<div class="stat"><div class="stat-label">${UI.esc(x[0])}</div>

    mount.innerHTML = UI.errorState(e.message, 'retrySch');

/** Simple, honest Gantt: one bar per activity positioned on the project window. */
function renderGantt(mount, d, projectId) {
  const rows = d.rows.filter(r => r.StartDate && r.FinishDate);
  if (!rows.length) {
    mount.innerHTML = UI.emptyState('Nothing to plot', 'Activities need a start and finish date.');
    return;
  }
  const min = new Date(d.summary.earliestStart).getTime();
  const max = new Date(d.summary.latestFinish).getTime();
  const span = Math.max(1, max - min);
  const pos = t => ((new Date(t).getTime() - min) / span) * 100;

  const tone = { Completed: 'var(--green-600)', Delayed: 'var(--red-600)',
                 'In Progress': 'var(--accent)', 'On Hold': 'var(--amber-600)', 'Not Started': 'var(--slate-400)' };

  mount.innerHTML = `
    <div style="padding:16px">
      <div class="between muted" style="font-size:12px;margin-bottom:8px">
        <span>${UI.esc(d.summary.earliestStart)}</span><span>${UI.esc(d.summary.latestFinish)}</span></div>
      ${rows.map(r => {
        const left = pos(r.StartDate), width = Math.max(0.8, pos(r.FinishDate) - left);
        return `<div style="display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:12px;
                  align-items:center;padding:5px 0;border-bottom:1px solid var(--border)">
          <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${UI.esc(r.ActivityName)}">
            <span class="mono muted">${UI.esc(r.WBS || '')}</span> ${UI.esc(r.ActivityName)}</div>
          <div style="position:relative;height:22px;background:var(--surface-2);border-radius:4px">
            <div title="${UI.esc(r.StartDate)} → ${UI.esc(r.FinishDate)} · ${UI.fmt.percent(r.ActualPercent)}"
                 style="position:absolute;left:${left}%;width:${width}%;top:3px;height:16px;
                        background:${tone[r.Status] || 'var(--accent)'};border-radius:3px;opacity:.35"></div>
            <div style="position:absolute;left:${left}%;width:${width * (Math.min(100, r.ActualPercent) / 100)}%;
                        top:3px;height:16px;background:${tone[r.Status] || 'var(--accent)'};border-radius:3px"></div>
          </div>
        </div>`;
      }).join('')}
      <div class="flex gap-16 mt-16 muted" style="font-size:12px;flex-wrap:wrap">
        ${Object.keys(tone).map(k => `<span><span style="display:inline-block;width:10px;height:10px;
          border-radius:2px;background:${tone[k]}"></span> ${k}</span>`).join('')}
        <span>Solid = actual progress, pale = planned duration.</span>
      </div>
    </div>`;
}

  const groups = (r.CategoryGroups && r.CategoryGroups.length)
    ? r.CategoryGroups

  if (!groups.length || !groups[0].items.length) return '<span class="muted">—</span>';
  return groups.map(g =>

    g.items.map(i => `<span class="chip">${UI.esc(i)}</span>`).join('') +
    `</div>`).join('');
}

       </div>

     </div>`;

  const cat = document.getElementById('vCategory');

    (vendorMeta.categories || App.enums.VENDOR_CATEGORIES || [])
      .map(c => `<option value="${UI.esc(c)}">${UI.esc(c)}</option>`).join('');
  cat.value = vendorState.category;
  document.getElementById('vStatus').value = vendorState.status;

  let debounce;
  document.getElementById('vSearch').oninput = e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { vendorState.search = e.target.value; vendorState.page = 1; loadVendors(); }, 250);
  };
  cat.onchange = e => { vendorState.category = e.target.value; vendorState.page = 1; loadVendors(); };
  document.getElementById('vStatus').onchange = e => { vendorState.status = e.target.value; vendorState.page = 1; loadVendors(); };
  document.getElementById('vReset').onclick = () => {
    Object.assign(vendorState, { page: 1, search: '', category: '', status: '' });
    pageVendors(root);
  };
  const add = document.getElementById('addVendorBtn');
  if (add) add.onclick = () => openVendorForm(null);

  document.getElementById('vendorActions').appendChild(
    importExportBar('VENDORS', null, () => loadVendors(), can('vendor.import'),
      () => ({ search: vendorState.search, filters: { Category: vendorState.category, Status: vendorState.status } })));

  await loadVendors();
}

/* ------------------------------------------------- VENDOR LEDGER & PAYMENTS
 * One running account per vendor. Invoices are debits, payments are credits,
 * and goods received but not yet billed sit beside the balance rather than
 * inside it — the vendor cannot claim what he has not invoiced.
 */

async function loadVendorLedger(vendorId) {
  const host = document.getElementById('vendorLedger');
  if (!host) return;
  host.innerHTML = UI.loadingState();
  const sym = App.settings.currencySymbol || 'Rs';
  const from = (document.getElementById('ledFrom') || {}).value || '';
  const to = (document.getElementById('ledTo') || {}).value || '';
  try {
    const d = (await api('getVendorLedger', vendorId, { from, to })).data;
    const s = d.summary;
    // One line of figures, not four cards: the statement below is the thing
    // being read, and tiles the height of the page pushed it out of sight.
    document.getElementById('vendorLedgerSummary').innerHTML =
      `<div class="ledger-figures">
        ${[['Opening', UI.fmt.money(d.openingBalance, sym)],
           ['Invoiced', UI.fmt.money(s.invoiced, sym)],
           ['Paid', UI.fmt.money(s.paid, sym)],
           ['Balance owed', UI.fmt.money(s.closingBalance, sym), 'strong'],
           ['Received, not billed', UI.fmt.money(s.receivedNotInvoiced, sym)]]
          .map(t => `<div class="ledger-figure${t[2] ? ' is-total' : ''}">
            <span>${UI.esc(t[0])}</span><strong>${UI.esc(t[1])}</strong></div>`).join('')}
      </div>`;

    // The brought-forward line makes the running balance verifiable: every
    // figure in the Balance column follows from the one above it.
    const rows = [{ opening: true, date: '', type: '', ref: '', document: '',
                    description: 'Balance brought forward', project: '',
                    debit: 0, credit: 0, balance: d.openingBalance }]
      .concat(d.entries);
    UI.table(host, {
      columns: [
        { key: 'date', label: 'Date', width: '96px', render: r =>
          r.opening ? '' : UI.fmt.date(r.date) },
        { key: 'type', label: 'Type', width: '92px', render: r =>
          r.opening ? '' : UI.badge(r.type, r.type === 'Invoice' ? 'amber' : 'green') },
        { key: 'ref', label: 'Reference', width: '130px', render: r =>
          r.opening ? '' :
          // The reference is what someone reads out on the phone, so it is
          // never allowed to break across lines.
          `<span class="mono nowrap">${UI.esc(r.ref)}</span>` +
          (r.document ? `<br><span class="muted">${UI.esc(r.document)}</span>` : '') },
        { key: 'description', label: 'Particulars', render: r =>
          (r.opening ? `<em>${UI.esc(r.description)}</em>` : UI.esc(r.description)) +
          (r.project ? `<br><span class="muted">${UI.esc(r.project)}</span>` : '') },
        { key: 'debit', label: 'Debit', align: 'right', width: '108px', render: r =>
          r.debit ? UI.fmt.number(r.debit) : '<span class="muted">—</span>' },
        { key: 'credit', label: 'Credit', align: 'right', width: '108px', render: r =>
          r.credit ? UI.fmt.number(r.credit) : '<span class="muted">—</span>' },
        { key: 'balance', label: 'Balance', align: 'right', width: '116px', render: r =>
          `<strong>${UI.fmt.number(r.balance)}</strong>` },
        // Each line opens the document behind it: an invoice to correct or
        // cancel, a payment to print as a voucher.
        { key: 'actions', label: '', align: 'right', width: '92px', render: r =>
          r.opening ? ''
            : r.type === 'Payment'
            ? `<div class="row-actions"><button class="btn btn-sm"
                 data-voucher="${UI.esc(r.ref)}">Voucher</button></div>`
            : `<div class="row-actions"><button class="btn btn-sm"
                 data-invoice="${UI.esc(r.ref)}">Open</button></div>` }
      ],
      rows: rows,
      empty: UI.emptyState('Nothing on the account',
        'Record an invoice, then a payment against it.')
    });
    host.querySelectorAll('[data-voucher]').forEach(b => {
      b.onclick = () => printRecord('VENDORPAY', b.dataset.voucher);
    });
    host.querySelectorAll('[data-invoice]').forEach(b => {
      b.onclick = () => openSupplierInvoice(b.dataset.invoice, () => loadVendorLedger(vendorId));
    });
  } catch (e) {
    host.innerHTML = UI.errorState(e.message, 'retryLedger');
    const b = document.getElementById('retryLedger');
    if (b) b.onclick = () => loadVendorLedger(vendorId);
  }
}

async function exportVendorLedger(vendorId) {
  const from = (document.getElementById('ledFrom') || {}).value || '';
  const to = (document.getElementById('ledTo') || {}).value || '';
  try {
    const d = (await api('getVendorLedger', vendorId, { from, to })).data;
    const head = ['Date', 'Type', 'Reference', 'Document', 'Project', 'Detail',
                  'Debit', 'Credit', 'Balance'];
    const esc = v => {
      const t = String(v === undefined || v === null ? '' : v);
      return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    const lines = [head.join(',')];
    if (d.openingBalance) {
      lines.push(['', 'Opening', '', '', '', 'Balance brought forward', '', '',
                  d.openingBalance].map(esc).join(','));
    }
    d.entries.forEach(e => lines.push([
      UI.fmt.date(e.date), e.type, e.ref, e.document, e.project, e.description,
      e.debit || '', e.credit || '', e.balance].map(esc).join(',')));
    downloadCsv(`${d.vendor.CompanyName.replace(/[^A-Za-z0-9]+/g, "_")}_ledger.csv`,
                 lines.join('\n'));
  } catch (e) { UI.error('Could not export the ledger', e.message); }
}

/**
 * An invoice, opened from the statement.
 *
 * The first thing it shows is its own position — net, paid, outstanding —
 * and the payments behind that figure, because that is what decides whether
 * anything can be done to it. Correcting and cancelling are offered only
 * while no live payment is settled against it; otherwise the reason is
 * stated instead of the buttons, so nobody hunts for a disabled control.
 */
async function openSupplierInvoice(invoiceId, onDone) {
  let d;
  try { d = (await api('getSupplierInvoice', invoiceId)).data; }
  catch (e) { UI.error('Could not open the invoice', e.message); return; }

  const inv = d.invoice;
  const sym = App.settings.currencySymbol || 'Rs';
  const money = n => UI.fmt.money(n, sym);
  const tone = { Unpaid: 'amber', 'Partially Paid': 'blue', Paid: 'green', Cancelled: 'grey' };

  const body = UI.el('div');
  body.innerHTML = `
    <dl class="kv">
      <dt>Vendor</dt><dd>${UI.esc(d.vendor ? d.vendor.CompanyName : inv.VendorID)}</dd>
      <dt>Invoice no.</dt><dd class="mono">${UI.esc(inv.InvoiceNumber)}</dd>
      <dt>Invoice date</dt><dd>${UI.esc(UI.fmt.date(inv.InvoiceDate))}</dd>
      <dt>Due</dt><dd>${inv.DueDate ? UI.esc(UI.fmt.date(inv.DueDate)) : '—'}</dd>
      <dt>Project</dt><dd>${UI.esc(d.project ? d.project.ProjectName : '—')}</dd>
      <dt>Against</dt><dd>${UI.esc(inv.POID || inv.GRNID || '—')}</dd>
      <dt>Status</dt><dd>${UI.badge(inv.Status, tone[inv.Status] || 'grey')}</dd>
    </dl>
    <table class="data" style="margin-top:4px">
      <tbody>
        <tr><td>Amount before tax</td><td class="r">${money(inv.Amount)}</td></tr>
        <tr><td>Tax</td><td class="r">${money(inv.TaxAmount)}</td></tr>
        <tr><td><strong>Net payable</strong></td><td class="r"><strong>${money(inv.NetAmount)}</strong></td></tr>
        <tr><td>Paid</td><td class="r">${money(inv.PaidAmount)}</td></tr>
        <tr><td><strong>Outstanding</strong></td><td class="r"><strong>${money(inv.Outstanding)}</strong></td></tr>
      </tbody>
    </table>
    ${d.payments.length ? `<div class="mt-16"><strong style="font-size:12.5px">Payments</strong>
      <table class="data mt-8"><thead><tr><th>Date</th><th>Voucher</th><th>Method</th>
        <th class="r">Amount</th><th></th></tr></thead>
      <tbody>${d.payments.map(p => `<tr${p.IsReversed ? ' class="muted"' : ''}>
        <td>${UI.esc(UI.fmt.date(p.PaymentDate))}</td>
        <td class="mono">${UI.esc(p.VendorPaymentID)}</td>
        <td>${UI.esc(p.Method)}${p.Reference ? ' · ' + UI.esc(p.Reference) : ''}</td>
        <td class="r">${money(p.Amount)}</td>
        <td>${p.IsReversed ? UI.badge('Reversed', 'red') : ''}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
    ${d.blockedBy ? `<div class="banner banner-info mt-16"><div>${UI.esc(d.blockedBy)}</div></div>` : ''}`;

  const footer = [{ label: 'Close', onClick: m => m.close() }];
  if (d.canCancel) {
    footer.push({ label: 'Cancel invoice', class: 'btn-danger', onClick: m => {
      m.close();
      openReasonModal({
        title: 'Cancel invoice ' + invoiceId,
        label: 'Why is it being cancelled?',
        confirmLabel: 'Cancel invoice', danger: true,
        intro: `<strong>${money(inv.NetAmount)}</strong> comes off this vendor's balance. ` +
               'The invoice stays on the record marked Cancelled — nothing is deleted.',
        onConfirm: async reason => {
          const res = await api('cancelSupplierInvoice', invoiceId, reason);
          UI.success('Cancelled', res.message);
          if (onDone) onDone();
        }
      });
    }});
  }
  if (d.canEdit) {
    footer.push({ label: 'Edit', class: 'btn-primary', onClick: m => {
      m.close();
      openSupplierInvoiceEdit(d, onDone);
    }});
  }

  UI.modal({ title: 'Invoice ' + invoiceId, size: 'wide', body, footer });

    const b = UI.el('div', { class: 'banner banner-info' });
    b.innerHTML = `<div>Unpaid invoices: ${open.map(e =>
      `<span class="mono">${UI.esc(e.ref)}</span> ${UI.fmt.money(e.debit, sym)}`).join(' · ')}</div>`;
    body.appendChild(b);
  }
  const form = UI.form(fields, {});
  body.appendChild(form);
  UI.modal({
    title: 'Payment or advance — ' + vendor.CompanyName, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Record payment', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(form, fields);
        if (!data) return;
        data.VendorID = vendor.VendorID;
        if (data.SupplierInvoiceID) data.POID = '';   // the invoice names its own order
        else if (data.POID) {
          const o = orders.find(x => x.POID === data.POID);
          if (o) data.ProjectID = o.ProjectID;
        }
        m.busy(true);
        try {
          const res = await api('recordVendorPayment', data);
          m.close(); UI.success('Recorded', res.message);
          if (onSaved) onSaved();
        } catch (e) { UI.error('Could not record the payment', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

async function pageVendorProfile(root, vendorId) {

           s.evaluations + ' evaluation(s)'],
          ['Purchase orders', s.totalOrders, `${s.openOrders} open, ${s.completedOrders} completed`],

          ['On-time delivery', s.onTimeRate === null ? '—' : UI.fmt.percent(s.onTimeRate),

            `${UI.fmt.number(s.rejectedQty, 2)} of ${UI.fmt.number(s.receivedQty, 2)} received`],
          ['Projects supplied', s.projectsSupplied, 'Distinct projects']]
         .map(t => `<div class="stat"><div class="stat-label">${UI.esc(t[0])}</div>
           <div class="stat-value">${UI.esc(t[1])}</div><div class="stat-note">${UI.esc(t[2])}</div>
           <div class="stat-accent"></div></div>`).join('')}
     </div>

     ${d.canLedger ? `<div class="card mt-24">
       <div class="card-head"><div class="card-title">Statement of account</div>
         <div class="filters" style="margin:0">
           <div class="field"><label for="ledFrom">From</label>

     <div class="mt-16" style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start" id="vendGrid">
       <div>

         </div>

  UI.table(document.getElementById('vendorPOs'), {

    b.onclick = () => UI.confirm({

function openVendorStatus(vendor) {
  const fields = [
    { name: 'Status', label: 'Status', type: 'select', required: true, span: 2,
      options: ['Active', 'Inactive', 'Blacklisted'], value: vendor.Status },
    { name: 'Reason', label: 'Reason', type: 'textarea', span: 2,
      hint: 'Required when blacklisting. Recorded in the vendor notes and the audit trail.' }
  ];
  const body = UI.form(fields);
  UI.modal({
    title: 'Change vendor status', size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Apply', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(body, fields);
        if (!data) return;
        m.busy(true);
        try {
          const r = await api('setVendorStatus', vendor.VendorID, data.Status, data.Reason);
          m.close();
          if (/still open/.test(r.message)) UI.warn('Status changed', r.message);
          else UI.success('Status changed', r.message);
          navigate('vendor', vendor.VendorID);
        } catch (e) { UI.error('Could not change status', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

function openEvaluationForm(vendor) {
  const score = { type: 'select', options: [
    { value: '5', label: '5 — Excellent' }, { value: '4', label: '4 — Good' },
    { value: '3', label: '3 — Acceptable' }, { value: '2', label: '2 — Poor' },
    { value: '1', label: '1 — Unacceptable' }] };
  const fields = [
    Object.assign({ name: 'DeliveryScore', label: 'Delivery on time (weight 0.30)', required: true }, score),
    Object.assign({ name: 'QualityScore', label: 'Quality of supply (weight 0.30)', required: true }, score),
    Object.assign({ name: 'PriceScore', label: 'Price competitiveness (weight 0.25)', required: true }, score),
    Object.assign({ name: 'ResponsivenessScore', label: 'Responsiveness (weight 0.15)', required: true }, score),
    { name: 'POID', label: 'Against purchase order (optional)' },
    { name: 'Comments', label: 'Comments', type: 'textarea', span: 2 }
  ];
  const body = UI.form(fields);
  const live = UI.el('div', { class: 'banner banner-info span-2' });
  body.appendChild(live);
  const recompute = () => {
    const v = UI.readForm(body);
    const overall = (Number(v.DeliveryScore) || 0) * 0.3 + (Number(v.QualityScore) || 0) * 0.3 +
                    (Number(v.PriceScore) || 0) * 0.25 + (Number(v.ResponsivenessScore) || 0) * 0.15;
    live.innerHTML = `<div>Overall score <strong>${overall.toFixed(2)} / 5</strong>
      <br><span class="muted">Weighted average. The rejection rate is taken from goods receipts, not scored here.</span></div>`;
  };
  body.querySelectorAll('select').forEach(sel => sel.addEventListener('change', recompute));
  recompute();

  UI.modal({
    title: 'Evaluate ' + vendor.CompanyName, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Record evaluation', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(body, fields);
        if (!data) return;
        m.busy(true);
        try {
          const r = await api('recordVendorPerformance', vendor.VendorID, data);
          m.close(); UI.success('Evaluation recorded', r.message);
          navigate('vendor', vendor.VendorID);
        } catch (e) { UI.error('Could not record', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

function openContactForm(vendorId) {
  const fields = [
    { name: 'Name', label: 'Name', required: true, span: 2 },
    { name: 'Designation', label: 'Designation' },
    { name: 'Phone', label: 'Phone' },
    { name: 'Email', label: 'Email', type: 'email', span: 2 },
    { name: 'IsPrimary', label: 'Primary contact', type: 'checkbox', span: 2 }
  ];
  const body = UI.form(fields);
  UI.modal({
    title: 'Add contact', size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Add', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(body, fields);
        if (!data) return;
        m.busy(true);
        try {
          await api('addVendorContact', vendorId, data);
          m.close(); UI.success('Contact added'); navigate('vendor', vendorId);
        } catch (e) { UI.error('Could not add', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

</script>

  <script>
/* =============================================================
   Procurement.html — Phase 5. Purchase requests and the approval
   workflow. Loaded after JavaScript.html and registers its own
   routes on the shared PAGES table.
   ============================================================= */

const prState = {
  page: 1, pageSize: 25, search: '', status: '', stage: '', projectId: '',
  awaitingMe: false, mineOnly: false, sortBy: 'RequestDate', sortDir: 'desc'
};

const PR_STATUS_TONE = {
  DRAFT: 'grey', SUBMITTED: 'blue', STOCK_VERIFIED: 'amber', PM_APPROVED: 'violet',
  MANAGEMENT_APPROVED: 'violet', ADMIN_APPROVED: 'violet',
  APPROVED_FOR_PROCUREMENT: 'green', RFQ_ISSUED: 'blue', PO_CREATED: 'green',
  CLOSED: 'grey', REJECTED: 'red', RETURNED: 'red', CANCELLED: 'grey'
};
const prStatusLabel = s => String(s || '').replace(/_/g, ' ').toLowerCase()
  .replace(/^./, c => c.toUpperCase());

/* ------------------------------------------------------------- LIST */

async function pagePurchaseRequests(root, arg) {
  // Opened from inside a project, the list is scoped to it; opened from the
  // sidebar, it is not. The filter lives in state either way.
  prState.projectId = (arg && arg.projectId) ? arg.projectId : '';
  // Inside a project, cancelled requests are left out (owner's request, 23 Oct 2026).
  prState.hideCancelled = !!prState.projectId;
  if (arg && arg.projectId) prState.page = 1;
  const sym = App.settings.currencySymbol || 'Rs';
  root.innerHTML =
    pageHead('Purchase Requests', 'Raise, verify, approve — every stage recorded',
      `<span id="prActions" class="flex gap-8"></span>` +
      (can('pr.create') ? `<button class="btn btn-primary" id="newPrBtn">+ New request</button>` : '')) +
    `<div id="prSummary" class="stat-grid" style="margin-bottom:16px"></div>
     <div class="card">
       <div class="card-head">
         <div class="filters">
           <div class="field"><label for="prSearch">Search</label>
             <input class="input" id="prSearch" placeholder="PR number, department, requester"
                    value="${UI.esc(prState.search)}"></div>
           <div class="field"><label for="prStatus">Status</label><select class="input" id="prStatus"></select></div>
           <div class="field"><label for="prStage">Waiting at</label><select class="input" id="prStage"></select></div>
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="prAwaiting"> Awaiting my decision</label></div>
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="prMine"> Raised by me</label></div>
           <button class="btn" id="prReset">Reset</button>
         </div>
         <button class="btn btn-sm" id="prWorkflowBtn">How approval works</button>
       </div>
       <div id="prTable">${UI.loadingState()}</div>
       <div id="prPager"></div>
     </div>`;

  const statusSel = document.getElementById('prStatus');
  statusSel.innerHTML = '<option value="">All statuses</option>' +
    (App.enums.PR_STATUS || []).map(s => `<option value="${s}">${prStatusLabel(s)}</option>`).join('');
  statusSel.value = prState.status;

  const stageSel = document.getElementById('prStage');
  stageSel.innerHTML = '<option value="">Any stage</option>' +
    [['STOCK_VERIFICATION', 'Stock verification'], ['PM_APPROVAL', 'Project manager'],
     ['MANAGEMENT_APPROVAL', 'Management'], ['ADMIN_APPROVAL', 'Administrator']]
      .map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  stageSel.value = prState.stage;

  document.getElementById('prAwaiting').checked = prState.awaitingMe;
  document.getElementById('prMine').checked = prState.mineOnly;

  let debounce;
  document.getElementById('prSearch').oninput = e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { prState.search = e.target.value; prState.page = 1; loadPurchaseRequests(); }, 250);
  };
  statusSel.onchange = e => { prState.status = e.target.value; prState.page = 1; loadPurchaseRequests(); };
  stageSel.onchange = e => { prState.stage = e.target.value; prState.page = 1; loadPurchaseRequests(); };
  document.getElementById('prAwaiting').onchange = e => {
    prState.awaitingMe = e.target.checked; prState.page = 1; loadPurchaseRequests();
  };
  document.getElementById('prMine').onchange = e => {
    prState.mineOnly = e.target.checked; prState.page = 1; loadPurchaseRequests();
  };
  document.getElementById('prReset').onclick = () => {
    Object.assign(prState, { page: 1, search: '', status: '', stage: '', awaitingMe: false, mineOnly: false });
    pagePurchaseRequests(root);
  };
  document.getElementById('prWorkflowBtn').onclick = showWorkflowConfig;
  const nb = document.getElementById('newPrBtn');
  if (nb) nb.onclick = () => openPrForm(null);

  // Import, Template and Export, the same three as BOQ, Budget and Vendors.
  // A request belongs to a project: the list's project filter supplies it when
  // one is chosen, and the import asks when it is not.
  document.getElementById('prActions').appendChild(
    importExportBar('PR', prState.projectId || null, () => loadPurchaseRequests(),
      can('pr.create'),
      () => ({ projectId: prState.projectId, search: prState.search,
               filters: { Status: prState.status } }),
      { projectScoped: true }));

  await loadPurchaseRequests();
}

async function loadPurchaseRequests() {
  const mount = document.getElementById('prTable');
  if (!mount) return;
  const sym = App.settings.currencySymbol || 'Rs';
  mount.innerHTML = UI.loadingState();
  try {
    const res = await api('listPurchaseRequests', prState);
    const d = res.data;

    document.getElementById('prSummary').innerHTML =
      [['Requests', d.summary.total, 'Visible to you'],
       ['Awaiting my decision', d.summary.awaitingMe, 'At a stage you can action'],
       ['Approved for procurement', d.summary.byStatus.APPROVED_FOR_PROCUREMENT || 0, 'Ready for RFQ or PO'],
       ['Value', UI.fmt.money(d.summary.estimatedValue, sym), 'Purchase value after stock check']]
        .map(t => `<div class="stat"><div class="stat-label">${UI.esc(t[0])}</div>
          <div class="stat-value">${UI.esc(t[1])}</div><div class="stat-note">${UI.esc(t[2])}</div>
          <div class="stat-accent"></div></div>`).join('');

    UI.table(mount, {
      sortBy: prState.sortBy, sortDir: prState.sortDir,
      onSort: key => {
        prState.sortDir = (prState.sortBy === key && prState.sortDir === 'asc') ? 'desc' : 'asc';
        prState.sortBy = key; loadPurchaseRequests();
      },
      columns: [
        { key: 'PRID', label: 'Request', render: r =>
          `<a href="#" data-open="${UI.esc(r.PRID)}"><strong class="mono">${UI.esc(r.PRID)}</strong></a>
           <br><span class="muted">${UI.esc(r.ItemCount)} item(s)</span>` },
        { key: 'ProjectName', label: 'Project', render: r =>
          `${UI.esc(r.ProjectName)}<br><span class="muted">${UI.esc(r.Department)}</span>` },
        { key: 'RequestedByName', label: 'Raised by', render: r =>
          `${UI.esc(r.RequestedByName)}<br><span class="muted">${UI.fmt.date(r.RequestDate)}</span>` },
        { key: 'RequiredDate', label: 'Required by', render: r => UI.fmt.date(r.RequiredDate) },
        { key: 'Priority', label: 'Priority', render: r =>
          UI.badge(r.Priority, r.Priority === 'Urgent' ? 'red' : r.Priority === 'High' ? 'amber' : 'grey') },
        { key: 'ApprovalValue', label: 'Value', align: 'right', render: r =>
          `${UI.fmt.money(r.ApprovalValue, sym)}${r.PurchaseTotal > 0 && r.PurchaseTotal !== r.EstimatedTotal
            ? `<br><span class="muted">est. ${UI.fmt.number(r.EstimatedTotal)}</span>` : ''}` },
        { key: 'Status', label: 'Status', render: r =>
          UI.badge(prStatusLabel(r.Status), PR_STATUS_TONE[r.Status]) },
        { key: 'CurrentStageLabel', label: 'Waiting at', render: r =>
          r.CurrentStageLabel ? UI.esc(r.CurrentStageLabel) : '<span class="muted">—</span>' },
        { key: 'actions', label: '', sortable: false, align: 'right', render: r =>
          `<div class="row-actions"><button class="btn btn-sm" data-open="${UI.esc(r.PRID)}">Open</button></div>` }
      ],
      rows: d.rows, rowKey: 'PRID',
      empty: UI.emptyState('No purchase requests',
        d.canCreate ? 'Raise the first request for a project you work on.' : 'Nothing to show yet.')
    });

    mount.querySelectorAll('[data-open]').forEach(n => {
      n.onclick = e => { e.preventDefault(); navigate('purchase-request', n.dataset.open); };
    });
    UI.pager(document.getElementById('prPager'), {
      page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
      onPage: p => { prState.page = p; loadPurchaseRequests(); }
    });
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retryPr');
    const b = document.getElementById('retryPr');
    if (b) b.onclick = loadPurchaseRequests;
  }
}

/* ------------------------------------------------------------ NEW / EDIT */

async function openPrForm(existing) {
  let projects = [];
  try { projects = (await api('listProjects', { pageSize: 200, includeMetrics: false })).data.rows; }
  catch (e) { UI.error('Could not load projects', e.message); return; }
  const open = projects.filter(p => !p.IsClosed);
  if (!open.length) { UI.warn('No open projects', 'You need access to an open project to raise a request.'); return; }

  const headerFields = [
    { name: 'ProjectID', label: 'Project', type: 'select', required: true,
      options: open.map(p => ({ value: p.ProjectID, label: p.ProjectName })),
      readonly: !!existing },
    { name: 'Department', label: 'Department', required: true },
    { name: 'RequiredDate', label: 'Required by', type: 'date', required: true },
    { name: 'Priority', label: 'Priority', type: 'select', options: App.enums.PRIORITY || [] },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  const header = UI.form(headerFields, existing
    ? { ProjectID: existing.request.ProjectID, Department: existing.request.Department,
        RequiredDate: existing.request.RequiredDate, Priority: existing.request.Priority,
        Remarks: existing.request.Remarks }
    : { Priority: 'Normal' });
  body.appendChild(header);

  const itemsWrap = UI.el('div', { class: 'card mt-16' });
  itemsWrap.innerHTML = `<div class="card-head"><div class="card-title">Items</div>
    <button class="btn btn-sm" id="addPrItem">+ Add item</button></div>
    <div class="table-wrap"><table class="data" id="prItemTable">
      <thead><tr><th style="width:110px">Code</th><th>Item</th><th>Specification</th>
        <th style="width:90px">Unit</th><th style="width:110px">Cost code</th>
        <th class="num" style="width:100px">Qty</th><th class="num" style="width:110px">Est. rate</th>
        <th class="num" style="width:120px">Amount</th><th style="width:40px"></th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><th colspan="7" class="num">Estimated total</th>
        <th class="num" id="prItemTotal">0</th><th></th></tr></tfoot>
    </table></div>`;
  body.appendChild(itemsWrap);

  const tbody = itemsWrap.querySelector('tbody');
  const units = App.enums.UNITS || [];
  const sym = App.settings.currencySymbol || 'Rs';

  function recalc() {
    let total = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const qty = Number(tr.querySelector('[data-f="RequestedQty"]').value) || 0;
      const rate = Number(tr.querySelector('[data-f="EstimatedRate"]').value) || 0;
      const amount = qty * rate;
      tr.querySelector('[data-amount]').textContent = UI.fmt.number(amount);
      total += amount;
    });
    itemsWrap.querySelector('#prItemTotal').textContent = UI.fmt.money(total, sym);
  }

  function addRow(values) {
    const v = values || {};
    const tr = UI.el('tr');
    tr.innerHTML =
      `<td><input class="input" data-f="ItemCode" value="${UI.esc(v.ItemCode || '')}"></td>
       <td><input class="input" data-f="ItemName" value="${UI.esc(v.ItemName || '')}"></td>
       <td><input class="input" data-f="Specification" value="${UI.esc(v.Specification || '')}"></td>
       <td><select class="input" data-f="Unit">${units.map(u =>
         `<option value="${u}"${u === v.Unit ? ' selected' : ''}>${u}</option>`).join('')}</select></td>
       <td><input class="input" data-f="CostCode" value="${UI.esc(v.CostCode || '')}"></td>
       <td><input class="input num" type="number" step="any" data-f="RequestedQty"
            value="${v.RequestedQty === undefined ? '' : v.RequestedQty}" style="text-align:right"></td>
       <td><input class="input" type="number" step="any" data-f="EstimatedRate"
            value="${v.EstimatedRate === undefined ? '' : v.EstimatedRate}" style="text-align:right"></td>
       <td class="num" data-amount>0</td>
       <td><button class="btn btn-sm btn-ghost" data-remove title="Remove line">&times;</button></td>`;
    tr.querySelectorAll('input').forEach(i => i.addEventListener('input', recalc));
    tr.querySelector('[data-remove]').onclick = () => {
      if (tbody.querySelectorAll('tr').length === 1) { UI.warn('A request needs at least one item'); return; }
      tr.remove(); recalc();
    };
    tbody.appendChild(tr);
    recalc();
  }

  itemsWrap.querySelector('#addPrItem').onclick = () => addRow();
  if (existing && existing.items.length) existing.items.forEach(addRow);
  else addRow();

  UI.modal({
    title: existing ? 'Edit purchase request ' + existing.request.PRID : 'New purchase request',
    size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: existing ? 'Save draft' : 'Create draft', class: 'btn-primary', onClick: async m => {
        const head = UI.validate(header, headerFields);
        if (!head) return;
        const items = [];
        let bad = null;
        tbody.querySelectorAll('tr').forEach((tr, i) => {
          const row = {};
          tr.querySelectorAll('[data-f]').forEach(f => { row[f.dataset.f] = f.value.trim(); });
          if (!row.ItemName) bad = bad || ('Line ' + (i + 1) + ' needs an item name.');
          if (!(Number(row.RequestedQty) > 0)) bad = bad || ('Line ' + (i + 1) + ' needs a quantity.');
          items.push(row);
        });
        if (bad) { UI.warn('Check the items', bad); return; }

        m.busy(true);
        try {
          if (existing) {
            await api('updatePurchaseRequest', existing.request.PRID,
              Object.assign({}, head, { items: items }));
            m.close(); UI.success('Draft saved');
            navigate('purchase-request', existing.request.PRID);
          } else {
            const res = await api('createPurchaseRequest', head.ProjectID,
              Object.assign({}, head, { items: items }));
            m.close(); UI.success('Draft created', res.message);
            navigate('purchase-request', res.data.PRID);
          }
        } catch (e) { UI.error('Could not save', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

/* ------------------------------------------------- STOCK VERIFICATION */

function openStockVerification(d) {
  const sym = App.settings.currencySymbol || 'Rs';
  const body = UI.el('div');
  body.innerHTML = `
    <p style="margin-top:0;font-size:13px">For each item, enter how much is already on hand.
      The quantity to purchase is calculated — you never type it.</p>
    <div class="table-wrap"><table class="data" id="verifyTable">
      <thead><tr><th>Item</th><th class="num">Requested</th><th class="num" style="width:150px">Available in stock</th>
        <th class="num">To purchase</th><th>Status</th><th class="num">Value</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><th colspan="5" class="num">Purchase value</th><th class="num" id="verifyTotal">0</th></tr></tfoot>
    </table></div>
    <div class="field mt-16"><label for="verifyComments">Comments</label>
      <textarea class="input" id="verifyComments" placeholder="Anything the approvers should know"></textarea></div>`;

  const tbody = body.querySelector('tbody');
  d.items.forEach(it => {
    const tr = UI.el('tr');
    const suggested = it.SystemStockOnHand === null ? '' : Math.min(it.SystemStockOnHand, it.RequestedQty);
    tr.dataset.id = it.PRItemID;
    tr.dataset.requested = it.RequestedQty;
    tr.dataset.rate = it.EstimatedRate;
    tr.innerHTML =
      `<td><strong>${UI.esc(it.ItemName)}</strong>
        ${it.ItemCode ? `<br><span class="mono muted">${UI.esc(it.ItemCode)}</span>` : ''}
        ${it.SystemStockOnHand !== null
          ? `<br><span class="muted">system stock: ${UI.fmt.number(it.SystemStockOnHand, 3)} ${UI.esc(it.Unit)}</span>`
          : ''}</td>
       <td class="num">${UI.fmt.number(it.RequestedQty, 3)} ${UI.esc(it.Unit)}</td>
       <td><input class="input" type="number" step="any" min="0" max="${it.RequestedQty}"
            data-available value="${suggested}" style="text-align:right"></td>
       <td class="num" data-purchase><strong>${UI.fmt.number(it.RequestedQty, 3)}</strong></td>
       <td data-status></td>
       <td class="num" data-value>0</td>`;
    tbody.appendChild(tr);
  });

  function recalc() {
    let total = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const requested = Number(tr.dataset.requested);
      const rate = Number(tr.dataset.rate);
      const input = tr.querySelector('[data-available]');
      let available = Number(input.value);
      if (!(available >= 0)) available = 0;
      if (available > requested) { available = requested; input.value = requested; }
      const purchase = Math.round((requested - available) * 10000) / 10000;
      const value = purchase * rate;
      total += value;
      tr.querySelector('[data-purchase]').innerHTML = `<strong>${UI.fmt.number(purchase, 3)}</strong>`;
      tr.querySelector('[data-value]').textContent = UI.fmt.number(value);
      tr.querySelector('[data-status]').innerHTML =
        purchase <= 0 ? UI.badge('Available', 'green')
          : available > 0 ? UI.badge('Partial', 'amber') : UI.badge('Not available', 'red');
    });
    body.querySelector('#verifyTotal').textContent = UI.fmt.money(total, sym);
  }
  tbody.querySelectorAll('[data-available]').forEach(i => i.addEventListener('input', recalc));
  recalc();

  UI.modal({
    title: 'Stock verification — ' + d.request.PRID, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Submit verification', class: 'btn-primary', onClick: async m => {
        const verifications = Array.from(tbody.querySelectorAll('tr')).map(tr => ({
          PRItemID: tr.dataset.id,
          AvailableQty: Number(tr.querySelector('[data-available]').value) || 0
        }));
        m.busy(true);
        try {
          const res = await api('verifyPurchaseRequestStock', d.request.PRID, verifications,
            body.querySelector('#verifyComments').value);
          m.close(); UI.success('Stock verified', res.message);
          navigate('purchase-request', d.request.PRID);
        } catch (e) { UI.error('Could not verify', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

function openDecision(d, action) {
  const sym = App.settings.currencySymbol || 'Rs';
  const stage = d.workflow.stages.find(s => s.state === 'current');
  const titles = { APPROVE: 'Approve', REJECT: 'Reject', RETURN: 'Return for correction' };
  const overBudget = d.budget && d.budget.anyExceeds;

  const fields = [{ name: 'Comments', label: action === 'APPROVE' ? 'Comments (optional)' : 'Reason',
    type: 'textarea', required: action !== 'APPROVE', span: 2 }];
  const body = UI.el('div');
  body.innerHTML =
    `<div class="banner banner-info"><div>
      <strong>${UI.esc(stage ? stage.label : '')}</strong> · ${UI.esc(d.request.PRID)} ·
      ${UI.fmt.money(d.workflow.approvalValue, sym)}
      ${action === 'APPROVE' ? '<br>Approving moves the request to the next stage in the route.' : ''}
    </div></div>` +
    (action === 'APPROVE' && overBudget
      ? `<div class="banner banner-warn"><div><strong>This request exceeds the remaining budget on
          ${d.budget.lines.filter(b => b.wouldExceed).map(b => UI.esc(b.costCode)).join(', ')}.</strong>
          ${d.canOverrideBudget
            ? '<br>If budget protection is switched on you will need to tick the override below, and the override is recorded in the audit trail.'
            : '<br>If budget protection is switched on, approval will be blocked — someone with the override permission must decide.'}
        </div></div>` : '');
  const form = UI.form(fields);
  body.appendChild(form);

  let overrideBox = null;
  if (action === 'APPROVE' && overBudget && d.canOverrideBudget) {
    const wrap = UI.el('div', { class: 'field' });
    wrap.innerHTML = `<label class="checkbox"><input type="checkbox" id="budgetOverride">
      Override the budget block and record the reason above</label>`;
    body.appendChild(wrap);
    overrideBox = wrap.querySelector('#budgetOverride');
  }

  UI.modal({
    title: titles[action] + ' ' + d.request.PRID, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: titles[action], class: action === 'REJECT' ? 'btn-danger' : 'btn-primary', onClick: async m => {
        const data = UI.validate(form, fields);
        if (!data) return;
        m.busy(true);
        try {
          const res = await api('actOnPurchaseRequest', d.request.PRID, action, data.Comments,
            { overrideBudget: overrideBox ? overrideBox.checked : false });
          m.close(); UI.success(titles[action] + 'd', res.message);
          navigate('purchase-request', d.request.PRID);
        } catch (e) {
          if (e.code === 'OVER_BUDGET') UI.error('Blocked by budget protection', e.message);
          else UI.error('Could not record the decision', e.message);
        }
        finally { m.busy(false); }
      }}
    ]
  });
}

async function openRfqForm() {

function statTile(label, value, note) {
  return `<div class="stat"><div class="stat-label">${UI.esc(label)}</div>
    <div class="stat-value">${UI.esc(value)}</div><div class="stat-note">${UI.esc(note)}</div>
    <div class="stat-accent"></div></div>`;
}

/**
 * The quotation document a vendor's column carries.
 *
 * The figures in this table were typed in by someone. The link beside the
 * vendor's name is the paper they were typed from, so the person signing off
 * on the choice can open it without leaving the comparison.
 */
function quoteProofHtml(v, canAttach) {
  const q = v.QuoteDocument;
  if (q) {
    return `<div class="quote-proof">
      <a href="${UI.esc(q.DriveUrl)}" target="_blank" rel="noopener"
         title="${UI.esc(q.FileName)}, attached by ${UI.esc(q.UploadedByName)}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" aria-hidden="true"><path d="M7 4h7l4 4v12H7z"></path>
          <path d="M14 4v4h4"></path></svg>
        Quotation</a>
      ${canAttach ? `<button class="linklike" data-replace-quote="${UI.esc(v.VendorID)}"
         title="Attach a corrected quotation in its place">Replace</button>` : ''}
    </div>`;
  }
  if (!canAttach) {
    return `<div class="quote-proof muted">No quotation attached</div>`;
  }
  return `<div class="quote-proof"><button class="linklike" data-attach-quote="${UI.esc(v.VendorID)}"
    >${v.HasQuoted ? 'Attach quotation' : 'Attach'}</button></div>`;
}

/** The comparison matrix: one row per line, one column per vendor. */
function renderComparison(mount, c, rfqId, canAttach) {
  if (!c.lines.length) {
    mount.innerHTML = UI.emptyState('Nothing to compare', 'This RFQ covers no purchasable lines.');
    return;
  }
  const head = ['<th>Item</th><th class="num">Qty</th><th class="num">Estimate</th>']
    .concat(c.vendors.map(v =>
      `<th class="num">${UI.esc(v.CompanyName)}${v.IsSelected ? '<br>' + UI.badge('Awarded', 'green') : ''}
        ${quoteProofHtml(v, canAttach)}</th>`))
    .concat(['<th class="num">Lowest</th><th class="num">Average</th><th class="num">Spread</th>'])
    .join('');

  const body = c.lines.map(line => {
    const cells = c.vendors.map(v => {
      const cell = line.cells.find(x => x.VendorID === v.VendorID);
      if (!cell || cell.Rate === null) return `<td class="num muted">—</td>`;
      const tone = cell.IsLowest ? 'quote-low' : cell.IsHighest ? 'quote-high' : '';
      return `<td class="num ${tone}" data-rate="${UI.esc(v.VendorID)}">
        <strong>${UI.fmt.number(cell.Rate)}</strong>
        <br><span class="muted">${UI.fmt.number(cell.Amount)}</span>
        ${cell.AboveLowestPercent > 0 ? `<br><span class="muted">+${UI.esc(cell.AboveLowestPercent)}%</span>` : ''}
      </td>`;
    }).join('');
    return `<tr>
      <td><strong>${UI.esc(line.ItemName)}</strong>
        ${line.ItemCode ? `<br><span class="mono muted">${UI.esc(line.ItemCode)}</span>` : ''}
        ${line.CostCode ? `<br><span class="muted">${UI.esc(line.CostCode)}</span>` : ''}</td>
      <td class="num">${UI.fmt.number(line.Quantity, 3)} ${UI.esc(line.Unit)}</td>
      <td class="num muted">${UI.fmt.number(line.EstimatedRate)}</td>
      ${cells}
      <td class="num">${line.lowest === null ? '—' : UI.fmt.number(line.lowest)}</td>
      <td class="num">${line.average === null ? '—' : UI.fmt.number(line.average)}</td>
      <td class="num">${line.spreadPercent ? UI.esc(line.spreadPercent) + '%' : '—'}</td>
    </tr>`;
  }).join('');

  const totals = c.vendors.map(v =>
    `<th class="num">${v.HasQuoted ? money(v.Total) : '—'}
      ${v.IsLowestTotal ? '<br>' + UI.badge('Lowest total', 'green') : ''}</th>`).join('');

  mount.innerHTML = `<div class="table-wrap"><table class="data compare">
    <thead><tr>${head}</tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><th colspan="2">Total</th><th class="num">${money(c.estimatedTotal)}</th>
      ${totals}
      <th class="num">${c.lowestTotal === null ? '—' : money(c.lowestTotal)}</th>
      <th class="num">${c.averageTotal === null ? '—' : money(c.averageTotal)}</th><th></th></tr></tfoot>
  </table></div>`;

  if (!rfqId) return;
  mount.querySelectorAll('[data-attach-quote],[data-replace-quote]').forEach(b => {
    const vendorId = b.dataset.attachQuote || b.dataset.replaceQuote;
    const vendor = c.vendors.find(v => v.VendorID === vendorId);
    b.onclick = () => openQuoteProofForm(rfqId, vendor);
  });
}

/** Attach, replace or detach the paper behind one vendor's quotation. */
function openQuoteProofForm(rfqId, vendor) {
  const held = vendor && vendor.QuoteDocument;
  const body = UI.el('div');
  body.innerHTML =
    `${held ? `<div class="banner banner-info">
        <div><strong>${UI.esc(held.FileName)}</strong> is attached, by
        ${UI.esc(held.UploadedByName)}. Attaching another replaces the link; the file
        already held stays in this project's documents.</div></div>` : ''}
     <div class="field">
       <label for="proofFile">Quotation from ${UI.esc(vendor ? vendor.CompanyName : 'the vendor')}</label>
       <input class="input" type="file" id="proofFile"
              accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx">
       <div class="hint">Up to 10 MB. It is filed under this project's documents as a quotation.</div>
     </div>
     <div class="field">
       <label for="proofNotes">Note (optional)</label>
       <input class="input" id="proofNotes" placeholder="e.g. Revised after the site visit">
     </div>`;

  const footer = [{ label: 'Cancel', onClick: m => m.close() }];
  if (held && !vendor.IsSelected) {
    footer.push({ label: 'Detach', class: 'btn-danger', onClick: async m => {
      m.busy(true);
      try {
        const res = await api('removeQuotationDocument', rfqId, vendor.VendorID, '');
        m.close(); UI.success('Detached', res.message); navigate('rfq', rfqId);
      } catch (e) { m.busy(false); UI.error('Could not detach', e.message); }
    }});
  }
  footer.push({ label: held ? 'Replace' : 'Attach', class: 'btn-primary', onClick: async m => {
    const file = (document.getElementById('proofFile').files || [])[0];
    if (!file) { UI.warn('Choose a file first', 'Nothing has been selected to attach.'); return; }
    if (file.size > 10 * 1024 * 1024) {
      UI.warn('That file is too large', 'The limit is 10 MB.'); return;
    }
    m.busy(true);
    try {
      const res = await api('attachQuotationDocument', rfqId, vendor.VendorID, {
        FileName: file.name, MimeType: file.type || 'application/octet-stream',
        Base64: await readAsBase64(file), SizeBytes: file.size,
        Notes: document.getElementById('proofNotes').value
      });
      m.close(); UI.success('Attached', res.message); navigate('rfq', rfqId);
    } catch (e) { m.busy(false); UI.error('Could not attach', e.message); }
  }});

  UI.modal({ title: (held ? 'Replace' : 'Attach') + ' the vendor quotation', body, footer });
}

/* -------------------------------------------------------- QUOTATION ENTRY */

function openQuotationForm(d) {
  const pending = d.comparison.vendors;
  const body = UI.el('div');
  const fields = [
    { name: 'VendorID', label: 'Vendor', type: 'select', required: true,
      options: pending.map(v => ({ value: v.VendorID,
        label: v.CompanyName + (v.HasQuoted ? ' (re-quote)' : '') })) },
    { name: 'DeliveryDays', label: 'Delivery in (days)', type: 'number' },
    { name: 'PaymentTerms', label: 'Payment terms', span: 2 }
  ];
  const form = UI.form(fields);
  body.appendChild(form);

  // The rates below are a transcription. This is the paper they came from, and
  // it is what an auditor asks for when the lowest price was not the one taken.
  const proof = UI.el('div', { class: 'field mt-8' });
  proof.innerHTML =
    `<label for="quoteFile">Vendor's quotation (the file they sent)</label>
     <input class="input" type="file" id="quoteFile"
            accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx">
     <div class="hint" id="quoteFileHint">Optional now, and attachable later from the
       comparison. Up to 10 MB. It lands in this project's documents.</div>`;
  body.appendChild(proof);

  const table = UI.el('div', { class: 'card mt-16' });
  table.innerHTML = `<div class="card-head"><div class="card-title">Rates quoted</div></div>
    <div class="table-wrap"><table class="data" id="quoteTable">
      <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Estimate</th>
        <th class="num" style="width:140px">Rate quoted</th><th class="num">Amount</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><th colspan="4" class="num">Quotation total</th>
        <th class="num" id="quoteTotal">0</th></tr></tfoot></table></div>`;
  body.appendChild(table);

  const tbody = table.querySelector('tbody');
  d.comparison.lines.forEach(line => {
    const tr = UI.el('tr');
    tr.dataset.id = line.PRItemID;
    tr.dataset.qty = line.Quantity;
    tr.innerHTML =
      `<td><strong>${UI.esc(line.ItemName)}</strong>
        ${line.Specification ? `<br><span class="muted">${UI.esc(line.Specification)}</span>` : ''}</td>
       <td class="num">${UI.fmt.number(line.Quantity, 3)} ${UI.esc(line.Unit)}</td>
       <td class="num muted">${UI.fmt.number(line.EstimatedRate)}</td>
       <td><input class="input num" type="number" step="any" min="0" data-rate style="text-align:right"></td>
       <td class="num" data-amount>0</td>`;
    tbody.appendChild(tr);
  });

  function recalc() {
    let total = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const qty = Number(tr.dataset.qty) || 0;
      const rate = Number(tr.querySelector('[data-rate]').value) || 0;
      const amount = qty * rate;
      tr.querySelector('[data-amount]').textContent = UI.fmt.number(amount);
      total += amount;
    });
    table.querySelector('#quoteTotal').textContent = money(total);
  }
  tbody.querySelectorAll('[data-rate]').forEach(i => i.addEventListener('input', recalc));
  recalc();

  // Pre-fill when re-quoting so a correction is an edit, not a retype.
  const prefill = () => {
    const vid = form.querySelector('[name="VendorID"]').value;
    tbody.querySelectorAll('tr').forEach(tr => {
      const line = d.comparison.lines.find(l => l.PRItemID === tr.dataset.id);
      const cell = line && line.cells.find(x => x.VendorID === vid);
      tr.querySelector('[data-rate]').value = (cell && cell.Rate !== null) ? cell.Rate : '';
    });
    recalc();
  };
  form.querySelector('[name="VendorID"]').onchange = prefill;
  prefill();

  UI.modal({
    title: 'Record a quotation — ' + d.rfq.RFQID, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Save quotation', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(form, fields);
        if (!data) return;
        const items = [];
        let bad = null;
        tbody.querySelectorAll('tr').forEach((tr, i) => {
          const raw = tr.querySelector('[data-rate]').value;
          if (raw === '') bad = bad || ('Line ' + (i + 1) + ' has no rate.');
          items.push({ PRItemID: tr.dataset.id, Rate: raw });
        });
        if (bad) { UI.warn('Every line needs a rate', bad); return; }

        const file = (document.getElementById('quoteFile').files || [])[0];
        if (file && file.size > 10 * 1024 * 1024) {
          UI.warn('That file is too large', 'The limit is 10 MB. Put larger files in Drive ' +
            'and attach the link from the documents screen instead.');
          return;
        }
        m.busy(true);
        try {
          const attachment = file ? {
            FileName: file.name, MimeType: file.type || 'application/octet-stream',
            Base64: await readAsBase64(file), SizeBytes: file.size
          } : null;
          const res = await api('recordQuotation', d.rfq.RFQID, data.VendorID,
            { items: items, DeliveryDays: data.DeliveryDays, PaymentTerms: data.PaymentTerms,
              attachment: attachment });
          m.close(); UI.success('Quotation recorded', res.message);
          navigate('rfq', d.rfq.RFQID);
        } catch (e) { UI.error('Could not record the quotation', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

/* ------------------------------------------------------------- AWARDING */

function openAwardForm(d) {
  const c = d.comparison;
  const quoted = c.vendors.filter(v => v.HasQuoted);
  const body = UI.el('div');
  const fields = [
    { name: 'VendorID', label: 'Award to', type: 'select', required: true, span: 2,
      options: quoted.map(v => ({ value: v.VendorID,
        label: `${v.CompanyName} — ${UI.fmt.number(v.Total)}` +
               (v.IsLowestTotal ? ' (lowest)' : ` (+${v.AboveLowestPercent}%)`) +
               (v.IsComplete ? '' : ' — incomplete') })) },
    { name: 'Reason', label: 'Reason for the choice', type: 'textarea', span: 2,
      hint: 'Required when the chosen quotation is not the lowest.' }
  ];
  const form = UI.form(fields);
  body.appendChild(form);

  const note = UI.el('div', { class: 'mt-16', id: 'awardNote' });
  body.appendChild(note);
  const reasonLabel = form.querySelector('label[for="f_Reason"]');
  const refresh = () => {
    const v = quoted.find(x => x.VendorID === form.querySelector('[name="VendorID"]').value);
    if (!v) { note.innerHTML = ''; return; }
    // The reason only matters when the choice is not the cheapest, so the
    // field becomes required the moment that is true — rather than letting the
    // server reject the form after the fact.
    fields[1].required = !v.IsLowestTotal;
    reasonLabel.textContent = 'Reason for the choice' + (v.IsLowestTotal ? '' : ' *');
    UI.clearErrors(form);
    note.innerHTML = v.IsLowestTotal
      ? `<div class="banner banner-ok"><div>This is the lowest of ${c.respondedCount} quotation(s).</div></div>`
      : `<div class="banner banner-warn"><div><strong>Not the lowest quotation.</strong>
          ${money(v.Total)} against ${money(c.lowestTotal)} —
          ${UI.esc(v.AboveLowestPercent)}% higher. A reason is required and is kept on the record.</div></div>`;
  };
  form.querySelector('[name="VendorID"]').onchange = refresh;
  refresh();

  UI.modal({
    title: 'Select a vendor — ' + d.rfq.RFQID, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Award', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(form, fields);
        if (!data) return;
        m.busy(true);
        try {
          const res = await api('selectQuotation', d.rfq.RFQID, data.VendorID, data.Reason);
          m.close(); UI.success('Awarded', res.message);
          navigate('rfq', d.rfq.RFQID);
        } catch (e) {
          if (e.code === 'REASON_REQUIRED') UI.warn('A reason is needed', e.message);
          else UI.error('Could not award', e.message);
        }
        finally { m.busy(false); }
      }}
    ]
  });
}

/* ============================================================== PO LIST */

async function pagePurchaseOrders(root, arg) {
  poState.projectId = (arg && arg.projectId) ? arg.projectId : '';
  // Inside a project, cancelled orders are left out (owner's request, 23 Oct 2026).
  poState.hideCancelled = !!poState.projectId;
  if (arg && arg.projectId) poState.page = 1;
  root.innerHTML =
    pageHead('Purchase Orders', 'What the company has committed to buy',
      `<span id="poActions" class="flex gap-8"></span>` +
      (can('po.create') ? `<button class="btn btn-primary" id="newPoBtn">+ New order</button>` : '')) +
    `<div id="poSummary" class="stat-grid" style="margin-bottom:16px"></div>
     <div class="card">
       <div class="card-head">
         <div class="filters">
           <div class="field"><label for="poSearch">Search</label>
             <input class="input" id="poSearch" placeholder="PO number, vendor, item"
                    value="${UI.esc(poState.search)}"></div>
           <div class="field"><label for="poStatus">Status</label>
             <select class="input" id="poStatus"></select></div>
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="poLive"> Live orders only</label></div>
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="poOverdue"> Overdue delivery</label></div>
           <button class="btn" id="poReset">Reset</button>
         </div>
       </div>
       <div id="poTable">${UI.loadingState()}</div>
       <div id="poPager"></div>
     </div>`;

  const sel = document.getElementById('poStatus');
  sel.innerHTML = `<option value="">All statuses</option>` +
    (App.enums.PO_STATUS || []).map(s => `<option value="${s}">${s}</option>`).join('');
  sel.value = poState.status;
  document.getElementById('poLive').checked = poState.liveOnly;
  document.getElementById('poOverdue').checked = poState.overdueOnly;

  let debounce;
  document.getElementById('poSearch').oninput = e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { poState.search = e.target.value; poState.page = 1; loadPurchaseOrders(); }, 250);
  };
  sel.onchange = e => { poState.status = e.target.value; poState.page = 1; loadPurchaseOrders(); };
  document.getElementById('poLive').onchange = e => {
    poState.liveOnly = e.target.checked; poState.page = 1; loadPurchaseOrders();
  };
  document.getElementById('poOverdue').onchange = e => {
    poState.overdueOnly = e.target.checked; poState.page = 1; loadPurchaseOrders();
  };
  document.getElementById('poReset').onclick = () => {
    Object.assign(poState, { page: 1, search: '', status: '', liveOnly: false, overdueOnly: false });
    pagePurchaseOrders(root);
  };
  const nb = document.getElementById('newPoBtn');
  if (nb) nb.onclick = openDirectPoForm;

  // Orders can be loaded from a file too — the same three buttons as everywhere
  // else. Importing needs po.import, which is not the same as being able to
  // raise one by hand.
  document.getElementById('poActions').appendChild(
    importExportBar('PO', poState.projectId || null, () => loadPurchaseOrders(),
      can('po.import'),
      () => ({ projectId: poState.projectId, search: poState.search,
               filters: { Status: poState.status, VendorID: poState.vendorId } }),
      { projectScoped: true }));

  await loadPurchaseOrders();
}

async function loadPurchaseOrders() {
  const mount = document.getElementById('poTable');
  if (!mount) return;
  mount.innerHTML = UI.loadingState();
  try {
    const d = (await api('listPurchaseOrders', poState)).data;
    document.getElementById('poSummary').innerHTML =
      [['Orders', d.summary.total, 'Visible to you'],
       ['Awaiting approval', d.summary.awaitingApproval, 'Submitted, not yet decided'],
       ['Committed value', money(d.summary.committedValue), 'Approved and beyond'],
       ['Overdue delivery', d.summary.overdue, 'Past the delivery date']]
        .map(t => `<div class="stat"><div class="stat-label">${UI.esc(t[0])}</div>
          <div class="stat-value">${UI.esc(t[1])}</div><div class="stat-note">${UI.esc(t[2])}</div>
          <div class="stat-accent"></div></div>`).join('');

    UI.table(mount, {
      sortBy: poState.sortBy, sortDir: poState.sortDir,
      onSort: key => {
        poState.sortDir = (poState.sortBy === key && poState.sortDir === 'asc') ? 'desc' : 'asc';
        poState.sortBy = key; loadPurchaseOrders();
      },
      columns: [
        { key: 'POID', label: 'Order', render: r =>
          `<a href="#" data-open="${UI.esc(r.POID)}"><strong class="mono">${UI.esc(r.POID)}</strong></a>
           <br><span class="muted">${UI.fmt.date(r.PODate)}</span>` },
        { key: 'VendorName', label: 'Vendor' },
        { key: 'ProjectName', label: 'Project', render: r =>
          `${UI.esc(r.ProjectName)}${r.PRID ? `<br><span class="muted mono">${UI.esc(r.PRID)}</span>` : ''}` },
        { key: 'DeliveryDate', label: 'Delivery', render: r =>
          `${UI.fmt.date(r.DeliveryDate)}${r.IsOverdue ? '<br>' + UI.badge('Overdue', 'red') : ''}` },
        { key: 'Total', label: 'Value', align: 'right', render: r => money(r.Total) },
        { key: 'ReceivedPercent', label: 'Received', align: 'right', render: r =>
          r.IsLive ? UI.esc(r.ReceivedPercent) + '%' : '<span class="muted">—</span>' },
        { key: 'Status', label: 'Status', render: r => UI.badge(r.Status, PO_TONE[r.Status]) },
        { key: 'actions', label: '', sortable: false, render: r =>
          `<div class="row-actions"><button class="btn btn-sm" data-open="${UI.esc(r.POID)}">Open</button></div>` }
      ],
      rows: d.rows,
      empty: UI.emptyState('No purchase orders', 'Award an RFQ, or raise an order directly.')
    });
    mount.querySelectorAll('[data-open]').forEach(n => {
      n.onclick = e => { e.preventDefault(); navigate('purchase-order', n.dataset.open); };
    });
    UI.pager(document.getElementById('poPager'), {
      page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
      onPage: p => { poState.page = p; loadPurchaseOrders(); }
    });
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retryPos');
    const b = document.getElementById('retryPos');
    if (b) b.onclick = loadPurchaseOrders;
  }
}

      empty: UI.emptyState('No cost codes', 'The lines carry no cost code.')
    });
    if (d.budget.anyExceeds || d.budget.anyUnbudgeted) {
      budgetHost.insertAdjacentHTML('afterbegin',
        `<div style="padding:16px 16px 0"><div class="banner banner-warn"><div>
          ${d.budget.anyExceeds ? '<strong>This order exceeds the remaining budget on at least one cost code.</strong> ' : ''}
          ${d.budget.anyUnbudgeted ? 'Some lines carry a cost code with no budget line.' : ''}
        </div></div></div>`);
    }
  }

  UI.table(document.getElementById('poHistory'), {
    columns: [
      { key: 'ActionAt', label: 'When', render: h => UI.fmt.dateTime(h.ActionAt) },
      { key: 'Action', label: 'Action', render: h => UI.badge(h.Action,
        h.Action === 'APPROVE' ? 'green' : h.Action === 'REJECT' || h.Action === 'CANCEL' ? 'red' : 'blue') },
      { key: 'UserID', label: 'By', render: h =>
        `${UI.esc(h.UserID)}<br><span class="muted">${UI.esc(h.Role)}</span>` },
      { key: 'Comments', label: 'Comments' }
    ],
    rows: d.approvals,
    empty: UI.emptyState('Nothing yet', 'Approvals appear here once the order is submitted.')
  });

  document.getElementById('backPos').onclick = () => navigate('purchase-orders');
  document.getElementById('printPo').onclick = () => printPurchaseOrder(po.POID);
  const bind = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  bind('editPo', () => openPoEditForm(d));
  bind('submitPo', () => UI.confirm({
    title: 'Send for approval',
    message: 'The order goes to management. Approving it commits ' + money(po.Total) + ' to the budget.',
    confirmLabel: 'Send',
    onConfirm: async m => {
      try { const res = await api('submitPurchaseOrder', po.POID); m.close();
            UI.success('Submitted', res.message); navigate('purchase-order', po.POID); }
      catch (e) { UI.error('Could not submit', e.message); }
    }
  }));
  bind('approvePo', () => openPoDecision(d, 'APPROVE'));
  bind('rejectPo', () => openPoDecision(d, 'REJECT'));
  bind('issuePo', () => UI.confirm({
    title: 'Issue to vendor',
    message: 'Mark ' + po.POID + ' as issued. The store will be told to expect the delivery.',
    confirmLabel: 'Issue',
    onConfirm: async m => {
      try { const res = await api('issuePurchaseOrder', po.POID); m.close();
            UI.success('Issued', res.message); navigate('purchase-order', po.POID); }
      catch (e) { UI.error('Could not issue', e.message); }
    }
  }));
  bind('cancelPo', () => {
    const e = d.cancelEffect || {};
    const short = !!e.partial;
    openReasonModal({
      title: (short ? 'Short-close ' : 'Cancel ') + po.POID,
      label: 'Why?',
      confirmLabel: short ? 'Short-close order' : 'Cancel order',
      danger: true,
      intro: short
        ? `<strong>${UI.esc(po.POID)} has already been part delivered.</strong><br>
           ${money(e.receivedValue)} of material stays on the project. Only the undelivered
           balance of <strong>${money(e.releasedValue)}</strong> is released from committed cost.
           The order closes — it cannot be received against again.`
        : `Nothing has been received against this order.
           <strong>${money(e.releasedValue)}</strong> of committed cost is released and the
           order is closed permanently.`,
      onConfirm: async reason => {
        const res = await api('cancelPurchaseOrder', po.POID, reason);
        UI.success(short ? 'Short-closed' : 'Cancelled', res.message);
        navigate('purchase-order', po.POID);
      }
    });
  });
}

function openPoDecision(d, action) {
  const overBudget = d.budget && d.budget.anyExceeds;
  const fields = [{ name: 'Comments', label: action === 'APPROVE' ? 'Comments (optional)' : 'Reason',
    type: 'textarea', required: action !== 'APPROVE', span: 2 }];
  const body = UI.el('div');
  body.innerHTML = `<div class="banner banner-info"><div>
      <strong>${UI.esc(d.po.POID)}</strong> · ${money(d.po.Total)} ·
      ${UI.esc(d.vendor ? d.vendor.CompanyName : '')}
      ${action === 'APPROVE' ? '<br>Approving commits this value to the project budget.' : ''}
    </div></div>` +
    (action === 'APPROVE' && overBudget
      ? `<div class="banner banner-warn"><div><strong>This order exceeds the remaining budget on
          ${d.budget.lines.filter(b => b.wouldExceed).map(b => UI.esc(b.costCode)).join(', ')}.</strong>
          ${d.canOverrideBudget
            ? '<br>If budget protection is switched on you will need to tick the override, and it is recorded in the audit trail.'
            : '<br>If budget protection is switched on, approval will be blocked.'}</div></div>` : '');
  const form = UI.form(fields);
  body.appendChild(form);

  let overrideBox = null;
  if (action === 'APPROVE' && overBudget && d.canOverrideBudget) {
    const wrap = UI.el('div', { class: 'field' });
    wrap.innerHTML = `<label class="checkbox"><input type="checkbox" id="poOverride">
      Override the budget block and record the reason above</label>`;
    body.appendChild(wrap);
    overrideBox = wrap.querySelector('#poOverride');
  }

  UI.modal({
    title: (action === 'APPROVE' ? 'Approve ' : 'Send back ') + d.po.POID, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: action === 'APPROVE' ? 'Approve' : 'Send back',
        class: action === 'APPROVE' ? 'btn-primary' : 'btn-danger',
        onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          m.busy(true);
          try {
            const res = await api('decidePurchaseOrder', d.po.POID, action, data.Comments,
              { overrideBudget: overrideBox ? overrideBox.checked : false });
            m.close(); UI.success('Recorded', res.message);
            navigate('purchase-order', d.po.POID);
          } catch (e) {
            if (e.code === 'OVER_BUDGET') UI.error('Blocked by budget protection', e.message);
            else UI.error('Could not record the decision', e.message);
          }
          finally { m.busy(false); }
        }}
    ]
  });
}

async function openPoEditForm(d) {

function buildPoForm(existing, projects, vendors) {
  const fromRfq = existing && existing.po.RFQID;
  const fields = [
    { name: 'ProjectID', label: 'Project', type: 'select', required: true, readonly: !!existing,
      options: projects.map(p => ({ value: p.ProjectID, label: p.ProjectName })) },
    { name: 'VendorID', label: 'Vendor', type: 'select', required: true, readonly: !!existing,
      options: vendors.map(v => ({ value: v.VendorID, label: v.CompanyName })) },
    { name: 'DeliveryDate', label: 'Delivery required by', type: 'date', required: true },
    { name: 'DeliveryLocation', label: 'Deliver to', required: true },
    { name: 'PaymentTerms', label: 'Payment terms' },
    { name: 'DiscountPercent', label: 'Discount %', type: 'number', value: 0 },
    { name: 'TaxPercent', label: 'Tax %', type: 'number', value: 0 },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ];
  const values = existing ? {
    ProjectID: existing.po.ProjectID, VendorID: existing.po.VendorID,
    DeliveryDate: existing.po.DeliveryDate, DeliveryLocation: existing.po.DeliveryLocation,
    PaymentTerms: existing.po.PaymentTerms, DiscountPercent: existing.po.DiscountPercent,
    TaxPercent: existing.po.TaxPercent, Remarks: existing.po.Remarks
  } : {};

  const body = UI.el('div');
  const form = UI.form(fields, values);
  body.appendChild(form);

  const itemsWrap = UI.el('div', { class: 'card mt-16' });
  itemsWrap.innerHTML = `<div class="card-head"><div class="card-title">Lines</div>
    ${fromRfq ? '<span class="muted">Rates come from the awarded quotation</span>'
              : '<button class="btn btn-sm" id="addPoItem">+ Add line</button>'}</div>
    <div class="table-wrap"><table class="data" id="poItemTable">
      <thead><tr><th style="width:110px">Code</th><th>Item</th><th style="width:90px">Unit</th>
        <th style="width:110px">Cost code</th><th class="num" style="width:100px">Qty</th>
        <th class="num" style="width:110px">Rate</th><th class="num" style="width:120px">Amount</th>
        <th style="width:40px"></th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><th colspan="6" class="num">Total</th>
        <th class="num" id="poItemTotal">0</th><th></th></tr></tfoot></table></div>`;
  body.appendChild(itemsWrap);

  const tbody = itemsWrap.querySelector('tbody');
  const units = App.enums.UNITS || [];

  function recalc() {
    let subtotal = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const qty = Number(tr.querySelector('[data-f="OrderedQty"]').value) || 0;
      const rate = Number(tr.querySelector('[data-f="Rate"]').value) || 0;
      const amount = qty * rate;
      tr.querySelector('[data-amount]').textContent = UI.fmt.number(amount);
      subtotal += amount;
    });
    const disc = Number(form.querySelector('[name="DiscountPercent"]').value) || 0;
    const tax = Number(form.querySelector('[name="TaxPercent"]').value) || 0;
    const taxable = subtotal - (subtotal * disc / 100);
    itemsWrap.querySelector('#poItemTotal').textContent = money(taxable + taxable * tax / 100);
  }
  ['DiscountPercent', 'TaxPercent'].forEach(n =>
    form.querySelector('[name="' + n + '"]').addEventListener('input', recalc));

  function addRow(v) {
    v = v || {};
    const tr = UI.el('tr');
    tr.innerHTML =
      `<td><input class="input" data-f="ItemCode" value="${UI.esc(v.ItemCode || '')}"></td>
       <td><input class="input" data-f="ItemName" value="${UI.esc(v.ItemName || '')}"></td>
       <td><select class="input" data-f="Unit">${units.map(u =>
         `<option value="${u}"${u === v.Unit ? ' selected' : ''}>${u}</option>`).join('')}</select></td>
       <td><input class="input" data-f="CostCode" value="${UI.esc(v.CostCode || '')}"></td>
       <td><input class="input num" type="number" step="any" data-f="OrderedQty"
            value="${v.OrderedQty === undefined ? '' : v.OrderedQty}" style="text-align:right"></td>
       <td><input class="input" type="number" step="any" data-f="Rate"
            value="${v.Rate === undefined ? '' : v.Rate}" style="text-align:right"></td>
       <td class="num" data-amount>0</td>
       <td>${fromRfq ? '' : '<button class="btn btn-sm btn-ghost" data-remove>&times;</button>'}</td>`;
    tr.querySelectorAll('input').forEach(i => i.addEventListener('input', recalc));
    if (fromRfq) tr.querySelectorAll('input, select').forEach(i => { i.readOnly = true; i.disabled = true; });
    const rm = tr.querySelector('[data-remove]');
    if (rm) rm.onclick = () => {
      if (tbody.querySelectorAll('tr').length === 1) { UI.warn('An order needs at least one line'); return; }
      tr.remove(); recalc();
    };
    tbody.appendChild(tr);
    recalc();
  }
  const addBtn = itemsWrap.querySelector('#addPoItem');
  if (addBtn) addBtn.onclick = () => addRow();
  if (existing && existing.items.length) existing.items.forEach(addRow);
  else addRow();

  UI.modal({
    title: existing ? 'Edit ' + existing.po.POID : 'New purchase order', size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: existing ? 'Save' : 'Create draft', class: 'btn-primary', onClick: async m => {
        const head = UI.validate(form, fields);
        if (!head) return;
        const items = [];
        let bad = null;
        tbody.querySelectorAll('tr').forEach((tr, i) => {
          const row = {};
          tr.querySelectorAll('[data-f]').forEach(f => { row[f.dataset.f] = f.value.trim(); });
          if (!row.ItemName) bad = bad || ('Line ' + (i + 1) + ' needs an item name.');
          if (!(Number(row.OrderedQty) > 0)) bad = bad || ('Line ' + (i + 1) + ' needs a quantity.');
          items.push(row);
        });
        if (bad) { UI.warn('Check the lines', bad); return; }
        m.busy(true);
        try {
          if (existing) {
            await api('updatePurchaseOrder', existing.po.POID,
              fromRfq ? head : Object.assign({}, head, { items: items }));
            m.close(); UI.success('Order saved');
            navigate('purchase-order', existing.po.POID);
          } else {
            const res = await api('createPurchaseOrder', head.ProjectID,
              Object.assign({}, head, { items: items }));
            m.close(); UI.success('Order created', res.message);
            navigate('purchase-order', res.data.POID);
          }
        } catch (e) { UI.error('Could not save', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}
