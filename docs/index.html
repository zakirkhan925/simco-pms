  await loadBudget(projectId, sym);
}

/** The filter state as the server reads it. */
function budgetQuery() {
  const q = { page: budgetState.page, pageSize: budgetState.pageSize, search: budgetState.search,
              category: budgetState.category };
  if (budgetState.show === 'overbudget') q.overBudgetOnly = true;
  else if (budgetState.show) q.qtyStatus = budgetState.show;
  return q;
}

async function loadBudget(projectId, sym) {
  const mount = document.getElementById('budgetTable');
  if (!mount) return;
  mount.innerHTML = UI.loadingState();
  try {
    const res = await api('listBudget', projectId, budgetQuery());
    const d = res.data;
    // Materials or trade works (13 Nov 2026): offered when the server says the project has a BOQ.
    if (d.worksTracking && budgetSectionBar(projectId, sym)) return;

    const cat = document.getElementById('budgetCategory');
    if (cat && !cat.dataset.filled) {
      cat.dataset.filled = '1';
      cat.innerHTML = '<option value="">All categories</option>' +
        (d.categories || []).map(c => `<option value="${UI.esc(c)}">${UI.esc(c)}</option>`).join('');
      cat.value = budgetState.category;
      cat.onchange = e => { budgetState.category = e.target.value; budgetState.page = 1; loadBudget(projectId, sym); };
    }
    const show = document.getElementById('budgetShow');
    if (show && !show.dataset.filled) {
      show.dataset.filled = '1';
      // A server older than 9 Nov 2026 sends no quantity counts and ignores these filters.
      const qtyFilters = d.quantityTracking && d.totals && d.totals.quantity;
      const opts = [['', 'All lines']].concat(qtyFilters ? [['tobuy', 'Still to buy'], ['full', 'Fully purchased'],
        ['over', 'Bought over requirement'], ['due', 'Awaiting delivery'], ['tracked', 'Tracked by quantity'],
        ['untracked', 'Not tracked by quantity']] : []).concat([['overbudget', 'Over budget (cost)']]);
      show.innerHTML = opts.map(o => `<option value="${o[0]}">${UI.esc(o[1])}</option>`).join('');
      show.value = budgetState.show;
      show.onchange = e => { budgetState.show = e.target.value; budgetState.page = 1; loadBudget(projectId, sym); };
    }

    const actions = document.getElementById('budgetActions');
    if (actions && !actions.dataset.filled) {
      actions.dataset.filled = '1';
      if (d.quantityTracking) {
        // Track the budget by cost, by quantity, or both (owner's request, 9 Nov 2026).
        const view = UI.el('select', { class: 'input', style: 'width:auto;height:30px', title: 'Track by' });
        view.innerHTML = [['both', 'Cost and quantity'], ['cost', 'Cost only'], ['qty', 'Quantity only']]
          .map(o => `<option value="${o[0]}"${budgetView() === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('');
        view.onchange = () => { try { localStorage.setItem('pms_budget_view', view.value); } catch (e) {} loadBudget(projectId, sym); };
        actions.appendChild(view);
        const run = UI.el('button', { class: 'btn btn-sm', text: 'Run update' });
        run.onclick = () => runBudgetUpdateDialog(projectId, sym);
        actions.appendChild(run);
        if (d.canTag) {
          const tag = UI.el('button', { class: 'btn btn-sm', text: 'Tag PO lines' });
          tag.onclick = () => openPoTagger(projectId, { onDone: () => loadBudget(projectId, sym) });
          actions.appendChild(tag);
        }
      }
      if (d.canEdit) {
        const add = UI.el('button', { class: 'btn btn-sm btn-primary', text: '+ Add line' });
        add.onclick = () => openBudgetForm(projectId, null, sym, d.quantityTracking);
        actions.appendChild(add);
      }
      actions.appendChild(importExportBar('BUDGET', projectId,
        () => navigate('project', { projectId, tab: 'budget' }), d.canEdit,
        () => ({})));
    }

    const t = d.totals;
    const mode = d.quantityTracking ? budgetView() : 'cost';
    const showCost = mode !== 'qty', showQty = mode !== 'cost';
    if (!showCost) {
      // Counted by the server over every line the filters leave, not just this page.
      const tr = d.rows.filter(r => r.BudgetQty !== null && r.BudgetQty !== undefined);
      const qt = t.quantity || { tracked: tr.length, full: tr.filter(r => r.ToBuyQty === 0).length,
        tobuy: tr.filter(r => r.ToBuyQty > 0).length, over: tr.filter(r => r.OverBoughtQty > 0).length,
        due: d.rows.filter(r => r.ToReceiveQty > 0).length };
      document.getElementById('budgetTotals').innerHTML = `
        <div class="stat-grid" style="padding:16px 16px 0">
          ${[['Tracked by quantity', String(qt.tracked || 0), `of ${t.lines} line(s)`],
             ['Fully purchased', String(qt.full || 0), 'nothing left to buy'],
             ['Still to buy', String(qt.tobuy || 0), 'line(s) short of requirement'],
             ['Bought over requirement', String(qt.over || 0), 'line(s)'],
             ['Awaiting delivery', String(qt.due || 0), 'line(s) with quantity due']]
            .map(x => `<div class="stat"><div class="stat-label">${UI.esc(x[0])}</div>
              <div class="stat-value">${UI.esc(x[1])}</div><div class="stat-note">${UI.esc(x[2])}</div>
              <div class="stat-accent"></div></div>`).join('')}
        </div>`;
    } else
    document.getElementById('budgetTotals').innerHTML = `
      <div class="stat-grid" style="padding:16px 16px 0">
        ${[['Revised budget', UI.fmt.money(t.revisedBudget, sym), `Original ${UI.fmt.money(t.originalBudget, sym)}`],
           ['Committed', UI.fmt.money(t.committed, sym), 'Live purchase orders'],
           ['Actual', UI.fmt.money(t.actual, sym), 'Issues, expenses, invoices'],
           ['Forecast', UI.fmt.money(t.forecast, sym), `${UI.fmt.percent(t.utilisation)} of budget`],
           ['Variance', UI.fmt.money(t.variance, sym), t.variance < 0 ? 'Over budget' : 'Budget − forecast']]
          .map(x => `<div class="stat"><div class="stat-label">${UI.esc(x[0])}</div>
            <div class="stat-value">${UI.esc(x[1])}</div><div class="stat-note">${UI.esc(x[2])}</div>
            <div class="stat-accent" ${/Over budget/.test(x[2]) ? 'style="background:var(--red-600)"' : ''}></div></div>`).join('')}
      </div>
      ${t.overBudgetLines ? `<div style="padding:16px 16px 0"><div class="banner banner-warn">
        <div><strong>${t.overBudgetLines} cost code(s) forecast above budget.</strong>
        Approvals that push a code further over can be blocked by turning on
        <span class="mono">budget.blockOverBudget</span> in Settings.</div></div></div>` : ''}`;

    UI.table(mount, {
      columns: [
        { key: 'CostCode', label: 'Cost code', render: r =>
          `<span class="mono"><strong>${UI.esc(r.CostCode)}</strong></span><br>
           <span class="muted">${UI.esc(r.Category)}</span>` },
        { key: 'Description', label: 'Description' },
        ...(d.quantityTracking && showQty ? budgetQtyColumns() : []),
      ].concat(showCost ? [
        { key: 'RevisedBudget', label: 'Budget', align: 'right', render: r =>
          r.RevisedBudget !== r.OriginalBudget
            ? `${UI.fmt.number(r.RevisedBudget)}<br><span class="muted">was ${UI.fmt.number(r.OriginalBudget)}</span>`
            : UI.fmt.number(r.RevisedBudget) },
        { key: 'Committed', label: 'Committed', align: 'right', render: r => UI.fmt.number(r.Committed) },
        { key: 'Actual', label: 'Actual', align: 'right', render: r => UI.fmt.number(r.Actual) },
        { key: 'Forecast', label: 'Forecast', align: 'right', render: r =>
          `${UI.fmt.number(r.Forecast)}${r.ForecastIsManual ? '<br><span class="muted">manual</span>' : ''}` },
        { key: 'Variance', label: 'Variance', align: 'right', render: r =>
          `<span class="${r.IsOverBudget ? 'state-error' : ''}"><strong>${UI.fmt.number(r.Variance)}</strong></span>` },
        { key: 'Utilisation', label: 'Used', align: 'right', render: r =>
          `<div style="min-width:90px">${UI.fmt.percent(r.Utilisation)}
             <div class="progress mt-8"><div style="width:${Math.min(100, r.Utilisation)}%;
               background:${r.IsOverBudget ? 'var(--red-600)' : 'var(--accent)'}"></div></div></div>` }
      ] : []).concat([
        ...(d.canEdit ? [{ key: 'actions', label: '', align: 'right', render: r =>
          `<div class="row-actions">
             <button class="btn btn-sm" data-edit="${UI.esc(r.BudgetID)}">Edit</button>
             <button class="btn btn-sm btn-danger" data-del="${UI.esc(r.BudgetID)}">Delete</button></div>` }] : [])
      ]),
      rows: d.rows,
      empty: UI.emptyState(budgetState.search || budgetState.category || budgetState.show ? 'Nothing matches'
        : 'No budget lines', budgetState.search || budgetState.category || budgetState.show
        ? 'Clear the search or a filter to see more lines.' : 'Add cost codes, or import the budget from a CSV.')
    });
    UI.pager(document.getElementById('budgetPager'), {
      page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
      onPage: p => { budgetState.page = p; loadBudget(projectId, sym); }
    });

    mount.querySelectorAll('[data-edit]').forEach(b => {
      const row = d.rows.find(r => r.BudgetID === b.dataset.edit);
      b.onclick = () => openBudgetForm(projectId, row, sym, d.quantityTracking);
    });
    mount.querySelectorAll('[data-del]').forEach(b => {
      const row = d.rows.find(r => r.BudgetID === b.dataset.del);
      b.onclick = () => UI.confirm({
        title: 'Delete budget line', message: row.CostCode + ' — ' + (row.Description || ''),
        confirmLabel: 'Delete', danger: true,
        onConfirm: async m => {
          try { await api('deleteBudgetLine', row.BudgetID); m.close(); UI.success('Line deleted'); loadBudget(projectId, sym); }
          catch (e) { UI.error('Could not delete', e.message); }
        }
      });
    });

    const extras = document.getElementById('budgetExtras');
    extras.innerHTML = d.unbudgetedCosts.length
      ? `<div class="card-body" style="border-top:1px solid var(--border)">
           <div class="card-title" style="margin-bottom:8px">Cost booked without a budget line</div>
           <div class="table-wrap"><table class="data">
             <thead><tr><th>Cost code</th><th class="num">Committed</th><th class="num">Actual</th></tr></thead>
             <tbody>${d.unbudgetedCosts.map(u => `<tr><td class="mono">${UI.esc(u.CostCode)}</td>
               <td class="num">${UI.fmt.number(u.Committed)}</td>
               <td class="num">${UI.fmt.number(u.Actual)}</td></tr>`).join('')}</tbody>
           </table></div></div>`
      : '';
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retryBudget');
    const b = document.getElementById('retryBudget');
    if (b) b.onclick = () => loadBudget(projectId, sym);
  }
}

function openBudgetForm(projectId, existing, sym, withQty) {
  const qtyFields = withQty ? [
    { name: 'ItemCode', label: 'Material code', hint: 'From the item master; leave blank for a line that buys no one material' },
    { name: 'Unit', label: 'Unit', type: 'select', options: [''].concat(App.enums.UNITS || []),
      hint: 'Blank takes the material\'s unit' },
    { name: 'BudgetQty', label: 'Required quantity', type: 'number', span: 2,
      hint: 'How much the project needs. Purchased, received and issued are counted against it' }
  ] : [];
  const fields = [
    { name: 'CostCode', label: 'Cost code', required: true },
    { name: 'Category', label: 'Category', type: 'select', required: true,
      options: App.enums.BUDGET_CATEGORIES || [] },
    { name: 'Description', label: 'Description', span: 2 },
    { name: 'OriginalBudget', label: 'Original budget', type: 'number', required: true },
    { name: 'RevisedBudget', label: 'Revised budget', type: 'number', hint: 'Leave blank to keep the original' },
    { name: 'Forecast', label: 'Forecast override', type: 'number', span: 2,
      hint: 'Leave blank to let the system forecast from actual cost plus open commitments' }
  ].concat(qtyFields);
  const body = UI.form(fields, existing || {});
  if (withQty) attachMaterialList(body.querySelector('[name="ItemCode"]'));
  UI.modal({
    title: existing ? 'Edit budget line' : 'Add budget line', size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: existing ? 'Save' : 'Add line', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(body, fields);
        if (!data) return;
        m.busy(true);
        try {
          const r = existing ? await api('updateBudgetLine', existing.BudgetID, data)
                             : await api('createBudgetLine', projectId, data);
          m.close();
          if (r.data && r.data.IsOverBudget) UI.warn('Saved — over budget', r.message);
          else UI.success(existing ? 'Budget line updated' : 'Budget line added');
          loadBudget(projectId, sym);
        } catch (e) { UI.error('Could not save', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

/** How the budget tab tracks: 'both', 'cost' or 'qty' — remembered in this browser. */
/* ------------------------------------------------ Trade works by quantity (13 Nov 2026) */

const worksState = { search: '', trade: '', show: '' };
function budgetSection() {
  let v = 'materials';
  try { v = localStorage.getItem('pms_budget_section') || 'materials'; } catch (e) {}
  return v === 'works' ? 'works' : 'materials';
}

/** The Materials / Trade works switch. Returns true when Works is showing (the caller stops). */
function budgetSectionBar(projectId, sym) {
  const bar = document.getElementById('budgetSection');
  if (!bar) return false;
  const cur = budgetSection();
  bar.style.display = '';
  bar.innerHTML = [['materials', 'Materials'], ['works', 'Trade works']].map(o =>
    `<button class="btn btn-sm${o[0] === cur ? ' btn-primary' : ''}" data-section="${o[0]}">${o[1]}</button>`).join('') +
    `<span class="muted" style="align-self:center;font-size:12.5px">${cur === 'works'
      ? 'Work quantities against the BOQ: given to subcontractors, measured on their bills, executed.'
      : 'Materials: required, purchased, received, issued.'}</span>`;
  bar.querySelectorAll('[data-section]').forEach(b => b.onclick = () => {
    try { localStorage.setItem('pms_budget_section', b.dataset.section); } catch (e) {}
    renderProjectBudget(bar.parentElement, { project: { ProjectID: projectId } }, sym);
  });
  const works = cur === 'works';
  document.getElementById('budgetMaterials').style.display = works ? 'none' : '';
  document.getElementById('budgetWorks').style.display = works ? '' : 'none';
  if (works) renderBudgetWorks(projectId);
  return works;
}

 * "Paid from": the company bank account a head-office payment came from (14 Nov 2026),
 * for its payment voucher. Offered once the bank list is set up in Settings
 * (finance.bankAccounts) and the server sends it. `cash` adds "Cash in hand" as the blank.
 */
function bankFieldFor(cash) {
  const list = (App.settings && App.settings.bankAccounts) || [];
  if (!list.length) return [];
  return [{ name: 'BankAccount', label: cash ? 'Paid from' : 'Paid from bank account', type: 'select',
    options: [{ value: '', label: cash ? 'Cash in hand' : '— for a bank, cheque or online payment —' }]
      .concat(list.map(n => ({ value: n, label: n }))),
    hint: cash ? 'Printed on the voucher' : 'Needed for bank, cheque and online payments; printed on the voucher' }];
}

function budgetView() {
  let v = 'both';
  try { v = localStorage.getItem('pms_budget_view') || 'both'; } catch (e) {}
  return ['both', 'cost', 'qty'].indexOf(v) === -1 ? 'both' : v;
}

/** Required, purchased, received, issued and still to buy, for a budget line. */
function budgetQtyColumns() {
  const q = v => v === null || v === undefined ? '<span class="muted">—</span>' : UI.fmt.number(v, 2);
  return [
    { key: 'ItemCode', label: 'Material', render: r => r.ItemCode
      ? `<span class="mono">${UI.esc(r.ItemCode)}</span><br><span class="muted">${UI.esc(r.Unit || '')}</span>`
      : `<span class="muted">${UI.esc(r.Unit || '—')}</span>` },
    { key: 'BudgetQty', label: 'Required', align: 'right', render: r => q(r.BudgetQty) },
    { key: 'PurchasedQty', label: 'Purchased', align: 'right', render: r =>
      q(r.PurchasedQty) + (r.OverBoughtQty ? `<br><span class="state-error">${UI.fmt.number(r.OverBoughtQty, 2)} over</span>` : '') +
      (r.OtherUnitQty ? `<br><span class="muted" title="Ordered in another unit; not added in">+${UI.fmt.number(r.OtherUnitQty, 2)} other unit</span>` : '') },
    { key: 'ReceivedQty', label: 'Received', align: 'right', render: r =>
      q(r.ReceivedQty) + (r.ToReceiveQty ? `<br><span class="muted">${UI.fmt.number(r.ToReceiveQty, 2)} due</span>` : '') },
    { key: 'IssuedQty', label: 'Issued', align: 'right', render: r => q(r.IssuedQty) },
    { key: 'ToBuyQty', label: 'To buy', align: 'right', render: r => r.ToBuyQty === null || r.ToBuyQty === undefined
      ? '<span class="muted">—</span>' : `<strong>${UI.fmt.number(r.ToBuyQty, 2)}</strong>` }
  ];
}

let materialCodesCache = null;
/** A type-ahead of the item master on a material-code box. */
async function attachMaterialList(input) {
  if (!input) return;
  try {
    if (!materialCodesCache) materialCodesCache = (await api('getMaterialCodes')).data;
  } catch (e) { return; }
  attachDatalist(input, materialCodesCache.map(m => ({ value: m.code, label: m.name + (m.unit ? ' · ' + m.unit : '') })));
}
function attachDatalist(input, options) {
  const id = 'dl_' + Math.random().toString(36).slice(2);
  const dl = UI.el('datalist', { id });
  dl.innerHTML = options.map(o => `<option value="${UI.esc(o.value)}">${UI.esc(o.label || '')}</option>`).join('');
  input.setAttribute('list', id);
  input.parentNode.appendChild(dl);
}

/** "Run update": recompute the budget and show what the PO lines carry that it does not. */
async function runBudgetUpdateDialog(projectId, sym) {
  let d;
  try { d = (await api('runBudgetUpdate', projectId)).data; }
  catch (e) { UI.error('Could not run the update', e.message); return; }
  const body = UI.el('div');
  const sec = (title, html) => `<div class="card-title" style="margin:16px 0 8px">${UI.esc(title)}</div>${html}`;
  const n = v => UI.fmt.number(v, 2);
  body.innerHTML =
    `<p style="margin:0">${d.rows.length} budget line(s) recalculated from live orders, receipts, issues, invoices and
      expenses${d.stored ? `; ${d.changed} line(s) had new committed or actual figures, now stored`
        : ' (shown only: storing needs budget edit rights on an open project)'}.</p>` +
    (d.misspeltCostCodes && d.misspeltCostCodes.length ? sec('Cost codes spelt differently from a budget line',
      `<p class="muted" style="margin:0 0 8px">These PO lines count nowhere until they carry the budget line's spelling.</p>
       <div class="table-wrap"><table class="data"><thead><tr><th>Written on PO</th><th>Budget line</th>
       <th class="num">Lines</th><th></th></tr></thead><tbody>${d.misspeltCostCodes.map((m, i) => `<tr>
       <td class="mono">${m.Written.map(w => UI.esc(JSON.stringify(w))).join(', ')}</td><td class="mono">${UI.esc(m.BudgetCode)}</td>
       <td class="num">${m.Lines}</td><td class="num">${d.canTag ? `<button class="btn btn-sm" data-fix="${i}">Fix</button>` : ''}</td>
       </tr>`).join('')}</tbody></table></div>`) : '') +
    (d.missingCostCodes.length ? sec('Cost codes on PO lines with no budget line',
      `<div class="table-wrap"><table class="data"><thead><tr>${d.canAddLines ? '<th style="width:32px"></th>' : ''}
       <th>Cost code</th><th>Items</th><th class="num">Lines</th><th class="num">Ordered</th><th class="num">Value</th>
       </tr></thead><tbody>${d.missingCostCodes.map(m => `<tr>
       ${d.canAddLines ? `<td><input type="checkbox" data-add="${UI.esc(m.CostCode)}" checked></td>` : ''}
       <td class="mono">${UI.esc(m.CostCode)}</td><td>${UI.esc(m.Items.join(', '))}</td><td class="num">${m.Lines}</td>
       <td class="num">${n(m.OrderedQty)} ${UI.esc(m.Unit || '')}</td><td class="num">${UI.fmt.money(m.Value, sym)}</td>
       </tr>`).join('')}</tbody></table></div>
       ${d.canAddLines ? '<div class="flex gap-8 mt-8"><button class="btn btn-sm btn-primary" id="addMissing">Add ticked as budget lines</button><span class="muted">Amount 0 and no required quantity — fill those in after.</span></div>' : ''}`)
      : sec('Cost codes on PO lines with no budget line', '<p class="muted" style="margin:0">None.</p>')) +
    sec('PO lines with no cost code that match no budget line',
      d.untagged.count
        ? `<p style="margin:0">${d.untagged.count} line(s), ${UI.fmt.money(d.untagged.value, sym)} ordered.
           ${d.canTag ? '<button class="btn btn-sm" id="tagUntagged">Tag them</button>' : ''}</p>`
        : '<p class="muted" style="margin:0">None.</p>') +
    (d.otherUnits.length ? sec('Ordered in another unit (not added in)',
      `<p style="margin:0">${d.otherUnits.map(o => `<span class="mono">${UI.esc(o.CostCode)}</span>: ${n(o.Qty)} not in ${UI.esc(o.Unit)}`).join('; ')}.
       Order these in the budget line's unit, or give them their own line.</p>`) : '');
  const m = UI.modal({ title: 'Budget update', size: 'wide', body,
    footer: [{ label: 'Close', onClick: x => { x.close(); loadBudget(projectId, sym); } }] });
  body.querySelectorAll('[data-fix]').forEach(b => {
    const fix = d.misspeltCostCodes[Number(b.dataset.fix)];
    b.onclick = async () => {
      try {
        const r = await api('tagPoLines', fix.POItemIDs.map(id => ({ POItemID: id, CostCode: fix.BudgetCode })));
        UI.success('Fixed', r.message); m.close(); runBudgetUpdateDialog(projectId, sym);
      } catch (e) { UI.error('Could not fix', e.message); }
    };
  });
  const add = body.querySelector('#addMissing');
  if (add) add.onclick = async () => {
    const codes = [...body.querySelectorAll('[data-add]:checked')].map(c => c.dataset.add);
    if (!codes.length) { UI.warn('Tick the cost codes to add'); return; }
    try {
      const r = await api('addMissingBudgetLines', projectId, codes);
      UI.success('Budget lines added', r.message); m.close(); loadBudget(projectId, sym);
    } catch (e) { UI.error('Could not add', e.message); }
  };
  const tag = body.querySelector('#tagUntagged');
  if (tag) tag.onclick = () => { m.close(); openPoTagger(projectId, { untaggedOnly: true, onDone: () => loadBudget(projectId, sym) }); };
}

/**
 * Tag PO lines (9 Nov 2026): cost code and material code on any order not
 * cancelled, posted ones included. Quantities and rates are not touched, so
 * nothing goes back for approval. One order (opts.poId) or the whole project.
 */
async function openPoTagger(projectId, opts) {
  opts = opts || {};
  let d;
  try { d = (await api('listPoLinesForTagging', projectId, { poId: opts.poId || '' })).data; }
  catch (e) { UI.error('Could not load the PO lines', e.message); return; }
  const body = UI.el('div');
  body.innerHTML = `
    <div class="banner banner-info"><div>Set the cost code and material code of each line. Quantities and rates do
      not change, so approved and received orders stay as they are; every change is in the audit log.
      ${d.closed ? '<strong>This project is closed.</strong>' : ''}</div></div>
    <div class="filters mt-8">
      <input class="input" id="tgSearch" placeholder="Search PO, item, vendor…" style="max-width:260px">
      <label class="flex gap-8" style="align-items:center"><input type="checkbox" id="tgUntagged" ${opts.untaggedOnly ? 'checked' : ''}>
        Only lines missing a code</label>
      <span class="muted" style="margin-left:auto">For ticked lines:</span>
      <input class="input" id="tgBulkCost" placeholder="Cost code" style="max-width:130px">
      <input class="input" id="tgBulkItem" placeholder="Material code" style="max-width:150px">
      <button class="btn btn-sm" id="tgApply">Apply</button>
    </div>
    <div class="table-wrap mt-8" style="max-height:52vh;overflow:auto"><table class="data" id="tgTable">
      <thead><tr><th style="width:28px"><input type="checkbox" id="tgAll"></th><th>PO</th><th>Item</th>
        <th class="num">Qty</th><th>Unit</th><th style="min-width:140px">Cost code</th><th style="min-width:160px">Material code</th></tr></thead>
      <tbody></tbody></table></div>
    <div class="muted mt-8" id="tgCount"></div>`;
  const costList = 'tgCostCodes', itemList = 'tgItems';
  const dl1 = UI.el('datalist', { id: costList });
  dl1.innerHTML = d.costCodes.map(c => `<option value="${UI.esc(c.code)}">${UI.esc(c.description || '')}</option>`).join('');
  const dl2 = UI.el('datalist', { id: itemList });
  dl2.innerHTML = d.materials.map(m => `<option value="${UI.esc(m.code)}">${UI.esc(m.name + (m.unit ? ' · ' + m.unit : ''))}</option>`).join('');
  body.appendChild(dl1); body.appendChild(dl2);
  body.querySelector('#tgBulkCost').setAttribute('list', costList);
  body.querySelector('#tgBulkItem').setAttribute('list', itemList);
  const tbody = body.querySelector('tbody');
  tbody.innerHTML = d.rows.map(r => `<tr data-id="${UI.esc(r.POItemID)}" data-cost="${UI.esc(r.CostCode)}" data-item="${UI.esc(r.ItemCode)}"
      data-text="${UI.esc((r.PONumber + ' ' + r.ItemName + ' ' + r.Vendor + ' ' + r.CostCode + ' ' + r.ItemCode).toLowerCase())}">
      <td><input type="checkbox" data-pick></td>
      <td><span class="mono">${UI.esc(r.PONumber)}</span><br><span class="muted">${UI.esc(r.Status)} · ${UI.esc(r.Vendor)}</span></td>
      <td>${UI.esc(r.ItemName)}</td><td class="num">${UI.fmt.number(r.OrderedQty, 2)}</td><td>${UI.esc(r.Unit)}</td>
      <td><input class="input" data-f="CostCode" list="${costList}" value="${UI.esc(r.CostCode)}"></td>
      <td><input class="input" data-f="ItemCode" list="${itemList}" value="${UI.esc(r.ItemCode)}"></td></tr>`).join('');
  const rows = () => [...tbody.querySelectorAll('tr')];
  const changed = () => rows().filter(tr => tr.querySelector('[data-f="CostCode"]').value.trim() !== tr.dataset.cost ||
    tr.querySelector('[data-f="ItemCode"]').value.trim() !== tr.dataset.item);
  const filter = () => {
    const q = body.querySelector('#tgSearch').value.trim().toLowerCase();
    const only = body.querySelector('#tgUntagged').checked;
    let shown = 0;
    rows().forEach(tr => {
      const missing = !tr.dataset.cost || !tr.dataset.item;
      const show = (!q || tr.dataset.text.indexOf(q) !== -1) && (!only || missing);
      tr.style.display = show ? '' : 'none';
      if (show) shown++;
    });
    body.querySelector('#tgCount').textContent = `${shown} of ${d.rows.length} line(s) shown · ${changed().length} changed, not saved`;
  };
  body.querySelector('#tgSearch').addEventListener('input', filter);
  body.querySelector('#tgUntagged').addEventListener('change', filter);
  tbody.addEventListener('input', filter);
  body.querySelector('#tgAll').addEventListener('change', e =>
    rows().filter(tr => tr.style.display !== 'none').forEach(tr => { tr.querySelector('[data-pick]').checked = e.target.checked; }));
  body.querySelector('#tgApply').onclick = () => {
    const cost = body.querySelector('#tgBulkCost').value.trim(), item = body.querySelector('#tgBulkItem').value.trim();
    const picked = rows().filter(tr => tr.querySelector('[data-pick]').checked && tr.style.display !== 'none');
    if (!picked.length) { UI.warn('Tick the lines first'); return; }
    if (!cost && !item) { UI.warn('Enter a cost code or a material code to apply'); return; }
    picked.forEach(tr => {
      if (cost) tr.querySelector('[data-f="CostCode"]').value = cost;
      if (item) tr.querySelector('[data-f="ItemCode"]').value = item;
    });
    filter();
  };
  filter();
  UI.modal({
    title: opts.poId ? 'Tag codes — ' + opts.poId : 'Tag PO lines', size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Save changes', class: 'btn-primary', onClick: async m => {
        const list = changed().map(tr => ({ POItemID: tr.dataset.id,
          CostCode: tr.querySelector('[data-f="CostCode"]').value.trim(),
          ItemCode: tr.querySelector('[data-f="ItemCode"]').value.trim() }));
        if (!list.length) { UI.warn('Nothing has changed'); return; }
        m.busy(true);
        try {
          const r = await api('tagPoLines', list);
          m.close(); UI.success('Codes saved', r.message);
          if (opts.onDone) opts.onDone();
        } catch (e) { UI.error('Could not save', e.message); }
        finally { m.busy(false); }
      } }
    ]
  });
}

const scheduleState = { view: 'table', search: '', status: '' };

async function renderProjectSchedule(host, d, sym) {
  const projectId = d.project.ProjectID;
  host.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="filters">
          <div class="field"><label for="schSearch">Search</label>
            <input class="input" id="schSearch" placeholder="WBS or activity"></div>
          <div class="field"><label for="schStatus">Status</label><select class="input" id="schStatus"></select></div>
          <div class="field"><label for="schView">View</label>
            <select class="input" id="schView">
              <option value="table">Table</option><option value="gantt">Gantt</option>
            </select></div>
        </div>
        <div class="flex gap-8" id="schActions"></div>
      </div>
      <div id="schSummary"></div>
      <div id="schBody">${UI.loadingState()}</div>
    </div>
    <div class="card mt-16">
      <div class="card-head"><div class="card-title">Milestones</div>
        <div id="msActions"></div></div>
      <div id="msTable"></div>
    </div>`;

  document.getElementById('schView').value = scheduleState.view;
  document.getElementById('schView').onchange = e => { scheduleState.view = e.target.value; loadSchedule(projectId); };
  let debounce;
  document.getElementById('schSearch').oninput = e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { scheduleState.search = e.target.value; loadSchedule(projectId); }, 250);
  };
  await loadSchedule(projectId);
}

async function loadSchedule(projectId) {
  const mount = document.getElementById('schBody');
  if (!mount) return;
  mount.innerHTML = UI.loadingState();
  try {
    const res = await api('listSchedule', projectId, scheduleState);
    const d = res.data;

    const statusSel = document.getElementById('schStatus');
    if (statusSel && !statusSel.dataset.filled) {
      statusSel.innerHTML = '<option value="">All statuses</option>' +
        d.statuses.map(s => `<option value="${s}">${s}</option>`).join('');
      statusSel.value = scheduleState.status;
      statusSel.dataset.filled = '1';
      statusSel.onchange = e => { scheduleState.status = e.target.value; loadSchedule(projectId); };
    }
    const actions = document.getElementById('schActions');
    if (actions && !actions.dataset.filled) {
      actions.dataset.filled = '1';
      if (d.canEdit) {
        const add = UI.el('button', { class: 'btn btn-sm btn-primary', text: '+ Add activity' });
        add.onclick = () => openActivityForm(projectId, null);
        actions.appendChild(add);
      }
      actions.appendChild(importExportBar('SCHEDULE', projectId,
        () => navigate('project', { projectId, tab: 'schedule' }), d.canEdit,
        () => ({ search: scheduleState.search, filters: { Status: scheduleState.status } })));
    }
    const msActions = document.getElementById('msActions');
    if (msActions && !msActions.dataset.filled && d.canEdit) {
      msActions.dataset.filled = '1';
      const add = UI.el('button', { class: 'btn btn-sm', text: '+ Add milestone' });
      add.onclick = () => openMilestoneForm(projectId, null);
      msActions.appendChild(add);
    }

    const s = d.summary;
    document.getElementById('schSummary').innerHTML = `
      <div class="stat-grid" style="padding:16px 16px 0">
        ${[['Activities', s.activities, `${s.delayed} delayed`],
           ['Planned progress', UI.fmt.percent(s.plannedProgress), 'Weighted by activity'],
           ['Actual progress', UI.fmt.percent(s.actualProgress), 'Weighted by activity'],
           ['Variance', UI.fmt.percent(s.variance), s.variance < 0 ? 'Behind plan' : 'On or ahead of plan'],
           ['Window', (s.earliestStart || '—') + ' → ' + (s.latestFinish || '—'), 'Earliest start to latest finish']]
          .map(x => `<div class="stat"><div class="stat-label">${UI.esc(x[0])}</div>
            <div class="stat-value" style="font-size:${String(x[1]).length > 14 ? '15px' : '24px'}">${UI.esc(x[1])}</div>
            <div class="stat-note">${UI.esc(x[2])}</div>
            <div class="stat-accent" ${x[2] === 'Behind plan' ? 'style="background:var(--amber-600)"' : ''}></div></div>`).join('')}
      </div>`;

    if (scheduleState.view === 'gantt') renderGantt(mount, d, projectId);
    else renderScheduleTable(mount, d, projectId);
    renderMilestones(d, projectId);
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retrySch');
    const b = document.getElementById('retrySch');
    if (b) b.onclick = () => loadSchedule(projectId);
  }
}

/** Simple, honest Gantt: one bar per activity positioned on the project window. */
function renderGantt(mount, d, projectId) {
  const rows = d.rows.filter(r => r.StartDate && r.FinishDate);
  if (!rows.length) {
    mount.innerHTML = UI.emptyState('Nothing to plot', 'Activities need a start and finish date.');
    return;
  }
  const min = new Date(d.summary.earliestStart).getTime();
  const max = new Date(d.summary.latestFinish).getTime();
  const span = Math.max(1, max - min);
  const pos = t => ((new Date(t).getTime() - min) / span) * 100;

  const tone = { Completed: 'var(--green-600)', Delayed: 'var(--red-600)',
                 'In Progress': 'var(--accent)', 'On Hold': 'var(--amber-600)', 'Not Started': 'var(--slate-400)' };

  mount.innerHTML = `
    <div style="padding:16px">
      <div class="between muted" style="font-size:12px;margin-bottom:8px">
        <span>${UI.esc(d.summary.earliestStart)}</span><span>${UI.esc(d.summary.latestFinish)}</span></div>
      ${rows.map(r => {
        const left = pos(r.StartDate), width = Math.max(0.8, pos(r.FinishDate) - left);
        return `<div style="display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:12px;
                  align-items:center;padding:5px 0;border-bottom:1px solid var(--border)">
          <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${UI.esc(r.ActivityName)}">
            <span class="mono muted">${UI.esc(r.WBS || '')}</span> ${UI.esc(r.ActivityName)}</div>
          <div style="position:relative;height:22px;background:var(--surface-2);border-radius:4px">
            <div title="${UI.esc(r.StartDate)} → ${UI.esc(r.FinishDate)} · ${UI.fmt.percent(r.ActualPercent)}"
                 style="position:absolute;left:${left}%;width:${width}%;top:3px;height:16px;
                        background:${tone[r.Status] || 'var(--accent)'};border-radius:3px;opacity:.35"></div>
            <div style="position:absolute;left:${left}%;width:${width * (Math.min(100, r.ActualPercent) / 100)}%;
                        top:3px;height:16px;background:${tone[r.Status] || 'var(--accent)'};border-radius:3px"></div>
          </div>
        </div>`;
      }).join('')}
      <div class="flex gap-16 mt-16 muted" style="font-size:12px;flex-wrap:wrap">
        ${Object.keys(tone).map(k => `<span><span style="display:inline-block;width:10px;height:10px;

const vendorState = { page: 1, pageSize: 25, search: '', category: '', status: '', sortBy: 'CompanyName', sortDir: 'asc' };


/** The live category list, refreshed whenever the vendor register loads. */
let vendorMeta = { categories: [], categoryGroups: [] };

/** A vendor's categories as chips, under the group each belongs to. */
function vendorCategoryChips(r) {
  const groups = (r.CategoryGroups && r.CategoryGroups.length)
    ? r.CategoryGroups
    : [{ group: '', items: r.CategoryList || (r.Category ? [r.Category] : []) }];
  if (!groups.length || !groups[0].items.length) return '<span class="muted">—</span>';
  return groups.map(g =>
    `<div class="cat-line">` +
    (g.group ? `<span class="cat-group">${UI.esc(g.group)}</span>` : '') +
    g.items.map(i => `<span class="chip">${UI.esc(i)}</span>`).join('') +
    `</div>`).join('');
}

/* ------------------------------------------------- VENDOR LEDGER & PAYMENTS
 * One running account per vendor. Invoices are debits, payments are credits,
 * and goods received but not yet billed sit beside the balance rather than
 * inside it — the vendor cannot claim what he has not invoiced.
 */

async function loadVendorLedger(vendorId) {
  const host = document.getElementById('vendorLedger');
  if (!host) return;
  host.innerHTML = UI.loadingState();
  const sym = App.settings.currencySymbol || 'Rs';
  const from = (document.getElementById('ledFrom') || {}).value || '';
  const to = (document.getElementById('ledTo') || {}).value || '';
  const projectId = (document.getElementById('ledProject') || {}).value || '';
  try {
    const d = (await api('getVendorLedger', vendorId, { from, to, projectId })).data;
    const s = d.summary;
    // The project list is the projects this vendor's account touches, read from the
    // whole statement (owner's request, 12 Nov 2026). A narrowed one keeps the list it had.
    const sel = document.getElementById('ledProject');
    if (sel && !projectId) {
      const seen = new Map();
      d.entries.forEach(e => { if (e.projectId && !seen.has(e.projectId)) seen.set(e.projectId, e.project || e.projectId); });
      sel.innerHTML = '<option value="">All projects</option>' +
        (d.entries.some(e => e.headOffice) ? '<option value="HEAD_OFFICE">Head office</option>' : '') + Array.from(seen.entries())
        .sort((x, y) => String(x[1]).localeCompare(String(y[1])))
        .map(([id, name]) => `<option value="${UI.esc(id)}">${UI.esc(name)}</option>`).join('');
      sel.value = '';
    }
    // One line of figures, not four cards: the statement below is the thing
    // being read, and tiles the height of the page pushed it out of sight.
    document.getElementById('vendorLedgerSummary').innerHTML =
      `<div class="ledger-figures">
        ${[['Opening', UI.fmt.money(d.openingBalance, sym)],
           ['Invoiced', UI.fmt.money(s.invoiced, sym)]]
          .concat(s.openingDues ? [['Owed before PMS', UI.fmt.money(s.openingDues, sym)]] : [])
          .concat([
           ['Paid', UI.fmt.money(s.paid, sym)],
           ['Balance owed', UI.fmt.money(s.closingBalance, sym), 'strong'],
           ['Received, not billed', UI.fmt.money(s.receivedNotInvoiced, sym)]])
          .map(t => `<div class="ledger-figure${t[2] ? ' is-total' : ''}">
            <span>${UI.esc(t[0])}</span><strong>${UI.esc(t[1])}</strong></div>`).join('')}
      </div>`;

    // The brought-forward line makes the running balance verifiable: every
    // figure in the Balance column follows from the one above it.
    const rows = [{ opening: true, date: '', type: '', ref: '', document: '',
                    description: 'Balance brought forward', project: '',
                    debit: 0, credit: 0, balance: d.openingBalance }]
      .concat(d.entries);
    UI.table(host, {
      columns: [
        { key: 'date', label: 'Date', width: '96px', render: r =>
          r.opening ? '' : UI.fmt.date(r.date) },
        { key: 'type', label: 'Type', width: '92px', render: r =>
          r.opening ? '' : UI.badge(r.type, r.type === 'Invoice' ? 'amber' : r.type === 'Debit note' ? 'violet'
            : r.type === 'Opening balance' ? 'blue' : 'green') },
        { key: 'ref', label: 'Reference', width: '130px', render: r =>
          r.opening ? '' :
          // The reference is what someone reads out on the phone, so it is
          // never allowed to break across lines.
          `<span class="mono nowrap">${UI.esc(r.ref)}</span>` +
          (r.document ? `<br><span class="muted">${UI.esc(r.document)}</span>` : '') },
        { key: 'description', label: 'Particulars', render: r =>
          r.opening ? `<em>${UI.esc(r.description)}</em>` : UI.esc(r.description) },
        { key: 'project', label: 'Project', render: r =>
          r.opening ? '' : r.unassigned ? UI.badge('Not set', 'amber')
            : r.project ? UI.esc(r.project) : '<span class="muted">—</span>' },
        { key: 'debit', label: 'Debit', align: 'right', width: '108px', render: r =>
          r.debit ? UI.fmt.number(r.debit) : '<span class="muted">—</span>' },
        { key: 'credit', label: 'Credit', align: 'right', width: '108px', render: r =>
          r.credit ? UI.fmt.number(r.credit) : '<span class="muted">—</span>' },
        { key: 'balance', label: 'Balance', align: 'right', width: '116px', render: r =>
          `<strong>${UI.fmt.number(r.balance)}</strong>` },
        // Each line opens the document behind it: an invoice to correct or
        // cancel, a payment to print as a voucher.
        { key: 'actions', label: '', align: 'right', width: '92px', render: r =>
          r.opening ? ''
            : r.type === 'Payment'
            ? `<div class="row-actions">` +
              (r.canReassign ? `<button class="btn btn-sm" data-setproj="${UI.esc(r.ref)}">Set project</button> ` : '') +
              `<button class="btn btn-sm"
                 data-voucher="${UI.esc(r.ref)}">Voucher</button>` +
              // A payment or advance keyed wrong is reversed, not deleted (24 Oct 2026).
              (can('vendor.pay') ? ` <button class="btn btn-sm btn-danger" data-revpay="${UI.esc(r.ref)}">Reverse</button>` : '') +
              `</div>`
            : r.type === 'Debit note'
            ? `<div class="row-actions"><button class="btn btn-sm"
                 data-debitnote="${UI.esc(r.ref)}">Open</button></div>`
            : r.type === 'Opening balance'
            ? (d.canOpening ? `<div class="row-actions"><button class="btn btn-sm btn-ghost"
                 data-cancelob="${UI.esc(r.ref)}">Cancel</button></div>` : '')
            : `<div class="row-actions"><button class="btn btn-sm"
                 data-invoice="${UI.esc(r.ref)}">Open</button></div>` }
      ],
      rows: rows,
      empty: UI.emptyState('Nothing on the account',
        'Record an invoice, then a payment against it.')
    });
    host.querySelectorAll('[data-voucher]').forEach(b => {
      b.onclick = () => printRecord('VENDORPAY', b.dataset.voucher);
    });
    host.querySelectorAll('[data-revpay]').forEach(b => {
      b.onclick = () => {
        const e = d.entries.find(x => x.ref === b.dataset.revpay);
        openReasonModal({
          title: 'Reverse payment ' + e.ref,
          label: 'Why is this being reversed?',
          confirmLabel: 'Reverse payment', danger: true,
          intro: `<strong>${UI.esc(UI.fmt.money(e.credit, sym))}</strong> paid on ${UI.esc(UI.fmt.date(e.date))}
            goes back onto what is owed to the vendor` + (e.related && /^SINV/.test(e.related)
              ? `, and invoice ${UI.esc(e.related)} is open again for it.` : '.') +
            ' The payment stays on the record marked Reversed — nothing is deleted.',
          onConfirm: async reason => {
            const res = await api('reverseVendorPayment', e.ref, reason);
            UI.success('Reversed', res.message);
            loadVendorLedger(vendorId);
          }
        });
      };
    });
    host.querySelectorAll('[data-invoice]').forEach(b => {
      b.onclick = () => openSupplierInvoice(b.dataset.invoice, () => loadVendorLedger(vendorId));
    });
    host.querySelectorAll('[data-setproj]').forEach(b => {
      b.onclick = () => openSetPaymentProject(d.entries.find(x => x.ref === b.dataset.setproj), () => loadVendorLedger(vendorId));
    });
    host.querySelectorAll('[data-cancelob]').forEach(b => {
      b.onclick = () => openReasonModal({
        title: 'Cancel opening balance ' + b.dataset.cancelob, label: 'Why is it being cancelled?',
        confirmLabel: 'Cancel it', danger: true,
        intro: 'It leaves the statement and what is owed. It stays on record, marked Cancelled.',
        onConfirm: async reason => {
          const res = await api('cancelVendorOpeningBalance', b.dataset.cancelob, reason);
          UI.success('Cancelled', res.message);
          loadVendorLedger(vendorId);
        }
      });
    });
    host.querySelectorAll('[data-debitnote]').forEach(b => {

    });
  } catch (e) {
    host.innerHTML = UI.errorState(e.message, 'retryLedger');
    const b = document.getElementById('retryLedger');
    if (b) b.onclick = () => loadVendorLedger(vendorId);
  }
}

async function exportVendorLedger(vendorId) {
  const from = (document.getElementById('ledFrom') || {}).value || '';
  const to = (document.getElementById('ledTo') || {}).value || '';
  const projectId = (document.getElementById('ledProject') || {}).value || '';
  try {
    const d = (await api('getVendorLedger', vendorId, { from, to, projectId })).data;
    const head = ['Date', 'Type', 'Reference', 'Document', 'Project', 'Detail',
                  'Debit', 'Credit', 'Balance'];
    const esc = v => {
      const t = String(v === undefined || v === null ? '' : v);
      return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    const lines = [head.join(',')];
    if (d.openingBalance) {
      lines.push(['', 'Opening', '', '', '', 'Balance brought forward', '', '',
                  d.openingBalance].map(esc).join(','));
    }
    d.entries.forEach(e => lines.push([
      UI.fmt.date(e.date), e.type, e.ref, e.document, e.project, e.description,
      e.debit || '', e.credit || '', e.balance].map(esc).join(',')));
    downloadCsv(`${d.vendor.CompanyName.replace(/[^A-Za-z0-9]+/g, "_")}_ledger.csv`,
                 lines.join('\n'));
  } catch (e) { UI.error('Could not export the ledger', e.message); }
}

/**
 * Tick boxes for the receipts an invoice is posted against (owner's request,
 * 24 Oct 2026: one invoice can cover several GRNs). Values are net of goods
 * returned. Ticking fills the amount in, until someone types their own.
 * Returns null when the server does not offer the list (an older server).
 */
async function grnPicker(vendorId, invoiceId, preselected, amountInput) {
  let rows;
  try { rows = (await api('listUninvoicedGRNs', vendorId, { invoiceId: invoiceId || '' })).data.rows; }
  catch (e) { return null; }
  const sym = App.settings.currencySymbol || 'Rs';
  const picked = new Set(preselected || []);
  let typed = !!(amountInput && amountInput.value && !(preselected || []).length);
  if (amountInput) amountInput.addEventListener('input', () => { typed = true; });
  const box = UI.el('div', { class: 'mt-16' });
  const draw = () => {
    const total = rows.filter(r => picked.has(r.GRNID)).reduce((s, r) => s + Number(r.Value || 0), 0);
    box.innerHTML = `<strong style="font-size:12.5px">Against goods receipts</strong>
      <span class="muted" style="font-size:12.5px"> — tick every receipt this invoice covers</span>
      ${rows.length ? `<div class="table-wrap mt-8"><table class="data"><thead><tr><th></th><th>Receipt</th><th>Date</th>
          <th>Order</th><th>Project</th><th class="r">Value</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td><input type="checkbox" data-g="${UI.esc(r.GRNID)}" ${picked.has(r.GRNID) ? 'checked' : ''}></td>
          <td class="mono">${UI.esc(r.GRNID)}</td><td>${UI.esc(UI.fmt.date(r.ReceiptDate))}</td>
          <td class="mono">${UI.esc(r.POID)}</td><td>${UI.esc(r.ProjectName)}</td>
          <td class="r">${UI.fmt.money(r.Value, sym)}${r.ReturnedValue ? `<br><span class="muted" style="font-size:11.5px">after ${UI.fmt.money(r.ReturnedValue, sym)} returned</span>` : ''}</td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="5" class="r">Ticked</td><td class="r"><strong>${UI.fmt.money(total, sym)}</strong></td></tr></tfoot>
        </table></div>`
      : '<p class="muted mt-8">No receipts from this vendor are waiting for an invoice.</p>'}`;
    box.querySelectorAll('[data-g]').forEach(c => c.onchange = () => {
      c.checked ? picked.add(c.dataset.g) : picked.delete(c.dataset.g);
      if (amountInput && !typed) {
        const t = rows.filter(r => picked.has(r.GRNID)).reduce((s, r) => s + Number(r.Value || 0), 0);
        amountInput.value = t ? Math.round(t * 100) / 100 : '';
      }
      draw();
    });
  };
  draw();
  return { el: box, picked: () => [...picked] };
}

        <tr><td>Tax</td><td class="r">${money(inv.TaxAmount)}</td></tr>
        <tr><td><strong>Net payable</strong></td><td class="r"><strong>${money(inv.NetAmount)}</strong></td></tr>

        <tr><td><strong>Outstanding</strong></td><td class="r"><strong>${money(inv.Outstanding)}</strong></td></tr>

}

/** Set the project of a payment, or split it across projects (owner, 12 Nov 2026; administrators). */
async function openSetPaymentProject(entry, onSaved) {
  if (!entry) return;
  let projects = [];
  try { projects = (await api('listProjects', { pageSize: 300 })).data.rows; } catch (e) { projects = []; }
  const opts = '<option value="">— choose —</option><option value="HEAD_OFFICE">Head office (no project)</option>' +
    projects.map(p => `<option value="${UI.esc(p.ProjectID)}">${UI.esc(p.ProjectName)}</option>`).join('');
  const sym = App.settings.currencySymbol || 'Rs';
  const body = UI.el('div');
  body.innerHTML =
    `<p class="muted" style="margin:0 0 12px;font-size:13px"><strong>${UI.esc(entry.ref)}</strong> · ${UI.esc(entry.document || '')}
       · ${UI.esc(UI.fmt.date(entry.date))} · <strong>${UI.esc(UI.fmt.money(entry.credit, sym))}</strong>.
       Choose its project. If one cheque paid for several projects, split it: the parts must add up to the payment.</p>
     <table class="lines"><thead><tr><th>Project</th><th class="num" style="width:160px">Amount</th><th></th></tr></thead>
       <tbody id="spRows"></tbody></table>
     <button class="btn btn-sm mt-8" id="spAdd" type="button">+ Split to another project</button>
     <div class="muted" style="margin-top:8px;font-size:12.5px" id="spSum"></div>
     <div class="field mt-16"><label for="spReason">Reason *</label>
       <textarea class="input" id="spReason" placeholder="For example: per Ali Hassan, old dues on Askari 14 JV"></textarea></div>`;
  const tbody = body.querySelector('#spRows');
  const sum = () => {
    const amts = [...tbody.querySelectorAll('[data-amt]')].map(i => Number(i.value || 0));
    const t = amts.reduce((a, b) => a + b, 0);
    body.querySelector('#spSum').textContent = amts.length > 1
      ? 'Parts: ' + UI.fmt.money(t, sym) + ' of ' + UI.fmt.money(entry.credit, sym) : '';
  };
  const addRow = (amount) => {
    const tr = UI.el('tr');
    tr.innerHTML = `<td><select class="input" data-proj>${opts}</select></td>
      <td><input class="input num" type="number" step="any" min="0" data-amt value="${amount === undefined ? '' : amount}"></td>
      <td><button class="line-drop" type="button" title="Remove">×</button></td>`;
    tbody.appendChild(tr);
    tr.querySelector('[data-amt]').oninput = sum;
    tr.querySelector('.line-drop').onclick = () => { if (tbody.children.length > 1) { tr.remove(); sum(); } };
  };
  addRow(entry.credit);
  body.querySelector('#spAdd').onclick = () => { addRow(''); sum(); };
  UI.modal({
    title: 'Set project — ' + entry.ref, body, size: 'wide',
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Save', class: 'btn-primary', onClick: async m => {
        const parts = [...tbody.querySelectorAll('tr')].map(tr => ({
          ProjectID: tr.querySelector('[data-proj]').value, Amount: tr.querySelector('[data-amt]').value }));
        if (parts.some(x => !x.ProjectID)) { UI.warn('Choose a project (or Head office) on every line.'); return; }
        const reason = body.querySelector('#spReason').value.trim();
        if (!reason) { UI.warn('Give the reason.'); return; }
        m.busy(true);
        try {
          const res = await api('setVendorPaymentProject', entry.ref,
            { parts, Reason: reason });
          m.close(); UI.success('Saved', res.message);
          if (onSaved) onSaved();
        } catch (e) { UI.error('Not saved', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

async function openVendorPaymentForm(vendor, onSaved) {
  let open = [];
  try {
    const led = (await api('getVendorLedger', vendor.VendorID, {})).data;
    open = led.entries.filter(e => e.type === 'Invoice' && e.status !== 'Paid');
  } catch (e) { /* a payment on account is still allowed */ }
  // An advance is a payment with no invoice, optionally against one of the
  // vendor's orders (owner's request, 23 Oct 2026: the form never said so).
  let orders = [];
  try {
    orders = (await api('listPurchaseOrders', { vendorId: vendor.VendorID, pageSize: 200 })).data.rows
      .filter(o => ['Cancelled', 'Draft'].indexOf(o.Status) === -1);
  } catch (e) { /* the advance can still be recorded without an order */ }
  // Every payment names a project or head office (owner, 12 Nov 2026).
  let projects = [];
  try { projects = (await api('listProjects', { pageSize: 300 })).data.rows; } catch (e) { projects = []; }

  const sym = App.settings.currencySymbol || 'Rs';
  const fields = [
    { name: 'SupplierInvoiceID', label: 'Against invoice', type: 'select',
      options: [{ value: '', label: '— none: this is an advance —' }].concat(open.map(e => ({ value: e.ref, label: e.ref }))),
      hint: open.length ? 'Leave blank to record an advance (on account). It counts against what the vendor is owed.'
                        : 'No unpaid invoices — this will be recorded as an advance (on account).' },
    { name: 'POID', label: 'Advance against order', type: 'select',
      options: [{ value: '', label: '—' }].concat(orders.map(o => ({ value: o.POID,
        label: o.POID + ' — ' + (o.ProjectName || o.ProjectID) + ' · ' + UI.fmt.money(o.Total, sym) }))),
      hint: 'For an advance only. Its project is taken from the order.' },
    { name: 'ProjectID', label: 'Project (when not against an invoice or order)', type: 'select',
      options: [{ value: '', label: '— choose —' }, { value: 'HEAD_OFFICE', label: 'Head office (no project)' }]
        .concat(projects.map(p => ({ value: p.ProjectID, label: p.ProjectName }))),
      hint: 'An invoice or an order brings its own project. Otherwise say which project this money is for, or Head office.' },
    { name: 'PaymentDate', label: 'Payment date', type: 'date', required: true,
      value: new Date().toISOString().slice(0, 10) },
    { name: 'Amount', label: 'Amount', type: 'number', required: true },
    { name: 'TaxWithheld', label: 'Tax withheld', type: 'number', value: 0,
      hint: 'Deducted at source. The vendor receives the amount less this.' },
    { name: 'Method', label: 'Method', type: 'select',
      options: (App.enums.PAYMENT_METHODS || ['Bank transfer', 'Cheque', 'Cash']) },
    ...bankFieldFor(), { name: 'Reference', label: 'Cheque / transfer number' },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  if (open.length) {
    const b = UI.el('div', { class: 'banner banner-info' });
    b.innerHTML = `<div>Unpaid invoices: ${open.map(e =>
      `<span class="mono">${UI.esc(e.ref)}</span> ${UI.fmt.money(e.debit, sym)}`).join(' · ')}</div>`;
    body.appendChild(b);
  }
  const form = UI.form(fields, {});
  body.appendChild(form);
  UI.modal({
    title: 'Payment or advance — ' + vendor.CompanyName, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Record payment', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(form, fields);
        if (!data) return;
        data.VendorID = vendor.VendorID;
        if (data.SupplierInvoiceID) { data.POID = ''; data.ProjectID = ''; }   // the invoice names its own
        else if (data.POID) {
          const o = orders.find(x => x.POID === data.POID);
          if (o) data.ProjectID = o.ProjectID;
        } else if (!data.ProjectID) {
          UI.warn('Choose the project this payment is for, or Head office.');
          return;
        }
        m.busy(true);
        try {
          const res = await api('recordVendorPayment', data);
          m.close(); UI.success('Recorded', res.message);
          if (onSaved) onSaved();
        } catch (e) { UI.error('Could not record the payment', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

function openVendorStatus(vendor) {

      options: ['Active', 'Inactive', 'Blacklisted'], value: vendor.Status },
    { name: 'Reason', label: 'Reason', type: 'textarea', span: 2,
      hint: 'Required when blacklisting. Recorded in the vendor notes and the audit trail.' }
  ];
  const body = UI.form(fields);
  UI.modal({
    title: 'Change vendor status', size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Apply', class: 'btn-primary', onClick: async m => {

        if (!data) return;
        m.busy(true);

function openEvaluationForm(vendor) {
  const score = { type: 'select', options: [
    { value: '5', label: '5 — Excellent' }, { value: '4', label: '4 — Good' },
    { value: '3', label: '3 — Acceptable' }, { value: '2', label: '2 — Poor' },
    { value: '1', label: '1 — Unacceptable' }] };
  const fields = [
    Object.assign({ name: 'DeliveryScore', label: 'Delivery on time (weight 0.30)', required: true }, score),
    Object.assign({ name: 'QualityScore', label: 'Quality of supply (weight 0.30)', required: true }, score),
    Object.assign({ name: 'PriceScore', label: 'Price competitiveness (weight 0.25)', required: true }, score),
    Object.assign({ name: 'ResponsivenessScore', label: 'Responsiveness (weight 0.15)', required: true }, score),
    { name: 'POID', label: 'Against purchase order (optional)' },
    { name: 'Comments', label: 'Comments', type: 'textarea', span: 2 }
  ];
  const body = UI.form(fields);
  const live = UI.el('div', { class: 'banner banner-info span-2' });
  body.appendChild(live);
  const recompute = () => {
    const v = UI.readForm(body);
    const overall = (Number(v.DeliveryScore) || 0) * 0.3 + (Number(v.QualityScore) || 0) * 0.3 +
                    (Number(v.PriceScore) || 0) * 0.25 + (Number(v.ResponsivenessScore) || 0) * 0.15;
    live.innerHTML = `<div>Overall score <strong>${overall.toFixed(2)} / 5</strong>
      <br><span class="muted">Weighted average. The rejection rate is taken from goods receipts, not scored here.</span></div>`;
  };
  body.querySelectorAll('select').forEach(sel => sel.addEventListener('change', recompute));
  recompute();

  UI.modal({
    title: 'Evaluate ' + vendor.CompanyName, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Record evaluation', class: 'btn-primary', onClick: async m => {
        const data = UI.validate(body, fields);
        if (!data) return;
        m.busy(true);
        try {
          const r = await api('recordVendorPerformance', vendor.VendorID, data);
          m.close(); UI.success('Evaluation recorded', r.message);
          navigate('vendor', vendor.VendorID);
        } catch (e) { UI.error('Could not record', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

function openContactForm(vendorId) {
  const fields = [
    { name: 'Name', label: 'Name', required: true, span: 2 },
    { name: 'Designation', label: 'Designation' },
    { name: 'Phone', label: 'Phone' },
    { name: 'Email', label: 'Email', type: 'email', span: 2 },
    { name: 'IsPrimary', label: 'Primary contact', type: 'checkbox', span: 2 }

  const body = UI.form(fields);
  UI.modal({
    title: 'Add contact', size: 'narrow', body,

      { label: 'Cancel', onClick: m => m.close() },

        const data = UI.validate(body, fields);
        if (!data) return;
        m.busy(true);
        try {
          await api('addVendorContact', vendorId, data);
          m.close(); UI.success('Contact added'); navigate('vendor', vendorId);
        } catch (e) { UI.error('Could not add', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

  awaitingMe: false, mineOnly: false, sortBy: 'RequestDate', sortDir: 'desc'
};

const PR_STATUS_TONE = {
  DRAFT: 'grey', SUBMITTED: 'blue', STOCK_VERIFIED: 'amber', PM_APPROVED: 'violet',
  MANAGEMENT_APPROVED: 'violet', ADMIN_APPROVED: 'violet',
  APPROVED_FOR_PROCUREMENT: 'green', RFQ_ISSUED: 'blue', PO_CREATED: 'green',
  CLOSED: 'grey', REJECTED: 'red', RETURNED: 'red', CANCELLED: 'grey'
};
const prStatusLabel = s => String(s || '').replace(/_/g, ' ').toLowerCase()
  .replace(/^./, c => c.toUpperCase());

/* ------------------------------------------------------------- LIST */

async function pagePurchaseRequests(root, arg) {
  // Opened from inside a project, the list is scoped to it; opened from the
  // sidebar, it is not. The filter lives in state either way.
  prState.projectId = (arg && arg.projectId) ? arg.projectId : '';
  // Inside a project, cancelled requests are left out (owner's request, 23 Oct 2026).
  prState.hideCancelled = !!prState.projectId;
  if (arg && arg.projectId) prState.page = 1;
  const sym = App.settings.currencySymbol || 'Rs';
  root.innerHTML =
    pageHead('Purchase Requests', 'Raise, verify, approve — every stage recorded',
      `<span id="prActions" class="flex gap-8"></span>` +
      (can('pr.create') ? `<button class="btn btn-primary" id="newPrBtn">+ New request</button>` : '')) +
    `<div id="prSummary" class="stat-grid" style="margin-bottom:16px"></div>
     <div class="card">
       <div class="card-head">
         <div class="filters">
           <div class="field"><label for="prSearch">Search</label>
             <input class="input" id="prSearch" placeholder="PR number, department, requester"
                    value="${UI.esc(prState.search)}"></div>
           <div class="field"><label for="prStatus">Status</label><select class="input" id="prStatus"></select></div>
           <div class="field"><label for="prStage">Waiting at</label><select class="input" id="prStage"></select></div>
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="prAwaiting"> Awaiting my decision</label></div>
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="prMine"> Raised by me</label></div>
           <button class="btn" id="prReset">Reset</button>
         </div>
         <button class="btn btn-sm" id="prWorkflowBtn">How approval works</button>
       </div>
       <div id="prTable">${UI.loadingState()}</div>
       <div id="prPager"></div>
     </div>`;

  const statusSel = document.getElementById('prStatus');
  statusSel.innerHTML = '<option value="">All statuses</option>' +
    (App.enums.PR_STATUS || []).map(s => `<option value="${s}">${prStatusLabel(s)}</option>`).join('');
  statusSel.value = prState.status;

  const stageSel = document.getElementById('prStage');
  stageSel.innerHTML = '<option value="">Any stage</option>' +
    [['STOCK_VERIFICATION', 'Stock verification'], ['PM_APPROVAL', 'Project manager'],
     ['MANAGEMENT_APPROVAL', 'Management'], ['ADMIN_APPROVAL', 'Administrator']]
      .map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  stageSel.value = prState.stage;

  document.getElementById('prAwaiting').checked = prState.awaitingMe;
  document.getElementById('prMine').checked = prState.mineOnly;

  let debounce;
  document.getElementById('prSearch').oninput = e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { prState.search = e.target.value; prState.page = 1; loadPurchaseRequests(); }, 250);
  };
  statusSel.onchange = e => { prState.status = e.target.value; prState.page = 1; loadPurchaseRequests(); };
  stageSel.onchange = e => { prState.stage = e.target.value; prState.page = 1; loadPurchaseRequests(); };
  document.getElementById('prAwaiting').onchange = e => {
    prState.awaitingMe = e.target.checked; prState.page = 1; loadPurchaseRequests();
  };
  document.getElementById('prMine').onchange = e => {
    prState.mineOnly = e.target.checked; prState.page = 1; loadPurchaseRequests();
  };
  document.getElementById('prReset').onclick = () => {
    Object.assign(prState, { page: 1, search: '', status: '', stage: '', awaitingMe: false, mineOnly: false });
    pagePurchaseRequests(root);
  };
  document.getElementById('prWorkflowBtn').onclick = showWorkflowConfig;
  const nb = document.getElementById('newPrBtn');
  if (nb) nb.onclick = () => openPrForm(null);

  // Import, Template and Export, the same three as BOQ, Budget and Vendors.
  // A request belongs to a project: the list's project filter supplies it when
  // one is chosen, and the import asks when it is not.
  document.getElementById('prActions').appendChild(
    importExportBar('PR', prState.projectId || null, () => loadPurchaseRequests(),
      can('pr.create'),
      () => ({ projectId: prState.projectId, search: prState.search,
               filters: { Status: prState.status } }),
      { projectScoped: true }));

  await loadPurchaseRequests();
}

async function loadPurchaseRequests() {
  const mount = document.getElementById('prTable');
  if (!mount) return;
  const sym = App.settings.currencySymbol || 'Rs';
  mount.innerHTML = UI.loadingState();
  try {
    const res = await api('listPurchaseRequests', prState);
    const d = res.data;

    document.getElementById('prSummary').innerHTML =
      [['Requests', d.summary.total, 'Visible to you'],
       ['Awaiting my decision', d.summary.awaitingMe, 'At a stage you can action'],
       ['Approved for procurement', d.summary.byStatus.APPROVED_FOR_PROCUREMENT || 0, 'Ready for RFQ or PO'],
       ['Value', UI.fmt.money(d.summary.estimatedValue, sym), 'Purchase value after stock check']]
        .map(t => `<div class="stat"><div class="stat-label">${UI.esc(t[0])}</div>
          <div class="stat-value">${UI.esc(t[1])}</div><div class="stat-note">${UI.esc(t[2])}</div>
          <div class="stat-accent"></div></div>`).join('');

    UI.table(mount, {
      sortBy: prState.sortBy, sortDir: prState.sortDir,
      onSort: key => {
        prState.sortDir = (prState.sortBy === key && prState.sortDir === 'asc') ? 'desc' : 'asc';
        prState.sortBy = key; loadPurchaseRequests();
      },
      columns: [
        { key: 'PRID', label: 'Request', render: r =>
          `<a href="#" data-open="${UI.esc(r.PRID)}"><strong class="mono">${UI.esc(r.PRID)}</strong></a>
           <br><span class="muted">${UI.esc(r.ItemCount)} item(s)</span>` },
        { key: 'ProjectName', label: 'Project', render: r =>
          `${UI.esc(r.ProjectName)}<br><span class="muted">${UI.esc(r.Department)}</span>` },
        { key: 'RequestedByName', label: 'Raised by', render: r =>
          `${UI.esc(r.RequestedByName)}<br><span class="muted">${UI.fmt.date(r.RequestDate)}</span>` },
        { key: 'RequiredDate', label: 'Required by', render: r => UI.fmt.date(r.RequiredDate) },
        { key: 'Priority', label: 'Priority', render: r =>
          UI.badge(r.Priority, r.Priority === 'Urgent' ? 'red' : r.Priority === 'High' ? 'amber' : 'grey') },
        { key: 'ApprovalValue', label: 'Value', align: 'right', render: r =>
          `${UI.fmt.money(r.ApprovalValue, sym)}${r.PurchaseTotal > 0 && r.PurchaseTotal !== r.EstimatedTotal
            ? `<br><span class="muted">est. ${UI.fmt.number(r.EstimatedTotal)}</span>` : ''}` },
        { key: 'Status', label: 'Status', render: r =>
          UI.badge(prStatusLabel(r.Status), PR_STATUS_TONE[r.Status]) },
        { key: 'CurrentStageLabel', label: 'Waiting at', render: r =>
          r.CurrentStageLabel ? UI.esc(r.CurrentStageLabel) : '<span class="muted">—</span>' },
        { key: 'actions', label: '', sortable: false, align: 'right', render: r =>
          `<div class="row-actions"><button class="btn btn-sm" data-open="${UI.esc(r.PRID)}">Open</button></div>` }
      ],
      rows: d.rows, rowKey: 'PRID',
      empty: UI.emptyState('No purchase requests',
        d.canCreate ? 'Raise the first request for a project you work on.' : 'Nothing to show yet.')
    });

    mount.querySelectorAll('[data-open]').forEach(n => {
      n.onclick = e => { e.preventDefault(); navigate('purchase-request', n.dataset.open); };
    });
    UI.pager(document.getElementById('prPager'), {
      page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
      onPage: p => { prState.page = p; loadPurchaseRequests(); }
    });
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message, 'retryPr');
    const b = document.getElementById('retryPr');
    if (b) b.onclick = loadPurchaseRequests;
  }
}

    UI.modal({

      body: `<p style="margin-top:0;font-size:13px">The route a request takes depends on its value after
        stock verification. These tiers come from Settings, so an administrator can change them without
        any code change.</p>
        <div class="table-wrap"><table class="data">
          <thead><tr><th>Value</th><th>Stages, in order</th></tr></thead>

/* ------------------------------------------------------------ NEW / EDIT */

async function openPrForm(existing) {
  let projects = [];
  try { projects = (await api('listProjects', { pageSize: 200, includeMetrics: false })).data.rows; }
  catch (e) { UI.error('Could not load projects', e.message); return; }
  const open = projects.filter(p => !p.IsClosed);
  if (!open.length) { UI.warn('No open projects', 'You need access to an open project to raise a request.'); return; }

  const headerFields = [
    { name: 'ProjectID', label: 'Project', type: 'select', required: true,
      options: open.map(p => ({ value: p.ProjectID, label: p.ProjectName })),
      readonly: !!existing },
    { name: 'Department', label: 'Department', required: true },
    { name: 'RequiredDate', label: 'Required by', type: 'date', required: true },
    { name: 'Priority', label: 'Priority', type: 'select', options: App.enums.PRIORITY || [] },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  const header = UI.form(headerFields, existing
    ? { ProjectID: existing.request.ProjectID, Department: existing.request.Department,
        RequiredDate: existing.request.RequiredDate, Priority: existing.request.Priority,
        Remarks: existing.request.Remarks }
    : { Priority: 'Normal' });
  body.appendChild(header);

  const itemsWrap = UI.el('div', { class: 'card mt-16' });
  itemsWrap.innerHTML = `<div class="card-head"><div class="card-title">Items</div>
    <button class="btn btn-sm" id="addPrItem">+ Add item</button></div>
    <div class="table-wrap"><table class="data" id="prItemTable">
      <thead><tr><th style="width:110px">Code</th><th>Item</th><th>Specification</th>
        <th style="width:90px">Unit</th><th style="width:110px">Cost code</th>
        <th class="num" style="width:100px">Qty</th><th class="num" style="width:110px">Est. rate</th>
        <th class="num" style="width:120px">Amount</th><th style="width:40px"></th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><th colspan="7" class="num">Estimated total</th>
        <th class="num" id="prItemTotal">0</th><th></th></tr></tfoot>
    </table></div>`;
  body.appendChild(itemsWrap);

  const tbody = itemsWrap.querySelector('tbody');
  const units = App.enums.UNITS || [];
  const sym = App.settings.currencySymbol || 'Rs';

  function recalc() {
    let total = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const qty = Number(tr.querySelector('[data-f="RequestedQty"]').value) || 0;
      const rate = Number(tr.querySelector('[data-f="EstimatedRate"]').value) || 0;
      const amount = qty * rate;
      tr.querySelector('[data-amount]').textContent = UI.fmt.number(amount);
      total += amount;
    });
    itemsWrap.querySelector('#prItemTotal').textContent = UI.fmt.money(total, sym);
  }

  function addRow(values) {
    const v = values || {};
    const tr = UI.el('tr');
    tr.innerHTML =
      `<td><input class="input" data-f="ItemCode" value="${UI.esc(v.ItemCode || '')}"></td>
       <td><input class="input" data-f="ItemName" value="${UI.esc(v.ItemName || '')}"></td>
       <td><input class="input" data-f="Specification" value="${UI.esc(v.Specification || '')}"></td>
       <td><select class="input" data-f="Unit">${units.map(u =>
         `<option value="${u}"${u === v.Unit ? ' selected' : ''}>${u}</option>`).join('')}</select></td>
       <td><input class="input" data-f="CostCode" value="${UI.esc(v.CostCode || '')}"></td>
       <td><input class="input num" type="number" step="any" data-f="RequestedQty"
            value="${v.RequestedQty === undefined ? '' : v.RequestedQty}" style="text-align:right"></td>
       <td><input class="input" type="number" step="any" data-f="EstimatedRate"
            value="${v.EstimatedRate === undefined ? '' : v.EstimatedRate}" style="text-align:right"></td>
       <td class="num" data-amount>0</td>
       <td><button class="btn btn-sm btn-ghost" data-remove title="Remove line">&times;</button></td>`;
    tr.querySelectorAll('input').forEach(i => i.addEventListener('input', recalc));
    tr.querySelector('[data-remove]').onclick = () => {
      if (tbody.querySelectorAll('tr').length === 1) { UI.warn('A request needs at least one item'); return; }
      tr.remove(); recalc();
    };
    tbody.appendChild(tr);
    recalc();
  }

  itemsWrap.querySelector('#addPrItem').onclick = () => addRow();
  if (existing && existing.items.length) existing.items.forEach(addRow);
  else addRow();

  UI.modal({
    title: existing ? 'Edit purchase request ' + existing.request.PRID : 'New purchase request',
    size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: existing ? 'Save draft' : 'Create draft', class: 'btn-primary', onClick: async m => {
        const head = UI.validate(header, headerFields);
        if (!head) return;
        const items = [];
        let bad = null;
        tbody.querySelectorAll('tr').forEach((tr, i) => {
          const row = {};
          tr.querySelectorAll('[data-f]').forEach(f => { row[f.dataset.f] = f.value.trim(); });
          if (!row.ItemName) bad = bad || ('Line ' + (i + 1) + ' needs an item name.');
          if (!(Number(row.RequestedQty) > 0)) bad = bad || ('Line ' + (i + 1) + ' needs a quantity.');
          items.push(row);
        });
        if (bad) { UI.warn('Check the items', bad); return; }

        m.busy(true);
        try {
          if (existing) {
            await api('updatePurchaseRequest', existing.request.PRID,
              Object.assign({}, head, { items: items }));
            m.close(); UI.success('Draft saved');
            navigate('purchase-request', existing.request.PRID);
          } else {
            const res = await api('createPurchaseRequest', head.ProjectID,
              Object.assign({}, head, { items: items }));
            m.close(); UI.success('Draft created', res.message);
            navigate('purchase-request', res.data.PRID);
          }
        } catch (e) { UI.error('Could not save', e.message); }
        finally { m.busy(false); }
      }}
    ]
  });
}

async function pagePurchaseRequestDetail(root, prId) {
  if (!prId) { navigate('purchase-requests'); return; }
  const res = await api('getPurchaseRequest', prId);
  const d = res.data;
  const r = d.request;
  const sym = App.settings.currencySymbol || 'Rs';

  const actions = [`<button class="btn" id="backPrs">← All requests</button>`,
                   `<button class="btn" id="printPr">Print</button>`];
  if (d.canEdit) actions.push(`<button class="btn" id="editPr">Edit</button>`);
  if (d.canSubmit) actions.push(`<button class="btn btn-primary" id="submitPr">Submit</button>`);
  if (d.canVerifyStock) actions.push(`<button class="btn btn-primary" id="verifyPr">Verify stock</button>`);
  if (d.canDecide) actions.push(
    `<button class="btn" id="returnPr">Return</button>`,
    `<button class="btn btn-danger" id="rejectPr">Reject</button>`,
    `<button class="btn btn-primary" id="approvePr">Approve</button>`);
  if (d.canCancel) actions.push(`<button class="btn" id="cancelPr">Cancel</button>`);

  root.innerHTML =
    pageHead(r.PRID, `${d.project ? d.project.ProjectName : r.ProjectID} · ${r.Department} · raised by ${d.requester ? d.requester.Name : r.RequestedBy}`,
      actions.join('')) +
    `<div class="flex gap-8" style="margin-bottom:16px;flex-wrap:wrap">
       ${UI.badge(prStatusLabel(r.Status), PR_STATUS_TONE[r.Status])}
       ${UI.badge(r.Priority, r.Priority === 'Urgent' ? 'red' : r.Priority === 'High' ? 'amber' : 'grey')}
       <span class="muted" style="align-self:center;font-size:12.5px">
         Required by ${UI.fmt.date(r.RequiredDate)} · approval tier ${UI.esc(d.workflow.tier)}</span>
     </div>
     <div class="card"><div class="card-head"><div class="card-title">Approval route</div>
       <span class="muted" style="font-size:12px">Value ${UI.fmt.money(d.workflow.approvalValue, sym)}</span></div>
       <div class="card-body" id="prStages"></div></div>

     <div class="card mt-16">
       <div class="card-head"><div class="card-title">Items</div>
         <span class="muted" style="font-size:12px">Purchase quantity is calculated from stock verification</span></div>
       <div id="prItems"></div>
     </div>

     <div class="mt-16" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start" id="prLower">
       <div class="card"><div class="card-head"><div class="card-title">Budget impact</div></div>
         <div id="prBudget"></div></div>
       <div class="card"><div class="card-head"><div class="card-title">Approval history</div>
         <span class="muted" style="font-size:12px">Append-only</span></div>
         <div id="prHistory"></div></div>
     </div>`;

  if (window.innerWidth < 1100) document.getElementById('prLower').style.gridTemplateColumns = '1fr';

  bind('editPr', () => openPrForm(d));
  bind('submitPr', () => confirmSubmitPr(r));
  bind('verifyPr', () => openStockVerification(d));
  bind('approvePr', () => openDecision(d, 'APPROVE'));
  bind('rejectPr', () => openDecision(d, 'REJECT'));
  bind('returnPr', () => openDecision(d, 'RETURN'));

        const tone = s.state === 'done' ? 'var(--green-600)'
