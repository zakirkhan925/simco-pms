async function subcategoryManager(onChanged) {
  const body = UI.el('div');
  body.innerHTML =
    `<div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:12px">
       <div class="field" style="flex-grow:1;margin:0">
         <label for="newCatName">Add a category</label>
         <input id="newCatName" class="input" placeholder="e.g. Terrazzo works" maxlength="60">
       </div>
       <div class="field" style="width:230px;margin:0">
         <label for="newCatGroup">Under</label>
         <select id="newCatGroup" class="input"></select>
       </div>
       <button class="btn btn-primary" type="button" id="addCatBtn">Add</button>
     </div>
     <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:8px">
       <input type="checkbox" id="showInactive"> Show ones switched off
     </label>
     <div id="catList" style="max-height:48vh;overflow-y:auto"></div>`;

  const listHost = body.querySelector('#catList');
  const groupSel = body.querySelector('#newCatGroup');
  let data = null;

  const refresh = async () => {
    listHost.innerHTML = UI.loadingState('Loading…');
    data = (await api('listSubcategories',
      { includeInactive: body.querySelector('#showInactive').checked })).data;

    const groups = Array.from(new Set(data.rows.map(r => r.TradeGroup))).sort();
    const keep = groupSel.value;
    groupSel.innerHTML = groups.map(g => `<option>${UI.esc(g)}</option>`).join('') +
      `<option value="__new">Other</option>`;
    if (keep) groupSel.value = keep;

    listHost.innerHTML = data.groups.map(g => `
      <div style="margin-bottom:14px">
        <div style="font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
                    color:var(--text-muted);margin:0 0 6px">${UI.esc(g.group)}</div>
        ${g.items.map(i => `
          <div style="display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;
                      ${i.Status === 'Active' ? '' : 'opacity:.55;'}">
            <span style="flex-grow:1;font-size:13px">${UI.esc(i.Name)}
              ${i.InUse ? `<span class="muted">· ${i.InUse} firm(s)</span>` : ''}
              ${i.Status === 'Active' ? '' : '<span class="muted">· off</span>'}</span>
            <button class="btn btn-sm" type="button" data-rename="${i.CategoryID}">Rename</button>
            <button class="btn btn-sm" type="button" data-toggle="${i.CategoryID}"
              data-status="${i.Status}">${i.Status === 'Active' ? 'Switch off' : 'Switch on'}</button>
            ${i.InUse ? '' : `<button class="btn btn-sm btn-danger" type="button"
              data-del="${i.CategoryID}" data-name="${UI.esc(i.Name)}">Remove</button>`}
          </div>`).join('')}
      </div>`).join('') || UI.emptyState('Nothing here', '');

    listHost.querySelectorAll('[data-rename]').forEach(b => {
      b.onclick = async () => {
        const row = data.rows.find(r => r.CategoryID === b.dataset.rename);
        const next = window.prompt('Rename this category' +
          (row.InUse ? ` — ${row.InUse} subcontractor(s) will be updated too` : ''), row.Name);
        if (next === null || !next.trim() || next.trim() === row.Name) return;
        try {
          UI.success((await api('updateSubcategory', row.CategoryID, { Name: next.trim() })).message);
          await refresh();
          if (onChanged) onChanged();
        } catch (e) { UI.error('Could not rename it', e.message); }
      };
    });
    listHost.querySelectorAll('[data-toggle]').forEach(b => {
      b.onclick = async () => {
        const next = b.dataset.status === 'Active' ? 'Inactive' : 'Active';
        try {
          await api('updateSubcategory', b.dataset.toggle, { Status: next });
          await refresh();
          if (onChanged) onChanged();
        } catch (e) { UI.error('Could not change it', e.message); }
      };
    });
    listHost.querySelectorAll('[data-del]').forEach(b => {
      b.onclick = () => UI.confirm({
        title: 'Remove this category?',
        message: `"${b.dataset.name}" is not used by any subcontractor and will be removed.`,
        confirmLabel: 'Remove', danger: true,
        onConfirm: async () => {
          try {
            UI.success((await api('deleteSubcategory', b.dataset.del)).message);
            await refresh();
            if (onChanged) onChanged();
          } catch (e) { UI.error('Could not remove it', e.message); }
        }
      });
    });
  };

  body.querySelector('#showInactive').onchange = refresh;
  body.querySelector('#addCatBtn').onclick = async () => {
    const name = body.querySelector('#newCatName').value.trim();
    if (!name) { UI.warn('Give the category a name.'); return; }
    try {
      const res = await api('createSubcategory', { Name: name, TradeGroup: groupSel.value });
      UI.success(res.message);
      body.querySelector('#newCatName').value = '';
      await refresh();
      if (onChanged) onChanged();
    } catch (e) { UI.error('Could not add it', e.message); }
  };

  await refresh();
  UI.modal({ title: 'Subcontractor categories', size: 'wide', body,
    footer: [{ label: 'Done', class: 'btn-primary', onClick: m => m.close() }] });
}

/**
 * Attach an advance that was paid before the agreement existed. Only
 * agreements on the same project are offered — the cash came out of that
 * project's float.
 */
function tagAdvanceDialog(paymentId, d, onDone) {
  const advance = (d.advances || []).find(a => a.SubPaymentID === paymentId);
  if (!advance) return;
  const choices = (d.agreements || [])
    .filter(a => String(a.ProjectID) === String(advance.ProjectID));

  if (!choices.length) {
    UI.error('No agreement to attach it to',
      'There is no agreement with this subcontractor on ' +
      (advance.ProjectName || advance.ProjectID) + ' yet. Prepare the agreement first.');
    return;
  }

  const fields = [
    { name: 'AgreementID', label: 'Recover through', type: 'select', required: true, span: 2,
      options: choices.map(a => ({ value: a.AgreementID,
        label: (a.AgreementNumber || a.AgreementID) + ' — ' + cash(a.ContractValue) +
               (a.Scope ? ' · ' + a.Scope : '') })) }
  ];
  const body = UI.el('div');
  body.innerHTML = `<p class="muted">${UI.esc(advance.SubPaymentID)} — ${cash(advance.Amount)}
    paid ${UI.esc(advance.PaymentDate)} on ${UI.esc(advance.ProjectName || advance.ProjectID)}.
    Once attached it is deducted from the bills on that agreement.</p>`;
  const form = UI.form(fields, {});
  body.appendChild(form);

  UI.modal({
    title: 'Attach advance to an agreement', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Attach', class: 'btn-primary', onClick: async m => {
          const v = UI.validate(form, fields);
          if (!v) return;
          m.busy(true);
          try {
            UI.success((await api('tagSubcontractorAdvance', paymentId, v.AgreementID)).message);
            m.close();
            onDone();
          } catch (e) { m.busy(false); UI.error('Could not attach it', e.message); }
        } }
    ]
  });
}

/* ================================================ AGREEMENT LINE ITEMS
   A subcontract is normally let on measured rates — so many SFT at so much
   per SFT. These lines are that schedule; every bill measures against them. */

function lineQty(n) {
  const v = Number(n || 0);
  return v.toLocaleString(undefined, { maximumFractionDigits: 3 });
}

/**
 * The line grid: a spreadsheet of Code / Description / UOM / Quantity / Rate.
 * Built once and used both when drawing up an agreement and when editing its
 * scope later, so the two cannot drift apart.
 *
 * Returns { root, collect, recalc, total } — `collect` gives the rows to send.
 */
function lineGrid(items, units, opts) {
  const o = opts || {};
  const rows = (items || []).map(i => ({
    AgreementItemID: i.AgreementItemID, ItemCode: i.ItemCode || '', Description: i.Description || '',
    Unit: i.Unit || '', Quantity: i.Quantity, Rate: i.Rate, Remarks: i.Remarks || '',
    locked: Number(i.PreviousQty || 0) > 0, billed: Number(i.PreviousQty || 0)
  }));

  const root = UI.el('div');
  root.innerHTML =
    `<div class="table-wrap">
       <table class="lines">
         <thead><tr>
           <th style="width:110px">Code</th>
           <th>Description</th>
           <th style="width:92px">UOM</th>
           <th class="num" style="width:110px">Quantity</th>
           <th class="num" style="width:110px">Rate</th>
           <th class="num" style="width:130px">Amount</th>
           <th style="width:34px"></th>
         </tr></thead>
         <tbody id="lineRows"></tbody>
         <tfoot><tr>
           <td colspan="5" style="text-align:right">${UI.esc(o.totalLabel || 'Agreement value')}</td>
           <td class="num" id="lineTotal">—</td><td></td>
         </tr></tfoot>
       </table>
     </div>
     <button class="btn mt-8" type="button" id="lineAdd">+ Add line</button>`;

  const tbody = root.querySelector('#lineRows');
  const totalCell = root.querySelector('#lineTotal');
  const unitOptions = u => units.map(x =>
    `<option value="${UI.esc(x)}"${x === u ? ' selected' : ''}>${UI.esc(x)}</option>`).join('');

  const recalc = () => {
    let total = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const q = Number(tr.querySelector('[data-f=Quantity]').value || 0);
      const r = Number(tr.querySelector('[data-f=Rate]').value || 0);
      const amt = q * r;
      total += amt;
      tr.querySelector('.line-amount').textContent = amt ? cash(amt) : '—';
    });
    totalCell.textContent = cash(total);
    if (o.onChange) o.onChange(total);
    return total;
  };

  const addRow = (row) => {
    const tr = UI.el('tr');
    const locked = !!row.locked;
    tr.dataset.id = row.AgreementItemID || '';
    tr.innerHTML =
      `<td><input class="input" data-f="ItemCode" value="${UI.esc(row.ItemCode)}" placeholder="BW-01"></td>
       <td><input class="input" data-f="Description" value="${UI.esc(row.Description)}"
                  placeholder="Block work 8&quot;"></td>
       <td><select class="input" data-f="Unit"${locked ? ' disabled' : ''}>
             <option value="">—</option>${unitOptions(row.Unit)}</select></td>
       <td><input class="input" type="number" step="any" min="0" data-f="Quantity"
                  value="${row.Quantity === undefined ? '' : row.Quantity}"></td>
       <td><input class="input" type="number" step="any" min="0" data-f="Rate"${locked ? ' readonly' : ''}
                  value="${row.Rate === undefined ? '' : row.Rate}"></td>
       <td class="num"><span class="line-amount">—</span></td>
       <td><button class="line-drop" type="button" title="${locked
             ? lineQty(row.billed) + ' ' + UI.esc(row.Unit) + ' already billed — this line cannot be removed'
             : 'Remove this line'}"${locked ? ' disabled' : ''}>×</button></td>`;
    tbody.appendChild(tr);
    tr.querySelectorAll('input,select').forEach(i => { i.oninput = recalc; i.onchange = recalc; });
    const drop = tr.querySelector('.line-drop');
    if (!locked) drop.onclick = () => { tr.remove(); recalc(); };
  };

  const blank = { ItemCode: '', Description: '', Unit: '', Quantity: '', Rate: '' };
  rows.forEach(addRow);
  if (!rows.length) addRow(blank);
  recalc();
  root.querySelector('#lineAdd').onclick = () => { addRow(blank); recalc(); };

  const collect = () => Array.from(tbody.querySelectorAll('tr')).map(tr => {
    const get = f => tr.querySelector('[data-f=' + f + ']');
    const out = {
      ItemCode: get('ItemCode').value.trim(),
      Description: get('Description').value.trim(),
      Unit: get('Unit').value,
      Quantity: get('Quantity').value,
      Rate: get('Rate').value
    };
    if (tr.dataset.id) out.AgreementItemID = tr.dataset.id;
    // A row nobody touched is not a line.
    const empty = !out.ItemCode && !out.Description && !out.Unit && !out.Quantity && !out.Rate;
    return empty && !tr.dataset.id ? null : out;
  }).filter(Boolean);

  return { root, collect, recalc };
}

async function agreementForm(existing, subId, onSaved, fixedProjectId) {
  // Every project that is still open, not only the active ones — a subcontract
  // is often signed while the project is in Planning or Tender.
  const projects = (await api('listProjects', { pageSize: 200 })).data.rows
    .filter(p => String(p.Status) !== 'Closed');
  const subs = (await api('listSubcontractors', { pageSize: 200 })).data.rows;
  const units = (App.enums && App.enums.UNITS) || [];

  const isNew = !existing;
  const values = existing ? Object.assign({}, existing) : {
    SubcontractorID: subId || '', ProjectID: fixedProjectId || '',
    Basis: 'measured',
    RetentionPercent: App.settings['finance.defaultRetentionPercent'] || 10
  };

  const fields = [
    { name: 'ProjectID', label: 'Project', type: 'select', required: true,
      options: projects.map(p => ({ value: p.ProjectID,
        label: p.ProjectID + ' — ' + p.ProjectName +
               (p.Status === 'Active' ? '' : ' (' + p.Status + ')') })),
      readonly: !!existing,
      hint: projects.length ? '' : 'No open projects — create one first' },
    { name: 'SubcontractorID', label: 'Subcontractor', type: 'select', required: true,
      options: subs.map(x => ({ value: x.SubcontractorID, label: x.CompanyName + ' (' + x.Trade + ')' })),
      readonly: !!existing },
    { name: 'Scope', label: 'Scope of work', required: true, type: 'textarea', span: 2 }
  ].concat(isNew ? [
    { name: 'Basis', label: 'How is this subcontract billed?', type: 'select', required: true, span: 2,
      options: [{ value: 'measured', label: 'Measured — quantity × rate per line (SFT, Cft, Nos…)' },
                { value: 'lump', label: 'Lump sum — one agreed figure' }],
      hint: 'Measured lets every bill be measured against the lines below' }
  ] : []).concat([
    { name: 'ContractValue', label: 'Contract value', type: 'number',
      required: !isNew && !(existing && existing.IsMeasured),
      hint: existing && existing.IsMeasured
        ? 'Set by the measured lines — change it under Scope & rates'
        : 'Set by the lines below when the subcontract is measured',
      readonly: !!(existing && existing.IsMeasured) },
    { name: 'RetentionPercent', label: 'Retention %', type: 'number' },
    { name: 'AdvanceAmount', label: 'Advance paid', type: 'number',
      hint: 'Recovered from bills as work is done' },
    { name: 'StartDate', label: 'Start date', type: 'date', required: true },
    { name: 'EndDate', label: 'End date', type: 'date', required: true },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ]);

  const body = UI.el('div');
  const form = UI.form(fields, values);
  body.appendChild(form);

  // On a new agreement the scope is entered here, as lines, rather than in a
  // second visit to the record.
  let grid = null, gridWrap = null;
  const valueField = form.querySelector('[name="ContractValue"]');
  const basisField = form.querySelector('[name="Basis"]');

  if (isNew) {
    gridWrap = UI.el('div');
    gridWrap.innerHTML = `<h4 style="margin:18px 0 6px;font-size:13px">Scope and rates</h4>`;
    grid = lineGrid([], units, {
      onChange: total => {
        if (valueField) {
          valueField.value = total ? total : '';
          valueField.setAttribute('readonly', 'readonly');
        }
      }
    });
    gridWrap.appendChild(grid.root);
    body.appendChild(gridWrap);

    const applyBasis = () => {
      const measured = basisField.value === 'measured';
      gridWrap.style.display = measured ? '' : 'none';
      const valueRow = valueField.closest('.field') || valueField.parentElement;
      if (valueRow) valueRow.style.display = measured ? 'none' : '';
      if (measured) { grid.recalc(); }
      else { valueField.removeAttribute('readonly'); }
    };
    basisField.onchange = applyBasis;
    applyBasis();
  }

  UI.modal({
    title: existing ? 'Edit ' + existing.AgreementID : 'New subcontract agreement',
    size: isNew ? 'xwide' : '', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Save', class: 'btn-primary', onClick: async m => {
          const measured = isNew && basisField.value === 'measured';
          // The value comes from the lines, so it is not a field the user answers.
          const check = measured ? fields.filter(f => f.name !== 'ContractValue') : fields;
          const data = UI.validate(form, check);
          if (!data) return;
          if (measured) {
            data.items = grid.collect();
            delete data.ContractValue;
            if (!data.items.length) {
              UI.warn('Add at least one line with a quantity and a rate.');
              return;
            }
          }
          m.busy(true);
          try {
            const res = existing
              ? await api('updateAgreement', existing.AgreementID, data)
              : await api('createAgreement', data.ProjectID, data);
            UI.success(res.message);
            m.close();
            if (onSaved) onSaved(res.data);
          } catch (e) { m.busy(false); UI.error('Could not save', e.message); }
        } }
    ]
  });
}

async function pageAgreement(root, agreementId) {
  if (!agreementId) { navigate('agreements'); return; }
  const d = (await api('getAgreement', agreementId)).data;
  const a = d.agreement, p = d.position;

  const actions = [];
  if (d.canEdit) actions.push(`<button class="btn" id="agrEdit">Edit</button>`);
  if (d.canEdit) actions.push(`<button class="btn" id="agrLines">Scope &amp; rates</button>`);
  if (d.canChangeStatus && d.allowedTransitions.length) {
    actions.push(`<button class="btn" id="agrStatusBtn">Change status</button>`);
  }
  // Submitted and decided like a subcontractor bill (owner's decision, 23 Oct 2026).
  if (d.canSubmit) actions.push(`<button class="btn btn-primary" id="agrSubmit">Submit for approval</button>`);
  if (d.canDecide) {
    actions.push(`<button class="btn" id="agrReturn">Return</button>`);
    actions.push(`<button class="btn btn-danger" id="agrReject">Reject</button>`);
    actions.push(`<button class="btn btn-primary" id="agrApprove">Approve</button>`);
  }

    pageHead(agreementId, (d.subcontractor ? d.subcontractor.CompanyName : '') +
      ' · ' + (d.project ? d.project.ProjectName : ''), actions.join(' ')) +
    `<div class="stat-grid" style="margin-bottom:16px">
       ${statTile('Contract value', cash(p.contractValue),
           a.IsMeasured ? p.lineCount + ' measured line(s)' : UI.esc(a.Scope || ''))}
       ${statTile('Billed', cash(p.billed), 'gross work approved')}
       ${statTile('Remaining', cash(p.remaining), 'left of the agreement')}
       ${statTile('Paid', cash(p.paid), '')}
       ${statTile('Outstanding', cash(p.outstanding), 'net still to pay')}
       ${statTile('Retention held', cash(p.retentionHeld),
          p.retentionReleased ? cash(p.retentionReleased) + ' released' : 'released at completion')}
       ${statTile('Advance outstanding', cash(p.advanceOutstanding),
          p.advancePaidCash > 0
            ? cash(p.advancePaidCash) + ' paid in cash' +
              (p.advanceAgreed > 0 ? ', ' + cash(p.advanceAgreed) + ' on the agreement' : '')
            : 'recovered from bills')}
     </div>
     <div class="card" style="margin-bottom:16px">
       <div class="card-head">
         <h3>Scope and rates</h3>
         <span class="muted" style="font-size:12.5px">${a.IsMeasured
           ? 'Work done is measured against these lines on every bill'
           : 'This agreement is billed as a lump sum'}</span>
       </div>
       <div id="agrLineTable"></div>
     </div>
     <div class="grid-2">
       <div class="card">
         <div class="card-head"><h3>Bills</h3>${UI.badge(a.Status, AGREEMENT_TONE[a.Status])}</div>
         <div id="agrBills"></div>

       <div class="card-head"><h3>Retention released</h3></div>
       <div id="agrReleases"></div>
     </div>` : ''}`;

  renderAgreementLines(document.getElementById('agrLineTable'), d);
  const relHost = document.getElementById('agrReleases');
  if (relHost) {
    UI.table(relHost, {
      columns: [
        { key: 'PaymentDate', label: 'Date', width: '110px', render: r =>
          r.IsReversed ? `<s class="muted">${UI.fmt.date(r.PaymentDate)}</s>` : UI.fmt.date(r.PaymentDate) },
        { key: 'Amount', label: 'Amount', align: 'right', render: r =>
          r.IsReversed ? `<s class="muted">${cash(r.Amount)}</s>` : cash(r.Amount) },
        { key: 'Method', label: 'Method' },
        { key: 'Reference', label: 'Reference', render: r => r.Reference ? `<span class="mono">${UI.esc(r.Reference)}</span>` : '—' },
        { key: 'Remarks', label: 'Reason', render: r => UI.esc(r.Remarks || '') +
          (r.IsReversed ? '<br>' + UI.badge('Reversed', 'red') +

      ],

    });
    relHost.querySelectorAll('[data-unrelease]').forEach(b => {
      b.onclick = () => {
        const rel = d.retentionReleases.find(x => String(x.SubPaymentID) === b.dataset.unrelease);
        openReasonModal({
          title: 'Reverse release ' + rel.SubPaymentID,
          label: 'Why is this being reversed?',
          confirmLabel: 'Reverse release', danger: true,
          intro: `<strong>${cash(rel.Amount)}</strong> released on ${UI.fmt.date(rel.PaymentDate)} is held again on this agreement.`,
          onConfirm: async reason => {

    rows: d.bills,
    empty: UI.emptyState('No bills yet', a.Status === 'Active'
      ? 'Raise the first bill when work has been measured.'
      : a.Status === 'Pending Approval'
        ? 'Bills can be raised once the agreement is approved.'
        : 'Submit the agreement for approval; bills can be raised once it is active.')
  });
  root.querySelectorAll('[data-bill]').forEach(el => {
    el.onclick = e => { e.preventDefault(); navigate('subbill', el.dataset.bill); };
  });
  renderApprovalTimeline(document.getElementById('agrHistory'), d.approvals);

  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on('agrEdit', () => agreementForm(a, a.SubcontractorID, () => navigate('agreement', agreementId)));
  on('agrLines', () => agreementLinesEditor(agreementId, d.items, d.units,
    () => navigate('agreement', agreementId)));
  on('agrBillBtn', () => subBillForm(agreementId, d, () => navigate('agreement', agreementId)));
  on('agrStatusBtn', () => agreementStatusDialog(agreementId, d.allowedTransitions));
  on('agrSubmit', async () => {
    try { UI.success((await api('submitAgreement', agreementId)).message); navigate('agreement', agreementId); }
    catch (e) { UI.error('Could not submit', e.message); }
  });
  on('agrRetention', () => releaseRetentionDialog(agreementId, p.retentionHeld));
  on('agrApprove', () => decideAgreementDialog(agreementId, 'APPROVE'));
  on('agrReturn', () => decideAgreementDialog(agreementId, 'RETURN'));
  on('agrReject', () => decideAgreementDialog(agreementId, 'REJECT'));
}

  const live = (agreements || []).filter(a => ['Completed', 'Terminated'].indexOf(a.Status) === -1);
  let projects = [];
  try {
    projects = (await api('listProjects', { pageSize: 200 })).data.rows.filter(p => String(p.Status) !== 'Closed');

    { name: 'AgreementID', label: 'Against agreement', type: 'select',

        label: a.AgreementID + ' — ' + (a.ProjectName || a.ProjectID) + ' · ' + (a.Scope || '') }))),
      hint: 'Recovered from this agreement’s bills. Leave blank if there is no agreement yet.' },
    { name: 'ProjectID', label: 'Project (when no agreement)', type: 'select',
      options: [{ value: '', label: '—' }].concat(projects.map(p => ({ value: p.ProjectID, label: p.ProjectID + ' — ' + p.ProjectName }))) },
    { name: 'Amount', label: 'Amount', type: 'number', required: true },
    { name: 'PaymentDate', label: 'Date', type: 'date' },

  ];
  const body = UI.el('div');

                                 AgreementID: live.length === 1 ? live[0].AgreementID : '' });
  body.appendChild(form);
  UI.modal({
    title: 'Advance to ' + s.CompanyName, body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },

}

/* ================================================= SUBCONTRACTOR BILL */


/**
 * Raise a bill, or correct one that was sent back.
 *
 * `existing` turns it into an edit: the fields prefill, and the bill's own
 * quantities are taken back out of the "previous" column — otherwise a line
 * would appear to have been billed twice and the balance would read short.
 */
async function subBillForm(agreementId, agreementData, onSaved, existing) {
  const p = agreementData.position, a = agreementData.agreement;
  const editing = !!existing;
  const mine = {};
  if (editing) {
    (existing.items || []).forEach(i => { mine[String(i.AgreementItemID)] = Number(i.CurrentQty) || 0; });
  }
  const allItems = (agreementData.items || []).map(i => {
    const own = mine[String(i.AgreementItemID)] || 0;
    if (!own) return i;
    return Object.assign({}, i, {
      PreviousQty: Number(i.PreviousQty) - own,
      BalanceQty: Number(i.BalanceQty) + own,
      PreviousAmount: Number(i.PreviousAmount || 0) - own * Number(i.Rate || 0)
    });
  });
  const measured = allItems.filter(i => Number(i.BalanceQty) > 0 || Number(i.PreviousQty) > 0);
  const isMeasured = allItems.length > 0;

  const fields = [
    { name: 'PeriodFrom', label: 'Period from', type: 'date', required: true },
    { name: 'PeriodTo', label: 'Period to', type: 'date', required: true }
  ].concat(isMeasured ? [] : [
    { name: 'GrossAmount', label: 'Value of work done this period', type: 'number', required: true,
      hint: 'At most ' + cash(p.remaining) + ' is left of the agreement' }
  ]).concat([
    { name: 'AdvanceRecovery', label: 'Advance recovery', type: 'number',
      hint: p.advanceOutstanding > 0
        ? 'Leave blank to recover the standard share. ' + cash(p.advanceOutstanding) + ' outstanding.'
        : 'No advance outstanding' },
    { name: 'TaxPercent', label: 'Tax %', type: 'number', value: 0 },
    { name: 'BillDate', label: 'Bill date', type: 'date', value: new Date().toISOString().slice(0, 10) }
  ]);

  const body = UI.el('div');
  const seed = editing ? {
    PeriodFrom: (existing.bill.PeriodFrom || '').slice(0, 10),
    PeriodTo: (existing.bill.PeriodTo || '').slice(0, 10),
    GrossAmount: existing.bill.GrossAmount,
    AdvanceRecovery: existing.bill.AdvanceRecovery,
    TaxPercent: existing.bill.TaxPercent,
    BillDate: (existing.bill.BillDate || '').slice(0, 10)
  } : {};
  const form = UI.form(fields, seed);
  body.appendChild(form);

  // The measurement sheet: what was done this period, line by line.
  let sheet = null;
  if (isMeasured) {
    sheet = UI.el('div');
    sheet.innerHTML =
      `<h4 style="margin:18px 0 6px;font-size:13px">Measurement for this period</h4>
       <div class="table-wrap">
         <table class="lines">
           <thead><tr>
             <th>Line</th><th style="width:56px">UOM</th>
             <th class="num" style="width:96px">Contract</th>
             <th class="num" style="width:96px">Previous</th>
             <th class="num" style="width:110px">This bill</th>
             <th class="num" style="width:96px">Cumulative</th>
             <th class="num" style="width:90px">Rate</th>
             <th class="num" style="width:120px">Amount</th>
           </tr></thead>
           <tbody>${measured.map(i => `
             <tr data-id="${UI.esc(i.AgreementItemID)}">
               <td>${UI.esc(i.Description)}${i.ItemCode
                 ? ' <span class="muted">· ' + UI.esc(i.ItemCode) + '</span>' : ''}</td>
               <td>${UI.esc(i.Unit)}</td>
               <td class="num">${lineQty(i.Quantity)}</td>
               <td class="num">${lineQty(i.PreviousQty)}</td>
               <td><input class="input" type="number" step="any" min="0" max="${i.BalanceQty}"
                          data-qty value="${mine[String(i.AgreementItemID)] || ''}" placeholder="0"
                          title="${lineQty(i.BalanceQty)} ${UI.esc(i.Unit)} still to do"></td>
               <td class="num" data-cum>${lineQty(i.PreviousQty)}</td>
               <td class="num">${cash(i.Rate)}</td>
               <td class="num" data-amt>—</td>
             </tr>`).join('')}</tbody>
         </table>
       </div>
       <div id="sheetWarn"></div>`;
    body.appendChild(sheet);
  }

  const preview = UI.el('div', { class: 'totals-strip', id: 'billPreview' });
  body.appendChild(preview);

  const readSheet = () => (measured || []).map((i, idx) => {
    const tr = sheet.querySelectorAll('tbody tr')[idx];
    return { AgreementItemID: i.AgreementItemID, CurrentQty: tr.querySelector('[data-qty]').value };
  }).filter(r => Number(r.CurrentQty) > 0);

  const recalc = () => {
    const v = UI.readForm(form);
    let gross;
    if (isMeasured) {
      gross = 0;
      const warn = [];
      measured.forEach((i, idx) => {
        const tr = sheet.querySelectorAll('tbody tr')[idx];
        const qty = Number(tr.querySelector('[data-qty]').value || 0);
        const amt = qty * Number(i.Rate || 0);
        gross += amt;
        tr.querySelector('[data-amt]').textContent = amt ? cash(amt) : '—';
        tr.querySelector('[data-cum]').textContent = lineQty(Number(i.PreviousQty) + qty);
        if (qty > Number(i.BalanceQty)) {
          warn.push(i.Description + ': only ' + lineQty(i.BalanceQty) + ' ' + i.Unit + ' left to bill');
        }
      });
      sheet.querySelector('#sheetWarn').innerHTML = warn.length
        ? '<div class="banner banner-warn mt-8">' + warn.map(UI.esc).join('<br>') + '</div>' : '';
    } else {
      gross = Number(v.GrossAmount || 0);
    }
    const retention = gross * Number(a.RetentionPercent || 0) / 100;
    const advance = (v.AdvanceRecovery === '' || v.AdvanceRecovery === undefined)
      ? Math.min(p.advanceOutstanding,
          gross * Number(App.settings['finance.advanceRecoveryPercent'] || 20) / 100)
      : Number(v.AdvanceRecovery || 0);
    const tax = gross * Number(v.TaxPercent || 0) / 100;
    const net = gross - retention - advance + tax;
    preview.innerHTML =
      '<div><span>Work done</span><span id="billGross">' + cash(gross) + '</span></div>' +
      '<div><span>Less retention (' + Number(a.RetentionPercent || 0) + '%)</span>' +
        '<span id="billRet">−' + cash(retention) + '</span></div>' +
      '<div><span>Less advance recovery</span><span id="billAdv">−' + cash(advance) + '</span></div>' +
      (tax ? '<div><span>Plus tax</span><span>+' + cash(tax) + '</span></div>' : '') +
      '<div class="grand"><span>Net payable</span>' +
        '<strong id="billNet">' + cash(net) + '</strong></div>' +
      (gross > p.remaining
        ? '<div class="banner banner-warn mt-8" id="billOver">This is more than the ' + cash(p.remaining) +
          ' left on the agreement and will be refused.</div>' : '');
  };
  form.querySelectorAll('input').forEach(i => { i.oninput = recalc; });
  if (sheet) sheet.querySelectorAll('[data-qty]').forEach(i => { i.oninput = recalc; });
  recalc();

  UI.modal({
    title: editing ? 'Correct ' + existing.bill.SubBillID : 'New subcontractor bill',
    size: isMeasured ? 'xwide' : '', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: editing ? 'Save changes' : 'Create draft', class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          if (isMeasured) {
            data.items = readSheet();
            if (!data.items.length) {
              UI.warn('Enter the quantity done this period against at least one line.');
              return;
            }
          }
          m.busy(true);
          try {
            const res = editing
              ? await api('updateSubcontractorBill', existing.bill.SubBillID, data)
              : await api('createSubcontractorBill', agreementId, data);
            UI.success(res.message);
            m.close();
            if (onSaved) onSaved(res.data);
          } catch (e) {
            m.busy(false);
            UI.error(editing ? 'Could not save the bill' : 'Could not create the bill', e.message);
          }
        } }
    ]
  });
}

function decideSubBillDialog(billId, action) {
  const verb = { APPROVE: 'Approve', RETURN: 'Return for correction', REJECT: 'Reject' }[action];
  const needsReason = action !== 'APPROVE';
  const fields = [{ name: 'Comments', label: needsReason ? 'Reason (required)' : 'Comments',
                    type: 'textarea', required: needsReason, span: 2 }];
  const body = UI.el('div');
  const form = UI.form(fields, {});
  body.appendChild(form);
  UI.modal({
    title: verb + ' bill', size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: verb, class: action === 'REJECT' ? 'btn-danger' : 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          m.busy(true);
          try {
            UI.success((await api('decideSubcontractorBill', billId, action, data.Comments || '')).message);
            m.close();
            navigate('subbill', billId);
          } catch (e) { m.busy(false); UI.error('Could not record the decision', e.message); }
        } }
    ]
  });
}


function subPaymentDialog(billId, outstanding) {
  const fields = [
    { name: 'Amount', label: 'Amount', type: 'number', required: true,
      hint: cash(outstanding) + ' is outstanding' },
    { name: 'PaymentDate', label: 'Payment date', type: 'date', required: true,
      value: new Date().toISOString().slice(0, 10) },
    { name: 'PaymentMethod', label: 'Method', type: 'select',
      options: ['Bank transfer', 'Cheque', 'Cash'] },
    { name: 'ReferenceNo', label: 'Reference' },
    { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, { Amount: outstanding });
  body.appendChild(form);
  const warn = UI.el('div', { class: 'banner banner-warn mt-8 hidden', id: 'payWarn',
    text: 'That is more than the outstanding balance and will be refused.' });
  body.appendChild(warn);
  form.querySelector('[name="Amount"]').oninput = e => {
    warn.classList.toggle('hidden', Number(e.target.value || 0) <= outstanding + 0.005);
  };

  UI.modal({
    title: 'Record a payment', size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Record payment', class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          m.busy(true);
          try {
            UI.success((await api('recordSubcontractorPayment', billId, data)).message);
            m.close();
            navigate('subbill', billId);
          } catch (e) { m.busy(false); UI.error('Could not record the payment', e.message); }
        } }
    ]
  });
}

async function cashSpendDialog(accountId, d) {
  // Only approved bills with something still owing can be settled from the float.
  const bills = (await api('listSubcontractorBills', { projectId: d.account.ProjectID, pageSize: 100 }))
    .data.rows.filter(b => b.IsApproved && Number(b.Outstanding) > 0);
  const advances = (d.advances || []).filter(a => Number(a.Outstanding) > 0);

  // Cash goes to subcontractors before there is a bill, so the firm is picked
  // directly. Agreements are offered per firm, and only this project's.
  const [subRes, agrRes] = await Promise.all([
    api('listSubcontractors', { pageSize: 300 }),
    api('listAgreements', { pageSize: 300 })
  ]);
  const subs = subRes.data.rows.filter(x => String(x.Status) !== 'Blacklisted');
  const projectAgreements = agrRes.data.rows
    .filter(a => String(a.ProjectID) === String(d.account.ProjectID));

  const fields = [
    { name: 'Type', label: 'What kind of payment?', type: 'select', required: true, span: 2,
      options: [
        { value: 'EXPENSE', label: 'Site expense' },
        { value: 'SUBPAYMENT', label: 'Payment against a subcontractor bill' },
        { value: 'SUBADVANCE', label: 'Advance to a subcontractor (no bill yet)' },
        { value: 'STAFF_ADVANCE', label: 'Advance to labour or staff' },
        { value: 'ADVANCE_RECOVERY', label: 'Advance settled or returned' },
        { value: 'RETURN', label: 'Cash returned to the office' }
      ] },
    { name: 'Amount', label: 'Amount', type: 'number', required: true,
      hint: cash(d.balance) + ' in hand' },
    { name: 'TxnDate', label: 'Date', type: 'date', required: true,
      value: new Date().toISOString().slice(0, 10) },
    { name: 'Category', label: 'Expense category', type: 'select', options: d.categories || [] },
    { name: 'CostCode', label: 'Cost code' },
    { name: 'SubBillID', label: 'Subcontractor bill', type: 'select',
      options: bills.map(b => ({ value: b.SubBillID,
        label: b.SubBillID + ' — ' + cash(b.Outstanding) + ' outstanding' })),
      hint: bills.length ? '' : 'No approved bills are outstanding on this project' },
    { name: 'SubcontractorID', label: 'Subcontractor', type: 'select',
      options: subs.map(x => ({ value: x.SubcontractorID,
        label: x.CompanyName + (x.Trade ? ' — ' + x.Trade : '') })),
      hint: subs.length ? '' : 'No active subcontractor on file' },
    { name: 'AgreementID', label: 'Against agreement', type: 'select',
      options: [],
      hint: 'Optional. Leave blank if the agreement is not signed yet — ' +
            'you can attach it later from the subcontractor.' },
    { name: 'StaffAdvanceID', label: 'Advance being settled', type: 'select',
      options: advances.map(a => ({ value: a.StaffAdvanceID,
        label: a.PersonName + ' — ' + cash(a.Outstanding) + ' outstanding' })),
      hint: advances.length ? '' : 'Nothing outstanding' },
    { name: 'PersonName', label: 'Person receiving it' },
    { name: 'PayeeName', label: 'Paid to', placeholder: 'Shop, driver, supplier…' },
    { name: 'Description', label: 'What was it for?', type: 'textarea', span: 2 }
  ];

  const body = UI.el('div');
  const form = UI.form(fields, { Type: 'EXPENSE' });
  body.appendChild(form);

  // Each kind of payment needs a different handful of these fields.
  const SHOW = {
    EXPENSE:          ['Category', 'CostCode', 'PayeeName', 'Description'],
    SUBPAYMENT:       ['SubBillID', 'Description'],
    SUBADVANCE:       ['SubcontractorID', 'AgreementID', 'Description'],
    STAFF_ADVANCE:    ['PersonName', 'Description'],
    ADVANCE_RECOVERY: ['StaffAdvanceID', 'Description'],
    RETURN:           ['Description']
  };
  const typeField = form.querySelector('[name="Type"]');
  const applyType = () => {
    const show = SHOW[typeField.value] || [];
    ['Category', 'CostCode', 'SubBillID', 'SubcontractorID', 'AgreementID', 'StaffAdvanceID',
     'PersonName', 'PayeeName', 'Description']
      .forEach(n => {
        const el = form.querySelector('[name="' + n + '"]');
        if (!el) return;
        const row = el.closest('.field') || el.parentElement;
        if (row) row.style.display = show.indexOf(n) === -1 ? 'none' : '';
      });
  };
  typeField.onchange = applyType;
  applyType();

  // The agreement list follows the firm: offering another firm's agreement
  // would only be refused by the server.
  const subField = form.querySelector('[name="SubcontractorID"]');
  const agrField = form.querySelector('[name="AgreementID"]');
  const applySub = () => {
    const mine = projectAgreements.filter(a => String(a.SubcontractorID) === String(subField.value));
    agrField.innerHTML = '<option value="">Not against an agreement yet</option>' +
      mine.map(a => `<option value="${UI.esc(a.AgreementID)}">` +
        UI.esc((a.AgreementNumber || a.AgreementID) + ' — ' + (a.Scope || a.Status)) +
        '</option>').join('');
    agrField.disabled = !mine.length;
  };
  subField.onchange = applySub;
  applySub();

  UI.modal({
    title: 'Record a payment from ' + accountId, body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Record', class: 'btn-primary', onClick: async m => {
          const shown = ['Type', 'Amount', 'TxnDate'].concat(SHOW[typeField.value] || []);
          const data = UI.validate(form, fields.filter(f => shown.indexOf(f.name) !== -1));
          if (!data) return;
          data.Type = typeField.value;
          m.busy(true);
          try {
            UI.success((await api('recordCashSpend', accountId, data)).message);
            m.close();
            navigate('cash-account', accountId);
          } catch (e) { m.busy(false); UI.error('Could not record it', e.message); }
        } }
    ]
  });
}

/**
 * Correcting an entry already in the book.
 *
 * What is offered depends on the entry. The detail — what it was for, who
 * took the money, which category it belongs under — is always correctable
 * while the period is open. The amount and date are only correctable on a
 * movement that stands alone; where the figure is shared with a bill, an
 * advance or another float, the form says so instead of letting someone
 * type a number the server will refuse.
 */
async function cashEditDialog(txnId, onDone) {
  let d;
  try { d = (await api('getCashTransaction', txnId)).data; }
  catch (e) { UI.error('Could not open the entry', e.message); return; }

  const t = d.transaction;
  if (!d.canEdit) { UI.error('This entry cannot be changed', d.blockedBy); return; }

  const money = d.canEditAmount;
  const fields = [
    { name: 'Amount', label: 'Amount', type: 'number', required: true,
      hint: money ? '' : d.amountBlockedBy },
    { name: 'TxnDate', label: 'Date', type: 'date', required: true },
    { name: 'Category', label: 'Expense category', type: 'select', options: d.categories || [] },
    { name: 'CostCode', label: 'Cost code' },
    { name: 'PayeeName', label: 'Paid to' },
    { name: 'Description', label: 'What was it for?', type: 'textarea', span: 2 }
  ];

  const body = UI.el('div');
  const head = UI.el('div', { class: 'banner banner-info' });
  head.innerHTML = `<div><strong>${UI.esc(CASH_TYPE_LABEL[t.Type] || t.Type)}</strong>
    · ${UI.esc(t.CashTxnID)}
    ${d.reportId ? ` · in report <span class="mono">${UI.esc(d.reportId)}</span>
        (${UI.esc(d.reportStatus)}), which is restated when you save` : ' · not yet reported'}
    ${d.linkedTo ? `<br>The amount is also held on ${UI.esc(d.linkedTo)}.` : ''}</div>`;
  body.appendChild(head);

  const form = UI.form(fields, {
    Amount: t.Amount, TxnDate: t.TxnDate, Category: t.Category,
    CostCode: t.CostCode, PayeeName: t.PayeeName, Description: t.Description
  });
  body.appendChild(form);

  // Only an expense carries a category; nothing else should be asked for one.
  if (t.Type !== 'EXPENSE') {
    ['Category', 'CostCode'].forEach(n => {
      const el = form.querySelector('[name="' + n + '"]');
      const rowEl = el && (el.closest('.field') || el.parentElement);
      if (rowEl) rowEl.style.display = 'none';
    });
  }
  // A figure that cannot move is shown, not hidden — the custodian still
  // needs to read it while correcting the line around it.
  if (!money) {
    ['Amount', 'TxnDate'].forEach(n => {
      const el = form.querySelector('[name="' + n + '"]');
      if (el) { el.disabled = true; el.classList.add('is-readonly'); }
    });
  }

  UI.modal({
    title: 'Edit ' + txnId, size: 'wide', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Save changes', class: 'btn-primary', onClick: async m => {
          const shown = fields.filter(f =>
            (money || ['Amount', 'TxnDate'].indexOf(f.name) === -1) &&
            (t.Type === 'EXPENSE' || ['Category', 'CostCode'].indexOf(f.name) === -1));
          const v = UI.validate(form, shown);
          if (!v) return;
          m.busy(true);
          try {
            UI.success((await api('updateCashTransaction', txnId, v)).message);
            m.close();
            onDone();
          } catch (e) { m.busy(false); UI.error('Could not save it', e.message); }
        } }
    ]
  });
}

async function pageCashReport(root, reportId) {
  if (!reportId) { navigate('cash'); return; }
  const d = (await api('getCashReport', reportId)).data;

  const actions = [`<button class="btn" id="creportBack">← Float</button>`,
                   `<button class="btn" id="creportPrint">Print</button>`];

  if (d.canDecide) {
    actions.push(`<button class="btn" id="creportReturn">Return</button>`);

    actions.push(`<button class="btn btn-primary" id="creportApprove">Approve</button>`);

  root.innerHTML =
    pageHead(reportId, UI.esc(d.account.CustodianName) + ' · ' +
      UI.fmt.date(r.PeriodFrom) + ' — ' + UI.fmt.date(r.PeriodTo), actions.join(' ')) +
    (diff ? `<div class="banner banner-warn"><div><strong>The cash counted differs by ${cash(diff)}.</strong>
       The ledger says ${cash(r.ClosingBalance)}; ${cash(r.CountedCash)} was counted.</div></div>` : '') +
    `<div class="grid-2">
       <div class="card">
         <div class="card-head"><h3>The period</h3>${UI.badge(r.Status, CASH_REPORT_TONE[r.Status])}</div>
         <div class="card-body">
           <div class="totals-strip">

             <div><span>Spent (${r.EntryCount} entries)</span><span id="crSpent">−${cash(r.TotalSpent)}</span></div>
             <div><span>Returned to office</span><span>−${cash(r.TotalReturned)}</span></div>
             <div class="grand"><span>Closing balance</span>
               <strong id="crClose">${cash(r.ClosingBalance)}</strong></div>
             ${r.CountedCash ? `<div><span>Counted in hand</span><span id="crCounted">${cash(r.CountedCash)}</span></div>` : ''}
           </div>
         </div>
       </div>
       <div class="card">
         <div class="card-head"><h3>Where it went</h3></div>
         <div id="crCategories"></div>
       </div>
     </div>
     <div class="card" style="margin-top:16px">
       <div class="card-head"><h3>Every entry in this period</h3></div>

     </div>
     <div class="card" style="margin-top:16px">

     </div>`;

    columns: [
      { key: 'category', label: 'Category' },

    ],
    rows: d.byCategory,
    empty: UI.emptyState('No expenses', 'This period holds no site expenses.')
  });

  UI.table(document.getElementById('crRows'), {
    columns: [
      { key: 'TxnDate', label: 'Date', width: '100px', render: x => UI.fmt.date(x.TxnDate) },
      { key: 'Type', label: 'Movement', width: '165px',
        render: x => UI.esc(CASH_TYPE_LABEL[x.Type] || x.Type) },
      { key: 'Description', label: 'Detail', render: x => UI.esc(x.Description || '') +
          (x.PayeeName ? ` <span class="muted">· ${UI.esc(x.PayeeName)}</span>` : '') },

        render: x => x.Category ? UI.esc(x.Category) : '<span class="muted">—</span>' },
      { key: 'Amount', label: 'Amount', align: 'right',

function cashSubmitDialog(reportId, report) {
  const fields = [
    { name: 'CountedCash', label: 'Cash actually in hand', type: 'number', span: 2,
      value: report.CountedCash || '',
      hint: 'The ledger says ' + cash(report.ClosingBalance) + '. Count the box and enter what is there.' }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, {});
  body.appendChild(form);
  const warn = UI.el('div', { id: 'submitDiff' });
  body.appendChild(warn);
  const recalc = () => {
    const v = UI.readForm(form);
    const diff = Number(v.CountedCash || 0) - Number(report.ClosingBalance || 0);
    warn.innerHTML = (v.CountedCash !== '' && diff)
      ? `<div class="banner banner-warn mt-8">That is ${cash(Math.abs(diff))} ${diff > 0 ? 'more' : 'less'}
         than the ledger expects. Submit anyway and explain it to your manager.</div>` : '';
  };
  form.querySelectorAll('input').forEach(i => { i.oninput = recalc; });

  UI.modal({
    title: 'Submit ' + reportId, size: 'narrow', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Submit', class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          m.busy(true);
          try {
            UI.success((await api('submitCashReport', reportId, data.CountedCash)).message);
            m.close();
            navigate('cash-report', reportId);
          } catch (e) { m.busy(false); UI.error('Could not submit', e.message); }
        } }
    ]
  });
}

function cashDecideDialog(reportId, action) {
  const label = { APPROVE: 'Approve', RETURN: 'Return for correction', REJECT: 'Reject' }[action];
  const fields = [
    { name: 'Comments', label: 'Comments', type: 'textarea', span: 2,
      required: action !== 'APPROVE',
      hint: action === 'APPROVE'
        ? 'The expenses will be booked to the project and the period closed'
        : 'Say what needs putting right' }
  ];
  const body = UI.el('div');

async function selectReport(id, projectScope) {

function reportCell(col, row) {
  const v = row[col.key];
  switch (col.type) {
    case 'money': return cash(v);
    case 'number': return UI.fmt.number(v, 0);
    case 'qty': return UI.fmt.number(v, 2);
    case 'percent': return (v === '' || v === null || v === undefined) ? '—' : UI.fmt.percent(v);
    case 'date': return UI.fmt.date(v);
    case 'badge': return UI.badge(v);
    case 'flag': return v ? '<span class="flag-yes">Yes</span>' : '<span class="muted">No</span>';
    default: return UI.esc(v === null || v === undefined ? '' : v);
  }
}

function renderReport(d) {
  const mount = document.getElementById('reportResult');
  if (!d.rows.length) {
    mount.innerHTML = UI.emptyState('Nothing matched',
      'No records fall inside these filters. Widen the dates or clear a filter.');
  } else {
    UI.table(mount, {
      columns: d.columns.map(c => ({
        key: c.key, label: c.label,
        align: ['money', 'number', 'qty', 'percent'].indexOf(c.type) !== -1 ? 'right' : '',
        render: row => {
          const html = reportCell(c, row);
          if (c.signed && typeof row[c.key] === 'number' && row[c.key] !== 0) {
            return `<span class="${row[c.key] < 0 ? 'num-neg' : 'num-pos'}">${html}</span>`;
          }
          return html;

      })),
      rows: d.rows

    `<span>${d.rowCount} row${d.rowCount === 1 ? '' : 's'}</span>` +

    (d.note ? `<span class="muted">${UI.esc(d.note)}</span>` : '');

function renderMonthlyChart(mount, charts) {
  const peak = Math.max(...charts.billed, ...charts.received);
  if (!peak) {
    mount.innerHTML = '<p class="muted" style="margin:0">Nothing has been certified or received yet. ' +
      'The last twelve months appear here once billing starts.</p>';
    return;
  }
  const max = peak;
  mount.innerHTML =
    '<div class="spark">' + charts.months.map((m, i) => {
      const b = Math.round(charts.billed[i] / max * 100);
      const r = Math.round(charts.received[i] / max * 100);
      const label = m.slice(5) + '/' + m.slice(2, 4);
      return `<div class="spark-col" title="${m}: certified ${charts.billed[i]}, received ${charts.received[i]}">
          <div class="spark-bar billed" style="height:${b}%"></div>
          <div class="spark-bar received" style="height:${r}%"></div>
          <div class="spark-label">${label}</div></div>`;
    }).join('') + '</div>' +
    `<div class="muted" style="font-size:11.5px">Peak month ${cash(peak)}</div>`;
}

function renderBudgetChart(mount, rows) {
  if (!rows.length) { mount.innerHTML = '<p class="muted">No projects yet.</p>'; return; }
  const max = Math.max(1, ...rows.map(r => Math.max(r.Budget, r.Forecast)));
  mount.innerHTML = '<div class="bar-chart">' + rows.map(r => {
    const over = r.Forecast > r.Budget && r.Budget > 0;
    return `<div class="bar-row">
        <div class="bar-label">${UI.esc(r.ProjectName)}</div>
        <div class="bar-track">
          <div class="bar ${over ? 'bar-billed' : 'bar-received'}"
               style="width:${Math.round(r.Forecast / max * 100)}%"></div>
        </div>
        <div class="bar-value">${cash(r.Forecast)} / ${cash(r.Budget)}</div>
      </div>`;
  }).join('') + '</div>';
}

function initGlobalSearch() {
  const input = document.getElementById('globalSearch');
  const panel = document.getElementById('globalSearchResults');
  if (!input || !panel || input.dataset.wired) return;
  input.dataset.wired = '1';
  input.disabled = false;

  let debounce, lastQuery = '';
  const close = () => panel.classList.add('hidden');

  input.oninput = () => {
    clearTimeout(debounce);
    const q = input.value.trim();
    if (q.length < 2) { close(); return; }
    debounce = setTimeout(async () => {
      lastQuery = q;
      try {
        const d = (await api('globalSearch', q, 5)).data;
        if (d.query !== lastQuery.toLowerCase()) return;   // a later keystroke won
        renderSearch(panel, d);
      } catch (e) { close(); }
    }, 220);
  };
  input.onkeydown = e => { if (e.key === 'Escape') { close(); input.blur(); } };
  document.addEventListener('click', e => {
    if (e.target !== input && !panel.contains(e.target)) close();
  });
}

const SEARCH_ROUTES = {
  project: id => navigate('project', id),
  pr: id => navigate('purchase-request', id),
  po: id => navigate('purchase-order', id),
  vendor: id => navigate('vendor', id),
  boq: id => navigate('project', { projectId: id, tab: 'boq' }),
  stock: () => navigate('stock'),
  'rar-bill': id => navigate('rar-bill', id),
  expense: id => navigate('expense', id),
  subcontractor: id => navigate('subcontractor', id),
  documents: id => navigate('project', { projectId: id, tab: 'documents' })
};

function renderSearch(panel, d) {
  if (!d.groups.length) {
    panel.innerHTML = `<div class="search-empty">Nothing matches “${UI.esc(d.query)}”.</div>`;
    panel.classList.remove('hidden');
    return;
  }
  panel.innerHTML = d.groups.map(g =>
    `<div class="search-group"><span>${UI.esc(g.label)}</span>
       <span>${g.items.length} of ${g.total}</span></div>` +
    g.items.map(it =>
      `<div class="search-item" data-view="${UI.esc(g.view)}" data-id="${UI.esc(it.id)}">
         <div class="search-item-title">${UI.esc(it.title)}</div>
         <div class="search-item-sub">${UI.esc(it.subtitle || '')}</div>
       </div>`).join('')
  ).join('');
  panel.classList.remove('hidden');
  panel.querySelectorAll('.search-item').forEach(el => {
    el.onclick = () => {
      panel.classList.add('hidden');
      document.getElementById('globalSearch').value = '';
      const go = SEARCH_ROUTES[el.dataset.view];
      if (go) go(el.dataset.id);
      else UI.warn('Not available', 'That record has no screen yet.');
    };
  });
}

           <button class="btn" id="impTemplate">Download template</button>
         </div>
         <div id="impNote" class="banner banner-info"></div>
         <div id="impColumns"></div>
       </div>
     </div>

     <div class="card" style="margin-top:16px">
       <div class="card-head"><div class="card-title">2 &middot; Upload and check the file</div></div>
       <div class="card-body">
         <div class="filters">
           <div class="field"><label for="impFile">CSV file</label>
             <input class="input" type="file" id="impFile" accept=".csv,text/csv"></div>
           <button class="btn btn-primary" id="impValidate" disabled>Check the file</button>
         </div>
         <p class="muted" style="font-size:12px;margin:0">
           Nothing is written until you have seen the report and confirmed.</p>
         <label id="impCatsRow" class="hidden"
                style="display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:12.5px">
           <input type="checkbox" id="impCreateCats" style="margin-top:2px">
           <span>Add categories I don't recognise.<br>
             <span class="muted">Anything not already on the list is created as the file is
             imported, rather than the row being refused. Separate several with a comma,
             a semicolon or a slash.</span></span>
         </label>
       </div>
     </div>

     <div id="impReport" style="margin-top:16px"></div>`;

  const modSel = document.getElementById('impModule');
  const projField = document.getElementById('impProjectField');

  const describe = () => {
    const m = modules.filter(x => x.key === modSel.value)[0];
    impState.module = m.key;
    projField.style.display = m.projectScoped ? '' : 'none';
    document.getElementById('impNote').textContent = m.note
      ? m.note
      : 'Download the template first — the column headings have to match exactly.';
    document.getElementById('impColumns').innerHTML =
      `<div class="table-wrap" style="max-height:240px;margin-top:12px"><table class="data"><thead><tr>
         <th>Column</th><th>Required</th><th>Type</th><th>Notes</th></tr></thead><tbody>` +
      m.columns.map(c => `<tr><td class="mono">${UI.esc(c.name)}</td>
         <td>${c.required ? '<span class="badge badge-amber">Required</span>' : '<span class="muted">optional</span>'}</td>
         <td>${UI.esc(c.type)}</td><td class="muted">${UI.esc(c.note || '')}</td></tr>`).join('') +
      `</tbody></table></div>`;
    document.getElementById('impReport').innerHTML = '';
    impState.report = null;

    // Only the imports that carry a managed category list can extend it, and
    // the option has to be re-evaluated whenever the module changes — not once
    // at start-up.
    const row = document.getElementById('impCatsRow');
    const extendable = ['VENDORS', 'STOCK_ITEMS', 'SUBCONTRACTORS'];
    if (row) row.classList.toggle('hidden', extendable.indexOf(String(m.key).toUpperCase()) === -1);
  };
  modSel.onchange = describe;
  describe();

  document.getElementById('impProject').onchange = e => { impState.projectId = e.target.value; };
  document.getElementById('impTemplate').onclick = async () => {
    try {
      const d = (await api('getImportTemplate', impState.module)).data;
      downloadCsv(d.fileName, d.csv);
      UI.success('Template downloaded', d.fileName);
    } catch (e) { UI.error('Could not build the template', e.message); }
  };

  const catsBox = document.getElementById('impCreateCats');
  if (catsBox) {
    catsBox.checked = !!impState.createCategories;
    catsBox.onchange = () => { impState.createCategories = catsBox.checked; };
  }

  const fileInput = document.getElementById('impFile');
  const validateBtn = document.getElementById('impValidate');
  fileInput.onchange = () => {
    const file = fileInput.files && fileInput.files[0];
    validateBtn.disabled = !file;
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => { impState.csv = String(ev.target.result); impState.fileName = file.name; };
    reader.readAsText(file);
  };
  validateBtn.onclick = runImportCheck;
}

async function runImportCheck() {
  const mount = document.getElementById('impReport');
  const m = impState.module;
  mount.innerHTML = UI.loadingState('Checking…');
  try {
    const d = (await api('validateImport', m, impState.csv, impState.projectId,
      { createCategories: impState.createCategories })).data;
    impState.report = d;
    const hard = d.errors.filter(e => e.severity !== 'warning');
    mount.innerHTML =
      `<div class="card">
         <div class="card-head"><div class="card-title">3 &middot; The report</div>
           <span class="badge badge-${hard.length ? 'red' : 'green'}">
             ${hard.length ? hard.length + ' problem(s)' : 'Ready'}</span></div>
         <div class="card-body">
           <div class="stat-grid" style="margin-bottom:12px">
             <div class="stat"><div class="stat-label">Rows read</div><div class="stat-value" id="impTotal">${d.summary.total}</div></div>
             <div class="stat"><div class="stat-label">Ready to import</div><div class="stat-value" id="impValid">${d.summary.valid}</div></div>
             <div class="stat"><div class="stat-label">Problems</div><div class="stat-value" id="impInvalid">${d.summary.invalid}</div></div>
           </div>
           ${hard.length
             ? `<div class="banner banner-warn" id="impBlocked">Nothing has been written.
                  Fix the file and upload it again — an import is all or nothing.</div>`
             : `<div class="banner banner-ok" id="impReady">${d.summary.valid} row(s) are ready.</div>`}
         </div>
         <div id="impErrors"></div>
         <div id="impPreview"></div>
         <div class="card-body flex gap-8">
           <button class="btn" id="impErrorCsv" ${d.errors.length ? '' : 'disabled'}>Download error report</button>
           <button class="btn btn-primary" id="impCommit" ${hard.length || !d.summary.valid ? 'disabled' : ''}>
             Import ${d.summary.valid} row(s)</button>
         </div>
       </div>`;

    if (d.errors.length) {
      UI.table(document.getElementById('impErrors'), {
        columns: [
          { key: 'row', label: 'Line', width: '70px' },
          { key: 'column', label: 'Column', width: '160px' },
          { key: 'value', label: 'Value', width: '160px' },
          { key: 'message', label: 'Problem',
            render: e => (e.severity === 'warning' ? '<span class="badge badge-amber">warning</span> ' : '') +
                         UI.esc(e.message) }
        ],
        rows: d.errors
      });
    }
    if (d.preview && d.preview.length) {
      const cols = Object.keys(d.preview[0].data);
      UI.table(document.getElementById('impPreview'), {
        columns: cols.map(c => ({ key: c, label: c })),
        rows: d.preview.map(p => p.data)
      });
    }

    document.getElementById('impErrorCsv').onclick = async () => {
      const r = (await api('getImportErrorReport', m, impState.csv, impState.projectId)).data;
      downloadCsv(r.fileName, r.csv);
    };
    const commit = document.getElementById('impCommit');
    if (commit && !commit.disabled) commit.onclick = () => confirmImport(m);
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message);
  }
}

function confirmImport(m) {
  UI.confirm({
    title: 'Import ' + impState.report.summary.valid + ' row(s)?',
    message: 'The file is re-checked on the server before anything is written. ' +
             'If any row fails then, nothing is imported at all.',
    confirmLabel: 'Import',
    onConfirm: async modal => {
      try {
        const d = (await api('commitImport', m, impState.csv, impState.projectId,
          { createCategories: impState.createCategories })).data;
        modal.close();
        UI.success('Imported', d.imported + ' record(s) written.');
        document.getElementById('impReport').innerHTML =
          `<div class="card"><div class="card-body">
             <div class="banner banner-ok" id="impDone">${d.imported} record(s) imported.</div>
           </div></div>`;
      } catch (e) {
        modal.close();
        UI.error('Import failed', e.message);
      }
    }
  });
}

    pageHead('Documents', 'Contracts, drawings, approvals and photographs, held in Drive',

function documentUploadForm(projects, onSaved, fixed) {
  const fields = [
    { name: 'ProjectID', label: 'Project', type: 'select', required: true,
      options: projects.map(p => ({ value: p.ProjectID, label: p.ProjectID + ' — ' + p.ProjectName })),
      value: (fixed && fixed.projectId) || docState.projectId, readonly: !!(fixed && fixed.projectId) },
    { name: 'DocumentType', label: 'Type', type: 'select', required: true,
      options: (App.enums.DOCUMENT_TYPES || []) },
    { name: 'Module', label: 'Attach to module', value: (fixed && fixed.module) || '',
      hint: 'Optional — e.g. PO, RAR, EXPENSE' },
    { name: 'RecordID', label: 'Attach to record', value: (fixed && fixed.recordId) || '',
      hint: 'Optional — the record id the file belongs to' },
    { name: 'Notes', label: 'Notes', type: 'textarea', span: 2 }
  ];
  const body = UI.el('div');
  const form = UI.form(fields, {});
  body.appendChild(form);
  const fileField = UI.el('div', { class: 'field' });
  fileField.appendChild(UI.el('label', { for: 'docFile', text: 'File *' }));
  const fileInput = UI.el('input', { class: 'input', type: 'file', id: 'docFile' });
  fileField.appendChild(fileInput);
  fileField.appendChild(UI.el('div', { class: 'hint', id: 'docFileHint',
    text: 'Up to 10 MB. Larger files belong in Drive with a link here.' }));
  body.appendChild(fileField);

  UI.modal({
    title: 'Upload a document', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Upload', class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          const file = fileInput.files && fileInput.files[0];
          if (!file) {
            document.getElementById('docFileHint').innerHTML =
              '<span class="text-red">Choose a file first.</span>';
            return;
          }
          if (file.size > 10 * 1024 * 1024) {
            document.getElementById('docFileHint').innerHTML =
              '<span class="text-red">That file is larger than 10 MB.</span>';
            return;
          }
          m.busy(true);
          try {
            const base64 = await readAsBase64(file);
            const res = await api('uploadDocument', data.ProjectID, {
              FileName: file.name, MimeType: file.type || 'application/octet-stream',
              Base64: base64, SizeBytes: file.size,
              DocumentType: data.DocumentType, Module: data.Module,
              RecordID: data.RecordID, Notes: data.Notes
            });
            UI.success(res.message);
            m.close();
            if (onSaved) onSaved(res.data);
          } catch (e) { m.busy(false); UI.error('Upload failed', e.message); }
        } }
    ]
  });
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('The file could not be read.'));
    reader.readAsDataURL(file);
  });
}

/** Rupees in words, because a voucher is not a voucher without them. */
function amountInWords(value) {
  const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
    'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen',
    'eighteen', 'nineteen'];
  const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  const under1000 = n => {
    if (n < 20) return ONES[n];
    if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
    return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' and ' + under1000(n % 100) : '');
  };
  // Pakistani grouping: crore, lakh, thousand — the way the amount is read aloud.
  const words = n => {
    if (n === 0) return 'zero';
    const parts = [];
    const crore = Math.floor(n / 10000000); n %= 10000000;
    const lakh = Math.floor(n / 100000); n %= 100000;
    const thousand = Math.floor(n / 1000); n %= 1000;
    if (crore) parts.push(under1000(crore) + ' crore');
    if (lakh) parts.push(under1000(lakh) + ' lakh');
    if (thousand) parts.push(under1000(thousand) + ' thousand');
    if (n) parts.push(under1000(n));
    return parts.join(' ');
  };
  const total = Math.abs(Number(value) || 0);
  const rupees = Math.floor(total);
  const paisa = Math.round((total - rupees) * 100);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  return cap(words(rupees)) + ' rupees' + (paisa ? ' and ' + words(paisa) + ' paisa' : '') + ' only';
}

function buildPrintHtml(p) {
  const c = p.company;
  const title = PRINT_TITLES[p.kind] || 'Document';
  const rows = flattenForPrint(p);
  const isNum = h => /qty|quantity|rate|amount|value|total/i.test(h);
  const ref = rows.ref || '';
  const bespoke = PRINT_BODIES[p.kind];
  if (bespoke) {
    return UI.print.page({
      company: c, title: title, ref: ref, styles: UI.print.docStyles(),
      signatures: p.kind === 'VENDORPAY' ? ['Prepared by', 'Approved by', 'Received by']
        : p.kind === 'CASHREPORT' ? ['Custodian', 'Checked by', 'Approved by']
        : p.kind === 'VENDORSTMT' ? ['Prepared by', 'Checked by']
        : ['Prepared by', 'Approved by'],
      body: bespoke(p)
    });
  }
  return UI.print.page({
    company: c,
    title: title,
    ref: ref,
    styles: UI.print.docStyles(),
    body:
      `<dl class="kv">${rows.header.map(kv =>
        `<dt>${UI.esc(kv[0])}</dt><dd>${UI.esc(kv[1])}</dd>`).join('')}</dl>` +
      (rows.lines.length
        ? `<table><thead><tr>${rows.lineCols.map(h =>
            `<th class="${isNum(h) ? 'r' : ''}">${UI.esc(h)}</th>`).join('')}</tr></thead><tbody>` +
          rows.lines.map(l => `<tr>${rows.lineCols.map(h =>
            `<td class="${isNum(h) ? 'r' : ''}">${UI.esc(l[h] === undefined ? '' : l[h])}</td>`).join('')}</tr>`).join('') +
          `</tbody></table>`
        : '')
  });
}

/** The id field that names each kind of document, on its own record. */
const PRINT_REF_FIELD = {
  PO: 'POID', PR: 'PRID', GRN: 'GRNID', ISSUE: 'IssueID', RAR: 'RARID',
  SUBBILL: 'SubBillID', RFQ: 'RFQID', VENDORPAY: 'VendorPaymentID',
  CASHREPORT: 'CashReportID'
};

/** Turns whichever record shape the server returned into a header block plus lines. */
function flattenForPrint(p) {
  const d = p.data || {};
  // Each payload wraps its record under a different key. The three newest —
  // an RFQ, a payment voucher, a cash report — were not listed here, so their
  // printed copies came out with no reference number on them at all.
  const record = d.po || d.pr || d.grn || d.issue || d.rar || d.bill ||
                 d.purchaseOrder || d.rfq || d.payment || d.report || d;
  const header = [];
  Object.keys(record).forEach(k => {
    const v = record[k];
    if (v === null || v === undefined || v === '' || typeof v === 'object') return;
    if (/^(CreatedBy|UpdatedBy|CreatedAt|UpdatedAt)$/.test(k)) return;
    header.push([k.replace(/([a-z])([A-Z])/g, '$1 $2'), v]);
  });
  // The record's own id heads the document; repeating it in the detail list
  // would just be the same string twice.
  //
  // Named per kind rather than picked from whichever id field turns up first:
  // an RFQ carries the PRID of the request behind it, and a first-match chain
  // put that number at the top of the page instead of the RFQ's own.
  const ref = record[PRINT_REF_FIELD[p.kind]] || '';
  const lines = d.items || d.lines || d.poItems || d.prItems || [];
  const lineCols = lines.length
    ? Object.keys(lines[0]).filter(k => typeof lines[0][k] !== 'object' && !/ID$/.test(k))
    : [];
  return { ref: ref, header: header.slice(0, 16), lines: lines, lineCols: lineCols };
}

  <script>
/* =============================================================
   Alerts.html — Phase 12. The notification centre: the bell in
   the header, its dropdown, and the full list.
   ============================================================= */

const notifState = { page: 1, pageSize: 25, unreadOnly: false, module: '', unread: 0, timer: null };

const NOTIF_TONE = { info: 'blue', action: 'amber', warning: 'amber', critical: 'red' };

/** Where a notification points. Unknown modules simply do not link anywhere. */
const NOTIF_ROUTES = {
  PR: id => navigate('purchase-request', id),
  RFQ: id => navigate('rfq', id),
  QUOTATION: id => navigate('quotations'),
  PO: id => navigate('purchase-order', id),
  GRN: () => navigate('goods-receipts'),
  ISSUE: () => navigate('material-issues'),
  STOCK: () => navigate('stock'),
  RAR: id => navigate('rar-bill', id),
  EXPENSE: id => navigate('expense', id),
  SUBBILL: id => navigate('subbill', id),
  AGREEMENT: id => navigate('agreement', id),
  PROJECT: id => navigate('project', id),
  BUDGET: id => navigate('project', { projectId: id, tab: 'budget' })
};

function initNotifications() {
  const btn = document.getElementById('notifBtn');
  if (!btn || btn.dataset.wired) return;
  btn.dataset.wired = '1';
  btn.disabled = false;
  btn.removeAttribute('title');
  btn.setAttribute('aria-label', 'Notifications');

  btn.onclick = e => { e.stopPropagation(); toggleNotifPanel(); };
  document.addEventListener('click', ev => {
    const panel = document.getElementById('notifPanel');
    if (panel && !panel.classList.contains('hidden') &&
        ev.target !== btn && !panel.contains(ev.target)) panel.classList.add('hidden');
  });

  refreshNotifBadge();
  if (notifState.timer) clearInterval(notifState.timer);
  // Pull rather than push: one small call a minute, and nothing to retry.
  notifState.timer = setInterval(refreshNotifBadge, 60000);
}

async function refreshNotifBadge() {
  try {
    const d = (await api('listNotifications', { pageSize: 1, unreadOnly: true })).data;
    setNotifBadge(d.unread);
  } catch (e) { /* a failed poll must never interrupt the user */ }
}

function setNotifBadge(count) {
  notifState.unread = count;
  const btn = document.getElementById('notifBtn');
  if (!btn) return;
  let dot = document.getElementById('notifDot');
  if (!count) { if (dot) dot.remove(); return; }
  if (!dot) {
    dot = UI.el('span', { class: 'notif-dot', id: 'notifDot' });
    btn.appendChild(dot);
  }
  dot.textContent = count > 99 ? '99+' : String(count);
}

async function toggleNotifPanel() {
  let panel = document.getElementById('notifPanel');
  if (!panel) {
    panel = UI.el('div', { class: 'notif-panel hidden', id: 'notifPanel' });
    document.querySelector('.topbar').appendChild(panel);
  }
  if (!panel.classList.contains('hidden')) { panel.classList.add('hidden'); return; }

  panel.innerHTML = UI.loadingState('Loading…');
  panel.classList.remove('hidden');
  try {
    const d = (await api('listNotifications', { pageSize: 8 })).data;
    setNotifBadge(d.unread);
    panel.innerHTML =
      `<div class="notif-head">
         <span>Notifications${d.unread ? ' · ' + d.unread + ' unread' : ''}</span>
         <button class="btn btn-sm" id="notifMarkAll"${d.unread ? '' : ' disabled'}>Mark all read</button>
       </div>` +
      (d.rows.length
        ? d.rows.map(n => notifItemHtml(n)).join('')
        : '<div class="notif-empty">Nothing waiting for you.</div>') +
      `<div class="notif-foot"><button class="btn btn-sm" id="notifSeeAll">See all</button></div>`;

    panel.querySelectorAll('[data-notif]').forEach(el => {
      el.onclick = () => openNotification(el.dataset.notif, el.dataset.module, el.dataset.record);
    });
    document.getElementById('notifSeeAll').onclick = () => {
      panel.classList.add('hidden');
      navigate('notifications');
    };
    const markAll = document.getElementById('notifMarkAll');
    if (markAll && !markAll.disabled) markAll.onclick = async ev => {
      ev.stopPropagation();
      await api('markAllNotificationsRead');
      setNotifBadge(0);
      toggleNotifPanel(); toggleNotifPanel();
    };
  } catch (e) {
    panel.innerHTML = `<div class="notif-empty">${UI.esc(e.message)}</div>`;
  }
}

function notifItemHtml(n) {
  const unread = String(n.Status) === 'Unread';
  return `<div class="notif-item${unread ? ' unread' : ''}"
       data-notif="${UI.esc(n.NotificationID)}" data-module="${UI.esc(n.Module || '')}"
       data-record="${UI.esc(n.RecordID || '')}">
     <span class="badge badge-${NOTIF_TONE[n.Severity] || 'grey'}">${UI.esc(n.Severity || 'info')}</span>
     <div class="notif-body">
       <div class="notif-title">${UI.esc(n.Title)}</div>
       <div class="notif-msg">${UI.esc(n.Message)}</div>
       <div class="notif-when">${UI.fmt.dateTime(n.CreatedAt)}</div>
     </div>
   </div>`;
}

async function openNotification(id, module, recordId) {
  try { await api('markNotificationRead', id); } catch (e) { /* reading is best effort */ }
  const panel = document.getElementById('notifPanel');
  if (panel) panel.classList.add('hidden');
  refreshNotifBadge();
  const go = NOTIF_ROUTES[String(module || '').toUpperCase()];
  if (go && recordId) go(recordId);
  else if (go) go();
  else navigate('notifications');
}

/* ------------------------------------------------------------ FULL LIST */

async function pageNotifications(root) {
  root.innerHTML =
    pageHead('Notifications', 'Work waiting on you, and things worth knowing about',
      `<button class="btn" id="notifPageMarkAll">Mark all read</button>`) +
    `<div class="card">
       <div class="card-head">
         <div class="filters">
           <div class="field"><label>&nbsp;</label>
             <label class="checkbox"><input type="checkbox" id="notifUnreadOnly"> Unread only</label></div>
           <div class="field"><label for="notifModule">Module</label>
             <select class="input" id="notifModule">
               <option value="">All</option>
               ${Object.keys(NOTIF_ROUTES).map(m => `<option>${m}</option>`).join('')}
             </select></div>
         </div>
       </div>
       <div id="notifList">${UI.loadingState()}</div>
       <div id="notifPager"></div>
     </div>`;

  document.getElementById('notifUnreadOnly').checked = notifState.unreadOnly;
  document.getElementById('notifUnreadOnly').onchange = e => {
    notifState.unreadOnly = e.target.checked; notifState.page = 1; loadNotifications();
  };
  document.getElementById('notifModule').onchange = e => {
    notifState.module = e.target.value; notifState.page = 1; loadNotifications();
  };
  document.getElementById('notifPageMarkAll').onclick = async () => {
    const d = (await api('markAllNotificationsRead')).data;
    UI.success('Marked read', d.marked + ' notification(s).');
    setNotifBadge(0);
    loadNotifications();
  };
  await loadNotifications();
}

async function loadNotifications() {
  const mount = document.getElementById('notifList');
  if (!mount) return;
  const d = (await api('listNotifications', {
    page: notifState.page, pageSize: notifState.pageSize,
    unreadOnly: notifState.unreadOnly, module: notifState.module
  })).data;
  setNotifBadge(d.unread);

  UI.table(mount, {
    columns: [
      { key: 'Severity', label: '', width: '90px',
        render: n => UI.badge(n.Severity, NOTIF_TONE[n.Severity] || 'grey') },
      { key: 'Title', label: 'Notification',
        render: n => `<div class="${String(n.Status) === 'Unread' ? 'bold' : ''}">${UI.esc(n.Title)}</div>
                      <div class="muted" style="font-size:11.5px">${UI.esc(n.Message)}</div>` },
      { key: 'Module', label: 'Module', width: '110px' },
      { key: 'RecordID', label: 'Record', width: '130px',
        render: n => n.RecordID ? `<span class="mono">${UI.esc(n.RecordID)}</span>` : '' },
      { key: 'CreatedAt', label: 'When', width: '160px', render: n => UI.fmt.dateTime(n.CreatedAt) },
      { key: 'Status', label: 'Status', width: '90px', render: n => UI.badge(n.Status) },
      { key: '_act', label: '', width: '80px', sortable: false,
        render: n => n.Module ? `<button class="btn btn-sm" data-open="${n.NotificationID}"
            data-module="${UI.esc(n.Module)}" data-record="${UI.esc(n.RecordID || '')}">Open</button>` : '' }
    ],
    rows: d.rows,
    empty: UI.emptyState('Nothing waiting', 'Notifications appear here when work needs your attention.')
  });
  mount.querySelectorAll('[data-open]').forEach(b => {
    b.onclick = () => openNotification(b.dataset.open, b.dataset.module, b.dataset.record);
  });

  UI.pager(document.getElementById('notifPager'), {
    page: d.page, totalPages: d.totalPages, total: d.total, pageSize: d.pageSize,
    onPage: p => { notifState.page = p; loadNotifications(); }
  });
}
