/** The server's arithmetic, so the sheet adds up as it is typed. */
function payCompute(K, l, s) {
  if (K.kind === 'LABOUR') {
    const hpd = s.HoursPerDay || 8;
    l.Gross = payRound(l.Days * l.DailyRate);
    l.OTRate = Math.round(l.DailyRate / hpd * 10000) / 10000;
    l.OTAmount = payRound(l.OTHours * l.DailyRate / hpd);
    l.TotalGross = payRound(l.Gross + l.OTAmount);
    l.Net = payRound(l.TotalGross - l.AdvanceDeduction - l.OtherDeduction);
  } else {
    const dim = s.DaysInMonth;
    l.MonthlyTotal = payRound(l.BasicSalary + l.Allowance);
    l.RatePerDay = Math.round(l.MonthlyTotal / dim * 10000) / 10000;
    l.Gross = payRound(l.MonthlyTotal * l.AttendanceDays / dim);
    l.Net = payRound(l.Gross - l.AdvanceDeduction - l.OtherDeduction - (l.TaxAmount || 0));
  }
  return l;
}
const payEarned = (K, l) => K.kind === 'LABOUR' ? l.TotalGross : l.Gross - (l.TaxAmount || 0);
/** The most of his advances this sheet can take: what he owes, up to what he has earned. */
function payFill(K, l) {
  return payRound(Math.max(0, Math.min(l.AdvanceAvailable || 0, payEarned(K, l) - (l.OtherDeduction || 0))));
}

async function payrollSheetPage(root, K, id) {
  if (!id) { navigate(K.route); return; }
  const d = (await api(K.getSheet, id)).data;
  const s = d.sheet;
  const NUMS = K.kind === 'LABOUR' ? ['Days', 'DailyRate', 'OTHours', 'AdvanceDeduction', 'OtherDeduction']
    : ['AttendanceDays', 'BasicSalary', 'Allowance', 'AdvanceDeduction', 'OtherDeduction', 'TaxAmount'];
  const lines = d.lines.map(l => { const o = Object.assign({}, l); NUMS.forEach(f => o[f] = Number(o[f]) || 0); return o; });
  const touched = new Set(lines.filter(l => l.AdvanceDeduction > 0).map(l => l[K.personKey]));
  let dirty = false;

  const acts = [`<button class="btn" id="psBack">← ${UI.esc(K.title)}</button>`,
                `<button class="btn" id="psPrint">Print</button>`];
  if (d.canEdit) acts.push(`<button class="btn" id="psCancel">Cancel sheet</button>`,
                           `<button class="btn" id="psSave">Save</button>`);
  if (d.canSubmit) acts.push(`<button class="btn btn-primary" id="psSubmit">Submit for checking</button>`);
  if (d.canReturn) acts.push(`<button class="btn" id="psReturn">Return</button>`);
  if (d.canCheck) acts.push(`<button class="btn btn-primary" id="psCheck">Mark checked</button>`);
  if (d.canApprove) acts.push(`<button class="btn btn-primary" id="psApprove">Approve</button>`);
  if (d.canPay && d.unpaidBank > 0) acts.push(`<button class="btn" id="psPayBank">Record bank payment</button>`);
  if (d.canPay && d.unpaidCash > 0) acts.push(`<button class="btn btn-primary" id="psPayCash">Pay cash from float</button>`);

  root.innerHTML = pageHead(id, `${K.noun} · ${s.MonthLabel} · ${s.ProjectName}`, acts.join(' ')) +
    (s.Status === 'Returned' && s.ReturnReason ? `<div class="banner banner-warn"><div><strong>Returned:</strong>
       ${UI.esc(s.ReturnReason)}</div></div>` : '') +
    (d.selfBlocked ? `<div class="banner banner-info"><div>You prepared this sheet, so someone else checks and approves it.</div></div>` : '') +
    `<div class="flex gap-8" style="margin:-6px 0 14px;align-items:center">${UI.badge(s.Status, PAYROLL_TONE[s.Status])}
       <span class="muted" style="font-size:12.5px">${K.kind === 'LABOUR'
         ? `Overtime at the daily rate ÷ ${s.HoursPerDay}`
         : `${s.DaysInMonth} days in ${UI.esc(s.MonthLabel)}: rate per day = (basic + allowances) ÷ ${s.DaysInMonth}`}</span></div>
     <div class="stat-grid" id="psTiles" style="margin-bottom:16px"></div>
     <div class="card" style="margin-bottom:16px">
       <div class="card-head"><h3>${d.canEdit ? 'Attendance and deductions' : 'The sheet'}</h3>
         <div class="flex gap-8" id="psTools"></div></div>
       <div style="overflow-x:auto"><table class="table" id="psGrid" style="min-width:${K.kind === 'LABOUR' ? 1250 : 1300}px"></table></div>
     </div>
     <div class="grid-2">
       <div class="card"><div class="card-head"><h3>Advances not on any register</h3></div><div id="psUnlinked"></div></div>
       <div class="card"><div class="card-head"><h3>History</h3></div><div id="psHistory"></div></div>
     </div>`;

  const tools = document.getElementById('psTools');
  if (d.canEdit) {
    const fill = UI.el('button', { class: 'btn btn-sm', text: 'Fill advances',
      title: 'Each person\'s outstanding advances, up to what he has earned' });
    fill.onclick = () => { lines.forEach(l => { l.AdvanceDeduction = payFill(K, l); touched.delete(l[K.personKey]); payCompute(K, l, s); }); dirty = true; draw(); };
    tools.appendChild(fill);
    // Add people from the register, or someone new to it (owner's request, 9 Nov 2026).
    const add = UI.el('button', { class: 'btn btn-sm btn-primary', id: 'psAddPeople', text: '+ Add people' });
    add.onclick = () => payrollAddPeople(K, d, s, addLine);
    tools.appendChild(add);
  }
  /** Puts a register person on the sheet (not saved until Save or Submit). */
  function addLine(p) {
    if (lines.some(x => x[K.personKey] === p[K.personKey])) return;
    const l = Object.assign({ AdvanceAvailable: 0, AdvanceOutstanding: 0 }, p, { IsPaid: false, Remarks: '' });
    l.PaymentMode = p.PaymentMode || 'Cash';
    NUMS.forEach(f => l[f] = Number(l[f]) || 0);
    if (K.kind === 'SALARY') l.AttendanceDays = s.DaysInMonth;
    else { l.Days = 0; l.OTHours = 0; }
    l.AdvanceDeduction = 0; l.OtherDeduction = 0; if (K.kind === 'SALARY') l.TaxAmount = 0;
    payCompute(K, l, s);
    l.AdvanceDeduction = payFill(K, l);
    payCompute(K, l, s);
    lines.push(l);
    const i = d.available.findIndex(x => x[K.personKey] === p[K.personKey]);
    if (i !== -1) d.available.splice(i, 1);
    dirty = true;
    draw();
  }

  const input = (l, f, w) => `<input class="input" style="width:${w}px;height:30px;padding:4px 6px;text-align:right"
     type="number" min="0" step="any" data-p="${UI.esc(l[K.personKey])}" data-f="${f}" value="${l[f] === 0 ? '' : l[f]}" placeholder="0">`;
  const cell = (l, f, w) => d.canEdit ? input(l, f, w) : payNum(l[f]);

  function draw() {
    lines.forEach(l => payCompute(K, l, s));
    const head = K.kind === 'LABOUR'
      ? ['#', 'Name', 'Mate', 'Work', 'Days', 'Rate/day', 'Gross', 'OT hrs', 'OT amount', 'Total gross', 'Advance', 'Other ded.', 'Net', 'Paid by', 'Remarks', '']
      : ['#', 'Name', 'Designation', 'Basic', 'Food + other', 'Monthly', 'Attendance', 'Rate/day', 'Gross', 'Advance', 'Other ded.', 'Tax', 'Net', 'Paid by', 'Remarks', ''];
    const right = new Set(['Days', 'Rate/day', 'Gross', 'OT hrs', 'OT amount', 'Total gross', 'Advance', 'Other ded.', 'Net',
                           'Basic', 'Food + other', 'Monthly', 'Attendance', 'Tax']);
    const rows = lines.map((l, i) => {
      const owed = l.AdvanceOutstanding ? `<div class="muted" style="font-size:11px">${l.AdvanceAvailable !== l.AdvanceOutstanding
        ? payNum(l.AdvanceAvailable) + ' of ' + payNum(l.AdvanceOutstanding) + ' free' : 'owes ' + payNum(l.AdvanceOutstanding)}</div>` : '';
      const name = `<strong>${UI.esc(l.Name)}</strong>${l.CNIC ? `<div class="muted" style="font-size:11px">${UI.esc(l.CNIC)}</div>` : ''}`;
      const mode = d.canEdit
        ? `<select class="input" style="width:78px;height:30px;padding:2px 4px" data-p="${UI.esc(l[K.personKey])}" data-f="PaymentMode">
             <option${l.PaymentMode !== 'Bank' ? ' selected' : ''}>Cash</option><option${l.PaymentMode === 'Bank' ? ' selected' : ''}>Bank</option></select>`
        : UI.esc(l.PaymentMode || 'Cash') + (l.IsPaid ? `<div class="muted" style="font-size:11px">paid · ${UI.esc(l.PaymentRef || '')}</div>` : '');
      const remarks = d.canEdit
        ? `<input class="input" style="width:140px;height:30px;padding:4px 6px" data-p="${UI.esc(l[K.personKey])}" data-f="Remarks" value="${UI.esc(l.Remarks || '')}">`
        : UI.esc(l.Remarks || '');
      const del = d.canEdit ? `<button class="btn btn-sm" data-del="${UI.esc(l[K.personKey])}" title="Take off this sheet">×</button>` : '';
      const net = `<strong class="${l.Net < 0 ? 'num-neg' : ''}">${payNum(l.Net)}</strong>`;
      const cells = K.kind === 'LABOUR'
        ? [i + 1, name, UI.esc(l.Mate || ''), UI.esc(l.Trade || '') + (l.SkillLevel ? `<div class="muted" style="font-size:11px">${UI.esc(l.SkillLevel)}</div>` : ''),
           cell(l, 'Days', 64), cell(l, 'DailyRate', 78), payNum(l.Gross), cell(l, 'OTHours', 64), payNum(l.OTAmount),
           payNum(l.TotalGross), cell(l, 'AdvanceDeduction', 84) + owed, cell(l, 'OtherDeduction', 78), net, mode, remarks, del]
        : [i + 1, name, UI.esc(l.Designation || ''), cell(l, 'BasicSalary', 86), cell(l, 'Allowance', 78), payNum(l.MonthlyTotal),
           cell(l, 'AttendanceDays', 64), payNum(l.RatePerDay), payNum(l.Gross), cell(l, 'AdvanceDeduction', 84) + owed,
           cell(l, 'OtherDeduction', 78), cell(l, 'TaxAmount', 70), net, mode, remarks, del];
      return `<tr>${cells.map((c, j) => `<td${right.has(head[j]) ? ' style="text-align:right"' : ''}>${c}</td>`).join('')}</tr>`;
    }).join('');
    const sum = f => payRound(lines.reduce((t, l) => t + (Number(l[f]) || 0), 0));
    const foot = K.kind === 'LABOUR'
      ? ['', 'Total', '', '', payNum(sum('Days')), '', payNum(sum('Gross')), payNum(sum('OTHours')), payNum(sum('OTAmount')),
         payNum(sum('TotalGross')), payNum(sum('AdvanceDeduction')), payNum(sum('OtherDeduction')), payNum(sum('Net')), '', '', '']
      : ['', 'Total', '', payNum(sum('BasicSalary')), payNum(sum('Allowance')), payNum(sum('MonthlyTotal')), '', '',
         payNum(sum('Gross')), payNum(sum('AdvanceDeduction')), payNum(sum('OtherDeduction')), payNum(sum('TaxAmount')),
         payNum(sum('Net')), '', '', ''];
    document.getElementById('psGrid').innerHTML =
      `<thead><tr>${head.map(h => `<th${right.has(h) ? ' style="text-align:right"' : ''}>${h}</th>`).join('')}</tr></thead>
       <tbody>${rows || `<tr><td colspan="${head.length}">${UI.emptyState('Nobody on this sheet', d.canEdit ? 'Add people from the register above.' : '')}</td></tr>`}</tbody>
       <tfoot><tr>${foot.map((c, j) => `<td${right.has(head[j]) ? ' style="text-align:right"' : ''}><strong>${c}</strong></td>`).join('')}</tr></tfoot>`;
    const gross = K.kind === 'LABOUR' ? sum('TotalGross') : sum('Gross');
    const deductions = payRound(sum('AdvanceDeduction') + sum('OtherDeduction') + sum('TaxAmount'));
    document.getElementById('psTiles').innerHTML =
      statTile('People', String(lines.length), K.kind === 'LABOUR' ? payNum(sum('Days')) + ' days · ' + payNum(sum('OTHours')) + ' OT hrs' : 'on this sheet') +
      statTile(K.kind === 'LABOUR' ? 'Total gross' : 'Gross', cash(gross), K.kind === 'LABOUR' ? cash(sum('OTAmount')) + ' overtime' : 'for attendance') +
      statTile('Deductions', cash(deductions), cash(sum('AdvanceDeduction')) + ' advances') +
      statTile('Net payable', cash(sum('Net')), s.PaidAmount ? cash(s.PaidAmount) + ' paid' : (dirty ? 'not saved yet' : 'nothing paid yet'));

    const grid = document.getElementById('psGrid');
    grid.querySelectorAll('input[data-f], select[data-f]').forEach(el => {
      const l = lines.find(x => x[K.personKey] === el.dataset.p);
      el.onchange = () => {
        const f = el.dataset.f;
        if (f === 'PaymentMode' || f === 'Remarks') { l[f] = el.value; dirty = true; return; }
        l[f] = Number(el.value) || 0;
        if (f === 'AdvanceDeduction') touched.add(l[K.personKey]);
        payCompute(K, l, s);
        // Until he types a figure himself, the advance follows what is earned.
        if (f !== 'AdvanceDeduction' && !touched.has(l[K.personKey])) { l.AdvanceDeduction = payFill(K, l); payCompute(K, l, s); }
        dirty = true;
        draw();
      };
    });
    grid.querySelectorAll('[data-del]').forEach(b => {
      b.onclick = () => {
        const i = lines.findIndex(x => x[K.personKey] === b.dataset.del);
        if (i !== -1) lines.splice(i, 1);
        dirty = true; draw();
      };
    });
  }
  draw();

  // Advances naming nobody on a register: they cannot be deducted until linked.
  UI.table(document.getElementById('psUnlinked'), {
    columns: [
      { key: 'PersonName', label: 'Given to', render: r => UI.esc(r.PersonName) + (r.PersonType ? ` <span class="muted">· ${UI.esc(r.PersonType)}</span>` : '') },
      { key: 'IssuedDate', label: 'Date', render: r => UI.fmt.date(r.IssuedDate) },
      { key: 'Outstanding', label: 'Owed', align: 'right', render: r => cash(r.Outstanding) },
      { key: 'a', label: '', align: 'right', render: r => d.canLinkAdvances
          ? `<button class="btn btn-sm" data-link="${UI.esc(r.StaffAdvanceID)}">Whose is it?</button>` : '' }
    ],
    rows: d.unlinkedAdvances,
    empty: UI.emptyState('None', 'Every advance on this project names someone on a register.')
  });
  document.querySelectorAll('[data-link]').forEach(b => {
    b.onclick = () => payrollLinkAdvance(K, d, s, d.unlinkedAdvances.find(a => a.StaffAdvanceID === b.dataset.link), id, async person => {
      // Linked: put him on the sheet if he is not, keep what was typed, and reload with his advance.
      if (person) addLine(person);
      if (!d.canEdit) { navigate(K.detail, id); return; }
      try { await save(); } catch (e) { UI.error('Linked, but the sheet could not be saved', e.message); return; }
      navigate(K.detail, id);
    });
  });
  UI.table(document.getElementById('psHistory'), {
    columns: [
      { key: 'ActionAt', label: 'When', render: r => UI.fmt.date(r.ActionAt) },
      { key: 'Action', label: 'Step' },
      { key: 'UserName', label: 'By', render: r => UI.esc(r.UserName || r.UserID || '') },
      { key: 'Comments', label: 'Note' }
    ],
    rows: d.history,
    empty: UI.emptyState('Not submitted yet', '')
  });

  const payload = () => ({ lines: lines.map(l => {
    const o = { [K.personKey]: l[K.personKey], PaymentMode: l.PaymentMode || 'Cash', Remarks: l.Remarks || '' };
    if (l[K.lineKey]) o[K.lineKey] = l[K.lineKey];
    NUMS.forEach(f => o[f] = l[f]);
    return o;
  }) });
  const save = async () => {
    const r = await api(K.saveSheet, id, payload());
    dirty = false;
    return r;
  };
  const on = (bid, fn) => { const b = document.getElementById(bid); if (b) b.onclick = fn; };
  on('psBack', () => navigate(K.route));
  on('psPrint', () => payrollPrint(K, d, lines));
  on('psSave', async () => {
    try { UI.success((await save()).message); navigate(K.detail, id); }
    catch (e) { UI.error('Could not save', e.message); }
  });
  const act = (action, label, needReason) => async () => {
    const go = async reason => {
      try {
        if (dirty && action === 'submit') await save();
        UI.success((await api(K.action, id, action, reason || '')).message);
        navigate(K.detail, id);
      } catch (e) { UI.error('Could not ' + label.toLowerCase(), e.message); }
    };
    if (!needReason) {
      UI.confirm({ title: label + ' ' + id + '?', confirmLabel: label, danger: action === 'cancel',
        message: action === 'approve' ? 'Approving takes the advance deductions off each person\'s advances. It cannot be undone.'
          : action === 'cancel' ? 'The sheet is kept, marked cancelled; its month is freed for a new one.'
          : action === 'submit' ? 'The sheet goes for checking and can no longer be edited unless it is returned.' : '',
        onConfirm: () => go('') });
      return;
    }
    const f = [{ name: 'Reason', label: 'Why is it going back?', type: 'textarea', required: true, span: 2 }];
    const form = UI.form(f, {});
    UI.modal({ title: 'Return ' + id, body: form, footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Return', class: 'btn-primary', onClick: async m => { const v = UI.validate(form, f); if (!v) return; m.close(); await go(v.Reason); } }
    ] });
  };
  on('psSubmit', act('submit', 'Submit'));
  on('psCheck', act('check', 'Check'));
  on('psApprove', act('approve', 'Approve'));
  on('psCancel', act('cancel', 'Cancel'));
  on('psReturn', act('return', 'Return', true));
  on('psPayCash', () => payrollPayDialog(K, d, id, 'Cash'));
  on('psPayBank', () => payrollPayDialog(K, d, id, 'Bank'));
}

/**
 * Everyone on the project's register not yet on the sheet, to tick and add;
 * or a new person, saved to the register and put on the sheet at once.
 */
function payrollAddPeople(K, d, s, addLine) {
  const who = K.kind === 'LABOUR' ? 'labourer' : 'employee';
  const body = UI.el('div');
  const rows = d.available.slice();
  body.innerHTML = `
    <p class="muted" style="margin:0 0 10px">Everyone on the ${UI.esc(s.ProjectName)} ${UI.esc(K.registerTitle.toLowerCase())} who is not on
      this sheet yet. Tick them and press <strong>Add to sheet</strong>. Someone not on the register: press
      <strong>New ${who}</strong>.</p>
    ${rows.length ? `<input class="input" id="apSearch" placeholder="Search name, ${K.kind === 'LABOUR' ? 'mate or work' : 'designation'}" style="margin-bottom:8px">
    <label class="checkbox" style="margin:0 0 6px"><input type="checkbox" id="apAll"> Select all</label>
    <div id="apList" style="max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:6px"></div>`
      : `<div class="banner banner-info"><div>Everyone on the register is already on this sheet.</div></div>`}`;
  const list = () => body.querySelector('#apList');
  const draw = q => {
    if (!list()) return;
    q = (q || '').toLowerCase();
    list().innerHTML = rows.filter(p => !q || [p.Name, p.Mate, p.Trade, p.Designation, p.CNIC]
      .some(v => String(v || '').toLowerCase().indexOf(q) !== -1)).map(p => `
      <label style="display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer">
        <input type="checkbox" value="${UI.esc(p[K.personKey])}">
        <span style="flex:1"><strong>${UI.esc(p.Name)}</strong>
          <span class="muted"> · ${UI.esc(K.kind === 'LABOUR' ? [p.Trade, p.Mate].filter(Boolean).join(' · ') : (p.Designation || ''))}</span></span>
        <span class="muted">${K.kind === 'LABOUR' ? payNum(p.DailyRate) + ' / day' : payNum(Number(p.BasicSalary) + Number(p.Allowance || 0)) + ' / month'}</span>
        ${p.AdvanceAvailable ? `<span class="badge badge-amber">owes ${payNum(p.AdvanceAvailable)}</span>` : ''}
      </label>`).join('') || '<p class="muted" style="padding:10px">Nobody matches.</p>';
  };
  draw('');
  UI.modal({
    title: 'Add people to ' + (d.sheet[K.sheetKey] || 'the sheet'), body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'New ' + who, onClick: m => {
          m.close();
          payrollPersonForm(K, [{ ProjectID: s.ProjectID, ProjectName: s.ProjectName, Status: 'Active' }], null, [],
            p => addLine(p), { ProjectID: s.ProjectID });
        } },
      { label: 'Add to sheet', class: 'btn-primary', onClick: m => {
          const ids = [...body.querySelectorAll('#apList input:checked')].map(c => c.value);
          if (!ids.length) { UI.warn('Nobody ticked', 'Tick the people to add, or press New ' + who + '.'); return; }
          ids.forEach(id => { const p = rows.find(x => x[K.personKey] === id); if (p) addLine(p); });
          m.close();
          UI.success(ids.length + (ids.length === 1 ? ' person' : ' people') + ' added', 'Enter their figures, then Save.');
        } }
    ]
  });
  const search = body.querySelector('#apSearch');
  if (search) search.oninput = () => draw(search.value);
  const all = body.querySelector('#apAll');
  if (all) all.onchange = () => body.querySelectorAll('#apList input').forEach(c => { c.checked = all.checked; });
}

function payrollPayDialog(K, d, id, mode) {
  const amount = mode === 'Cash' ? d.unpaidCash : d.unpaidBank;
  const fields = mode === 'Cash'
    ? [{ name: 'CashAccountID', label: 'From float', type: 'select', required: true,
         options: d.floats.map(f => ({ value: f.CashAccountID, label: f.CashAccountID + ' — ' + (f.Name || '') + ' (' + cash(f.Balance) + ' in hand)' })),
         hint: d.floats.length ? '' : 'You hold no active float on this project' },
       { name: 'TxnDate', label: 'Date paid', type: 'date', required: true, value: new Date().toISOString().slice(0, 10) }]
    : [{ name: 'Reference', label: 'Cheque or transfer number', required: true },
       { name: 'TxnDate', label: 'Date', type: 'date', value: new Date().toISOString().slice(0, 10) }];
  const body = UI.el('div');
  body.appendChild(UI.el('p', { style: 'margin:0 0 12px', text: `${cash(amount)} to everyone on ${id} paid ${mode === 'Cash' ? 'in cash' : 'by bank'} and not yet paid.` +
    (mode === 'Cash' ? ' One entry in the float\'s ledger.' : '') }));
  const form = UI.form(fields, {});
  body.appendChild(form);
  UI.modal({
    title: mode === 'Cash' ? 'Pay cash from a float' : 'Record bank payment', body,
    footer: [
      { label: 'Cancel', onClick: m => m.close() },
      { label: 'Pay ' + cash(amount), class: 'btn-primary', onClick: async m => {
          const data = UI.validate(form, fields);
          if (!data) return;
          data.Mode = mode;
          m.busy(true);
          try { UI.success((await api(K.pay, id, data)).message); m.close(); navigate(K.detail, id); }
          catch (e) { m.busy(false); UI.error('Could not pay', e.message); }
        } }
    ]
  });
}

/**
 * Ties an advance that names nobody on the register to a person: someone on
 * the register, or someone new, added to the register there and then.
 */
function payrollLinkAdvance(K, d, s, adv, id, after) {
  const who = K.kind === 'LABOUR' ? 'labourer' : 'employee';
  const everyone = d.lines.concat(d.available);
  // The likeliest match first: the same name as on the advance.
  const guess = everyone.find(p => String(p.Name).trim().toLowerCase() === String(adv.PersonName).trim().toLowerCase());
  const people = [{ value: '', label: 'Choose from the register…' }]
    .concat(everyone.map(p => ({ value: p[K.personKey], label: p.Name + ' (' + p[K.personKey] + ')' })));
  const fields = [{ name: 'PersonID', label: `${adv.PersonName}'s ${cash(adv.Outstanding)} is owed by`, type: 'select',
                    span: 2, options: people }];
  const body = UI.el('div');
  const form = UI.form(fields, { PersonID: guess ? guess[K.personKey] : '' });
  body.appendChild(form);
  body.appendChild(UI.el('p', { class: 'muted', style: 'margin:8px 0 0',
    text: `Not on the register? Press "New ${who}": he is added to the register with this name, the advance is linked to him, ` +
          'and he is put on this sheet.' }));
  const link = async personId => {
    UI.success((await api('linkStaffAdvance', adv.StaffAdvanceID, { PersonType: K.personType, PersonID: personId })).message);
  };
  UI.modal({ title: 'Whose advance is ' + adv.StaffAdvanceID + '?', body, footer: [
    { label: 'Cancel', onClick: m => m.close() },
    { label: 'New ' + who, onClick: m => {
        m.close();
        payrollPersonForm(K, [{ ProjectID: s.ProjectID, ProjectName: s.ProjectName, Status: 'Active' }], null, [],
          async person => {
            try { await link(person[K.personKey]); } catch (e) { UI.error('Added to the register, but the advance could not be linked', e.message); return; }
            await after(person);
          }, { ProjectID: s.ProjectID, Name: adv.PersonName });
      } },
    { label: 'Link', class: 'btn-primary', onClick: async m => {
        const v = UI.validate(form, fields);
        if (!v) return;
        if (!v.PersonID) { UI.setFieldError(form, 'PersonID', 'Choose who took it, or press New ' + who); return; }
        m.busy(true);
        try { await link(v.PersonID); } catch (e) { m.busy(false); UI.error('Could not link it', e.message); return; }
        m.close();
        await after(d.available.find(p => p[K.personKey] === v.PersonID) || null);
      } }
  ] });
}

/** The paper sheet, landscape, with the three signatures. */
function payrollPrint(K, d, lines) {
  const s = d.sheet, n = v => UI.fmt.number(v, 2);
  const cols = K.kind === 'LABOUR'
    ? [['#', (l, i) => i + 1], ['Mate', l => l.Mate], ['Name of labour', l => l.Name], ['Skill', l => l.SkillLevel],
       ['CNIC', l => l.CNIC], ['Work', l => l.Trade], ['Days', l => n(l.Days), 1], ['Rate/day', l => n(l.DailyRate), 1],
       ['Gross', l => n(l.Gross), 1], ['OT hrs', l => n(l.OTHours), 1], ['Rate/hr', l => n(l.OTRate), 1],
       ['Total OT', l => n(l.OTAmount), 1], ['Total gross', l => n(l.TotalGross), 1],
       ['Deductions', l => n(l.AdvanceDeduction + l.OtherDeduction), 1], ['Net salary', l => n(l.Net), 1], ['Signature', () => '']]
    : [['#', (l, i) => i + 1], ['Name', l => l.Name], ['Designation', l => l.Designation], ['CNIC', l => l.CNIC],
       ['Payment mode', l => l.PaymentMode === 'Bank' ? (l.BankAccount || 'Bank') : 'Cash'],
       ['Basic salary', l => n(l.BasicSalary), 1], ['Food + other', l => n(l.Allowance), 1], ['Basic + mess', l => n(l.MonthlyTotal), 1],
       ['Working days', l => l.DaysInMonth || s.DaysInMonth, 1], ['Rate/day', l => n(l.RatePerDay), 1],
       ['Attendance', l => n(l.AttendanceDays), 1], ['Gross salary', l => n(l.Gross), 1],
       ['Deductions', l => n(l.AdvanceDeduction + l.OtherDeduction), 1], ['Tax', l => n(l.TaxAmount), 1],
       ['Net salary', l => n(l.Net), 1], ['Notes', l => l.Remarks]];
  const sum = f => lines.reduce((t, l) => t + (Number(typeof f === 'function' ? f(l) : l[f]) || 0), 0);
  const totals = K.kind === 'LABOUR'
    ? { 'Days': sum('Days'), 'Gross': sum('Gross'), 'OT hrs': sum('OTHours'), 'Total OT': sum('OTAmount'), 'Total gross': sum('TotalGross'),
        'Deductions': sum(l => l.AdvanceDeduction + l.OtherDeduction), 'Net salary': sum('Net') }
    : { 'Basic salary': sum('BasicSalary'), 'Food + other': sum('Allowance'), 'Basic + mess': sum('MonthlyTotal'),
        'Gross salary': sum('Gross'), 'Deductions': sum(l => l.AdvanceDeduction + l.OtherDeduction), 'Tax': sum('TaxAmount'), 'Net salary': sum('Net') };
  const names = [s.PreparedByName, s.CheckedByName, s.ApprovedByName];
  const body = `
    <dl class="kv"><dt>Project</dt><dd>${UI.esc(s.ProjectName)}</dd><dt>Month</dt><dd>${UI.esc(s.MonthLabel)}</dd>
      <dt>Status</dt><dd>${UI.esc(s.Status)}</dd></dl>
    <table><thead><tr>${cols.map(c => `<th${c[2] ? ' class="r"' : ''}>${c[0]}</th>`).join('')}</tr></thead>
      <tbody>${lines.map((l, i) => `<tr>${cols.map(c => `<td${c[2] ? ' class="r"' : ''}>${UI.esc(c[1](l, i) == null ? '' : c[1](l, i))}</td>`).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr>${cols.map((c, j) => `<td${c[2] ? ' class="r"' : ''}>${j === 1 ? 'Total' : (c[0] in totals ? n(totals[c[0]]) : '')}</td>`).join('')}</tr></tfoot>
    </table>`;
  UI.print.send(UI.print.page({
    title: K.kind === 'LABOUR' ? 'Labour work calculation sheet' : 'Salary sheet', ref: d.sheet[K.sheetKey] || '',
    meta: [s.MonthLabel], styles: UI.print.docStyles() + '@page{size:A4 landscape} body{font-size:10.5px} th,td{padding:4px 5px}',
    signatures: K.signatures.map((x, i) => names[i] ? x + ' — ' + names[i] : x), body
  }));
}

PAGES['salary-sheet'] = (root, id) => payrollSheetPage(root, PAYROLL.salary, id);

  <script>
/* ==========================================================================
 * Security Instruments (owner's request, 11 Nov 2026; first named CDR & Guarantees Recovery).
 *
 * A module of its own for Head Office Accounts and Management: the register
 * of CDRs, bank guarantees, performance bonds and insurance guarantees, and
 * the follow-up of each until what is refundable has come back.
 *
 * It adds to the app without changing it. Its menu group is added here, and
 * only once the server says this person has access (the module keeps its
 * own access list; no role or permission is involved). Every figure on these
 * screens comes from the server, worked out from the records.
 * ======================================================================== */

const BGM_TONE = {
  'Active': 'blue', 'Return Pending': 'amber', 'Expired – Recovery Required': 'red',
  'Release Requested': 'violet', 'Cancellation Pending': 'amber', 'Refund Pending': 'amber',
  'Partially Recovered': 'amber', 'Recovered': 'green', 'Closed': 'grey', 'Void': 'grey'
};
const BGM_ALERT_TONE = { danger: 'red', warn: 'amber', info: 'blue' };
const bgmState = { filters: {}, meta: null };
const bgmMoney = (v, cur) => (cur && cur !== 'PKR' ? cur + ' ' : '') + UI.fmt.money(v);
const bgmDate = d => d ? `<span style="white-space:nowrap">${UI.esc(String(d).slice(0, 10))}</span>` : '<span class="muted">—</span>';
const bgmLink = id => `<a href="#" class="link" style="white-space:nowrap" data-bgm="${UI.esc(id)}">${UI.esc(id)}</a>`;
function bgmWireLinks(root) {
  root.querySelectorAll('[data-bgm]').forEach(a => {
    a.onclick = e => { e.preventDefault(); navigate('bgm-instrument', a.dataset.bgm); };
  });
}

/* ------------------------------------------------------------ THE MENU */

// Added, never in place of anything: the original adoptSession runs first and
// unchanged. An older server without this module simply answers with an
// error, and the menu group is never added.
(function () {
  const original = adoptSession;
  adoptSession = function (data) {
    original(data);
    call('bgmMyAccess', App.token).then(r => {
      const a = r && r.data;
      if (!a || !a.level) return;
      App.bgm = a;
      if (NAV.some(g => g.group === 'Security Instruments')) return;
      const items = [
        { id: 'bgm-dashboard', label: 'Recovery Dashboard', icon: '⛨', phase: 15, perm: 'bgm.view' },
        { id: 'bgm-register', label: 'Instrument Register', icon: '☰', phase: 15, perm: 'bgm.view' },
        { id: 'bgm-reports', label: 'Recovery Reports', icon: '◳', phase: 15, perm: 'bgm.view' }
      ];
      if (a.canManageAccess) items.push({ id: 'bgm-access', label: 'Module Access', icon: '⚿', phase: 15, perm: 'bgm.view' });
      if (App.permissions.indexOf('bgm.view') === -1) App.permissions.push('bgm.view');
      const admin = NAV.findIndex(g => g.group === 'Administration');
      NAV.splice(admin === -1 ? NAV.length : admin, 0, { group: 'Security Instruments', items });
      renderNav();
    }).catch(() => {});
  };
})();

async function bgmLoadMeta(force) {
  if (!bgmState.meta || force) bgmState.meta = (await api('bgmMeta')).data;
  return bgmState.meta;
}

/* ------------------------------------------------------------- FILTERS */

function bgmFilterBar(host, meta, onApply) {
  const f = bgmState.filters;
  const opt = (list, cur, all) => `<option value="">${all}</option>` + list.map(o =>
    `<option value="${UI.esc(o.value)}"${String(o.value) === String(cur || '') ? ' selected' : ''}>${UI.esc(o.label)}</option>`).join('');
  const cats = Object.keys(meta.categories).map(k => ({ value: k, label: meta.categories[k] }));
  host.innerHTML = `
    <div class="field"><label for="bgmSearch">Search</label>
      <input class="input" id="bgmSearch" placeholder="Number, bank, beneficiary, contract" value="${UI.esc(f.search || '')}"></div>
    <div class="field"><label for="bgmCat">Type</label><select class="input" id="bgmCat">${opt(cats, f.category, 'All types')}</select></div>
    <div class="field"><label for="bgmFor">Guarantee for</label><select class="input" id="bgmFor">
      ${opt(Object.keys(meta.guaranteeTypes || {}).map(k => ({ value: k, label: meta.guaranteeTypes[k] })), f.guaranteeType, 'All')}</select></div>
    <div class="field"><label for="bgmIssuer">Bank / insurance company</label><select class="input" id="bgmIssuer">
      ${opt(meta.issuers.map(x => ({ value: x, label: x })), f.issuer, 'All')}</select></div>
    <div class="field"><label for="bgmBen">Beneficiary</label><select class="input" id="bgmBen">
      ${opt(meta.beneficiaries.map(x => ({ value: x, label: x })), f.beneficiary, 'All')}</select></div>
    <div class="field"><label for="bgmProj">Project</label><select class="input" id="bgmProj">
      ${opt(meta.projects.map(p => ({ value: p.ProjectID, label: p.ProjectName })), f.projectId, 'All')}</select></div>
    <div class="field"><label for="bgmContract">Contract / work order</label>
      <input class="input" id="bgmContract" value="${UI.esc(f.contract || '')}"></div>
    <div class="field"><label for="bgmStatus">Recovery status</label><select class="input" id="bgmStatus">
      ${opt(meta.statuses.filter(s => s !== 'Void').map(s => ({ value: s, label: s })), f.status, 'All')}</select></div>
    <div class="field"><label for="bgmIssueFrom">Issued from</label><input class="input" type="date" id="bgmIssueFrom" value="${UI.esc(f.issueFrom || '')}"></div>
    <div class="field"><label for="bgmIssueTo">Issued to</label><input class="input" type="date" id="bgmIssueTo" value="${UI.esc(f.issueTo || '')}"></div>
    <div class="field"><label for="bgmExpFrom">Expiring from</label><input class="input" type="date" id="bgmExpFrom" value="${UI.esc(f.expiryFrom || '')}"></div>
    <div class="field"><label for="bgmExpTo">Expiring to</label><input class="input" type="date" id="bgmExpTo" value="${UI.esc(f.expiryTo || '')}"></div>
    <div class="field" style="align-self:end"><button class="btn" id="bgmClear">Clear</button></div>`;
  const read = () => {
    const v = id => document.getElementById(id).value.trim();
    bgmState.filters = {
      search: v('bgmSearch'), category: v('bgmCat'), guaranteeType: v('bgmFor'), issuer: v('bgmIssuer'), beneficiary: v('bgmBen'),
      projectId: v('bgmProj'), contract: v('bgmContract'), status: v('bgmStatus'),
      issueFrom: v('bgmIssueFrom'), issueTo: v('bgmIssueTo'), expiryFrom: v('bgmExpFrom'), expiryTo: v('bgmExpTo')
    };
    onApply();
  };
  let t;
  host.querySelectorAll('input').forEach(i => { i.oninput = () => { clearTimeout(t); t = setTimeout(read, 350); }; });
  host.querySelectorAll('select').forEach(s => { s.onchange = read; });
  document.getElementById('bgmClear').onclick = () => { bgmState.filters = {}; bgmFilterBar(host, meta, onApply); onApply(); };

/** Written in the browser from what is on screen: nothing extra leaves the server. */
function bgmCsv(title, rows, cols) {
  const cell = v => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = '﻿' + [cols.map(c => cell(c[1])).join(',')]
    .concat(rows.map(r => cols.map(c => cell(r[c[0]])).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = title.replace(/[^\w ]+/g, '').replace(/ /g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function bgmPrintList(title, rows, totals) {
  const f = bgmState.filters;
  const meta = Object.keys(f).filter(k => f[k]).map(k => k + ': ' + f[k]);
  const body = `<table><thead><tr><th>Record</th><th>Type</th><th>Number</th><th>Bank / insurer</th><th>Beneficiary</th>
      <th>Expiry</th><th class="r">Face value</th><th class="r">Refundable</th><th class="r">Recovered</th>
      <th class="r">Outstanding</th><th>Status</th><th class="r">Days</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${UI.esc(r.InstrumentID)}</td><td>${UI.esc(r.CategoryName)}</td><td>${UI.esc(r.ReferenceNo)}</td>
      <td>${UI.esc(r.Issuer)}</td><td>${UI.esc(r.Beneficiary)}</td><td>${UI.esc(r.Category === 'CDR' ? r.ExpectedReturnDate : r.ExpiryDate)}</td>
      <td class="r">${bgmMoney(r.FaceValue, r.Currency)}</td><td class="r">${bgmMoney(r.Refundable, r.Currency)}</td>
      <td class="r">${bgmMoney(r.Recovered, r.Currency)}</td><td class="r"><strong>${bgmMoney(r.Outstanding, r.Currency)}</strong></td>
      <td>${UI.esc(r.RecoveryStatus)}</td><td class="r">${r.DaysOutstanding || ''}</td></tr>`).join('') + `</tbody></table>` +
    (totals || []).map(t => `<p><strong>${UI.esc(t.Currency)}</strong>: ${t.Count} instruments · face value ${UI.fmt.money(t.FaceValue)} ·
      recovered ${UI.fmt.money(t.Recovered)} · <strong>outstanding ${UI.fmt.money(t.Outstanding)}</strong></p>`).join('');
  UI.print.send(UI.print.page({ title, meta, body, styles: UI.print.docStyles() + '@page{size:A4 landscape}', signatures: ['Prepared by (HO Accounts)', 'Reviewed by (CFO)'] }));

      { key: 'By', label: 'Who' }, { key: 'Action', label: 'Action' }, { key: 'Remarks', label: 'Note' }

  on('bgmVoid', () => bgmReasonDialog('Void ' + i.InstrumentID, 'Why this record is void (kept, but out of every total)', 'Void', true,

  root.querySelectorAll('[data-rev-ev]').forEach(b => { b.onclick = () => bgmReasonDialog('Reverse this step', 'Why it is being reversed',

  root.querySelectorAll('[data-rev-rec]').forEach(b => { b.onclick = () => bgmReasonDialog('Reverse this entry', 'Why it is being reversed',

      <dt>Type</dt><dd>${UI.esc(i.CategoryName)}</dd><dt>Number</dt><dd>${UI.esc(i.ReferenceNo)}</dd>
      <dt>Bank / insurer</dt><dd>${UI.esc(i.Issuer)}</dd><dt>Beneficiary</dt><dd>${UI.esc(i.Beneficiary)}</dd>

      <dt>Issued</dt><dd>${UI.esc(i.IssueDate)}</dd><dt>${i.Category === 'CDR' ? 'Expected return' : 'Expiry'}</dt>
      <dd>${UI.esc(i.Category === 'CDR' ? i.ExpectedReturnDate : i.ExpiryDate)}</dd>
      <dt>Face value</dt><dd>${m(i.FaceValue)}</dd><dt>Refundable</dt><dd>${m(i.Refundable)}</dd>
      <dt>Recovered</dt><dd>${m(i.Recovered)}</dd><dt>Outstanding</dt><dd>${m(i.Outstanding)}</dd>
      <dt>Status</dt><dd>${UI.esc(i.RecoveryStatus)}</dd></dl>
    <h3>Steps</h3><table><tr><th>Date</th><th>Step</th><th>Details</th></tr>${d.events.filter(e => !e.ReversedAt).map(e =>
      `<tr><td>${UI.esc(e.EventDate)}</td><td>${UI.esc(e.Label)}</td><td>${UI.esc([e.NewExpiryDate, e.Reference, e.Details].filter(Boolean).join(' · '))}</td></tr>`).join('')}</table>
    <h3>Received back</h3><table><tr><th>Date</th><th>Entry</th><th class="r">Amount</th><th>Reference</th></tr>${d.recoveries.filter(r => !r.ReversedAt).map(r =>
      `<tr><td>${UI.esc(r.RecoveryDate)}</td><td>${r.Kind === 'RECEIPT' ? 'Received' : 'Adjustment'}</td><td class="r">${m(r.Amount)}</td><td>${UI.esc(r.Reference)}</td></tr>`).join('')}</table>
    <h3>Follow-ups</h3><table><tr><th>Date</th><th>How</th><th>Contacted</th><th>What was said</th><th>Next</th></tr>${d.followups.map(f =>

}

function bgmInstrumentForm(existing, onSaved) {
  const meta = bgmState.meta;
  const v = Object.assign({ Currency: 'PKR', Category: 'BG' }, existing || {});
  if (existing && existing.ExpectedRefundable !== undefined) v.ExpectedRefundable = existing.ExpectedRefundable;
  const users = meta.users.filter(u => u.Level === 'HO_ACCOUNTS' || u.UserID === App.user.UserID || u.UserID === v.ResponsibleUserID);
  const body = UI.el('div');
  let form, fields;
  const build = cat => {
    const isCdr = cat === 'CDR', ig = cat === 'IG';
    const amountLabel = { CDR: 'CDR amount', BG: 'Guarantee amount', IG: 'Guarantee amount' }[cat];
    const numberLabel = { CDR: 'CDR number', BG: 'BG number', IG: 'Guarantee / bond reference number' }[cat];
    const forOptions = Object.keys(meta.guaranteeTypes).map(k => ({ value: k, label: meta.guaranteeTypes[k] }));
    fields = [
      { name: 'Category', label: 'Type', type: 'select', required: true, readonly: !!existing,
        options: Object.keys(meta.categories).map(k => ({ value: k, label: meta.categories[k] })) },
      { name: 'GuaranteeType', label: isCdr ? 'CDR given as' : 'Guarantee for', type: 'select', required: !isCdr,
        options: (isCdr ? [{ value: '', label: '— not stated —' }] : [{ value: '', label: '— choose —' }]).concat(forOptions),
        hint: isCdr ? '' : 'A performance bond is a bank or insurance guarantee given for performance: choose the issuer in Type and Performance bond here.' },
      { name: 'ReferenceNo', label: numberLabel, required: true },
      { name: 'Issuer', label: ig ? 'Insurance company' : 'Issuing bank', required: true },
      { name: 'Beneficiary', label: 'Beneficiary', required: true },
      { name: 'IssueDate', label: isCdr ? 'Deposit date' : 'Issue date', type: 'date', required: true },
      isCdr ? { name: 'ExpectedReturnDate', label: 'Expected return date', type: 'date', hint: 'Recovery falls due on this date.' }
        : { name: 'ExpiryDate', label: 'Expiry date', type: 'date', required: true,
            hint: existing ? 'After a renewal, the expiry changes with "Record a step → Renewed".' : '' },
      isCdr ? null : { name: 'ReleaseEligibilityDate', label: 'Release eligibility date', type: 'date',
        hint: 'If it can be released before expiry (a performance bond on completion, say), recovery falls due from this date.' },
      { name: 'Currency', label: 'Currency', required: true, hint: 'PKR, USD…' },
      { name: 'FaceValue', label: amountLabel, type: 'number', required: true },
      isCdr ? null : { name: 'CashMargin', label: ig ? 'Insurance margin deposited' : 'Cash margin', type: 'number' },
      isCdr ? null : { name: 'SecurityDeposit', label: 'Security deposit', type: 'number' },
      { name: 'ExpectedRefundable', label: 'Expected refundable amount', type: 'number',
        hint: isCdr ? 'Blank = the CDR amount.' : 'Blank = cash margin + security deposit. The face value is not cash.' },
      isCdr || ig ? null : { name: 'BankCharges', label: 'Bank charges', type: 'number' },
      ig ? { name: 'InsuranceCharges', label: 'Premium / insurance charges', type: 'number' } : null,
      { name: 'OtherExpenses', label: 'Other expenses', type: 'number' },
      { name: 'ProjectID', label: 'Project (optional)', type: 'select',
        options: [{ value: '', label: '— none —' }].concat(meta.projects.map(p => ({ value: p.ProjectID, label: p.ProjectName }))) },
      { name: 'ContractRef', label: 'Contract reference' },
      { name: 'WorkOrderNo', label: 'Work order / contract number' },
      { name: 'ResponsibleUserID', label: 'Responsible (HO Accounts)', type: 'select',
        options: users.map(u => ({ value: u.UserID, label: u.Name })), value: App.user.UserID },
      { name: 'DocumentRef', label: 'Document reference', hint: 'File number, or where the original and its scan are kept.' },
      { name: 'Purpose', label: 'Purpose of the instrument', type: 'textarea', span: 2 },
      { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
    ].filter(Boolean);
    const cur = form ? UI.readForm(form) : v;
    cur.Category = cat;
    const nf = UI.form(fields, cur);
    body.innerHTML = '';
    body.appendChild(nf);
    form = nf;
    const lists = { Issuer: meta.issuers, Beneficiary: meta.beneficiaries };
    Object.keys(lists).forEach(k => {
      const input = form.querySelector(`[name="${k}"]`);
      const dl = UI.el('datalist', { id: 'bgmDl' + k });
      dl.innerHTML = lists[k].map(x => `<option value="${UI.esc(x)}">`).join('');
      input.setAttribute('list', dl.id);
      form.appendChild(dl);
    });
    form.querySelectorAll('input[type="number"]').forEach(n => { n.step = 'any'; n.min = '0'; });
    const sel = form.querySelector('[name="Category"]');
    if (!existing) sel.onchange = () => build(sel.value);
  };
  build(v.Category);
  UI.modal({
    title: existing ? 'Edit ' + existing.InstrumentID : 'Register instrument', body, size: 'wide',
    footer: [
      { label: 'Cancel', onClick: mm => mm.close() },
      { label: existing ? 'Save' : 'Register', class: 'btn-primary', onClick: async mm => {
          const data = UI.validate(form, fields);
          if (!data) return;
          if (existing) { data.InstrumentID = existing.InstrumentID; data.Category = existing.Category; }
          mm.busy(true);
          try {
            const r = await api('bgmSaveInstrument', data);
            UI.success(r.message);
            mm.close();
            onSaved(r.data.InstrumentID || (existing && existing.InstrumentID));
          } catch (e) { mm.busy(false); UI.error('Not saved', e.message); }
        } }
    ]
  });
}

function bgmStepDialog(i, steps, onDone) {
  const meta = bgmState.meta;
  const fields = () => {
    const type = form ? form.querySelector('[name="EventType"]').value : steps[0].type;
    return [
      { name: 'EventType', label: 'Step', type: 'select', required: true, options: steps.map(s => ({ value: s.type, label: s.label })) },
      { name: 'EventDate', label: 'Date', type: 'date', required: true, value: meta.today },
      type === 'RENEWED' ? { name: 'NewExpiryDate', label: 'New expiry date', type: 'date', required: true } : null,
      type === 'RENEWED' ? { name: 'Amount', label: 'Renewal charges', type: 'number' } : null,
      { name: 'Reference', label: 'Letter / reference number' },
      { name: 'Details', label: 'Details', type: 'textarea', span: 2 }
    ].filter(Boolean);
  };
  const body = UI.el('div');
  let form = null, fl;
  const build = () => {
    const keep = form ? UI.readForm(form) : {};
    fl = fields();
    const nf = UI.form(fl, keep);
    body.innerHTML = '';
    body.appendChild(nf);
    form = nf;
    form.querySelector('[name="EventType"]').onchange = build;
  };
  build();
  UI.modal({
    title: 'Record a step · ' + i.InstrumentID, body,
    footer: [
      { label: 'Cancel', onClick: mm => mm.close() },
      { label: 'Record', class: 'btn-primary', onClick: async mm => {
          const data = UI.validate(form, fl);
          if (!data) return;
          mm.busy(true);
          try { const r = await api('bgmRecordEvent', i.InstrumentID, data); UI.success(r.message); mm.close(); onDone(); }
          catch (e) { mm.busy(false); UI.error('Not recorded', e.message); }
        } }
    ]
  });
}

function bgmPaymentDialog(i, onDone) {
  const meta = bgmState.meta;
  const isCdr = i.Category === 'CDR';
  const purposes = Object.keys(meta.paymentPurposes).filter(k => isCdr
    ? ['CDR_AMOUNT', 'PREMIUM', 'OTHER'].indexOf(k) !== -1 : k !== 'CDR_AMOUNT');
  const suggest = p => p === 'CDR_AMOUNT' ? i.FaceValue : p === 'SECURITY_CHEQUE' ? i.FaceValue : p === 'CASH_MARGIN' ? i.CashMargin : '';
  const body = UI.el('div');
  let form = null, fields;
  const build = () => {
    const keep = form ? UI.readForm(form) : { Purpose: purposes[0], Method: 'Cheque', Amount: suggest(purposes[0]), PaidTo: i.Issuer, PaymentDate: meta.today };
    const purpose = keep.Purpose, method = purpose === 'SECURITY_CHEQUE' ? 'Cheque' : keep.Method;
    keep.Method = method;
    const transfer = method === 'Bank transfer';
    fields = [
      { name: 'Purpose', label: 'What it was for', type: 'select', required: true,
        options: purposes.map(k => ({ value: k, label: meta.paymentPurposes[k] })) },
      { name: 'Method', label: 'How', type: 'select', required: true, readonly: purpose === 'SECURITY_CHEQUE', options: meta.paymentMethods },
      { name: 'ChequeNo', label: transfer ? 'Transaction reference' : method === 'Pay order' ? 'Pay order number' : 'Cheque number', required: true },
      { name: 'DrawnOnBank', label: transfer ? 'From SIMCO bank' : 'Drawn on (SIMCO bank)' },
      { name: 'AccountNo', label: 'SIMCO account number' },
      transfer ? null : { name: 'ChequeDate', label: 'Date written on the cheque', type: 'date',
        hint: purpose === 'SECURITY_CHEQUE' ? 'Leave blank: the security cheque is undated.' : '' },
      { name: 'PaymentDate', label: transfer ? 'Date transferred' : 'Date handed over', type: 'date', required: true },
      { name: 'Amount', label: 'Amount (' + i.Currency + ')', type: 'number', required: true },
      { name: 'PaidTo', label: 'Given to', hint: 'The bank or insurance company holding it.' },
      { name: 'Remarks', label: 'Remarks', type: 'textarea', span: 2 }
    ].filter(Boolean);
    const nf = UI.form(fields, keep);
    body.innerHTML = '';
    body.appendChild(nf);
    form = nf;
    form.querySelectorAll('input[type="number"]').forEach(n => { n.step = 'any'; n.min = '0'; });
    form.querySelector('[name="Purpose"]').onchange = e => {
      const amt = form.querySelector('[name="Amount"]');
      amt.value = suggest(e.target.value);
      build();
    };
    form.querySelector('[name="Method"]').onchange = build;
  };
  build();
  UI.modal({
    title: 'Record cheque / payment · ' + i.InstrumentID, body, size: 'wide',
    footer: [
      { label: 'Cancel', onClick: mm => mm.close() },
      { label: 'Record', class: 'btn-primary', onClick: async mm => {
          const data = UI.validate(form, fields);
          if (!data) return;
          if (data.Purpose === 'SECURITY_CHEQUE') data.Method = 'Cheque';
          mm.busy(true);
          try { const r = await api('bgmRecordPayment', i.InstrumentID, data); UI.success(r.message); mm.close(); onDone(); }
          catch (e) { mm.busy(false); UI.error('Not recorded', e.message); }
        } }
    ]
  });
}

function bgmReasonDialog(title, label, action, required, fn, onDone, danger) {
  const fields = [{ name: 'reason', label, type: 'textarea', required, span: 2 }];
  const form = UI.form(fields);
  UI.modal({
    title, body: form, size: 'narrow',
    footer: [
      { label: 'Cancel', onClick: mm => mm.close() },
      { label: action, class: danger ? 'btn-danger' : 'btn-primary', onClick: async mm => {
          const data = UI.validate(form, fields);
          if (!data) return;
          mm.busy(true);
          try { const r = await fn(data.reason); UI.success(r.message); mm.close(); onDone(); }
          catch (e) { mm.busy(false); UI.error('Not done', e.message); }
        } }
    ]
  });
}

const bgmRep = { id: 'REGISTER', period: {}, includeVoid: false };

async function pageBgmReports(root, id) {
  if (id) bgmRep.id = id;
  root.innerHTML = pageHead('Recovery Reports', 'Sixteen views of the same records the dashboard uses',
    `<button class="btn" id="bgmRepCsv">Export to Excel</button> <button class="btn" id="bgmRepPrint">Print / PDF</button>`) +
    `<div class="report-layout" style="display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start">
       <div class="card" id="bgmRepList" style="padding:6px 0"></div>
       <div style="min-width:0">
         <div class="card"><div class="card-head"><div class="filters" id="bgmFilters"></div></div>
           <div class="card-head hidden" id="bgmRepExtra" style="border-bottom:0"></div></div>
         <div class="card mt-16"><div class="card-head"><div><div class="card-title" id="bgmRepTitle"></div>
           <div class="muted" style="font-size:12px" id="bgmRepNote"></div></div></div>
           <div id="bgmRepBody">${UI.loadingState()}</div><div id="bgmRepTotals"></div></div>
         <div class="card mt-16 hidden" id="bgmRepSumCard"><div class="card-head"><div class="card-title" id="bgmRepSumTitle"></div></div>
           <div id="bgmRepSum"></div></div>
       </div></div>`;
  let meta;
  try { meta = await bgmLoadMeta(true); } catch (e) { document.getElementById('bgmRepBody').innerHTML = UI.errorState(e.message); return; }
  const list = document.getElementById('bgmRepList');
  list.innerHTML = meta.reports.map((r, n) => {
    const on = r.id === bgmRep.id;
    return `<button data-rep="${r.id}" style="display:block;width:100%;text-align:left;border:0;cursor:pointer;padding:8px 14px;
      font:inherit;font-size:13px;background:${on ? 'var(--navy-soft)' : 'none'};color:${on ? 'var(--navy)' : 'inherit'};
      font-weight:${on ? 650 : 450}">${n + 1}. ${UI.esc(r.title)}</button>`;
  }).join('');
  list.querySelectorAll('[data-rep]').forEach(b => { b.onclick = () => { bgmRep.id = b.dataset.rep; pageBgmReports(root); }; });
  let last = null;
  const extra = document.getElementById('bgmRepExtra');
  const filters = exp => Object.assign({}, bgmState.filters, {
    periodFrom: bgmRep.period.from || '', periodTo: bgmRep.period.to || '', includeVoid: bgmRep.includeVoid, export: !!exp });
  const load = async () => {
    const host = document.getElementById('bgmRepBody');
    host.innerHTML = UI.loadingState();
    try { last = (await api('bgmRunReport', bgmRep.id, filters(false))).data; } catch (e) { host.innerHTML = UI.errorState(e.message); return; }
    document.getElementById('bgmRepTitle').textContent = last.title;
    document.getElementById('bgmRepNote').textContent = last.note + (last.period ? '  Period ' + last.period.from + ' to ' + last.period.to + '.' : '');
    UI.table(host, { columns: bgmRepColumns(last.columns), rows: last.rows,
      empty: UI.emptyState('Nothing to report', 'No instrument matches this report and the filters.') });
    document.getElementById('bgmRepTotals').innerHTML = bgmRepTotalsHtml(last);
    const sc = document.getElementById('bgmRepSumCard');
    sc.classList.toggle('hidden', !last.summary);
    if (last.summary) {
      document.getElementById('bgmRepSumTitle').textContent = last.summary.title;
      UI.table(document.getElementById('bgmRepSum'), { columns: bgmRepColumns(last.summary.columns), rows: last.summary.rows });
    }
    bgmWireLinks(host);
  };
  if (bgmRep.id === 'RECOVERED_PERIOD') {
    extra.innerHTML = `<div class="filters">
      <div class="field"><label for="bgmPFrom">Received from</label><input class="input" type="date" id="bgmPFrom" value="${UI.esc(bgmRep.period.from || '')}"></div>
      <div class="field"><label for="bgmPTo">Received to</label><input class="input" type="date" id="bgmPTo" value="${UI.esc(bgmRep.period.to || '')}"></div>
      <div class="field muted" style="align-self:end;font-size:12px">Left blank: this month.</div></div>`;
    ['bgmPFrom', 'bgmPTo'].forEach(i => { document.getElementById(i).onchange = () => {

  } else if (bgmRep.id === 'REGISTER' || bgmRep.id === 'PROJECT') {

  extra.classList.toggle('hidden', !extra.innerHTML);
  document.getElementById('bgmRepCsv').onclick = async () => {

  document.getElementById('bgmRepPrint').onclick = () => last && bgmPrintReport(last);
  bgmFilterBar(document.getElementById('bgmFilters'), meta, load);

function bgmRepCell(c, r) {
  const v = r[c.key];
  if (c.key === 'InstrumentID' && v) return bgmLink(v);
  if (c.key === 'RecoveryStatus' && v) return UI.badge(v, BGM_TONE[v]);
  if (c.type === 'money') return v === undefined || v === null || v === '' ? '' : bgmMoney(v, r.Currency);
  if (c.type === 'date') return bgmDate(v);
  if (c.type === 'int') return v ? (c.key === 'DaysOutstanding' && v > 90 ? `<strong style="color:var(--over)">${v}</strong>` : String(v)) : '';
  return UI.esc(v === null || v === undefined ? '' : v);
}
const bgmRepColumns = cols => cols.map(c => ({ key: c.key, label: c.label,
  align: c.type === 'money' || c.type === 'int' ? 'right' : '', render: r => bgmRepCell(c, r) }));

function bgmRepTotalsHtml(d) {
  const money = d.columns.filter(c => c.type === 'money');
  if (!d.totals.length) return '';
  return `<div style="padding:12px 16px" class="muted">` + d.totals.map(t =>
    `<strong>${UI.esc(t.Currency)}</strong> · ${t.Rows} row${t.Rows === 1 ? '' : 's'}` +
    money.map(c => ` · ${UI.esc(c.label)} <strong>${UI.fmt.money(t[c.key])}</strong>`).join('')).join('<br>') + `</div>`;
}

function bgmPrintReport(d) {
  const f = bgmState.filters;
  const meta = Object.keys(f).filter(k => f[k]).map(k => k + ': ' + f[k]);
  if (d.period) meta.unshift('Period ' + d.period.from + ' to ' + d.period.to);
  const num = c => c.type === 'money' || c.type === 'int';
  const cell = (c, r) => {
    const v = r[c.key];
    if (c.type === 'money') return v === undefined || v === null || v === '' ? '' : bgmMoney(v, r.Currency);
    return UI.esc(v === null || v === undefined ? '' : v);
  };
  const table = (cols, rows) => `<table><thead><tr>${cols.map(c => `<th${num(c) ? ' class="r"' : ''}>${UI.esc(c.label)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c => `<td${num(c) ? ' class="r"' : ''}>${cell(c, r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const money = d.columns.filter(c => c.type === 'money');
  const totals = d.totals.map(t => `<p><strong>${UI.esc(t.Currency)}</strong>: ${t.Rows} rows` +
    money.map(c => ` · ${UI.esc(c.label)} <strong>${UI.fmt.money(t[c.key])}</strong>`).join('') + `</p>`).join('');
  const body = `<p class="muted">${UI.esc(d.note)}</p>` + (d.rows.length ? table(d.columns, d.rows) : '<p>Nothing to report.</p>') + totals +
    (d.summary ? `<h3 style="font-size:12px;margin:16px 0 0">${UI.esc(d.summary.title)}</h3>` + table(d.summary.columns, d.summary.rows) : '');
  UI.print.send(UI.print.page({ title: d.title, meta, body,
    styles: UI.print.docStyles() + '@page{size:A4 landscape} body{font-size:10.5px} th,td{padding:4px 5px}',
    signatures: ['Prepared by (HO Accounts)', 'Reviewed by (CFO)'] }));
}

/* -------------------------------------------------------------- ACCESS */

async function pageBgmAccess(root) {
  root.innerHTML = pageHead('Module Access', 'Who may use Security Instruments, and at what level. No role or permission changes.') +
    `<div class="card"><div class="card-body muted" style="font-size:13px">
       <strong>HO Accounts</strong>: registers instruments, records steps, refunds and follow-ups, closes.
       <strong>CFO</strong>: sees everything; authorises adjustments to the refundable amount; reopens a closed record.
       <strong>Management</strong> and <strong>Internal Audit</strong>: see everything, change nothing.
       Administrators always have full access.</div><div id="bgmAcc">${UI.loadingState()}</div></div>`;
  let d;
  try { d = (await api('bgmListAccess')).data; } catch (e) { document.getElementById('bgmAcc').innerHTML = UI.errorState(e.message); return; }
  const opts = cur => `<option value="">No access</option>` + Object.keys(d.levels).map(k =>
    `<option value="${k}"${k === cur ? ' selected' : ''}>${UI.esc(d.levels[k])}</option>`).join('');
  UI.table(document.getElementById('bgmAcc'), {
    columns: [
      { key: 'Name', label: 'User', render: u => `<strong>${UI.esc(u.Name)}</strong><br><span class="muted" style="font-size:12px">${UI.esc(u.Email)}</span>` },
      { key: 'Role', label: 'PMS role (unchanged)' },
      { key: 'UserStatus', label: 'Account' },
      { key: 'Level', label: 'Security Instruments access', render: u => u.Role === 'ADMIN' ? '<span class="muted">Full (administrator)</span>'
          : `<select class="input" data-acc="${UI.esc(u.UserID)}" style="max-width:200px">${opts(u.Level)}</select>` }
    ],
    rows: d.users
  });
  document.querySelectorAll('[data-acc]').forEach(s => {
    s.onchange = async () => {
      s.disabled = true;
      try { UI.success((await api('bgmSetAccess', s.dataset.acc, s.value)).message); }
      catch (e) { UI.error('Not changed', e.message); }
      s.disabled = false;
    };
  });
}

  <script>
/* =============================================================
   Reports.html — Phase 10. The report browser, the management
   dashboard and the global search box in the header.
   ============================================================= */

const reportState = { id: null, filters: {}, data: null, options: null, catalogue: null };

/* ============================================================ REPORTS */

async function pageReports(root, arg) {
  const preselect = (arg && (arg.id || arg.reportId)) || reportState.id;
  const projectScope = arg && arg.projectId;

  const cat = reportState.catalogue || (await api('listReports')).data;
  reportState.catalogue = cat;
  reportState.options = cat.filterOptions;

  if (!cat.reports.length) {
    root.innerHTML = pageHead('Reports', '') +
      UI.emptyState('No reports available', 'Your role does not include report access.');
    return;
  }

  root.innerHTML =
    pageHead('Reports', 'Filter first, then read — and export exactly what you filtered') +
    `<div class="report-layout">
       <div class="card"><div class="report-list" id="reportList"></div></div>
       <div>
         <div class="card" style="margin-bottom:16px">
           <div class="card-head">
             <div><div class="card-title" id="reportTitle">Choose a report</div>
             <div class="page-sub" id="reportDesc"></div></div>
           </div>
           <div class="card-body"><div class="filters" id="reportFilters"></div></div>
         </div>
         <div class="card">
           <div class="card-head">
             <div class="card-title">Results</div>
             <div class="flex gap-8">
               <button class="btn btn-sm" id="reportPrint">Print</button>
               <button class="btn btn-sm" id="reportExport">Export CSV</button>
             </div>
           </div>
           <div id="reportResult">${UI.emptyState('Nothing run yet', 'Pick a report on the left.')}</div>
           <div class="report-meta" id="reportMeta"></div>
         </div>
       </div>
     </div>`;

  const list = document.getElementById('reportList');
  cat.groups.forEach(group => {
    list.appendChild(UI.el('div', { class: 'report-group-label', text: group }));
    cat.reports.filter(r => r.group === group).forEach(r => {
      const b = UI.el('button', { class: 'report-pick', text: r.name, 'data-report': r.id });
      b.onclick = () => selectReport(r.id, projectScope);
      list.appendChild(b);
    });
  });

  document.getElementById('reportExport').onclick = exportCurrentReport;
  // Statements of account print one statement to a page, each as the party's own
  // statement prints (26 Oct 2026); every other report prints the screen.
  // The weekly user progress prints as a landscape document (2 Nov 2026): too wide for the screen print.
  document.getElementById('reportPrint').onclick = () => reportState.id === 'statements'
    ? printRecord('STATEMENTS', '', readReportFilters())
    : reportState.id === 'user-progress'
      ? printRecord('REPORT', 'user-progress', readReportFilters())
      : window.print();

  const first = preselect && cat.reports.some(r => r.id === preselect) ? preselect : cat.reports[0].id;
  await selectReport(first, projectScope);
}

const FILTER_DEFS = {
  projectId: { label: 'Project', type: 'select', options: o => o.projects, placeholder: 'All projects' },
  status:    { label: 'Status',  type: 'select', placeholder: 'Any status',
               options: (o, spec) => (o.statusSets && o.statusSets[spec.statuses]) || o.projectStatuses },
  category:  { label: 'Category', type: 'select',
               options: o => (o.budgetCategories || []).concat(o.expenseCategories || [])
                 .filter((v, i, a) => a.indexOf(v) === i), placeholder: 'All categories' },
  vendorId:  { label: 'Vendor', type: 'select', options: o => o.vendors, placeholder: 'All vendors' },
  // A server older than 24 Oct 2026 sends no subcontractor list; the filter then has nothing to offer.
  partyType: { label: 'Parties', type: 'select', placeholder: 'Vendors and subcontractors',
               options: () => [{ value: 'vendor', label: 'Vendors only' }, { value: 'subcontractor', label: 'Subcontractors only' }] },
  subcontractorId: { label: 'Subcontractor', type: 'select', options: o => o.subcontractors || [],
                     placeholder: 'All subcontractors' },
  from:      { label: 'From', type: 'date' },
  to:        { label: 'To', type: 'date' }
};

async function selectReport(id, projectScope) {
  reportState.id = id;
  const spec = reportState.catalogue.reports.filter(r => r.id === id)[0];
  document.querySelectorAll('.report-pick').forEach(b =>
    b.classList.toggle('active', b.dataset.report === id));
  document.getElementById('reportTitle').textContent = spec.name;
  document.getElementById('reportDesc').textContent = spec.description;

  const bar = document.getElementById('reportFilters');
  bar.innerHTML = '';
  spec.filters.forEach(key => {
    const def = FILTER_DEFS[key];
    if (!def) return;
    const field = UI.el('div', { class: 'field' });
    field.appendChild(UI.el('label', { for: 'rf_' + key, text: def.label }));
    let input;
    if (def.type === 'select') {
      input = UI.el('select', { class: 'input', id: 'rf_' + key, name: key });
      input.appendChild(UI.el('option', { value: '' }, def.placeholder));
      (def.options(reportState.options, spec) || []).forEach(o => {
        const opt = UI.el('option', { value: o.value === undefined ? o : o.value });
        opt.textContent = o.label === undefined ? o : o.label;
        input.appendChild(opt);
      });
      if (key === 'projectId' && projectScope) { input.value = projectScope; input.disabled = true; }
    } else {
      input = UI.el('input', { class: 'input', id: 'rf_' + key, name: key, type: 'date' });
    }
    if (reportState.filters[key] !== undefined && !input.disabled) input.value = reportState.filters[key];
    input.onchange = () => runCurrentReport();
    field.appendChild(input);
    bar.appendChild(field);
  });
  const reset = UI.el('button', { class: 'btn', text: 'Reset filters' });
  reset.onclick = () => { reportState.filters = {}; selectReport(id, projectScope); };
  bar.appendChild(reset);

  await runCurrentReport();
}

function readReportFilters() {
  const out = {};
  document.querySelectorAll('#reportFilters [name]').forEach(i => {
    if (i.value) out[i.name] = i.value;
  });
  return out;
}

async function runCurrentReport() {
  const mount = document.getElementById('reportResult');
  mount.innerHTML = UI.loadingState('Running…');
  reportState.filters = readReportFilters();
  try {
    const d = (await api('runReport', reportState.id, reportState.filters)).data;
    reportState.data = d;
    renderReport(d);
  } catch (e) {
    mount.innerHTML = UI.errorState(e.message);
  }
}

function reportCell(col, row) {
  const v = row[col.key];
  switch (col.type) {
    // A blank amount stays blank: a statement's opening and closing lines have no debit or credit.
    case 'money': return (v === '' || v === null || v === undefined) ? '' : cash(v);
    case 'number': return UI.fmt.number(v, 0);
    // A day with nothing in it reads as a dash, as on the owner's weekly sheet.
    case 'count': return v ? UI.fmt.number(v, 0) : '<span class="muted">–</span>';
    case 'qty': return UI.fmt.number(v, 2);
    case 'percent': return (v === '' || v === null || v === undefined) ? '—' : UI.fmt.percent(v);
    case 'date': return UI.fmt.date(v);
    case 'badge': return UI.badge(v);
    case 'flag': return v ? '<span class="flag-yes">Yes</span>' : '<span class="muted">No</span>';
    default: return UI.esc(v === null || v === undefined ? '' : v);
  }
}

function renderReport(d) {
  const mount = document.getElementById('reportResult');
  if (!d.rows.length) {
    mount.innerHTML = UI.emptyState('Nothing matched',
      'No records fall inside these filters. Widen the dates or clear a filter.');
  } else {
    UI.table(mount, {
      columns: d.columns.map(c => ({
        key: c.key, label: c.label,
        align: ['money', 'number', 'count', 'qty', 'percent'].indexOf(c.type) !== -1 ? 'right' : '',
        render: row => {
          const html = reportCell(c, row);
          if (c.signed && typeof row[c.key] === 'number' && row[c.key] !== 0) {
            return `<span class="${row[c.key] < 0 ? 'num-neg' : 'num-pos'}">${html}</span>`;
          }
          return html;
        }
      })),
      rows: d.rows
    });
    // Totals live in a footer under the table, from the server's own arithmetic.
    const table = mount.querySelector('table.data');
    if (table && Object.keys(d.totals).length) {
      const tfoot = UI.el('tfoot', { class: 'report-totals' });
      const tr = UI.el('tr');
      d.columns.forEach((c, i) => {
        const td = UI.el('td', { class: ['money', 'number', 'count', 'qty', 'percent'].indexOf(c.type) !== -1 ? 'num' : '' });
        if (i === 0) td.textContent = 'Total · ' + d.rowCount + ' row' + (d.rowCount === 1 ? '' : 's');
        else if (d.totals[c.key] !== undefined) td.innerHTML = c.type === 'money'
          ? cash(d.totals[c.key]) : UI.fmt.number(d.totals[c.key], 0);
        tr.appendChild(td);
      });
      tfoot.appendChild(tr);
      table.appendChild(tfoot);
    }
  }
  // A report may send charts (the weekly user progress does); an older server sends none.
  if (d.rows.length && d.charts && d.charts.length) {
    d.charts.forEach(ch => mount.appendChild(renderReportChart(ch)));
  }
  document.getElementById('reportMeta').innerHTML =
    `<span>${d.rowCount} row${d.rowCount === 1 ? '' : 's'}</span>` +
    `<span>Run by ${UI.esc(d.generatedBy)}</span>` +
    `<span>${UI.fmt.dateTime(d.generatedAt)}</span>` +
    (d.note ? `<span class="muted">${UI.esc(d.note)}</span>` : '');
}

/** A plain bar chart: one row a bar, the value beside it. */
function renderReportChart(ch) {
  const box = UI.el('div', { class: 'card-body report-chart' });
  const max = Math.max(1, ...ch.bars.map(b => b.value));
  box.innerHTML = `<div class="card-title" style="margin-bottom:8px">${UI.esc(ch.title)}</div>` +
    (ch.bars.length ? '<div class="bar-chart">' + ch.bars.map(b =>
      `<div class="bar-row">
         <div class="bar-label">${UI.esc(b.label)}</div>
         <div class="bar-track"><div class="bar bar-received" style="width:${Math.round(b.value / max * 100)}%"></div></div>
         <div class="bar-value">${UI.fmt.number(b.value, 0)}</div>
       </div>`).join('') + '</div>'
      : '<p class="muted" style="margin:0">Nothing in this period.</p>');
  return box;
}

async function exportCurrentReport() {
  if (!reportState.id) return;
  try {
    const d = (await api('exportReport', reportState.id, reportState.filters)).data;
    downloadCsv(d.filename, d.csv);
  } catch (e) { UI.error('Could not export', e.message); }
}

  root.innerHTML =

       ${tile('Projects', String(t.projects), t.active + ' active')}

       ${tile('Working budget', cash(t.budget), UI.fmt.percent(t.budgetUtilisation) + ' committed')}

       ${tile('Forecast cost', cash(t.forecastCost), 'incl. open commitments')}
       ${tile('Forecast profit', cash(t.forecastProfit), UI.fmt.percent(t.margin) + ' margin', true)}
       ${tile('Certified', cash(t.certified), 'client has agreed')}
       ${tile('Received', cash(t.received), '')}
       ${tile('Receivables', cash(t.receivables), 'owed by clients')}
       ${tile('Retention held', cash(t.retentionHeld), 'due at completion')}
       ${tile('Payables', cash(d.payables.total),
              cash(d.payables.suppliers) + ' suppliers · ' + cash(d.payables.subcontractors) + ' subcontract')}
       ${tile('Stock value', cash(d.pipeline.stockValue), '')}
     </div>

     <div class="grid-2" style="margin-bottom:16px">

function renderMonthlyChart(mount, charts) {
  const peak = Math.max(...charts.billed, ...charts.received);
  if (!peak) {
    mount.innerHTML = '<p class="muted" style="margin:0">Nothing has been certified or received yet. ' +
      'The last twelve months appear here once billing starts.</p>';
    return;
  }
  const max = peak;
  mount.innerHTML =
    '<div class="spark">' + charts.months.map((m, i) => {
      const b = Math.round(charts.billed[i] / max * 100);
      const r = Math.round(charts.received[i] / max * 100);
      const label = m.slice(5) + '/' + m.slice(2, 4);
      return `<div class="spark-col" title="${m}: certified ${charts.billed[i]}, received ${charts.received[i]}">
          <div class="spark-bar billed" style="height:${b}%"></div>
          <div class="spark-bar received" style="height:${r}%"></div>
          <div class="spark-label">${label}</div></div>`;
    }).join('') + '</div>' +
    `<div class="muted" style="font-size:11.5px">Peak month ${cash(peak)}</div>`;
}

function renderBudgetChart(mount, rows) {
  if (!rows.length) { mount.innerHTML = '<p class="muted">No projects yet.</p>'; return; }
  const max = Math.max(1, ...rows.map(r => Math.max(r.Budget, r.Forecast)));
  mount.innerHTML = '<div class="bar-chart">' + rows.map(r => {
    const over = r.Forecast > r.Budget && r.Budget > 0;
    return `<div class="bar-row">
        <div class="bar-label">${UI.esc(r.ProjectName)}</div>
        <div class="bar-track">
          <div class="bar ${over ? 'bar-billed' : 'bar-received'}"
               style="width:${Math.round(r.Forecast / max * 100)}%"></div>
        </div>
        <div class="bar-value">${cash(r.Forecast)} / ${cash(r.Budget)}</div>
      </div>`;
  }).join('') + '</div>';
}

function initGlobalSearch() {
  const input = document.getElementById('globalSearch');
  const panel = document.getElementById('globalSearchResults');
  if (!input || !panel || input.dataset.wired) return;
  input.dataset.wired = '1';
  input.disabled = false;

  let debounce, lastQuery = '';
  const close = () => panel.classList.add('hidden');

  input.oninput = () => {
    clearTimeout(debounce);
    const q = input.value.trim();
    if (q.length < 2) { close(); return; }
    debounce = setTimeout(async () => {
      lastQuery = q;
      try {
        const d = (await api('globalSearch', q, 5)).data;
        if (d.query !== lastQuery.toLowerCase()) return;   // a later keystroke won
        renderSearch(panel, d);
      } catch (e) { close(); }
    }, 220);
  };
  input.onkeydown = e => { if (e.key === 'Escape') { close(); input.blur(); } };
  document.addEventListener('click', e => {
    if (e.target !== input && !panel.contains(e.target)) close();
  });
}

const SEARCH_ROUTES = {
  project: id => navigate('project', id),
  pr: id => navigate('purchase-request', id),
  po: id => navigate('purchase-order', id),
  vendor: id => navigate('vendor', id),
  boq: id => navigate('project', { projectId: id, tab: 'boq' }),
  stock: () => navigate('stock'),
  'rar-bill': id => navigate('rar-bill', id),
  expense: id => navigate('expense', id),
  subcontractor: id => navigate('subcontractor', id),
  documents: id => navigate('project', { projectId: id, tab: 'documents' })
};

function renderSearch(panel, d) {
  if (!d.groups.length) {
    panel.innerHTML = `<div class="search-empty">Nothing matches “${UI.esc(d.query)}”.</div>`;
    panel.classList.remove('hidden');
    return;
  }
  panel.innerHTML = d.groups.map(g =>
    `<div class="search-group"><span>${UI.esc(g.label)}</span>
       <span>${g.items.length} of ${g.total}</span></div>` +
    g.items.map(it =>
      `<div class="search-item" data-view="${UI.esc(g.view)}" data-id="${UI.esc(it.id)}">
         <div class="search-item-title">${UI.esc(it.title)}</div>
         <div class="search-item-sub">${UI.esc(it.subtitle || '')}</div>
       </div>`).join('')
  ).join('');
  panel.classList.remove('hidden');
  panel.querySelectorAll('.search-item').forEach(el => {
    el.onclick = () => {
      panel.classList.add('hidden');
      document.getElementById('globalSearch').value = '';
      const go = SEARCH_ROUTES[el.dataset.view];
      if (go) go(el.dataset.id);
      else UI.warn('Not available', 'That record has no screen yet.');
    };
  });
}

async function runImportCheck() {
